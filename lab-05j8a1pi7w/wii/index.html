<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Wii Menu · Zach Winship</title>
<link rel="icon" href="../../images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@400;500;700;800&display=swap" rel="stylesheet">
<!--
  Layout reference: the bottom-bar silhouette, button geometry and page
  arrow are adapted from tobieche110/wii-portfolio (MIT License,
  Copyright (c) 2024 Tobias Echenique). Everything else is original.
  A fan homage to the Nintendo Wii Menu; not affiliated with Nintendo.
-->
<style>
:root{
  --cyan:#34beed;
  --cyan-text:#1f7fae;
  --gray-text:#6e7075;
  --ink:#4a4c50;
  --tile-border:#bdbec2;
  --font:'M PLUS 1p','Helvetica Neue',Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
.has-hand #root, .has-hand #root *{cursor:none !important}

/* Wii Menu background: near-white with faint horizontal lines */
.scan{background-color:#fafafa;background-image:repeating-linear-gradient(to bottom,#fafafa 0 2px,#f0f0f0 2px 4px)}

/* ================= STAGE ================= */
#root{position:fixed;inset:0;overflow:hidden}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden}
#barExt{position:absolute;left:0;right:0;bottom:0;pointer-events:none;background:linear-gradient(#e6e7ea,#d8d9dd);border-top:3px solid var(--cyan);display:none}

/* ================= HEALTH & SAFETY ================= */
#warning{position:absolute;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;transition:opacity .6s ease;cursor:pointer}
#warning.gone{opacity:0;pointer-events:none}
.warn-title{display:flex;align-items:center;gap:18px;font-size:44px;font-weight:700;color:#222;letter-spacing:.5px;text-align:center}
.warn-title svg{width:56px;height:56px;flex:0 0 auto}
.warn-rule{width:min(880px,88%);height:3px;background:#222;margin:22px 0 34px}
.warn-body{width:min(880px,88%);font-size:30px;line-height:1.55;font-weight:500;color:#222}
.warn-body b{font-weight:700}
.warn-body .url{display:block;margin-top:26px}
.warn-press{margin-top:80px;font-size:30px;font-weight:500;color:#222;display:flex;align-items:center;gap:12px;opacity:0;animation:pressIn .6s ease 1.6s forwards, pressPulse 2.2s ease-in-out 2.2s infinite}
.a-btn{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:50%;background:#222;color:#fff;font-size:24px;font-weight:700}
@keyframes pressIn{to{opacity:1}}
@keyframes pressPulse{0%,100%{opacity:1}50%{opacity:.45}}
.portrait .warn-title{font-size:40px;flex-direction:column;gap:10px}
.portrait .warn-body{font-size:34px}

/* ================= MENU ================= */
#menu{position:absolute;inset:0;visibility:hidden}
#menu.boot{animation:fadeIn .8s ease both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
#pages{position:absolute;left:0;top:0;overflow:hidden;transition:transform .5s cubic-bezier(.45,0,.2,1),opacity .45s ease}
#track{position:absolute;left:0;top:0;height:100%;display:flex;transition:transform .55s cubic-bezier(.45,0,.2,1)}
.page{position:relative;height:100%}
.grid{position:absolute;display:grid}

/* --- channel tile --- */
.ch{position:relative;border-radius:18px;background:#fff;border:2px solid var(--tile-border);padding:0;transition:border-color .1s,box-shadow .1s;outline:none}
.ch .bn{position:absolute;inset:4px;border-radius:13px;overflow:hidden}
.ch.hot,.ch:focus-visible{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 0 7px 2px rgba(52,190,237,.45);z-index:3;animation:hotPulse 1.4s ease-in-out infinite}
@keyframes hotPulse{0%,100%{box-shadow:0 0 0 1px var(--cyan),0 0 6px 1px rgba(52,190,237,.35)}50%{box-shadow:0 0 0 1px var(--cyan),0 0 9px 3px rgba(52,190,237,.6)}}
.ch.empty{background:#ececee;border-color:#d2d3d6;cursor:default}
.ch.empty .bn{display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(to bottom,#efeff1 0 2px,#e6e6e9 2px 4px)}
.wii-mark{display:block;width:34%;max-width:96px}
/* 4:3 tiles: show the 16:9 banner letterboxed, like the real menu did */
.grid.narrow .ch .bn{top:50%;bottom:auto;aspect-ratio:16/9;transform:translateY(-50%);border-radius:8px}
.grid.narrow .ch.empty .bn{inset:4px;transform:none;aspect-ratio:auto}

/* hover label */
#bubble{position:absolute;z-index:40;pointer-events:none;padding:6px 28px;border-radius:999px;background:#fff;border:2px solid #b9babd;box-shadow:0 2px 4px rgba(0,0,0,.12);font-size:22px;font-weight:500;color:#4a4c50;white-space:nowrap;opacity:0;transform:translate(-50%,4px) scale(.92);transition:opacity .12s,transform .16s cubic-bezier(.3,1.6,.5,1)}
#bubble.on{opacity:1;transform:translate(-50%,0) scale(1);transition-delay:.18s}

/* page arrows */
.parrow{position:absolute;width:46px;height:82px;z-index:5;opacity:0;pointer-events:none;transition:opacity .25s}
.parrow svg{width:100%;height:100%;filter:drop-shadow(0 2px 2px rgba(20,60,120,.25))}
.parrow.show{opacity:1;pointer-events:auto}
.parrow.show svg{animation:arrowPulse 1.6s ease-in-out infinite}
.parrow.hot svg{animation:none;transform:scale(1.08)}
#arrL svg{transform:scaleX(-1)}
#arrL.show svg{animation:arrowPulseL 1.6s ease-in-out infinite}
#arrL.hot svg{animation:none;transform:scaleX(-1) scale(1.08)}
@keyframes arrowPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes arrowPulseL{0%,100%{transform:scaleX(-1) scale(1)}50%{transform:scaleX(-1) scale(1.07)}}

/* ================= BOTTOM BAR ================= */
#bar{position:absolute;left:0;height:200px;transition:transform .45s cubic-bezier(.45,0,.2,1)}
#bar svg.shape{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#clock{position:absolute;left:0;right:0;top:18px;display:flex;justify-content:center;height:62px}
#date{position:absolute;left:0;right:0;top:122px;text-align:center;font-size:30px;font-weight:500;color:#7d7f84;letter-spacing:.5px}
.round-btn{position:absolute;top:65px;width:132px;height:132px;border-radius:50%;outline:none}
.round-btn .face{position:absolute;inset:8px;border-radius:50%;background:linear-gradient(#f2f2f3,#d9d9db);border:4px solid var(--cyan);box-shadow:0 3px 4px rgba(0,0,0,.16);display:flex;align-items:center;justify-content:center;transition:box-shadow .12s}
.round-btn.hot .face,.round-btn:focus-visible .face{box-shadow:0 0 0 3px rgba(52,190,237,.35),0 0 8px 2px rgba(52,190,237,.45),0 3px 4px rgba(0,0,0,.16)}
#wiiBtn{left:58px}
#mailBtn{right:58px}
#wiiBtn .wii-mark{width:70px;max-width:none}
#mailBtn .env{fill:#a1a0a4;animation:mailGlow 2.4s ease-in-out infinite}
@keyframes mailGlow{0%,100%{fill:#a1a0a4}50%{fill:#34beed}}
#sdBtn{position:absolute;top:100px;width:50px;height:60px;border-radius:8px;outline:none;padding:2px}
#sdBtn svg{width:100%;height:100%}
#sdBtn.hot svg path:first-child,#sdBtn:focus-visible svg path:first-child{stroke:var(--cyan);stroke-width:3}

/* ================= CHANNEL PREVIEW ================= */
#preview{position:absolute;inset:0;z-index:50;pointer-events:none}
#preview.open{pointer-events:auto}
#preview.closing{pointer-events:none}
#pvZoom{position:absolute;overflow:hidden;background:#fff;transition:left .5s cubic-bezier(.45,0,.2,1),top .5s cubic-bezier(.45,0,.2,1),width .5s cubic-bezier(.45,0,.2,1),height .5s cubic-bezier(.45,0,.2,1),border-radius .5s}
#pvZoom .bn{position:absolute;inset:0}
#pvBottom{position:absolute;left:0;right:0;bottom:0;height:148px;display:flex;align-items:center;justify-content:center;gap:9%;transform:translateY(100%);transition:transform .35s cubic-bezier(.45,0,.2,1)}
#preview.shown #pvBottom{transform:none}
.pill{position:relative;width:400px;height:88px;border-radius:999px;background:linear-gradient(#fdfdfd,#e9e9eb);border:2px solid #c4c5c9;box-shadow:0 2px 3px rgba(0,0,0,.12);font-size:36px;font-weight:500;color:#55575c;transition:border-color .1s,box-shadow .1s;outline:none}
.pill.hot,.pill:focus-visible{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 0 8px 2px rgba(52,190,237,.45)}
.portrait .pill{width:300px;height:84px;font-size:32px}
.pvarrow{position:absolute;width:46px;height:82px;opacity:0;transition:opacity .25s;outline:none}
#preview.shown .pvarrow{opacity:1}
.pvarrow svg{width:100%;height:100%;filter:drop-shadow(0 2px 2px rgba(20,60,120,.25))}
.pvarrow.hot svg{transform:scale(1.08)}
#pvL svg{transform:scaleX(-1)}
#pvL.hot svg{transform:scaleX(-1) scale(1.08)}

/* ================= WII BUTTON SCREEN ================= */
#sysmenu{position:absolute;inset:0;z-index:55;display:none;flex-direction:column;align-items:center;justify-content:center;gap:36px}
#sysmenu.open{display:flex;animation:fadeIn .25s ease}
.sys-row{display:flex;gap:56px}
.portrait .sys-row{flex-direction:column;gap:30px}
.sysbtn{width:440px;height:200px;border-radius:24px;background:linear-gradient(#ffffff,#eeeff1);border:2px solid #c4c5c9;box-shadow:0 2px 4px rgba(0,0,0,.1);font-size:36px;font-weight:500;color:#55575c;transition:border-color .1s,box-shadow .1s;outline:none}
.sysbtn.hot,.sysbtn:focus-visible{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 0 8px 2px rgba(52,190,237,.45)}

/* ================= HAND CURSOR ================= */
#hand{position:fixed;left:0;top:0;z-index:9999;pointer-events:none;width:58px;height:70px;margin:-6px 0 0 -18px;display:none;transform-origin:18px 6px;will-change:transform}
.has-hand #hand{display:block}
.has-hand.in-content #hand{display:none}
#hand svg{width:100%;height:100%;transition:transform .08s;filter:drop-shadow(1px 2px 1px rgba(0,0,0,.28))}
#hand.press svg{transform:scale(.92)}

/* ================= CHANNEL CONTENT ================= */
#content{position:fixed;inset:0;z-index:70;display:none;flex-direction:column;cursor:auto}
#content.open{display:flex;animation:fadeIn .3s ease}
#content.leaving{animation:fadeOut .2s ease forwards}
@keyframes fadeOut{to{opacity:0}}
.cc-head{flex:0 0 auto;display:flex;align-items:center;gap:16px;padding:16px clamp(16px,4vw,48px);padding-top:max(16px,env(safe-area-inset-top));background:#fff;border-bottom:2px solid #d9dadd}
.cc-head .ico{width:92px;height:52px;border-radius:10px;overflow:hidden;border:2px solid var(--tile-border);flex:0 0 auto;position:relative;background:#fff}
.cc-head .ico .bn{position:absolute;inset:0}
.cc-head h1{font-size:clamp(22px,3vw,30px);font-weight:700;color:#55575c;line-height:1.15;outline:none}
.cc-head p{font-size:14px;color:var(--gray-text);font-weight:500}
.cc-body{flex:1;overflow-y:auto;padding:26px clamp(16px,4vw,48px) 40px;-webkit-overflow-scrolling:touch;user-select:text}
.cc-inner{max-width:1000px;margin:0 auto}
.cc-foot{flex:0 0 auto;display:flex;justify-content:center;align-items:center;gap:clamp(12px,4vw,48px);flex-wrap:wrap;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom));border-top:3px solid var(--cyan);background:linear-gradient(#ededef,#dfe0e3)}
.cc-foot .pill{width:min(260px,42vw);height:62px;font-size:24px}
@media (max-height:500px){.cc-head{padding:8px 16px}.cc-head .ico{width:64px;height:36px}.cc-foot{padding:8px}.cc-foot .pill{height:46px;font-size:20px}}

.sec-h{font-size:19px;font-weight:700;color:#55575c;margin:30px 0 12px;padding-bottom:8px;border-bottom:2px solid #d9dadd}
.sec-h:first-child{margin-top:0}
.card{background:#fff;border:2px solid #d5d6da;border-radius:18px;padding:22px 24px;margin-bottom:16px}
.card h3{font-size:21px;font-weight:700;color:#45474c;line-height:1.3}
.card .meta{font-size:14px;font-weight:500;color:var(--cyan-text);margin:4px 0 10px}
.card p{font-size:16.5px;line-height:1.7;color:#55575c}
.card p + p{margin-top:12px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.tag{font-size:13px;font-weight:500;color:#6a6c71;background:#f3f3f5;border:1px solid #dcdde0;border-radius:8px;padding:2px 10px}
.links{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.wbtn{display:inline-flex;align-items:center;padding:9px 22px;border-radius:999px;background:linear-gradient(#ffffff,#eeeff1);border:2px solid #c6c7cb;color:#4a4c50;font-weight:500;font-size:15px;text-decoration:none;transition:border-color .1s,box-shadow .1s}
.wbtn:hover,.wbtn:focus-visible{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 0 6px rgba(52,190,237,.45);outline:none}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.grid2 .card{margin:0}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:6px;background:var(--cyan);color:#fff;margin:0 6px 8px 0}
.badge.gray{background:#9a9ca1}
.about-top{display:flex;gap:28px;align-items:center;flex-wrap:wrap}
.about-top img{width:160px;height:160px;object-fit:cover;border-radius:24px;border:2px solid #d5d6da}
.about-top h2{font-size:32px;font-weight:700;color:#45474c}
.about-top .sub{color:var(--cyan-text);font-weight:500;margin-top:2px}
video{width:100%;border-radius:12px;background:#000;margin-top:12px;display:block}
.vids{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:10px}
.vids figcaption{font-size:13px;font-weight:500;color:#6a6c71;margin-top:6px}
.shop-row{display:flex;gap:18px;align-items:flex-start}
.shop-row .thumb{flex:0 0 150px;height:85px;border-radius:12px;overflow:hidden;position:relative;border:2px solid #d5d6da}
.shop-row .thumb .bn{position:absolute;inset:0}
.shop-row .price{margin-left:auto;flex:0 0 auto;font-weight:700;color:var(--cyan-text);font-size:14px;text-align:right}
@media (max-width:640px){.shop-row{flex-direction:column}.shop-row .thumb{width:100%;flex-basis:auto;height:auto;aspect-ratio:16/9}.shop-row .price{margin-left:0;text-align:left}}
.wx{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.wx .card{text-align:center;background:linear-gradient(#e9f6fd,#fff 60%)}
.wx .temp{font-size:64px;font-weight:700;color:#45474c;line-height:1}
.wx .cond{font-weight:500;color:var(--cyan-text);margin-top:6px}
.poll-opts{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px}
.poll-bar{height:28px;border-radius:999px;background:#eef0f2;overflow:hidden;margin-top:8px;border:1px solid #dedfe2}
.poll-bar i{display:block;height:100%;border-radius:999px;transition:width .8s cubic-bezier(.45,0,.2,1)}
.list-plain{list-style:none}
.list-plain li{padding:10px 0;border-bottom:1px solid #e4e5e8;font-size:16px}
.list-plain li:last-child{border:0}
.list-plain a{color:var(--cyan-text);font-weight:500;text-decoration:none}
.list-plain a:hover{text-decoration:underline}
.pdf-frame{width:100%;height:70vh;border:2px solid #d5d6da;border-radius:16px;background:#fff}
/* Message Board */
.board-date{display:flex;align-items:baseline;gap:14px;margin-bottom:18px}
.board-date .d{font-size:64px;font-weight:700;color:#45474c;line-height:1}
.board-date .m{font-size:22px;font-weight:500;color:var(--gray-text)}
.letter{background:#fffef6;border:2px solid #e3dfc4;border-radius:14px;padding:30px 34px;max-width:720px;background-image:repeating-linear-gradient(transparent 0 33px,#ece8cf 33px 34px);background-position:0 18px}
.letter p{font-size:18px;line-height:34px;color:#4a4c50}
.letter .from{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.letter .from img{width:52px;height:52px;border-radius:12px;object-fit:cover;border:2px solid #d5d6da}
.letter .from b{font-size:18px}
/* themed content headers */
#content[data-theme="shop"] .cc-head{background:linear-gradient(#e7f7fe,#fff)}
#content[data-theme="forecast"] .cc-head{background:linear-gradient(#bfe6fa,#fff)}
#content[data-theme="news"] .cc-head{background:linear-gradient(#e8eef6,#fff)}
#content[data-theme="board"] .cc-head{background:linear-gradient(#fbf9ec,#fff)}

/* ================= BANNERS =================
   Drawn in container units (cqw/cqh) so the same markup works on a tile,
   in the zoomed preview and in the content header. `.pv` elements only
   show when the banner is large (preview). */
.bn{container-type:size;font-family:var(--font)}
.bn *{position:absolute}
.bn .t{left:0;right:0;text-align:center;font-weight:700;white-space:nowrap}
.bn .pv{display:none}
#pvZoom .bn .pv{display:block}
.spin{animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes walk{from{transform:translateX(-30cqw)}to{transform:translateX(130cqw)}}
@keyframes ticker{from{transform:translateX(100cqw)}to{transform:translateX(-100%)}}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(4cqw)}}

@media (prefers-reduced-motion:reduce){
  .bn *,.spin,.ch.hot,.parrow.show svg,#mailBtn .env,.warn-press{animation:none !important}
  .warn-press{opacity:1}
  #track,#pvZoom,#pages,#bar,#pvBottom{transition-duration:.01s !important}
}
</style>
</head>
<body class="scan">

<div id="root" class="scan">
<div id="barExt"></div>
<div id="stage" class="scan">

  <!-- ===== Health & Safety ===== -->
  <div id="warning" role="button" tabindex="0" aria-label="Press A to continue">
    <div class="warn-title">
      <svg viewBox="0 0 60 60" aria-hidden="true"><path d="M30 4 57 54H3Z" fill="#222"/><path d="M27.5 20h5l-1 20h-3zM27.5 44h5v5h-5z" fill="#fff"/></svg>
      <span>WARNING-HEALTH AND SAFETY</span>
    </div>
    <div class="warn-rule"></div>
    <div class="warn-body">
      BEFORE BROWSING, READ ZACH'S <b>RÉSUMÉ</b> FOR IMPORTANT INFORMATION ABOUT HIS RESEARCH, PROJECTS AND EXPERIENCE.
      <span class="url">Also online at<br>zwinship.github.io</span>
    </div>
    <div class="warn-press">Press <span class="a-btn">A</span> to continue.</div>
  </div>

  <!-- ===== Wii Menu ===== -->
  <div id="menu">
    <div id="pages"><div id="track"></div></div>
    <button class="parrow" id="arrL" aria-label="Previous page" data-hot></button>
    <button class="parrow" id="arrR" aria-label="Next page" data-hot></button>

    <div id="bar">
      <svg class="shape" preserveAspectRatio="none" aria-hidden="true"></svg>
      <div id="clock" aria-hidden="true"></div>
      <div id="date"></div>
      <button class="round-btn" id="wiiBtn" aria-label="Wii Menu options" data-hot><span class="face"><span class="wii-mark-slot"></span></span></button>
      <button id="sdBtn" aria-label="SD Card: résumé" data-hot><svg viewBox="0 0 46 56" aria-hidden="true"><path d="M4 2h26l14 14v36a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z" fill="#cbcccf" stroke="#a9aaae" stroke-width="2"/><g fill="#e9e9eb"><rect x="8" y="6" width="4" height="9" rx="1"/><rect x="14" y="6" width="4" height="9" rx="1"/><rect x="20" y="6" width="4" height="9" rx="1"/><rect x="26" y="6" width="4" height="9" rx="1"/></g><text x="23" y="42" text-anchor="middle" font-family="M PLUS 1p,Arial" font-weight="700" font-size="13" fill="#9a9b9f">SD</text></svg></button>
      <button class="round-btn" id="mailBtn" aria-label="Wii Message Board: contact Zach" data-hot>
        <span class="face"><svg width="58" height="40" viewBox="0 0 96 64" style="position:relative"><path class="env" d="M0 4v8l46.7 22.9c.8.4 1.8.4 2.6 0L96 12V4c0-2.2-1.8-4-4-4H4C1.8 0 0 1.8 0 4z"/><path class="env" d="M46.7 43.8 0 20.5V60c0 2.2 1.8 4 4 4h88c2.2 0 4-1.8 4-4V20.5L49.3 43.8c-.8.4-1.8.4-2.6 0z"/></svg></span>
      </button>
    </div>

    <div id="bubble" aria-hidden="true"></div>

    <!-- ===== Channel preview ===== -->
    <div id="preview" role="dialog" aria-modal="true" aria-label="Channel preview">
      <div id="pvZoom"></div>
      <button class="pvarrow" id="pvL" aria-label="Previous channel" data-hot></button>
      <button class="pvarrow" id="pvR" aria-label="Next channel" data-hot></button>
      <div id="pvBottom" class="scan">
        <button class="pill" id="pvMenu" data-hot>Wii Menu</button>
        <button class="pill" id="pvStart" data-hot>Start</button>
      </div>
    </div>

    <!-- ===== Wii button screen ===== -->
    <div id="sysmenu" class="scan" role="dialog" aria-modal="true" aria-label="Wii Menu options">

  about: { actions:[['Email','mailto:'+EMAIL],['Résumé',RESUME]], html: () => `<div class="card"><div class="about-top">
      <img src="${ASSET}images/zwinship.png" alt="Zach Winship">
      <div><h2>Zach Winship</h2><div class="sub">Quantitative Economist and Data Analyst</div>
      <div class="links">${EXT('https://linkedin.com/in/zwinship','LinkedIn')}${EXT('https://github.com/zwinship','GitHub')}</div></div></div></div>
    <div class="card"><p>I recently graduated from Bentley University with a BS in Quantitative Economics and a double minor in Mathematics and Data Technologies. I'm now pursuing the MS in Quantitative Economics at New York University, with expected graduation in May 2027, where I also work as a teaching assistant for Introductory Macroeconomics.</p>
      <p>My work sits at the intersection of data and policy. I'm drawn to questions where careful empirical methods can cut through noise and say something concrete about how the world works. I'm currently a co-author on an NBER working paper studying how NYC's congestion pricing program affected EMS response times, and I've built tools for sports prediction, transportation research, and political economy, always trying to combine rigor with work that's actually interesting to look at.</p>

/* =====================================================================
   SOUND — all synthesized
   ===================================================================== */
let AC = null, noiseBuf = null, jingleGain = null;
function audio(){
  if (!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)();
    noiseBuf = AC.createBuffer(1, AC.sampleRate*.5, AC.sampleRate); const d = noiseBuf.getChannelData(0); for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1; }catch(e){} }
  return AC;
}
function tone(freq, dur=.06, type='sine', vol=.05, when=0, slide=0, dest){
  const ac = audio(); if(!ac) return;
  const t = ac.currentTime + when, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(freq*slide, t+dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t+.008); g.gain.exponentialRampToValueAtTime(.0001, t+dur);
  o.connect(g).connect(dest||ac.destination); o.start(t); o.stop(t+dur+.02);
}
function noise(dur, f0, f1, vol=.03, q=2){
  const ac = audio(); if(!ac) return;
  const t = ac.currentTime, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = noiseBuf; f.type = 'bandpass'; f.Q.value = q;
  f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t+dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t+dur*.3); g.gain.exponentialRampToValueAtTime(.0001, t+dur);
  s.connect(f).connect(g).connect(ac.destination); s.start(t); s.stop(t+dur+.02);
}
const SFX = {
  hover: () => { noise(.025, 3200, 2800, .05, 6); tone(1250,.04,'sine',.018); },
  select: () => { tone(520,.16,'sine',.05,0,1.9); tone(1600,.03,'triangle',.02); },
  back: () => tone(900,.15,'sine',.045,0,.55),
  page: () => noise(.26, 500, 2200, .05, 1.2),
  start: () => { tone(330,.35,'sine',.05,0,.6); noise(.3, 1800, 400, .03, 1); },
  press: () => tone(1500,.03,'triangle',.03),
};
const NOTE = n => { const m = /^([A-G])(#?)(\d)$/.exec(n); if (!m) return 0; const i = {C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]] + (m[2]?1:0); return 440*Math.pow(2,(i + (m[3]-4)*12 - 9)/12); };
function playJingle(str){
  const ac = audio(); if (!ac || !str) return;
  stopJingle();
  jingleGain = ac.createGain(); jingleGain.gain.value = 1; jingleGain.connect(ac.destination);
  let t = 0; const beat = .16;
  str.split(' ').forEach(n => { if (n !== '.'){ const f = NOTE(n); tone(f, .3, 'triangle', .045, t, 0, jingleGain); tone(f*2, .12, 'sine', .012, t, 0, jingleGain); } t += beat; });
}
function stopJingle(){ if (jingleGain){ try{ jingleGain.gain.setTargetAtTime(0, AC.currentTime, .05); }catch(e){} jingleGain = null; } }

/* =====================================================================

let L;
function computeLayout(){
  const a = innerWidth / innerHeight;
  if (a < .9){
    const W = 720, H = 1280, cols = 2, rows = 4, gx = 16, gy = 18, mx = 60;
    const tw = (W - 2*mx - gx*(cols-1)) / cols, th = 188;
    return { mode:'portrait', W, H, cols, rows, per:cols*rows, gx, gy, mx, tw, th, top:96, barTop:H-200, s:190, zoom:{l:0,t:260,w:720,h:405}, arrowY:96 + (rows*th+(rows-1)*gy)/2 - 41 };
  }
  const H = 720, W = Math.round(Math.max(960, Math.min(1280, H*a)));
  const cols = 4, rows = 3, gx = 14, gy = 12, mx = Math.round(W*.074);
  const tw = (W - 2*mx - gx*(cols-1)) / cols, th = 156;
  return { mode:'land', W, H, cols, rows, per:cols*rows, gx, gy, mx, tw, th, top:40, barTop:H-200, s:204, zoom:{l:0,t:0,w:W,h:572}, arrowY:40 + (rows*th+(rows-1)*gy)/2 - 41 };
}
const stage = document.getElementById('stage'), track = document.getElementById('track'), pagesEl = document.getElementById('pages');
const bar = document.getElementById('bar'), barExt = document.getElementById('barExt');
let SCALE = 1, OX = 0, OY = 0, PAGES = 1;
const tiles = [];

function barPath(W, s){
  const d = s + (W/2 - s)*.55, k = (d - s)/238;
  const X = v => (s + v*k).toFixed(1), R = v => (W - s - v*k).toFixed(1);
  return `M0,44 H${s} C${X(32)},44 ${X(71)},44 ${X(118)},84 C${X(150)},112 ${X(180)},130 ${X(238)},130 H${R(238)} C${R(180)},130 ${R(150)},112 ${R(118)},84 C${R(71)},44 ${R(32)},44 ${W-s},44 H${W}`;
}
function buildBar(){
  const W = L.W, top = barPath(W, L.s);
  const svg = bar.querySelector('svg.shape');
  svg.setAttribute('viewBox', `0 0 ${W} 200`);
  svg.innerHTML = `<defs><linearGradient id="barG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8e9ec"/><stop offset=".4" stop-color="#e1e2e6"/><stop offset="1" stop-color="#d6d7db"/></linearGradient>
      <linearGradient id="tabG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dcdcdf"/><stop offset="1" stop-color="#d0d0d3"/></linearGradient>
      <filter id="tabShadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="1" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity=".1"/></filter></defs>
    <path fill="url(#barG)" d="${top} V200 H0 Z"/>
    <path fill="none" stroke="#34beed" stroke-width="3" d="${top}"/>
    <path filter="url(#tabShadow)" fill="url(#tabG)" d="M0,61 H118 C155,61 186,92 186,130 C186,168 155,199 118,199 H0 Z"/>
    <path filter="url(#tabShadow)" fill="url(#tabG)" d="M${W},61 H${W-118} C${W-155},61 ${W-186},92 ${W-186},130 C${W-186},168 ${W-155},199 ${W-118},199 H${W} Z"/>`;
  Object.assign(bar.style, { top:L.barTop+'px', width:W+'px' });
  const sd = document.getElementById('sdBtn');
  sd.style.left = '212px'; sd.style.display = L.mode==='portrait' ? 'none' : '';
  document.getElementById('clock').style.transform = L.mode==='portrait' ? 'scale(.85)' : '';
}
function buildGrid(){
  PAGES = Math.ceil(CHANNELS.length / L.per);

  Object.assign(pagesEl.style, { width:L.W+'px', height:(L.barTop+60)+'px' });

    const pg = document.createElement('div'); pg.className='page'; pg.style.width = L.W+'px';
    const grid = document.createElement('div'); grid.className = 'grid' + (L.tw/L.th < 1.6 ? ' narrow' : '');
    Object.assign(grid.style, { left:L.mx+'px', top:L.top+'px', gridTemplateColumns:`repeat(${L.cols},${L.tw}px)`, gridTemplateRows:`repeat(${L.rows},${L.th}px)`, gap:`${L.gy}px ${L.gx}px` });
    for (let s=0; s<L.per; s++){
      const idx = p*L.per+s, ch = CHANNELS[idx];
      const el = document.createElement('button');

      }

  }
  const ax = Math.max(6, L.mx/2-23);
  document.getElementById('arrL').style.cssText = `left:${ax}px;top:${L.arrowY}px`;
  document.getElementById('arrR').style.cssText = `right:${ax}px;top:${L.arrowY}px`;

  document.getElementById('pvL').style.left = '22px'; document.getElementById('pvR').style.right = '22px';

}
function fit(){
  const w = innerWidth, h = innerHeight;
  SCALE = Math.min(w/L.W, h/L.H);
  OX = (w - L.W*SCALE)/2;
  OY = h - L.H*SCALE;              // bottom-align so the bar always touches the bottom edge
  Object.assign(stage.style, { width:L.W+'px', height:L.H+'px', transform:`translate(${OX}px,${OY}px) scale(${SCALE})` });
  // Extend the bar beyond the stage on ultra-wide screens
  if (OX > 1 && L.mode!=='portrait'){ barExt.style.display='block'; barExt.style.height = ((200-44)*SCALE)+'px'; }
  else barExt.style.display='none';
}
function relayout(force){
  const next = computeLayout();
  const changed = force || !L || next.mode!==L.mode || next.W!==L.W;
  L = next;
  document.body.classList.toggle('portrait', L.mode==='portrait');
  if (changed){
    if (state==='preview' || state==='opening' || state==='closing') forceClosePreview();
    buildBar(); buildGrid(); setPage(Math.min(page, PAGES-1), true, true);
  }

}

  const ampm = h>=12 ? 'PM' : 'AM'; h = h%12 || 12;
  const hs = String(h), ms = String(m).padStart(2,'0');
  let x = 0, svg = '';
  for (const c of hs){ svg += digitSVG(c, x); x += 38; }
  svg += `<g opacity="${colon?1:.12}"><rect x="${x+1}" y="20" width="6" height="6" rx="2" fill="${SEG_COL}"/><rect x="${x+1}" y="40" width="6" height="6" rx="2" fill="${SEG_COL}"/></g>`; x += 14;

  hx += (mx-hx)*k; hy += (my-hy)*k;
  const roll = (mx/innerWidth - .5) * 14;  // the Wiimote "roll": tilts with where you point, not how fast
  hand.style.transform = `translate(${hx}px,${hy}px) rotate(${roll}deg)`;
  requestAnimationFrame(loop);
})();

let hotEl = null;
const bubble = document.getElementById('bubble');
function setHot(el, silent){
  if (el === hotEl) return;
  if (hotEl) hotEl.classList.remove('hot');
  hotEl = el;
  if (el){ el.classList.add('hot'); if (started && !silent) SFX.hover(); }
  updateBubble();
}
function updateBubble(){
  if (hotEl && hotEl.classList.contains('ch') && state==='menu'){
    const idx = +hotEl.dataset.idx, ch = CHANNELS[idx];
    bubble.textContent = ch.name;
    const s = idx % L.per, col = s % L.cols, row = Math.floor(s / L.cols);
    const cx = L.mx + col*(L.tw+L.gx) + L.tw/2, by = L.top + (row+1)*L.th + row*L.gy;
    const half = bubble.offsetWidth/2 || 120;
    bubble.style.left = Math.max(half+10, Math.min(L.W-half-10, cx)) + 'px';
    bubble.style.top = Math.min(by - 22, L.barTop - 40) + 'px';
    bubble.classList.add('on');
  } else bubble.classList.remove('on');
}
document.addEventListener('pointerover', e => {
  if (e.pointerType === 'touch') return;
  const el = e.target.closest('[data-hot]');
  setHot(el && !el.disabled && el.offsetParent !== null ? el : null);
});
document.documentElement.addEventListener('mouseleave', () => setHot(null));
document.addEventListener('focusin', e => { const el = e.target.closest('[data-hot]'); if (el) setHot(el, true); });

/* =====================================================================
   STATE MACHINE: warning → menu → opening → preview → content
                              ↖ closing ↙
   ===================================================================== */
let state = 'warning', started = false, page = 0, current = -1, pvTimer = null;
const menu = document.getElementById('menu'), warning = document.getElementById('warning');

function startMenu(){
  if (started) return;
  started = true; audio(); SFX.press();
  warning.classList.add('gone');
  menu.style.visibility = 'visible'; menu.classList.add('boot');
  state = 'menu';
  setTimeout(()=>{ warning.remove(); }, 700);
}
warning.addEventListener('click', startMenu);

/* --- paging --- */
const arrL = document.getElementById('arrL'), arrR = document.getElementById('arrR');
function setPage(p, silent, instant){
  page = Math.max(0, Math.min(PAGES-1, p));
  if (instant){ track.style.transition='none'; }
  track.style.transform = `translateX(${-page*L.W}px)`;
  if (instant){ track.offsetWidth; track.style.transition=''; }
  arrL.classList.toggle('show', page>0); arrR.classList.toggle('show', page<PAGES-1);
  arrL.disabled = page===0; arrR.disabled = page===PAGES-1;
  if (!silent) SFX.page();
  setHot(null);
}
arrL.onclick = () => setPage(page-1);
arrR.onclick = () => setPage(page+1);

/* --- preview: the menu "camera" pushes into the tile while its banner grows --- */
const preview = document.getElementById('preview'), pvZoom = document.getElementById('pvZoom');
function tileRect(idx){
  const s = idx % L.per, col = s % L.cols, row = Math.floor(s / L.cols);
  const w = L.tw-12, h = L.tw/L.th < 1.6 ? w*9/16 : L.th-12;
  return { l:L.mx + col*(L.tw+L.gx) + 6, t:L.top + row*(L.th+L.gy) + (L.th-h)/2, w, h };
}
function placeZoom(r, radius){ Object.assign(pvZoom.style, { left:r.l+'px', top:r.t+'px', width:r.w+'px', height:r.h+'px', borderRadius:radius+'px' }); }
function camera(on, idx){
  if (on){
    const r = tileRect(idx);
    pagesEl.style.transformOrigin = `${r.l + r.w/2}px ${r.t + r.h/2}px`;
    pagesEl.style.transform = 'scale(3.2)'; pagesEl.style.opacity = '0';
    bar.style.transform = 'translateY(230px)';
    arrL.style.opacity = arrR.style.opacity = '0';
  } else {
    pagesEl.style.transform = ''; pagesEl.style.opacity = '';
    bar.style.transform = ''; arrL.style.opacity = arrR.style.opacity = '';
  }
}
function openPreview(idx, dir){
  current = idx; const ch = CHANNELS[idx];
  if (state === 'menu'){
    state = 'opening'; SFX.select(); bubble.classList.remove('on');
    pvZoom.innerHTML = `<div class="bn">${B[ch.art]()}</div>`;
    pvZoom.style.transition = 'none'; placeZoom(tileRect(idx), 13); pvZoom.offsetWidth; pvZoom.style.transition = '';
    preview.classList.remove('closing'); preview.classList.add('open');
    requestAnimationFrame(() => { placeZoom(L.zoom, 0); camera(true, idx); });
    clearTimeout(pvTimer);
    pvTimer = setTimeout(() => { if (state!=='opening') return; state = 'preview'; preview.classList.add('shown'); document.getElementById('pvStart').focus({preventScroll:true}); playJingle(ch.jingle); }, 480);
  } else if (state === 'preview'){
    SFX.page(); stopJingle();
    pvZoom.innerHTML = `<div class="bn">${B[ch.art]()}</div>`;
    pvZoom.animate([{opacity:0, transform:`translateX(${dir*60}px)`},{opacity:1, transform:'none'}],{duration:260,easing:'ease-out'});
    setTimeout(()=>{ if (current===idx && state==='preview') playJingle(ch.jingle); }, 200);
  } else return;
  document.getElementById('pvL').style.visibility = idx>0 ? 'visible':'hidden';
  document.getElementById('pvR').style.visibility = idx<CHANNELS.length-1 ? 'visible':'hidden';
}
function closePreview(){
  if (state !== 'preview' && state !== 'opening') return;
  state = 'closing'; clearTimeout(pvTimer); stopJingle(); SFX.back();
  preview.classList.remove('shown'); preview.classList.add('closing');
  const p = Math.floor(current / L.per); if (p !== page) setPage(p, true, true);
  placeZoom(tileRect(current), 13); camera(false);
  pvTimer = setTimeout(() => {
    preview.classList.remove('open','closing'); pvZoom.innerHTML=''; pvZoom.style.width='0';
    state = 'menu';
    if (tiles[current]){ if (!coarse) tiles[current].focus({preventScroll:true}); setHot(coarse ? null : tiles[current], true); }
  }, 480);
}
function forceClosePreview(){
  clearTimeout(pvTimer); stopJingle(); camera(false);
  preview.classList.remove('open','shown','closing'); pvZoom.innerHTML=''; pvZoom.style.width='0';
  if (state!=='content') state = 'menu';
}
document.getElementById('pvMenu').onclick = closePreview;
document.getElementById('pvL').onclick = () => current>0 && openPreview(current-1, -1);
document.getElementById('pvR').onclick = () => current<CHANNELS.length-1 && openPreview(current+1, 1);
document.getElementById('pvStart').onclick = () => openContent(current);

/* --- channel content --- */
const content = document.getElementById('content'), ccFoot = document.getElementById('ccFoot');
let contentFrom = 'preview';
function showScreen(key, title, sub, art){
  const sc = SCREENS[key];
  document.getElementById('ccIco').innerHTML = art ? `<div class="bn">${B[art]()}</div>` : `<div class="bn"><div style="inset:0;background:#fffef6"></div><svg viewBox="0 0 96 64" style="left:25%;top:20%;width:50%;height:60%"><path d="M0 4v8l46.7 22.9c.8.4 1.8.4 2.6 0L96 12V4c0-2.2-1.8-4-4-4H4C1.8 0 0 1.8 0 4z" fill="#34beed"/><path d="M46.7 43.8 0 20.5V60c0 2.2 1.8 4 4 4h88c2.2 0 4-1.8 4-4V20.5L49.3 43.8c-.8.4-1.8.4-2.6 0z" fill="#34beed"/></svg></div>`;
  document.getElementById('ccTitle').textContent = title;
  document.getElementById('ccSub').textContent = sub;
  document.getElementById('ccInner').innerHTML = sc.html();
  ccFoot.innerHTML = `<button class="pill" id="ccBack" data-hot>Wii Menu</button>` +
    (sc.actions||[]).map(([l,h])=>`<a class="pill" data-hot href="${h}" ${h.startsWith('mailto:')?'':'target="_blank" rel="noopener"'} style="display:inline-flex;align-items:center;justify-content:center;text-decoration:none">${l}</a>`).join('');
  document.getElementById('ccBack').onclick = closeContent;
  content.dataset.theme = sc.theme || '';
  document.getElementById('ccBody').scrollTop = 0;
  content.classList.remove('leaving'); content.classList.add('open');
  document.documentElement.classList.add('in-content');
  stage.inert = true;
  setTimeout(()=>document.getElementById('ccTitle').focus({preventScroll:true}), 50);
  if (key === 'forecast') loadWeather();
  if (key === 'votes') wirePoll();
}
function openContent(idx){
  if (state !== 'preview') return;
  const ch = CHANNELS[idx]; SFX.start(); stopJingle();
  state = 'content'; contentFrom = 'preview';
  showScreen(ch.screen, ch.name, ch.sub, ch.art);
}
function closeContent(){
  if (state !== 'content') return;
  state = 'leaving'; SFX.back();
  content.querySelectorAll('video').forEach(v=>v.pause());
  content.classList.add('leaving');
  setTimeout(() => {
    content.classList.remove('open','leaving'); document.getElementById('ccInner').innerHTML = '';
    document.documentElement.classList.remove('in-content'); stage.inert = false;
    if (contentFrom === 'preview'){ state = 'preview'; preview.classList.add('shown'); document.getElementById('pvStart').focus({preventScroll:true}); }
    else { state = 'menu'; if (!coarse) document.getElementById('mailBtn').focus({preventScroll:true}); }
  }, 200);
}

/* --- Wii button / SD / mail --- */
const sys = document.getElementById('sysmenu');
function openSys(){ if(state!=='menu') return; SFX.select(); sys.classList.add('open'); state='sys'; bubble.classList.remove('on'); document.getElementById('sysData').focus({preventScroll:true}); }
function closeSys(){ if(state!=='sys') return; SFX.back(); sys.classList.remove('open'); state='menu'; if (!coarse) document.getElementById('wiiBtn').focus({preventScroll:true}); }
document.getElementById('wiiBtn').onclick = openSys;
document.getElementById('sysClose').onclick = closeSys;
document.getElementById('sysData').onclick = () => window.open(RESUME,'_blank','noopener');
document.getElementById('sysSettings').onclick = () => { location.href = ASSET; };
document.getElementById('sdBtn').onclick = () => { if (state==='menu'){ SFX.select(); window.open(RESUME,'_blank','noopener'); } };
document.getElementById('mailBtn').onclick = () => { if(state!=='menu') return; SFX.select(); state='content'; contentFrom='menu'; showScreen('board','Wii Message Board','Contact Zach',null); };

/* --- keyboard: arrows move the highlight, Enter/A = select, Esc/Backspace/B = back --- */
let kFocus = 0;
addEventListener('keydown', e => {
  const onControl = e.target.closest && e.target.closest('button,a,video,iframe,input');
  if (state === 'warning'){ if (['Enter',' ','a','A'].includes(e.key)){ e.preventDefault(); startMenu(); } return; }
  if (onControl && (e.key==='Enter' || e.key===' ')) return;  // native buttons handle their own activation
  const back = ['Escape','Backspace','b','B'].includes(e.key);
  if (state === 'menu'){
    if (hotEl && hotEl.dataset.idx) kFocus = +hotEl.dataset.idx;
    const per = L.per, cols = L.cols, s = kFocus % per, row = Math.floor(s/cols), col = s % cols;
    let n = null;
    if (!hotEl && e.key.startsWith('Arrow')) n = page*per;
    else if (e.key==='ArrowRight') n = col < cols-1 ? kFocus+1 : (page < PAGES-1 ? (page+1)*per + row*cols : null);
    else if (e.key==='ArrowLeft') n = col > 0 ? kFocus-1 : (page > 0 ? (page-1)*per + row*cols + cols-1 : null);
    else if (e.key==='ArrowDown') n = row < L.rows-1 ? kFocus+cols : null;
    else if (e.key==='ArrowUp') n = row > 0 ? kFocus-cols : null;
    else if (e.key==='Enter' || e.key==='a' || e.key==='A'){ if (hotEl && hotEl.classList.contains('ch')) openPreview(+hotEl.dataset.idx); return; }
    else return;
    e.preventDefault();
    if (n===null || n<0) return;
    n = Math.min(n, CHANNELS.length-1);
    const p = Math.floor(n/per); if (p!==page) setPage(p);
    kFocus = n; tiles[n].focus({preventScroll:true}); setHot(tiles[n]);
  } else if (state === 'preview'){
    if (back){ e.preventDefault(); closePreview(); }
    else if (e.key==='Enter' || e.key==='a' || e.key==='A') openContent(current);
    else if (e.key==='ArrowLeft' && current>0) openPreview(current-1,-1);
    else if (e.key==='ArrowRight' && current<CHANNELS.length-1) openPreview(current+1,1);
  } else if (state === 'content'){
    if (e.key==='Escape' || ((e.key==='Backspace' || e.key==='b' || e.key==='B') && !onControl)){ e.preventDefault(); closeContent(); }
  } else if (state === 'sys'){
    if (back) closeSys();
    else if (e.key==='ArrowRight' || e.key==='ArrowDown') document.getElementById('sysSettings').focus();
    else if (e.key==='ArrowLeft' || e.key==='ArrowUp') document.getElementById('sysData').focus();
  }
});

/* --- touch: swipe pages in the menu, channels in the preview --- */
let tsx = null, tsy = null;
addEventListener('touchstart', e => { tsx = e.touches[0].clientX; tsy = e.touches[0].clientY; }, {passive:true});
addEventListener('touchend', e => {
  if (tsx===null) return; const dx = e.changedTouches[0].clientX - tsx, dy = e.changedTouches[0].clientY - tsy; tsx = null;
  if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy)) return;
  if (state==='menu') setPage(page + (dx<0?1:-1));
  else if (state==='preview'){ const n = current + (dx<0?1:-1); if (n>=0 && n<CHANNELS.length) openPreview(n, dx<0?1:-1); }
});

/* =====================================================================
   LIVE DATA: forecast + poll
   ===================================================================== */
const WX_CODES = {0:'Clear',1:'Mostly Clear',2:'Partly Cloudy',3:'Cloudy',45:'Fog',48:'Fog',51:'Drizzle',53:'Drizzle',55:'Drizzle',61:'Rain',63:'Rain',65:'Heavy Rain',71:'Snow',73:'Snow',75:'Heavy Snow',80:'Showers',81:'Showers',82:'Showers',95:'Thunderstorms'};
const CITIES = [[40.73,-73.99],[42.39,-71.22],[43.89,-70.33]];
let wxCache = null;
function fetchWeather(){
  if (wxCache) return wxCache;
  const lat = CITIES.map(c=>c[0]).join(','), lon = CITIES.map(c=>c[1]).join(',');
  wxCache = fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&temperature_unit=fahrenheit`)
    .then(r=>r.json()).then(d=>Array.isArray(d)?d:[d]).catch(()=>null);
  return wxCache;
}
function paintBannerTemp(){
  fetchWeather().then(d=>{ if(!d || !d[0] || !d[0].current) return; const t = Math.round(d[0].current.temperature_2m)+'°';
    document.querySelectorAll('.wx-temp').forEach(el=>{ el.textContent=t; el.style.display='block'; }); });
}
function loadWeather(){
  fetchWeather().then(d=>{
    document.querySelectorAll('#wxCards [data-wx]').forEach((el,i)=>{
      if(!d || !d[i] || !d[i].current){ el.querySelector('.temp').textContent='—'; el.querySelector('.cond').textContent='Forecast unavailable right now'; return; }
      el.querySelector('.temp').textContent = Math.round(d[i].current.temperature_2m)+'°F';
      el.querySelector('.cond').textContent = WX_CODES[d[i].current.weather_code] || '—';
    });
  });
}
new MutationObserver(paintBannerTemp).observe(pvZoom,{childList:true});

function wirePoll(){
  document.querySelectorAll('[data-vote]').forEach(b=>b.onclick=()=>{
    const v = +b.dataset.vote; SFX.select();
    const base = [72, 28]; base[v] += 1; const tot = base[0]+base[1];
    document.getElementById('pollRes').style.display='block';
    [0,1].forEach(i=>{ const pct = Math.round(base[i]/tot*100);
      document.getElementById('pv'+i).textContent = pct+'%';
      requestAnimationFrame(()=>document.getElementById('pb'+i).style.width = pct+'%'); });
  });
}

/* =====================================================================
   GO
   ===================================================================== */
relayout(true);
let rT; addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(()=>relayout(false), 80); });
</script>
