<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Wii Menu · Zach Winship</title>
<link rel="icon" href="../../images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@400;500;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --wii-cyan:#34beed;
  --wii-cyan-lt:#8fdcf7;
  --wii-gray:#8f9196;
  --wii-gray-dk:#5c5e63;
  --wii-bar:#e1e2e6;
  --wii-bar-dk:#d4d5d9;
  --tile-border:#c3c4c8;
  --bg:#f4f4f4;
  --font:'M PLUS 1p','Helvetica Neue',Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:var(--font);color:#4a4c50;-webkit-font-smoothing:antialiased;user-select:none}
button{font-family:inherit;border:0;background:none;color:inherit}
.has-hand, .has-hand *{cursor:none !important}

/* The faint horizontal scanlines of the Wii Menu background */
.scan{
  background-color:#f7f7f7;
  background-image:repeating-linear-gradient(to bottom,#f7f7f7 0 2px,#ececec 2px 4px);
}

/* ================= STAGE (fixed 1280x720, scaled to fit) ================= */
#root{position:fixed;inset:0;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden}

/* ================= HEALTH & SAFETY ================= */
#warning{position:absolute;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;transition:opacity .7s ease}
#warning.gone{opacity:0;pointer-events:none}
.warn-title{display:flex;align-items:center;gap:18px;font-size:46px;font-weight:800;color:#222;letter-spacing:.5px}
.warn-title svg{width:58px;height:58px}
.warn-rule{width:880px;height:3px;background:#222;margin:22px 0 34px}
.warn-body{width:880px;font-size:30px;line-height:1.55;font-weight:500;color:#222}
.warn-body b{font-weight:800}
.warn-body .url{display:block;margin-top:26px;color:#222}
.warn-press{margin-top:80px;font-size:30px;font-weight:700;color:#222;display:flex;align-items:center;gap:12px;animation:blink 1.6s ease-in-out infinite}
.a-btn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;background:#222;color:#fff;font-size:26px;font-weight:800}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

/* ================= MENU ================= */
#menu{position:absolute;inset:0}
#menu.boot{animation:menuBoot .9s ease both}
@keyframes menuBoot{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}

#pages{position:absolute;left:0;top:0;width:1280px;height:560px;overflow:hidden}
#track{position:absolute;left:0;top:0;height:100%;display:flex;transition:transform .6s cubic-bezier(.3,.9,.3,1)}
.page{width:1280px;height:560px;position:relative;flex:0 0 1280px}
.grid{position:absolute;left:94px;top:42px;display:grid;grid-template-columns:repeat(4,258px);grid-template-rows:repeat(3,152px);gap:16px 20px}

/* --- channel tile --- */
.ch{position:relative;border-radius:22px;background:#fff;border:3px solid var(--tile-border);box-shadow:0 2px 3px rgba(0,0,0,.08);padding:4px;transition:border-color .12s,box-shadow .12s,transform .18s}
.ch .bn{position:absolute;inset:4px;border-radius:16px;overflow:hidden}
.ch.hot{border-color:var(--wii-cyan);box-shadow:0 0 0 2px var(--wii-cyan-lt),0 0 16px 3px rgba(52,190,237,.55);z-index:3}
.ch.empty{background:#e6e6e8;border-color:#cfd0d3;box-shadow:inset 0 1px 3px rgba(0,0,0,.06)}
.ch.empty .bn{display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(to bottom,#ebebed 0 2px,#e1e1e4 2px 4px)}
.wii-logo{font-family:var(--font);font-weight:800;letter-spacing:-1px;color:#c9cacd;font-size:44px;font-style:italic;text-shadow:0 1px 0 #f6f6f7}

/* hover label bubble */
#bubble{position:absolute;z-index:40;pointer-events:none;padding:9px 38px;border-radius:999px;background:#fff;border:3px solid #c9cacd;box-shadow:0 4px 10px rgba(0,0,0,.18);font-size:23px;font-weight:700;color:#4a4c50;white-space:nowrap;opacity:0;transform:translate(-50%,6px) scale(.9);transition:opacity .12s,transform .12s}
#bubble.on{opacity:1;transform:translate(-50%,0) scale(1)}

/* page arrows */
.parrow{position:absolute;top:230px;width:46px;height:82px;z-index:5;opacity:0;transition:opacity .25s,transform .15s}
.parrow svg{width:100%;height:100%;filter:drop-shadow(0 2px 3px rgba(20,60,120,.3))}
.parrow.show{opacity:1}
.parrow.hot{transform:scale(1.15)}
#arrR{right:22px}
#arrL{left:22px}
#arrL svg{transform:scaleX(-1)}

/* ================= BOTTOM BAR ================= */
#bar{position:absolute;left:0;top:520px;width:1280px;height:200px}
#bar svg.shape{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#clock{position:absolute;left:0;right:0;top:20px;display:flex;justify-content:center;align-items:flex-start;height:62px}
#clock svg{height:62px}
#date{position:absolute;left:0;right:0;top:120px;text-align:center;font-size:34px;font-weight:700;color:#8a8c91;letter-spacing:.5px}
.round-btn{position:absolute;top:65px;width:132px;height:132px;border-radius:50%}
.round-btn .face{position:absolute;inset:8px;border-radius:50%;background:radial-gradient(circle at 40% 30%,#f3f3f4 0%,#dadadc 60%,#cfd0d2 100%);border:4px solid var(--wii-cyan);box-shadow:0 4px 6px rgba(0,0,0,.18),inset 0 2px 2px #fff;display:flex;align-items:center;justify-content:center;transition:box-shadow .15s,transform .15s}
.round-btn .face::before{content:"";position:absolute;left:14%;top:8%;width:60%;height:44%;border-radius:50%;background:linear-gradient(#ffffffd0,#ffffff00);transform:rotate(-25deg)}
.round-btn.hot .face{box-shadow:0 0 0 4px var(--wii-cyan-lt),0 0 18px 4px rgba(52,190,237,.6),0 4px 6px rgba(0,0,0,.18);transform:scale(1.05)}
#wiiBtn{left:58px}
#mailBtn{right:58px}
.round-btn .lbl{position:relative;font-weight:800;font-size:38px;color:#a1a0a4;letter-spacing:-1px;font-style:italic}
#mailBtn .dot{position:absolute;right:16px;top:14px;width:22px;height:22px;border-radius:50%;background:#34beed;border:3px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.25);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
#sdBtn{position:absolute;left:214px;top:102px;width:46px;height:56px}

/* ================= CHANNEL PREVIEW (zoomed banner) ================= */
#preview{position:absolute;inset:0;z-index:50;pointer-events:none}
#preview.open{pointer-events:auto}
#pvBg{position:absolute;inset:0;opacity:0;transition:opacity .35s}
#preview.open #pvBg{opacity:1}
#pvZoom{position:absolute;border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 0 0 rgba(0,0,0,0);transition:left .45s cubic-bezier(.3,.9,.3,1),top .45s cubic-bezier(.3,.9,.3,1),width .45s cubic-bezier(.3,.9,.3,1),height .45s cubic-bezier(.3,.9,.3,1),border-radius .45s}
#pvZoom .bn{position:absolute;inset:0}
#pvBottom{position:absolute;left:0;right:0;bottom:0;height:148px;display:flex;align-items:center;justify-content:center;gap:120px;opacity:0;transition:opacity .25s;border-top:3px solid #34beed;box-shadow:0 -2px 8px rgba(0,0,0,.08)}
#preview.shown #pvBottom{opacity:1}
.pill{position:relative;width:360px;height:96px;border-radius:999px;background:linear-gradient(#ffffff 0%,#f2f4f7 45%,#dfe3ea 100%);border:3px solid #b9d9ea;box-shadow:0 4px 8px rgba(0,0,0,.18),inset 0 -4px 8px rgba(160,175,195,.35);font-size:38px;font-weight:500;color:#4b4f55;transition:box-shadow .12s,border-color .12s,transform .12s}
.pill::before{content:"";position:absolute;left:30px;right:30px;top:6px;height:32px;border-radius:999px;background:linear-gradient(#ffffffee,#ffffff00)}
.pill span{position:relative}
.pill.hot{border-color:var(--wii-cyan);box-shadow:0 0 0 3px var(--wii-cyan-lt),0 0 18px 4px rgba(52,190,237,.55),0 4px 8px rgba(0,0,0,.18);transform:scale(1.04)}
.pvarrow{position:absolute;top:245px;width:46px;height:82px;opacity:0;transition:opacity .25s,transform .15s}
#preview.shown .pvarrow{opacity:1}
.pvarrow svg{width:100%;height:100%;filter:drop-shadow(0 2px 3px rgba(20,60,120,.3))}
.pvarrow.hot{transform:scale(1.15)}
#pvL{left:22px} #pvL svg{transform:scaleX(-1)}
#pvR{right:22px}

/* ================= WII BUTTON MENU (system options) ================= */
#sysmenu{position:absolute;inset:0;z-index:55;display:none;flex-direction:column;align-items:center;justify-content:center;gap:40px}
#sysmenu.open{display:flex;animation:fadeIn .3s ease}
#sysmenu .sys-title{font-size:40px;font-weight:700;color:#6a6c71}
.sys-row{display:flex;gap:60px}
.sysbtn{width:420px;height:230px;border-radius:30px;background:linear-gradient(#fff,#eceef1);border:3px solid #c7c8cc;box-shadow:0 4px 10px rgba(0,0,0,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;font-size:34px;font-weight:700;color:#55575c;transition:box-shadow .12s,border-color .12s,transform .12s}
.sysbtn svg{width:96px;height:96px}
.sysbtn.hot{border-color:var(--wii-cyan);box-shadow:0 0 0 3px var(--wii-cyan-lt),0 0 18px 4px rgba(52,190,237,.5);transform:scale(1.03)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

#rotate{display:none;position:fixed;left:16px;right:16px;bottom:24px;text-align:center;font-size:14px;font-weight:700;color:#8a8c91}
@media (orientation:portrait) and (max-width:700px){#rotate{display:block}}

/* ================= HAND CURSOR ================= */
#hand{position:fixed;left:0;top:0;z-index:9999;pointer-events:none;width:58px;height:70px;margin:-6px 0 0 -18px;display:none;transform-origin:18px 6px;will-change:transform}
.has-hand #hand{display:block}
#hand.press svg{transform:scale(.9)}
#hand svg{width:100%;height:100%;transition:transform .08s;filter:drop-shadow(1px 3px 2px rgba(0,0,0,.3))}

/* ================= CHANNEL CONTENT (unscaled, responsive) ================= */
#content{position:fixed;inset:0;z-index:70;display:none;flex-direction:column}
#content.open{display:flex;animation:fadeIn .35s ease}
.cc-head{flex:0 0 auto;display:flex;align-items:center;gap:16px;padding:18px clamp(16px,4vw,48px);background:linear-gradient(#ffffff,#eef0f3);border-bottom:3px solid var(--wii-cyan)}
.cc-head .ico{width:52px;height:52px;border-radius:14px;overflow:hidden;border:3px solid var(--tile-border);flex:0 0 auto;position:relative;background:#fff}
.cc-head .ico .bn{position:absolute;inset:0}
.cc-head h1{font-size:clamp(22px,3vw,32px);font-weight:800;color:#55575c}
.cc-head p{font-size:14px;color:#8a8c91;font-weight:500}
.cc-body{flex:1;overflow-y:auto;padding:28px clamp(16px,4vw,48px) 40px;-webkit-overflow-scrolling:touch;user-select:text}
.cc-inner{max-width:1040px;margin:0 auto}
.cc-foot{flex:0 0 auto;display:flex;justify-content:center;gap:24px;padding:14px 16px;background:linear-gradient(#eceef1,#dcdee2);border-top:2px solid #cfd0d4}
.cc-foot .pill{width:240px;height:58px;font-size:24px}
.cc-foot .pill::before{top:4px;height:20px;left:22px;right:22px}

.sec-h{font-size:15px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#34a9d6;margin:30px 0 14px;display:flex;align-items:center;gap:12px}
.sec-h::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,#bfe7f6,transparent)}
.sec-h:first-child{margin-top:0}
.card{background:#fff;border:3px solid #d5d6da;border-radius:22px;padding:22px 24px;margin-bottom:16px;box-shadow:0 2px 4px rgba(0,0,0,.05);transition:border-color .15s,box-shadow .15s}
.card:hover{border-color:var(--wii-cyan);box-shadow:0 0 0 2px #c9eefb,0 6px 16px rgba(52,190,237,.18)}
.card h3{font-size:21px;font-weight:800;color:#45474c;line-height:1.3}
.card .meta{font-size:13px;font-weight:700;color:#34a9d6;margin:4px 0 10px;letter-spacing:.3px}
.card p{font-size:15.5px;line-height:1.65;color:#5a5c61}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tag{font-size:12px;font-weight:700;color:#6a6c71;background:#f0f1f3;border:2px solid #dedfe2;border-radius:999px;padding:2px 11px}
.links{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.wbtn{display:inline-flex;align-items:center;gap:8px;padding:8px 20px;border-radius:999px;background:linear-gradient(#fff,#e7ebf0);border:2px solid #b9d9ea;color:#3f4348;font-weight:700;font-size:14px;text-decoration:none;box-shadow:0 2px 4px rgba(0,0,0,.1);transition:all .12s}
.wbtn:hover{border-color:var(--wii-cyan);box-shadow:0 0 0 2px #c9eefb,0 0 10px rgba(52,190,237,.5)}
.wbtn.blue{background:linear-gradient(#5fd0f6,#22a8dc);border-color:#1b93c4;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.2)}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.grid2 .card{margin:0}
.badge{display:inline-block;font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:3px 10px;border-radius:999px;background:#34beed;color:#fff;margin-right:6px;vertical-align:middle}
.badge.gray{background:#a9abb0}
.about-top{display:flex;gap:28px;align-items:center;flex-wrap:wrap}
.about-top img{width:170px;height:170px;object-fit:cover;border-radius:30px;border:4px solid #fff;box-shadow:0 0 0 3px #d5d6da,0 6px 14px rgba(0,0,0,.12)}
.about-top h2{font-size:34px;font-weight:800;color:#45474c}
.about-top .sub{color:#34a9d6;font-weight:700;margin-top:2px}
video{width:100%;border-radius:14px;background:#000;margin-top:12px;display:block}
.vids{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:10px}
.vids figcaption{font-size:13px;font-weight:700;color:#6a6c71;margin-top:6px}
.shop-row{display:flex;gap:18px;align-items:flex-start}
.shop-row .thumb{flex:0 0 150px;height:96px;border-radius:14px;overflow:hidden;position:relative;border:3px solid #d5d6da;container-type:size}
.shop-row .thumb .bn{position:absolute;inset:0}
.shop-row .price{margin-left:auto;flex:0 0 auto;font-weight:800;color:#34a9d6;font-size:14px;text-align:right}
@media (max-width:640px){.shop-row{flex-direction:column}.shop-row .thumb{width:100%;flex-basis:auto;height:140px}.shop-row .price{margin-left:0;text-align:left}}
.wx{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.wx .card{text-align:center}
.wx .temp{font-size:64px;font-weight:800;color:#45474c;line-height:1}
.wx .cond{font-weight:700;color:#34a9d6;margin-top:6px}
.poll-opts{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px}
.poll-bar{height:30px;border-radius:999px;background:#eef0f2;overflow:hidden;margin-top:8px;border:2px solid #dedfe2}
.poll-bar i{display:block;height:100%;border-radius:999px;transition:width .8s cubic-bezier(.3,.9,.3,1)}
.list-plain{list-style:none}
.list-plain li{padding:10px 0;border-bottom:2px dashed #e4e5e8;font-size:15px}
.list-plain li:last-child{border:0}
.list-plain a{color:#1f8fc0;font-weight:700;text-decoration:none}
.list-plain a:hover{text-decoration:underline}
.pdf-frame{width:100%;height:70vh;border:3px solid #d5d6da;border-radius:18px;background:#fff}

/* ================= BANNERS =================
   Every banner is drawn in container units so the same markup works
   on a channel tile, in the zoomed preview and in the content header. */
.bn{container-type:size;font-family:var(--font)}
.bn *{position:absolute}
.bn .t{left:0;right:0;text-align:center;font-weight:800;white-space:nowrap}
.spin{animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6%)}}
@keyframes walk{from{transform:translateX(-30cqw)}to{transform:translateX(130cqw)}}
@keyframes ticker{from{transform:translateX(100cqw)}to{transform:translateX(-100%)}}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes floaty{0%,100%{transform:translate(0,0)}50%{transform:translate(2cqw,-3cqh)}}
@keyframes ledrun{from{offset-distance:0%}to{offset-distance:100%}}
@keyframes grow{from{transform:scaleX(.05)}to{transform:scaleX(1)}}
@keyframes draw{from{stroke-dashoffset:400}to{stroke-dashoffset:0}}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
</style>
</head>
<body class="scan">

<div id="root" class="scan">
<div id="stage" class="scan">

  <!-- ===== Health & Safety ===== -->
  <div id="warning">
    <div class="warn-title">
      <svg viewBox="0 0 60 60"><path d="M30 4 57 54H3Z" fill="#222"/><path d="M27.5 20h5l-1 20h-3zM27.5 44h5v5h-5z" fill="#fff"/></svg>
      WARNING-HEALTH AND SAFETY
    </div>
    <div class="warn-rule"></div>
    <div class="warn-body">
      BEFORE BROWSING, READ ZACH'S <b>RÉSUMÉ</b> FOR IMPORTANT INFORMATION ABOUT HIS RESEARCH, PROJECTS AND EXPERIENCE.
      <span class="url">Also online at<br>zwinship.github.io</span>
    </div>
    <div class="warn-press">Press <span class="a-btn">A</span> to continue.</div>
  </div>

  <!-- ===== Wii Menu ===== -->
  <div id="menu" style="visibility:hidden">
    <div id="pages"><div id="track"></div></div>

    <button class="parrow" id="arrL" aria-label="Previous page" data-hot></button>
    <button class="parrow" id="arrR" aria-label="Next page" data-hot></button>

    <div id="bar">
      <svg class="shape" viewBox="0 0 1280 200" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <linearGradient id="barG" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#e9eaed"/><stop offset=".35" stop-color="#e1e2e6"/><stop offset="1" stop-color="#d6d7db"/>
          </linearGradient>
          <linearGradient id="tabG" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#dcdcde"/><stop offset="1" stop-color="#cfcfd2"/>
          </linearGradient>
          <filter id="barShadow" x="-5%" y="-30%" width="110%" height="160%">
            <feDropShadow dx="0" dy="-2" stdDeviation="4" flood-color="#6c7c8c" flood-opacity=".18"/>
          </filter>
          <filter id="tabShadow" x="-20%" y="-20%" width="140%" height="160%">
            <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000" flood-opacity=".18"/>
          </filter>
        </defs>
        <!-- silhouette: raised shoulders at the corners, a dip in the middle -->
        <path filter="url(#barShadow)" fill="url(#barG)" d="M0,44 H204 C236,44 275,44 322,84 C354,112 384,130 442,130 H838 C896,130 926,112 958,84 C1005,44 1044,44 1076,44 H1280 V200 H0 Z"/>
        <path fill="none" stroke="#fff" stroke-width="5" opacity=".8" d="M0,47 H204 C236,47 275,47 322,87 C354,115 384,133 442,133 H838 C896,133 926,115 958,87 C1005,47 1044,47 1076,47 H1280"/>
        <path fill="none" stroke="#34beed" stroke-width="3" d="M0,44 H204 C236,44 275,44 322,84 C354,112 384,130 442,130 H838 C896,130 926,112 958,84 C1005,44 1044,44 1076,44 H1280"/>
        <!-- button holder tabs -->
        <path filter="url(#tabShadow)" fill="url(#tabG)" d="M0,61 H118 C155,61 186,92 186,130 C186,168 155,199 118,199 H0 Z"/>
        <path filter="url(#tabShadow)" fill="url(#tabG)" d="M1280,61 H1162 C1125,61 1094,92 1094,130 C1094,168 1125,199 1162,199 H1280 Z"/>
      </svg>
      <div id="clock" aria-label="Clock"></div>
      <div id="date"></div>
      <button class="round-btn" id="wiiBtn" aria-label="Wii Menu options" data-hot><span class="face"><span class="lbl">Wii</span></span></button>
      <button class="round-btn" id="mailBtn" aria-label="Wii Message Board" data-hot>
        <span class="face"><svg width="58" height="42" viewBox="0 0 96 64" style="position:relative"><path d="M0 4v8l46.7 22.9c.8.4 1.8.4 2.6 0L96 12V4c0-2.2-1.8-4-4-4H4C1.8 0 0 1.8 0 4z" fill="#a1a0a4"/><path d="M46.7 43.8 0 20.5V60c0 2.2 1.8 4 4 4h88c2.2 0 4-1.8 4-4V20.5L49.3 43.8c-.8.4-1.8.4-2.6 0z" fill="#a1a0a4"/></svg></span>

let AC = null;
function audio(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function tone(freq, dur=.06, type='sine', vol=.05, when=0, slide=0){
  const ac = audio(); if(!ac) return;
  const t = ac.currentTime + when, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(freq*slide, t+dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t+.006); g.gain.exponentialRampToValueAtTime(.0001, t+dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t+dur+.02);
}

  page: () => tone(600,.12,'sine',.04,0,1.8),

/* ---- clock: seven-segment digits drawn in SVG ---- */
const SEG = { // a b c d e f g
  0:'1111110',1:'0110000',2:'1101101',3:'1111001',4:'0110011',5:'1011011',6:'1011111',7:'1110000',8:'1111111',9:'1111011',' ':'0000000' };
const SEG_POLY = [
  'M6,2 H30 L26,7 H10 Z', 'M31,4 V30 L27,27 V8 Z', 'M31,34 V60 L27,56 V37 Z',
  'M6,62 H30 L26,57 H10 Z', 'M5,34 V60 L9,56 V37 Z', 'M5,4 V30 L9,27 V8 Z', 'M7,32 L10,29.5 H26 L29,32 L26,34.5 H10 Z'];
function digitSVG(ch, x){
  const on = SEG[ch] || SEG[' '];
  return `<g transform="translate(${x},0)">${SEG_POLY.map((d,i)=>on[i]==='1'?`<path d="${d}" fill="#97999e"/>`:'').join('')}</g>`;
}
let colon = true;
function tick(){
  const now = new Date();
  let h = now.getHours(); const m = now.getMinutes();
  const ampm = h>=12 ? 'PM' : 'AM'; h = h%12 || 12;
  const hs = String(h).padStart(2,' '), ms = String(m).padStart(2,'0');
  let x = 0, svg = '';
  if (hs[0] !== ' ') { svg += digitSVG(hs[0], x); x += 40; }
  svg += digitSVG(hs[1], x); x += 40;
  svg += `<g opacity="${colon?1:.15}"><rect x="${x+2}" y="18" width="7" height="7" rx="1.5" fill="#97999e"/><rect x="${x+2}" y="40" width="7" height="7" rx="1.5" fill="#97999e"/></g>`; x += 16;
  svg += digitSVG(ms[0], x); x += 40; svg += digitSVG(ms[1], x); x += 40;
  svg += `<text x="${x+4}" y="20" font-family="M PLUS 1p,Arial" font-weight="800" font-size="17" fill="#97999e">${ampm}</text>`; x += 34;
  document.getElementById('clock').innerHTML = `<svg viewBox="0 0 ${x} 64" width="${x}" height="62">${svg}</svg>`;
  const wd = now.toLocaleDateString('en-US',{weekday:'short'});
  document.getElementById('date').textContent = `${wd} ${now.getMonth()+1}/${now.getDate()}`;
  colon = !colon;
}

}

function tileRectInStage(idx){
  const r = tiles[idx].getBoundingClientRect();
  return { l:(r.left-OX)/SCALE+7, t:(r.top-OY)/SCALE+7, w:r.width/SCALE-14, h:r.height/SCALE-14 };
}
function placeZoom(r, radius){ Object.assign(pvZoom.style, { left:r.l+'px', top:r.t+'px', width:r.w+'px', height:r.h+'px', borderRadius:radius+'px' }); }
function openPreview(idx, fromSide){
  current = idx; const ch = CHANNELS[idx];
  pvZoom.innerHTML = `<div class="bn">${B[ch.art]()}</div>`;
  if (state === 'menu'){
    state = 'preview'; SFX.select(); bubble.classList.remove('on');
    pvZoom.style.transition = 'none'; placeZoom(tileRectInStage(idx), 16);
    pvZoom.offsetWidth; pvZoom.style.transition = '';
    requestAnimationFrame(()=>{ placeZoom({l:0,t:0,w:1280,h:572}, 0); });
    preview.classList.add('open');
    setTimeout(()=>preview.classList.add('shown'), 380);
  } else {
    SFX.page();
    pvZoom.animate([{opacity:0, transform:`translateX(${fromSide*60}px)`},{opacity:1, transform:'none'}],{duration:280,easing:'ease-out'});
  }
  document.getElementById('pvL').style.visibility = idx>0 ? 'visible':'hidden';
  document.getElementById('pvR').style.visibility = idx<CHANNELS.length-1 ? 'visible':'hidden';
}
function closePreview(){
  if (state !== 'preview') return;
  SFX.back(); preview.classList.remove('shown');
  const p = Math.floor(current/12); if (p !== page) setPage(p, true);
  placeZoom(tileRectInStage(current), 16);
  setTimeout(()=>{ preview.classList.remove('open'); pvZoom.innerHTML=''; pvZoom.style.width='0'; state='menu'; }, 450);
}
document.getElementById('pvMenu').onclick = closePreview;
document.getElementById('pvL').onclick = () => current>0 && openPreview(current-1, -1);
document.getElementById('pvR').onclick = () => current<CHANNELS.length-1 && openPreview(current+1, 1);
document.getElementById('pvStart').onclick = () => openContent(current);

tiles.forEach((t,i) => t && t.addEventListener('click', () => state==='menu' && openPreview(i)));

/* --- channel content --- */
const content = document.getElementById('content');
function openContent(idx){
  const ch = CHANNELS[idx]; SFX.start();
  document.getElementById('ccIco').innerHTML = `<div class="bn">${B[ch.art]()}</div>`;
  document.getElementById('ccTitle').textContent = ch.title;
  document.getElementById('ccSub').textContent = ch.name;
  document.getElementById('ccInner').innerHTML = SCREENS[ch.screen]();
  document.getElementById('ccBody').scrollTop = 0;
  content.classList.add('open'); state = 'content';
  if (ch.screen === 'forecast') loadWeather();
  if (ch.screen === 'votes') wirePoll();
}
document.getElementById('ccBack').onclick = () => {
  content.classList.remove('open');
  content.querySelectorAll('video').forEach(v=>v.pause());
  document.getElementById('ccInner').innerHTML = '';
  state = 'preview'; closePreview();
};

/* --- Wii button / mail button --- */
const sys = document.getElementById('sysmenu');
document.getElementById('wiiBtn').onclick = () => { if(state!=='menu') return; SFX.select(); sys.classList.add('open'); state='sys'; };
document.getElementById('sysClose').onclick = () => { SFX.back(); sys.classList.remove('open'); state='menu'; };
document.getElementById('sysData').onclick = () => window.open(ASSET+'about_me/resume.pdf','_blank');
document.getElementById('sysSettings').onclick = () => { location.href = ASSET; };
document.getElementById('mailBtn').onclick = () => { if(state!=='menu') return; SFX.select(); location.href = 'mailto:'+EMAIL; };

/* --- keyboard: arrows move the cursor focus, Enter = A, Esc/Backspace = B --- */
let kFocus = 0;
addEventListener('keydown', e => {
  if (state === 'warning'){ if (['Enter',' ','a','A'].includes(e.key)){ e.preventDefault(); startMenu(); } return; }
  if (state === 'menu'){
    const cols = 4, onPage = i => Math.floor(i/12) === page;
    if (hotEl && hotEl.dataset.idx) kFocus = +hotEl.dataset.idx;
    let n = kFocus;
    if (e.key==='ArrowRight'){ n = (kFocus%4===3) ? Math.min(CHANNELS.length-1,(page+1)*12) : kFocus+1; }
    else if (e.key==='ArrowLeft'){ n = (kFocus%4===0) ? Math.max(0, page*12-9) : kFocus-1; }
    else if (e.key==='ArrowDown'){ n = kFocus+cols; }
    else if (e.key==='ArrowUp'){ n = kFocus-cols; }
    else if (e.key==='Enter' || e.key==='a'){ if (hotEl && hotEl.dataset.idx) openPreview(+hotEl.dataset.idx); else openPreview(kFocus); return; }
    else return;
    e.preventDefault();
    if (n<0 || n>=CHANNELS.length) return;
    const p = Math.floor(n/12); if (p!==page) setPage(p);
    kFocus = n; setHot(tiles[n]);
  } else if (state === 'preview'){
    if (e.key==='Escape' || e.key==='Backspace' || e.key==='b') closePreview();
    else if (e.key==='Enter' || e.key==='a') openContent(current);
    else if (e.key==='ArrowLeft' && current>0) openPreview(current-1,-1);
    else if (e.key==='ArrowRight' && current<CHANNELS.length-1) openPreview(current+1,1);
  } else if (state === 'content'){
    if (e.key==='Escape') document.getElementById('ccBack').click();
  } else if (state === 'sys'){
    if (e.key==='Escape') document.getElementById('sysClose').click();
  }
});

/* --- touch: swipe between pages --- */
let tsx = null;
addEventListener('touchstart', e => { if(state==='menu') tsx = e.touches[0].clientX; }, {passive:true});
addEventListener('touchend', e => {
  if (tsx===null) return; const dx = e.changedTouches[0].clientX - tsx; tsx = null;
  if (Math.abs(dx) > 60) setPage(page + (dx<0?1:-1));
});

/* =====================================================================
   LIVE DATA: Forecast + poll
   ===================================================================== */
const WX_CODES = {0:'Clear',1:'Mostly Clear',2:'Partly Cloudy',3:'Cloudy',45:'Fog',48:'Fog',51:'Drizzle',53:'Drizzle',55:'Drizzle',61:'Rain',63:'Rain',65:'Heavy Rain',71:'Snow',73:'Snow',75:'Heavy Snow',80:'Showers',81:'Showers',82:'Showers',95:'Thunderstorms'};
const CITIES = [[40.73,-73.99],[42.39,-71.22],[43.89,-70.33]];
let wxCache = null;
function fetchWeather(){
  if (wxCache) return wxCache;
  const lat = CITIES.map(c=>c[0]).join(','), lon = CITIES.map(c=>c[1]).join(',');
  wxCache = fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&temperature_unit=fahrenheit`)
    .then(r=>r.json()).then(d=>Array.isArray(d)?d:[d]).catch(()=>null);
  return wxCache;
}
function paintBannerTemp(){
  fetchWeather().then(d=>{ if(!d) return; const t = Math.round(d[0].current.temperature_2m)+'°';
    document.querySelectorAll('.wx-temp').forEach(el=>el.textContent=t); });
}
function loadWeather(){
  fetchWeather().then(d=>{
    document.querySelectorAll('#wxCards [data-wx]').forEach((el,i)=>{
      if(!d || !d[i]){ el.querySelector('.cond').textContent='Forecast unavailable'; return; }
      el.querySelector('.temp').textContent = Math.round(d[i].current.temperature_2m)+'°F';
      el.querySelector('.cond').textContent = WX_CODES[d[i].current.weather_code] || '—';
    });
  });
}
paintBannerTemp();
new MutationObserver(paintBannerTemp).observe(pvZoom,{childList:true});

function wirePoll(){
  document.querySelectorAll('[data-vote]').forEach(b=>b.onclick=()=>{
    const v = +b.dataset.vote; SFX.select();
    const base = [72, 28]; base[v] += 1; const tot = base[0]+base[1];
    document.getElementById('pollRes').style.display='block';
    [0,1].forEach(i=>{ const pct = Math.round(base[i]/tot*100);
      document.getElementById('pv'+i).textContent = pct+'%';
      requestAnimationFrame(()=>document.getElementById('pb'+i).style.width = pct+'%'); });
  });
}
</script>
</body>
