<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Zach 98</title>
<link rel="icon" href="../../images/logo.png">
<!-- 98.css v0.1.21 by Jordan Scales, MIT License (vendor/98.css.LICENSE) -->
<link rel="stylesheet" href="vendor/98.css">
<style>
:root{
  --face:#c0c0c0; --hl:#ffffff; --lt:#dfdfdf; --sh:#808080; --dk:#0a0a0a;
  --navy:#000080; --title2:#1084d0; --desk:#008080;
  --raised:inset -1px -1px var(--dk),inset 1px 1px var(--hl),inset -2px -2px var(--sh),inset 2px 2px var(--lt);
  --sunken:inset -1px -1px var(--hl),inset 1px 1px var(--sh),inset -2px -2px var(--lt),inset 2px 2px var(--dk);
  --thin-sunk:inset -1px -1px var(--hl),inset 1px 1px var(--sh);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--desk);font-size:11px;-webkit-font-smoothing:none;user-select:none}
img,svg{image-rendering:pixelated}
.ico{display:block;shape-rendering:crispEdges}

/* ============ BOOT ============ */
#boot{position:fixed;inset:0;z-index:9000;background:#000;color:#c0c0c0;font:16px/1.35 "Courier New",monospace;padding:24px 28px;white-space:pre-wrap;cursor:default}
#boot .energy{position:absolute;right:28px;top:20px;color:#5af;font-weight:bold;text-align:right;line-height:1.1}
#splash{position:fixed;inset:0;z-index:8999;display:none;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(#5d8fd8,#a8c8f0 55%,#e8f2ff);overflow:hidden}
#splash .cloud{position:absolute;background:#fff;border-radius:50%;filter:blur(6px);opacity:.85}
#splash .logo{position:relative;font:bold 64px/1 "Times New Roman",serif;color:#fff;text-shadow:3px 3px 0 #2a4f8a;letter-spacing:1px}
#splash .logo sup{font:bold 30px Arial,sans-serif;color:#ffcf3a;text-shadow:2px 2px 0 #7a4d00;vertical-align:top;margin-left:6px}
#splash .tag{position:relative;font:italic 18px "Times New Roman",serif;color:#173b73;margin-top:10px}
#splash .bar{position:absolute;left:0;right:0;bottom:0;height:18px;background:linear-gradient(90deg,#000080,#1084d0,#5bc0ff,#1084d0,#000080);background-size:50% 100%;animation:bootbar 1.2s linear infinite}
@keyframes bootbar{to{background-position:100% 0}}

/* ============ DESKTOP ============ */
#desktop{position:absolute;left:0;top:0;right:0;bottom:28px;overflow:hidden}
#icons{position:absolute;left:4px;top:4px;bottom:4px;display:grid;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,76px);grid-auto-columns:76px;gap:0 2px}
.dicon{width:76px;height:74px;display:flex;flex-direction:column;align-items:center;padding-top:4px;color:#fff;text-align:center;cursor:default;outline:none}
.dicon .ico{width:32px;height:32px}
.dicon .lbl{margin-top:4px;padding:1px 2px;line-height:13px;max-width:74px;word-wrap:break-word;border:1px dotted transparent}
.dicon.sel .ico{filter:url(#selTint)}
.dicon.sel .lbl{background:var(--navy);border-color:#ffff80}
.dicon .arrow{position:absolute}
#zoomRect{position:fixed;z-index:7000;border:2px solid #fff;mix-blend-mode:difference;pointer-events:none;display:none}

/* ============ TASKBAR ============ */
#taskbar{position:fixed;left:0;right:0;bottom:0;height:28px;background:var(--face);box-shadow:inset 0 1px var(--lt),inset 0 2px var(--hl);display:flex;align-items:center;gap:3px;padding:3px 2px 2px;z-index:5000}
#taskbar button{min-width:0;min-height:0;padding:0 4px;height:22px}
#startBtn{display:flex;align-items:center;gap:3px;font-weight:bold;padding:0 5px 0 3px !important;flex:0 0 auto}
#startBtn.on{box-shadow:var(--sunken);padding-top:1px !important}
#startBtn .ico{width:18px;height:16px}
.tb-sep{width:2px;height:20px;box-shadow:inset 1px 0 var(--sh),inset -1px 0 var(--hl);margin:0 2px;flex:0 0 auto}
.quick{display:flex;gap:1px;flex:0 0 auto}
.quick button{width:22px;padding:0 !important;display:flex;align-items:center;justify-content:center;box-shadow:none !important;background:none}
.quick button:hover{box-shadow:var(--raised) !important}
.quick .ico{width:16px;height:16px}
#tasks{flex:1;display:flex;gap:3px;min-width:0;overflow:hidden}
.task{flex:0 1 160px;min-width:40px !important;display:flex;align-items:center;gap:3px;text-align:left;justify-content:flex-start;overflow:hidden;white-space:nowrap}
.task .ico{width:16px;height:16px;flex:0 0 auto}
.task span{overflow:hidden;text-overflow:ellipsis}
.task.on{box-shadow:var(--sunken) !important;font-weight:bold;background:repeating-conic-gradient(var(--hl) 0 25%,var(--face) 0 50%) 0 0/2px 2px}
#tray{flex:0 0 auto;height:22px;display:flex;align-items:center;gap:6px;padding:0 8px 0 6px;box-shadow:var(--thin-sunk)}
#tray .ico{width:16px;height:16px}

/* ============ START MENU ============ */
#startMenu{position:fixed;left:2px;bottom:27px;z-index:6000;background:var(--face);box-shadow:var(--raised);padding:3px 3px 3px 24px;display:none;min-width:200px}
#startMenu.open{display:block}
#startMenu .band{position:absolute;left:3px;top:3px;bottom:3px;width:21px;background:linear-gradient(0deg,var(--navy),var(--title2));overflow:hidden}
#startMenu .band span{position:absolute;left:1px;bottom:6px;transform:rotate(-90deg);transform-origin:left top;translate:0 0;white-space:nowrap;color:#c0c0c0;font:bold 18px Arial,sans-serif;letter-spacing:.5px;width:0}
#startMenu .band span b{color:#fff}
.mi{position:relative;display:flex;align-items:center;gap:8px;height:32px;padding:0 18px 0 6px;white-space:nowrap;cursor:default}
.mi .ico{width:24px;height:24px;flex:0 0 auto}
.mi u{text-decoration:underline}
.mi.sub::after{content:"";position:absolute;right:6px;top:50%;margin-top:-4px;border-left:4px solid #000;border-top:4px solid transparent;border-bottom:4px solid transparent}
.mi:hover,.mi.hover{background:var(--navy);color:#fff}
.mi.sub:hover::after,.mi.sub.hover::after{border-left-color:#fff}
.msep{height:2px;margin:3px 2px;box-shadow:inset 0 1px var(--sh),inset 0 -1px var(--hl)}
.submenu{position:fixed;z-index:6001;background:var(--face);box-shadow:var(--raised);padding:3px;display:none;min-width:180px}
.submenu .mi{height:22px;gap:6px}
.submenu .mi .ico{width:16px;height:16px}

/* ============ WINDOWS ============ */
.app{position:absolute;display:flex;flex-direction:column;min-width:200px;min-height:100px}
.app .title-bar{flex:0 0 auto;cursor:default;touch-action:none}
.app .title-bar-text{display:flex;align-items:center;gap:3px;overflow:hidden;white-space:nowrap}
.app .title-bar-text .ico{width:16px;height:16px;flex:0 0 auto}
.app .title-bar-controls{flex:0 0 auto}
.app.max{left:0 !important;top:0 !important;width:100% !important;height:100% !important}
.app.min{display:none}
.app .window-body{flex:1;min-height:0;display:flex;flex-direction:column;margin:2px 3px 3px;overflow:hidden}
.app .resize{position:absolute;right:2px;bottom:2px;width:13px;height:13px;cursor:nwse-resize;touch-action:none;background:
  linear-gradient(135deg,transparent 0 45%,var(--hl) 45% 52%,var(--sh) 52% 60%,transparent 60% 70%,var(--hl) 70% 77%,var(--sh) 77% 85%,transparent 85%)}
.app.max .resize{display:none}
.menubar{display:flex;flex:0 0 auto;padding:1px 0 2px}
.menubar > div{padding:2px 6px;position:relative}
.menubar > div:hover,.menubar > div.open{box-shadow:var(--thin-sunk)}
.menubar > div::first-letter{text-decoration:underline}
.dropdown{position:absolute;left:0;top:100%;z-index:50;background:var(--face);box-shadow:var(--raised);padding:3px;min-width:170px;display:none}
.menubar > div.open .dropdown{display:block}
.dropdown .mi{height:20px;padding:0 20px}
.dropdown .mi.check::before{content:"✓";position:absolute;left:6px}
.toolbar{display:flex;flex:0 0 auto;align-items:stretch;gap:0;padding:2px 2px;box-shadow:inset 0 1px var(--hl),inset 0 -1px var(--sh),inset 0 2px var(--lt)}
.tbtn{min-width:0 !important;min-height:0 !important;padding:2px 6px !important;display:flex;flex-direction:column;align-items:center;gap:1px;box-shadow:none !important;background:none !important}
.tbtn:not(:disabled):hover{box-shadow:var(--thin-sunk),inset -1px -1px var(--sh),inset 1px 1px var(--hl) !important}
.tbtn:disabled{color:var(--sh)}
.tbtn .ico{width:20px;height:20px}
.tbtn:disabled .ico{filter:grayscale(1) opacity(.45)}
.addr{display:flex;align-items:center;gap:4px;padding:2px 3px 3px;flex:0 0 auto;box-shadow:inset 0 -1px var(--sh),inset 0 1px var(--hl)}
.addr .fld{flex:1;display:flex;align-items:center;gap:3px;background:#fff;box-shadow:var(--sunken);height:21px;padding:0 3px;overflow:hidden;white-space:nowrap}
.addr .fld .ico{width:16px;height:16px;flex:0 0 auto}
.panel-white{flex:1;min-height:0;background:#fff;box-shadow:var(--sunken);padding:2px;overflow:auto;user-select:text}
.status-bar{flex:0 0 auto;margin:2px 0 0}

/* explorer */
.explorer{flex:1;min-height:0;display:flex;background:#fff;box-shadow:var(--sunken);padding:2px;overflow:hidden}
.webview{flex:0 0 190px;padding:14px 12px;background:linear-gradient(#fff,#fff 60%,#e8eef8);border-right:1px solid #d0d8e8;overflow:auto;user-select:text}
.webview .wv-ico{width:48px;height:48px;margin-bottom:8px}
.webview h2{font:bold 21px Arial,sans-serif;margin:0 0 4px;color:#000;line-height:1.05;word-break:break-word}
.webview .wv-line{height:3px;margin:6px 0 10px;background:linear-gradient(90deg,#ff9a00,#ffd800,#2ab0ff,transparent)}
.webview p{margin:0 0 8px;font-size:11px;line-height:1.35}
.webview a{color:#00c}
.files{flex:1;min-width:0;overflow:auto;padding:6px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:4px}
.file{width:84px;display:flex;flex-direction:column;align-items:center;text-align:center;padding:3px 0;cursor:default;outline:none}
.file .ico{width:32px;height:32px}
.file .lbl{margin-top:3px;padding:0 2px;line-height:13px;border:1px dotted transparent;word-break:break-word}
.file.sel .ico{filter:url(#selTint)}
.file.sel .lbl{background:var(--navy);color:#fff;border-color:#ffff80}
.files.details{display:block;padding:0}
.files.details table{width:100%;border-collapse:collapse}
.files.details th{position:sticky;top:0;text-align:left;font-weight:normal;background:var(--face);box-shadow:var(--raised);padding:2px 6px;white-space:nowrap}
.files.details td{padding:1px 6px;white-space:nowrap}
.files.details td:first-child{display:flex;align-items:center;gap:4px}
.files.details td .ico{width:16px;height:16px}
.files.details tr.sel td{background:var(--navy);color:#fff}
@media (max-width:640px){.webview{display:none}}

/* notepad / wordpad */
textarea.notepad{flex:1;resize:none;border:0;width:100%;font:13px/1.35 "Courier New",monospace;padding:2px 4px;box-shadow:var(--sunken);user-select:text}
.wp-page{flex:1;min-height:0;overflow:auto;background:var(--sh);box-shadow:var(--sunken);padding:10px}
.wp-doc{background:#fff;max-width:680px;margin:0 auto;padding:36px 44px;font:14px/1.45 "Times New Roman",Times,serif;color:#000;box-shadow:2px 2px 0 #000;user-select:text}
.wp-doc h1{font:bold 22px "Times New Roman",serif;margin:0 0 2px}
.wp-doc h2{font:bold 16px "Times New Roman",serif;margin:18px 0 2px}
.wp-doc .when{font-style:italic;color:#333}
.wp-doc a{color:#00f}
.ruler{flex:0 0 auto;height:20px;margin:2px 0;background:#fff;box-shadow:var(--thin-sunk);position:relative;overflow:hidden;
  background-image:repeating-linear-gradient(90deg,#000 0 1px,transparent 1px 12px),repeating-linear-gradient(90deg,#000 0 1px,transparent 1px 48px);background-size:100% 4px,100% 8px;background-position:0 100%,0 100%;background-repeat:repeat-x}
.fmtbar{display:flex;gap:4px;align-items:center;padding:2px;flex:0 0 auto}
.fmtbar select{height:21px}
.fmtbar .b{min-width:0 !important;width:23px;padding:0 !important;font-weight:bold}

/* properties dialog */
.props{display:flex;gap:12px;align-items:flex-start;margin:10px 4px}
.props .ico{width:32px;height:32px;flex:0 0 auto}
.props h4{margin:0;font-size:13px;font-weight:bold}
.kv{display:grid;grid-template-columns:90px 1fr;gap:5px 8px;margin:10px 4px}
.hr98{height:2px;margin:8px 0;box-shadow:inset 0 1px var(--sh),inset 0 -1px var(--hl)}
.desc-box{background:#fff;box-shadow:var(--sunken);padding:8px;line-height:1.45;font-size:11px;user-select:text;max-height:170px;overflow:auto}
.btn-row{display:flex;justify-content:flex-end;gap:6px;flex-wrap:wrap;margin-top:10px}
.btn-row button{min-width:75px}

/* tabs */
.tabs{flex:1;display:flex;flex-direction:column;min-height:0}
.tabs menu[role=tablist]{margin:0;flex:0 0 auto}
.tabs .window[role=tabpanel]{flex:1;overflow:auto;min-height:0;user-select:text}

/* media player */
.mp{flex:1;display:flex;flex-direction:column;min-height:0;gap:3px}
.mp-screen{flex:1;min-height:120px;background:#000;box-shadow:var(--sunken);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.mp-screen video{max-width:100%;max-height:100%;display:block}
.mp-screen .vis{color:#0f0;font:12px "Courier New",monospace;text-align:center;padding:14px}
.mp-controls{display:flex;gap:2px;align-items:center;flex:0 0 auto}
.mp-controls button{min-width:0 !important;width:26px;padding:0 !important}
.mp-list{flex:0 0 132px;min-height:0;overflow:auto;background:#fff;box-shadow:var(--sunken);padding:2px}
.mp-list div{padding:2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp-list div.sel{background:var(--navy);color:#fff}
.mp-info{flex:0 0 auto;background:#000;color:#0f0;font:11px "Courier New",monospace;padding:4px 6px;box-shadow:var(--sunken);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* browser page (90s homepage) */
.ie-page{flex:1;min-height:0;overflow:auto;box-shadow:var(--sunken);background:#fff;user-select:text}
.web{font:16px "Times New Roman",Times,serif;color:#000;padding:14px 18px;min-height:100%;
  background-color:#fffbe6;background-image:radial-gradient(#f2e6b8 1px,transparent 1px);background-size:14px 14px}
.web h1{font:bold 34px "Times New Roman",serif;text-align:center;margin:6px 0;color:#800000}
.web h2{font:bold 22px "Times New Roman",serif;color:#000080;margin:18px 0 6px}
.web a{color:#0000ee;text-decoration:underline;cursor:pointer}
.web a:visited{color:#551a8b}
.web hr{border:0;height:4px;background:linear-gradient(90deg,red,orange,yellow,lime,cyan,blue,violet);margin:14px 0}
.web table{border-collapse:separate}
.web table{max-width:100%}
.web td,.web th{border:2px outset #ccc;padding:4px 8px;vertical-align:top;font-size:15px;white-space:normal}
.web .marq{overflow:hidden;white-space:nowrap;background:#000080;color:#ffff00;font:bold 16px "Courier New",monospace;padding:3px 0}
.web .marq span{display:inline-block;padding-left:100%;animation:marq 16s linear infinite}
@keyframes marq{to{transform:translateX(-100%)}}
.web .uc{display:inline-block;padding:4px 14px;background:repeating-linear-gradient(-45deg,#ffd800 0 12px,#000 12px 24px);color:#fff;font:bold 14px Arial;text-shadow:1px 1px 0 #000,-1px -1px 0 #000}
.web .uc span{background:#000;padding:2px 6px}
.web .counter{display:inline-flex;gap:1px;background:#000;padding:2px;vertical-align:middle}
.web .counter b{background:#222;color:#0f0;font:bold 16px "Courier New",monospace;padding:0 3px}
.web .blink{animation:blink98 1s steps(1) infinite}
@keyframes blink98{50%{opacity:0}}
.web .center{text-align:center}
.web ul{margin:6px 0}
.web .new{color:red;font-weight:bold;font-size:12px;font-family:Arial}

/* mail */
.mail-fields{display:grid;grid-template-columns:62px 1fr;gap:4px 6px;align-items:center;padding:6px 4px;flex:0 0 auto}
.mail-fields input{width:100%}
.mail-body{flex:1;resize:none;font:13px Arial,sans-serif;padding:6px;border:0;box-shadow:var(--sunken)}

/* minesweeper */
.ms{display:inline-flex;flex-direction:column;background:var(--face);padding:6px;box-shadow:inset -1px -1px var(--sh),inset 1px 1px var(--hl),inset -2px -2px var(--sh),inset 2px 2px var(--hl),inset -3px -3px var(--sh),inset 3px 3px var(--hl)}
.ms-head{display:flex;justify-content:space-between;align-items:center;padding:4px 5px;margin-bottom:6px;box-shadow:inset -1px -1px var(--hl),inset 1px 1px var(--sh),inset -2px -2px var(--hl),inset 2px 2px var(--sh)}
.led{background:#000;color:#f00;font:bold 22px/1 "Courier New",monospace;letter-spacing:1px;padding:1px 2px;box-shadow:inset -1px -1px var(--hl),inset 1px 1px var(--sh);min-width:41px;text-align:center;text-shadow:0 0 2px #f00}
.ms-face{min-width:0 !important;min-height:0 !important;width:26px;height:26px;padding:0 !important;font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center}
.ms-grid{display:grid;box-shadow:inset -1px -1px var(--hl),inset 1px 1px var(--sh),inset -2px -2px var(--hl),inset 2px 2px var(--sh),inset -3px -3px var(--hl),inset 3px 3px var(--sh);padding:3px}
.cell{width:16px;height:16px;background:var(--face);box-shadow:inset -1px -1px var(--sh),inset 1px 1px var(--hl),inset -2px -2px var(--sh),inset 2px 2px var(--hl);font:bold 12px/16px Arial,sans-serif;text-align:center;cursor:default}
.cell .ico{display:inline-block;vertical-align:-2px}
.cell.open{box-shadow:none;border-left:1px solid var(--sh);border-top:1px solid var(--sh);line-height:15px}
.cell.boom{background:red}
.n1{color:#0000ff}.n2{color:#008000}.n3{color:#ff0000}.n4{color:#000080}.n5{color:#800000}.n6{color:#008080}.n7{color:#000}.n8{color:#808080}

/* dos */
.dos{flex:1;min-height:0;overflow:auto;background:#000;color:#c0c0c0;font:14px/1.25 "Courier New",monospace;padding:4px 6px;white-space:pre-wrap;word-break:break-word;user-select:text;cursor:text}
.dos input{background:transparent;border:0;color:#c0c0c0;font:inherit;outline:none;padding:0;width:60%;box-shadow:none;height:auto;caret-color:#c0c0c0}

/* welcome */
.welcome{display:flex;flex-direction:column;flex:1;min-height:0}
.wl-banner{flex:0 0 auto;background:linear-gradient(90deg,#000 0,#000080 60%,#1084d0);color:#fff;padding:14px 18px;font:bold 26px "Times New Roman",serif}
.wl-banner span{color:#ffcf3a}
.wl-body{flex:1;display:flex;min-height:0;background:#fff;box-shadow:var(--sunken)}
.wl-opts{flex:0 0 210px;background:#000;padding:18px 0;display:flex;flex-direction:column;gap:4px}
.wl-opt{display:flex;align-items:center;gap:8px;color:#fff;padding:6px 14px;cursor:default;font-size:12px}
.wl-opt .ico{width:24px;height:24px}
.wl-opt:hover,.wl-opt.on{color:#ffcf3a;text-decoration:underline}
.wl-text{flex:1;padding:18px 20px;overflow:auto;font-size:12px;line-height:1.5;user-select:text}
.wl-text h3{font:bold 18px Arial,sans-serif;margin:0 0 8px;color:#000080}
@media (max-width:640px){.wl-opts{flex-basis:150px}}

/* misc */
.err{display:flex;gap:14px;align-items:flex-start;padding:12px 8px 4px}
.err .ico{width:32px;height:32px;flex:0 0 auto}
.err p{margin:6px 0 0;line-height:1.4}
.colors{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.swatch{height:40px;box-shadow:var(--sunken);cursor:default;position:relative}
.swatch.on{outline:2px dotted #000;outline-offset:2px}
.monitor-prev{width:180px;margin:6px auto 10px;position:relative}
.monitor-prev .scr{position:absolute;left:16px;top:14px;width:148px;height:98px}
#safe{position:fixed;inset:0;z-index:9500;background:#000;display:none;align-items:center;justify-content:center;text-align:center;color:#ff8c00;font:bold 32px Arial,sans-serif;cursor:default}
#safe small{display:block;color:#888;font:14px Arial;margin-top:40px}
#shutdim{position:fixed;inset:0;z-index:7500;display:none;background:repeating-conic-gradient(#000 0 25%,transparent 0 50%) 0 0/2px 2px}
a.btnlink{color:inherit;text-decoration:none}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <!-- Win98 blue "selected" tint for icons -->
  <filter id="selTint"><feColorMatrix type="matrix" values=".5 0 0 0 0  0 .5 0 0 0  0 0 .5 0 .5  0 0 0 1 0"/></filter>
</svg>

<div id="boot"></div>
<div id="splash">
  <div class="cloud" style="left:8%;top:18%;width:260px;height:80px"></div>
  <div class="cloud" style="left:60%;top:12%;width:320px;height:90px"></div>
  <div class="cloud" style="left:30%;top:68%;width:380px;height:100px"></div>
  <div class="cloud" style="left:75%;top:58%;width:220px;height:70px"></div>
  <div class="logo">Zach<sup>98</sup></div>
  <div class="tag">Quantitative Economics Edition</div>
  <div class="bar"></div>
</div>

<div id="desktop"><div id="icons"></div></div>
<div id="zoomRect"></div>

/* =====================================================================
   SOUND — tiny synthesized "ding" and "chord" for dialogs
   ===================================================================== */
let AC = null;
function beep(kind='ding'){
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const notes = kind==='chord' ? [523,659,784] : kind==='tada' ? [523,659,784,1047] : [880,1320];
    notes.forEach((f,i)=>{
      const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime + (kind==='tada'?i*.09:0);
      o.type='triangle'; o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.06,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+.5);
      o.connect(g).connect(AC.destination); o.start(t); o.stop(t+.55);
    });
  }catch(e){}
}

/* =====================================================================
   WINDOW MANAGER
   ===================================================================== */
const desktop = document.getElementById('desktop');
const tasks = document.getElementById('tasks');
const isSmall = () => innerWidth < 700;
let Z = 10, cascade = 0;
const wins = new Map();   // key -> win object

function focusWin(w){
  if (!w) return;
  wins.forEach(o => { o.el.querySelector('.title-bar').classList.toggle('inactive', o!==w); o.task.classList.toggle('on', o===w && !o.el.classList.contains('min')); });
  w.el.style.zIndex = w.opts.top ? 7600 : ++Z;
  w.el.classList.remove('min');
  w.task.classList.add('on');
  active = w;
}
let active = null;

function zoomFrom(rect, w){
  const z = document.getElementById('zoomRect'); if (!rect) return;
  const to = w.el.getBoundingClientRect();
  z.style.display='block';
  const anim = z.animate([
    {left:rect.left+'px',top:rect.top+'px',width:rect.width+'px',height:rect.height+'px'},
    {left:to.left+'px',top:to.top+'px',width:to.width+'px',height:to.height+'px'}],{duration:180,easing:'linear'});
  anim.onfinish = () => z.style.display='none';
}

function openWin(key, opts, fromRect){
  if (wins.has(key)){ const w = wins.get(key); focusWin(w); return w; }
  const W = Math.min(opts.w||520, innerWidth-8), H = Math.min(opts.h||380, innerHeight-36);
  const x = opts.x ?? Math.max(4, Math.min(innerWidth-W-4, 90 + (cascade%8)*26));
  const y = opts.y ?? Math.max(4, Math.min(innerHeight-28-H-4, 30 + (cascade%8)*24));
  cascade++;
  const el = document.createElement('div');
  el.className = 'window app';
  el.style.cssText = `left:${x}px;top:${y}px;width:${W}px;height:${H}px`;
  const ctrls = opts.dialog
    ? `${opts.help?'<button aria-label="Help"></button>':''}<button aria-label="Close"></button>`
    : `<button aria-label="Minimize"></button><button aria-label="Maximize"${opts.noMax?' disabled':''}></button><button aria-label="Close"></button>`;
  el.innerHTML = `<div class="title-bar"><div class="title-bar-text">${opts.dialog?'':icon(opts.icon||'doc',16)}<span>${esc(opts.title)}</span></div><div class="title-bar-controls">${ctrls}</div></div>
    <div class="window-body"></div>${opts.noResize||opts.dialog?'':'<div class="resize"></div>'}`;
  desktop.appendChild(el);
  const body = el.querySelector('.window-body');
  const task = document.createElement('button');
  task.className = 'task'; task.innerHTML = `${icon(opts.icon||'doc',16)}<span>${esc(opts.title)}</span>`;
  if (!opts.dialog) tasks.appendChild(task);
  const w = { key, el, body, task, opts, onClose:null };
  wins.set(key, w);

  const close = () => { if (w.onClose) w.onClose(); el.remove(); task.remove(); wins.delete(key); if (active===w){ active=null; const top=[...wins.values()].sort((a,b)=>b.el.style.zIndex-a.el.style.zIndex)[0]; if(top && !top.el.classList.contains('min')) focusWin(top); } };
  w.close = close;
  w.setTitle = t => { el.querySelector('.title-bar-text span').textContent = t; task.querySelector('span').textContent = t; };
  el.querySelector('[aria-label=Close]').onclick = close;
  const minB = el.querySelector('[aria-label=Minimize]');
  if (minB) minB.onclick = e => { e.stopPropagation(); el.classList.add('min'); task.classList.remove('on'); active=null; };
  const maxB = el.querySelector('[aria-label=Maximize]');
  const toggleMax = () => { if (opts.noMax) return; el.classList.toggle('max'); maxB.setAttribute('aria-label', el.classList.contains('max')?'Restore':'Maximize'); if (w.onResize) w.onResize(); };
  if (maxB) maxB.onclick = toggleMax;
  const helpB = el.querySelector('[aria-label=Help]');
  if (helpB) helpB.onclick = () => openApp('help');
  task.onclick = () => { if (active===w && !el.classList.contains('min')){ el.classList.add('min'); task.classList.remove('on'); active=null; } else focusWin(w); };
  el.addEventListener('pointerdown', () => { if (active!==w) focusWin(w); }, true);

  // drag
  const tb = el.querySelector('.title-bar');
  tb.addEventListener('dblclick', e => { if (!e.target.closest('button')) toggleMax(); });
  tb.addEventListener('pointerdown', e => {
    if (e.target.closest('button') || el.classList.contains('max')) return;
    const sx = e.clientX, sy = e.clientY, ox = el.offsetLeft, oy = el.offsetTop;
    tb.setPointerCapture(e.pointerId);
    const mv = ev => {
      el.style.left = Math.max(-el.offsetWidth+60, Math.min(innerWidth-40, ox+ev.clientX-sx))+'px';
      el.style.top = Math.max(0, Math.min(innerHeight-50, oy+ev.clientY-sy))+'px';
    };
    const up = () => { tb.removeEventListener('pointermove', mv); tb.removeEventListener('pointerup', up); };
    tb.addEventListener('pointermove', mv); tb.addEventListener('pointerup', up);
  });
  // resize
  const rz = el.querySelector('.resize');
  if (rz) rz.addEventListener('pointerdown', e => {
    e.preventDefault(); const sx=e.clientX, sy=e.clientY, ow=el.offsetWidth, oh=el.offsetHeight;
    rz.setPointerCapture(e.pointerId);
    const mv = ev => { el.style.width = Math.max(opts.minW||220, ow+ev.clientX-sx)+'px'; el.style.height = Math.max(opts.minH||120, oh+ev.clientY-sy)+'px'; if (w.onResize) w.onResize(); };
    const up = () => { rz.removeEventListener('pointermove', mv); rz.removeEventListener('pointerup', up); };
    rz.addEventListener('pointermove', mv); rz.addEventListener('pointerup', up);
  });

  if (isSmall() && !opts.dialog && !opts.noMax){ el.classList.add('max'); maxB && maxB.setAttribute('aria-label','Restore'); }
  if (opts.center || (isSmall() && opts.dialog)){ el.style.left = Math.max(4,(innerWidth-W)/2)+'px'; el.style.top = Math.max(4,(innerHeight-28-H)/3)+'px'; }
  opts.render && opts.render(w);
  focusWin(w);
  zoomFrom(fromRect, w);
  return w;
}

/* --- menus inside windows --- */
function menubar(menus){
  return `<div class="menubar">${menus.map(([name, items])=>`<div>${name}<div class="dropdown">${(items||[]).map(it=> it==='-' ? '<div class="msep"></div>' : `<div class="mi${it[2]?' check':''}" data-act="${it[1]}">${it[0]}</div>`).join('')}</div></div>`).join('')}</div>`;
}
function wireMenubar(w, handlers){
  const mb = w.body.querySelector('.menubar'); if (!mb) return;
  mb.querySelectorAll(':scope > div').forEach(m => {
    m.addEventListener('pointerdown', e => {
      if (e.target.closest('.dropdown')) return;
      const was = m.classList.contains('open');
      mb.querySelectorAll(':scope > div').forEach(x=>x.classList.remove('open'));
      if (!was) m.classList.add('open');
      e.stopPropagation();
    });
    m.addEventListener('pointerenter', () => { if (mb.querySelector(':scope > div.open') && !m.classList.contains('open')){ mb.querySelectorAll(':scope > div').forEach(x=>x.classList.remove('open')); m.classList.add('open'); } });
  });
  mb.querySelectorAll('.dropdown .mi').forEach(mi => mi.addEventListener('click', e => {
    e.stopPropagation(); mb.querySelectorAll(':scope > div').forEach(x=>x.classList.remove('open'));
    const a = mi.dataset.act; if (handlers[a]) handlers[a](); else if (a==='close') w.close(); else if (a.startsWith('app:')) openApp(a.slice(4)); else if (a.startsWith('url:')) ext(a.slice(4));
  }));
}
document.addEventListener('pointerdown', () => document.querySelectorAll('.menubar > div.open').forEach(x=>x.classList.remove('open')));

/* --- message boxes --- */
function msgbox(title, text, kind='info', buttons=['OK'], cb){
  beep(kind==='errorx'?'chord':'ding');
  const key = 'msg'+Math.random();
  const w = openWin(key, { title, dialog:true, w:Math.min(380, innerWidth-16), h:150, render(w){
    w.body.innerHTML = `<div class="err">${icon(kind)}<p>${text}</p></div><div class="btn-row" style="justify-content:center">${buttons.map((b,i)=>`<button ${i===0?'class="default"':''} data-b="${i}">${b}</button>`).join('')}</div>`;
    w.body.querySelectorAll('[data-b]').forEach(b => b.onclick = () => { w.close(); cb && cb(+b.dataset.b); });
  }});
  w.el.style.height='auto';
  w.el.style.left = Math.max(4,(innerWidth-w.el.offsetWidth)/2)+'px';
  w.el.style.top = Math.max(4,(innerHeight-28-w.el.offsetHeight)/2.4)+'px';
  return w;
}

function explorer(w, cfg){
  // cfg: {path, title, icon, desc, items:[{name, icon, type, size, open}]}
  let view = 'icons';
  const history = [cfg]; let hi = 0;
  function render(){
    const c = history[hi];
    w.setTitle(c.title);
    w.body.innerHTML = menubar([
      ['File',[['Open','open'],'-',['Close','close']]],
      ['Edit',[['Select All','selall']]],
      ['View',[['Large Icons','v:icons',view==='icons'],['Details','v:details',view==='details']]],
      ['Go',[['Back','back'],['Forward','fwd'],['Up One Level','up'],'-',['My Computer','app:mycomputer']]],
      ['Favorites',[['GitHub','url:https://github.com/zwinship'],['LinkedIn','url:https://linkedin.com/in/zwinship']]],
      ['Help',[['About Zach 98','app:about98']]],
    ]) + `<div class="toolbar">
        <button class="tbtn" data-t="back" ${hi>0?'':'disabled'}>${icon('back',20)}Back</button>
        <button class="tbtn" data-t="fwd" ${hi<history.length-1?'':'disabled'}>${icon('fwd',20)}Forward</button>
        <button class="tbtn" data-t="up" ${c.parent?'':'disabled'}>${icon('up',20)}Up</button>
        <div class="tb-sep" style="height:auto"></div>
        <button class="tbtn" data-t="views">${icon('views',20)}Views</button>
      </div>
      <div class="addr"><span>Address</span><div class="fld">${icon(c.icon,16)}<span>${esc(c.path)}</span></div></div>
      <div class="explorer">
        <div class="webview">${icon(c.icon,48).replace('class="ico"','class="ico wv-ico"')}<h2>${esc(c.title)}</h2><div class="wv-line"></div>${c.desc||''}<p id="wvSel" style="margin-top:12px"></p></div>
        <div class="files ${view}"></div>
      </div>
      <div class="status-bar"><p class="status-bar-field">${c.items.length} object(s)</p><p class="status-bar-field" style="flex:0 0 140px">${icon('computer',16).replace('class="ico"','class="ico" style="display:inline;vertical-align:-3px;width:14px;height:14px"')} My Computer</p></div>`;
    const files = w.body.querySelector('.files');
    const wv = w.body.querySelector('#wvSel');
    const select = (el, it) => {
      files.querySelectorAll('.sel').forEach(x=>x.classList.remove('sel')); el.classList.add('sel');
      wv.innerHTML = `<b>${esc(it.name)}</b><br>${esc(it.type||'')}${it.blurb?'<br><br>'+esc(it.blurb):''}`;
    };
    if (view==='icons'){
      c.items.forEach(it => {
        const f = document.createElement('div'); f.className='file'; f.tabIndex=0;
        f.innerHTML = `${icon(it.icon)}<div class="lbl">${esc(it.name)}</div>`;
        f.onclick = () => { select(f,it); if (matchMedia('(pointer:coarse)').matches) go(it, f); };
        f.ondblclick = () => go(it, f);
        f.onkeydown = e => { if (e.key==='Enter') go(it, f); };
        files.appendChild(f);
      });
    } else {
      files.innerHTML = `<table><thead><tr><th>Name</th><th>Type</th><th>Modified</th></tr></thead><tbody></tbody></table>`;
      const tb = files.querySelector('tbody');
      c.items.forEach(it => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${icon(it.icon,16)}${esc(it.name)}</td><td>${esc(it.type||'')}</td><td>${esc(it.date||'')}</td>`;
        tr.onclick = () => { tb.querySelectorAll('.sel').forEach(x=>x.classList.remove('sel')); tr.classList.add('sel'); wv.innerHTML=`<b>${esc(it.name)}</b><br>${esc(it.type||'')}${it.blurb?'<br><br>'+esc(it.blurb):''}`; };
        tr.ondblclick = () => go(it, tr);
        tb.appendChild(tr);
      });
    }
    w.body.querySelectorAll('[data-t]').forEach(b => b.onclick = () => {
      const t = b.dataset.t;
      if (t==='back' && hi>0){ hi--; render(); }
      if (t==='fwd' && hi<history.length-1){ hi++; render(); }
      if (t==='up' && c.parent){ nav(FOLDERS[c.parent]()); }
      if (t==='views'){ view = view==='icons'?'details':'icons'; render(); }
    });
    wireMenubar(w, {
      'v:icons':()=>{view='icons';render();}, 'v:details':()=>{view='details';render();},
      back:()=>{ if(hi>0){hi--;render();} }, fwd:()=>{ if(hi<history.length-1){hi++;render();} },
      up:()=>{ if(c.parent) nav(FOLDERS[c.parent]()); },
      open:()=>{ const s=files.querySelector('.sel'); if(s) s.dispatchEvent(new MouseEvent('dblclick')); },
      selall:()=>files.querySelectorAll('.file,tr').forEach(x=>x.classList.add('sel')),
    });
  }
  function nav(next){ history.splice(hi+1); history.push(next); hi++; render(); }
  function go(it, el){
    if (it.folder) nav(FOLDERS[it.folder]());
    else it.open(el.getBoundingClientRect());
  }
  render();
}

  media: { title:'Presentations - Media Player', icon:'media', w:720, h:500, minW:420, minH:300, render(w){
    let cur = 0;
    w.body.innerHTML = menubar([['File',[['Open PDF','pdf'],'-',['Exit','close']]],['View',[]],['Play',[['Play/Pause','pp']]],['Favorites',[]],['Go',[]],['Help',[]]])
      + `<div class="mp" style="flex-direction:row;gap:4px">
          <div class="mp" style="flex:1">
            <div class="mp-screen"><div class="vis"></div></div>
            <div class="mp-controls"><button data-c="play" title="Play">${icon('play',12)}</button><button data-c="pause" title="Pause">${icon('pause',12)}</button><button data-c="stop" title="Stop">${icon('stopsq',12)}</button>
              <select style="flex:1;min-width:0;margin-left:6px" data-clip></select></div>
            <div class="desc-box" style="max-height:120px" data-desc></div>
            <div class="btn-row" style="margin-top:2px" data-btns></div>
          </div>
          <div class="mp-list" style="flex:0 0 190px" data-list></div>
        </div>
        <div class="mp-info" data-info></div>`;
    const list = w.body.querySelector('[data-list]'), scr = w.body.querySelector('.mp-screen'), clip = w.body.querySelector('[data-clip]');
    PRESENTATIONS.forEach((p,i)=>{ const d=document.createElement('div'); d.textContent=`${i+1}. ${p.title}`; d.onclick=()=>show(i); list.appendChild(d); });
    function vid(){ return scr.querySelector('video'); }
    function load(src){ scr.innerHTML = src ? `<video src="${src}" playsinline preload="metadata" controls></video>` : `<div class="vis">No video for this presentation.<br><br>▶ Open the PDF slides below.</div>`; }
    function show(i){
      cur = i; const p = PRESENTATIONS[i];
      list.querySelectorAll('div').forEach((d,k)=>d.classList.toggle('sel',k===i));
      clip.innerHTML = (p.vids||[]).map((v,k)=>`<option value="${k}">${esc(v[1])}</option>`).join('') || '<option>(slides only)</option>';
      clip.disabled = !p.vids;
      load(p.vids ? ASSET+p.vids[0][0] : null);
      w.body.querySelector('[data-desc]').innerHTML = `<b>${esc(p.title)}</b><br><i>${esc(p.meta)}</i><br><br>${esc(p.body)}<br><br>${p.tags.map(esc).join(' · ')}`;
      w.body.querySelector('[data-btns]').innerHTML = `${p.pdf?`<button class="default" data-u="${ASSET+p.pdf}">Open PDF Slides</button>`:''}${p.gh?`<button data-u="${p.gh}">View on GitHub</button>`:''}`;
      w.body.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>ext(b.dataset.u));
      w.body.querySelector('[data-info]').textContent = `Clip ${i+1} of ${PRESENTATIONS.length}  ·  ${p.title}`;
    }
    clip.onchange = () => { const p = PRESENTATIONS[cur]; if (p.vids) { load(ASSET+p.vids[+clip.value][0]); vid().play().catch(()=>{}); } };
    w.body.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{ const v=vid(); if(!v) return; const c=b.dataset.c; if(c==='play') v.play(); if(c==='pause') v.pause(); if(c==='stop'){ v.pause(); v.currentTime=0; } });
    wireMenubar(w, { pdf:()=>{ const p=PRESENTATIONS[cur]; if(p.pdf) ext(ASSET+p.pdf); }, pp:()=>{ const v=vid(); if(v) v.paused?v.play():v.pause(); } });
    w.onClose = () => { const v=vid(); if(v) v.pause(); };
    show(0);
  }},

    const find = () => {
      const t = q.value.trim().toLowerCase();
      const hits = ALL_PROJECTS.filter(p => !t || (p.title+' '+p.body+' '+p.tags.join(' ')+' '+p.meta).toLowerCase().includes(t));
      res.innerHTML = hits.map((p,i)=>`<tr data-k="${i}"><td>${esc(shortName(p.title))}</td><td>${p.group==='Research'?'C:\\Research':'D:\\Personal Projects'}</td><td>${esc(p.meta.split(' · ')[0])}</td></tr>`).join('');

      st.textContent = `${hits.length} file(s) found`;
    };
    w.body.querySelector('[data-go]').onclick = find; q.onkeydown = e => { if (e.key==='Enter') find(); };

  dos: { title:'MS-DOS Prompt', icon:'dos', w:600, h:360, render(w){
    w.body.innerHTML = `<div class="dos" tabindex="0"></div>`;
    const out = w.body.querySelector('.dos');
    const print = s => { out.insertAdjacentHTML('beforeend', s+'\n'); };
    let line;
    const prompt = () => { out.insertAdjacentHTML('beforeend', `<span>C:\\ZACH&gt;</span><input spellcheck="false" autocomplete="off">`); line = out.querySelector('input:last-of-type'); line.focus(); out.scrollTop = out.scrollHeight;
      line.onkeydown = e => { if (e.key!=='Enter') return; const v = line.value; line.replaceWith(document.createTextNode(v)); out.insertAdjacentHTML('beforeend','\n'); exec(v.trim()); }; };
    const exec = v => {

/* =====================================================================
   MINESWEEPER (Beginner: 9×9, 10 mines)
   ===================================================================== */
function minesweeper(w){
  const R=9, C=9, M=10;
  let grid, opened, flags, over, first, timer, secs;
  w.body.innerHTML = menubar([['Game',[['New','new'],'-',['Exit','close']]],['Help',[['About Minesweeper','abt']]]])
    + `<div class="ms"><div class="ms-head"><div class="led" data-left>010</div><button class="ms-face" data-face></button><div class="led" data-time>000</div></div><div class="ms-grid" style="grid-template-columns:repeat(${C},16px)"></div></div>`;
  w.body.style.background = 'var(--face)';
  const gridEl = w.body.querySelector('.ms-grid'), face = w.body.querySelector('[data-face]');
  const pad = n => String(Math.max(-99,Math.min(999,n))).padStart(3,'0');
  function reset(){
    grid = Array(R*C).fill(0); opened = Array(R*C).fill(false); flags = Array(R*C).fill(false);
    over = false; first = true; secs = 0; clearInterval(timer);
    face.innerHTML=FACE(); w.body.querySelector('[data-time]').textContent='000'; w.body.querySelector('[data-left]').textContent=pad(M);
    gridEl.innerHTML=''; for (let i=0;i<R*C;i++){ const c=document.createElement('div'); c.className='cell'; c.dataset.i=i; gridEl.appendChild(c); }
  }
  const nb = i => { const r=Math.floor(i/C), c=i%C, out=[]; for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){ if(!dr&&!dc)continue; const rr=r+dr, cc=c+dc; if(rr>=0&&rr<R&&cc>=0&&cc<C) out.push(rr*C+cc);} return out; };
  function plant(safe){
    const banned = new Set([safe, ...nb(safe)]); let n=0;
    while(n<M){ const k=Math.floor(Math.random()*R*C); if(grid[k]!==-1 && !banned.has(k)){ grid[k]=-1; n++; } }
    for(let i=0;i<R*C;i++) if(grid[i]!==-1) grid[i]=nb(i).filter(j=>grid[j]===-1).length;
  }
  function paint(i){
    const el = gridEl.children[i];
    if (opened[i]){ el.className='cell open'; const v=grid[i]; if (v===-1) el.innerHTML = icon('mine',14); else el.textContent = v||''; if(v>0) el.classList.add('n'+v); }
    else { el.className='cell'; el.innerHTML = flags[i]?FLAG:''; }
  }
  function open(i){
    if (opened[i]||flags[i]) return; opened[i]=true; paint(i);
    if (grid[i]===0) nb(i).forEach(open);
  }
  function click(i){
    if (over || flags[i]) return;
    if (first){ plant(i); first=false; timer=setInterval(()=>{ secs++; w.body.querySelector('[data-time]').textContent=pad(secs); },1000); }
    if (grid[i]===-1){ over=true; clearInterval(timer); face.innerHTML=FACE('dead');
      for(let k=0;k<R*C;k++) if(grid[k]===-1){ opened[k]=true; paint(k); }
      gridEl.children[i].classList.add('boom'); return; }
    open(i);
    if (opened.filter(Boolean).length === R*C-M){ over=true; clearInterval(timer); face.innerHTML=FACE('cool'); beep('tada'); }
  }
  gridEl.addEventListener('pointerdown', e => { if(!over && e.button===0 && e.target.dataset.i) face.innerHTML=FACE('oh'); });
  gridEl.addEventListener('pointerup', e => { if(!over) face.innerHTML=FACE(); });
  gridEl.addEventListener('click', e => { const i=e.target.dataset.i; if(i!==undefined) click(+i); });
  gridEl.addEventListener('contextmenu', e => { e.preventDefault(); const i=+e.target.dataset.i; if(isNaN(i)||over||opened[i]) return; flags[i]=!flags[i]; paint(i); w.body.querySelector('[data-left]').textContent=pad(M-flags.filter(Boolean).length); });
  face.onclick = reset;
  wireMenubar(w, { new:reset, abt:()=>msgbox('About Minesweeper','Minesweeper<br>Zach 98 Edition. Right-click to flag a mine.','info') });
  w.onClose = () => clearInterval(timer);
  reset();
  requestAnimationFrame(()=>{ const ms=w.body.querySelector('.ms'); w.el.style.width=(ms.offsetWidth+12)+'px'; w.el.style.height=(ms.offsetHeight+w.el.querySelector('.title-bar').offsetHeight+w.body.querySelector('.menubar').offsetHeight+14)+'px'; });
}

/* =====================================================================
   START MENU
   ===================================================================== */
const startBtn = document.getElementById('startBtn'), startMenu = document.getElementById('startMenu');
const SUBS = {
  programs: [['Accessories','folder',null,[['Notepad','notepad','notepad'],['WordPad','doc','wordpad'],['Media Player','media','media'],['Minesweeper','mine','winmine']]],['Internet Explorer','globe','ie'],['Outlook Express','mail','mail'],['MS-DOS Prompt','dos','dos'],['Windows Explorer','computer','mycomputer'],['Wii Menu','display','@wii']],
  favorites: [['GitHub','web','@https://github.com/zwinship'],['LinkedIn','web','@https://linkedin.com/in/zwinship'],['NBER Paper','web','@https://www.nber.org/papers/w35414'],['OctaStats','web','@https://octastats.github.io/index.html'],['Tale of the Tape','web','@https://taleofthetape.github.io'],['Micro Course Site','web','@https://falconeconsim.github.io/']],
  documents: [['About Me.txt','notepad','notepad'],['Experience.doc','doc','wordpad'],['resume.pdf','pdf','resume'],['transcript.pdf','pdf','@'+ASSET+'about_me/transcript.pdf'],...PRESENTATIONS.filter(p=>p.pdf).map(p=>[p.pdf.split('/').pop().replace(/_Presentation\.pdf$/,'').replace(/_/g,' ')+'.pdf','presentation','@'+ASSET+p.pdf])],
  settings: [['Control Panel','control','control'],['Display','display','display'],['System Properties','computer','system'],['Taskbar & Start Menu...','settings','help']],
};
function buildSub(id, items){
  const el = document.getElementById('sub-'+id) || Object.assign(document.createElement('div'),{className:'submenu',id:'sub-'+id});
  if (!el.parentNode) document.body.appendChild(el);
  el.innerHTML = items.map((it,k)=>`<div class="mi${it[3]?' sub':''}" data-k="${k}">${icon(it[1],16)}<span>${esc(it[0])}</span></div>`).join('');
  el.querySelectorAll('.mi').forEach(mi => {
    const it = items[+mi.dataset.k];
    if (it[3]){
      const childId = id+'-'+mi.dataset.k; buildSub(childId, it[3]);
      mi.addEventListener('pointerenter', () => hoverIntent(() => showSub(childId, mi, el)));
    } else {
      mi.addEventListener('pointerenter', () => hoverIntent(() => hideSubsBelow(el)));
      mi.addEventListener('click', () => { closeStart(); const t = it[2];
        if (t==='@wii') location.href='../wii/'; else if (t==='@saver') setTimeout(screensaver,300); else if (t.startsWith('@')) ext(t.slice(1)); else openApp(t); });
    }
  });
  return el;
}
Object.entries(SUBS).forEach(([k,v])=>buildSub(k,v));
const subChain = [];
let hoverT = null;
function hoverIntent(fn){ clearTimeout(hoverT); hoverT = setTimeout(fn, 180); }
function hideSubsBelow(parent){
  while (subChain.length && subChain[subChain.length-1].el !== parent){ const s=subChain.pop(); s.el.style.display='none'; s.anchor.classList.remove('hover'); }
}
function showSub(id, anchor, parent){
  hideSubsBelow(parent);
  const el = document.getElementById('sub-'+id); el.style.display='block';
  const r = anchor.getBoundingClientRect();
  let left = r.right - 3, top = r.top - 3;
  if (left + el.offsetWidth > innerWidth) left = Math.max(0, r.left - el.offsetWidth + 3);
  if (top + el.offsetHeight > innerHeight - 28) top = Math.max(0, innerHeight - 28 - el.offsetHeight);
  el.style.left = left+'px'; el.style.top = top+'px';
  anchor.classList.add('hover');
  subChain.push({el, anchor, parent});
}
startMenu.querySelectorAll('.mi').forEach(mi => {
  if (mi.dataset.sub) mi.addEventListener('pointerenter', () => hoverIntent(() => showSub(mi.dataset.sub, mi, startMenu)));
  else mi.addEventListener('pointerenter', () => hoverIntent(() => hideSubsBelow(startMenu)));
  if (mi.dataset.sub) mi.addEventListener('click', () => { clearTimeout(hoverT); showSub(mi.dataset.sub, mi, startMenu); });
  if (mi.dataset.open) mi.addEventListener('click', () => { closeStart(); openApp(mi.dataset.open); });
});
function closeStart(){ clearTimeout(hoverT); startMenu.classList.remove('open'); startBtn.classList.remove('on'); hideSubsBelow(null); }
startBtn.addEventListener('click', e => { e.stopPropagation(); const o = !startMenu.classList.contains('open'); closeStart(); if (o){ startMenu.classList.add('open'); startBtn.classList.add('on'); } });
document.addEventListener('pointerdown', e => { if (!e.target.closest('#startMenu,.submenu,#startBtn')) closeStart(); });
document.querySelectorAll('.quick [data-open]').forEach(b => b.onclick = () => {
  if (b.id==='showDesk'){ wins.forEach(w=>{ w.el.classList.add('min'); w.task.classList.remove('on'); }); active=null; return; }
  openApp(b.dataset.open, b.getBoundingClientRect());
});
addEventListener('keydown', e => { if (e.key==='Escape') closeStart(); if (e.key==='Meta' ) { e.preventDefault(); startBtn.click(); } });

function tick(){ document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}); }

function localGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function localSet(k,v){ try{ v ? localStorage.setItem(k,v) : localStorage.removeItem(k); }catch(e){} }
function setDesktop(bg){ document.body.style.background = bg; }
setDesktop(localGet('z98bg') || '#008080');

function boot(){
  const el = document.getElementById('boot'), sp = document.getElementById('splash');
  el.style.display='block'; sp.style.display='none';
  const lines = [
    'Zach BIOS v4.10, An Energy Star Ally','Copyright (C) 1998-2026, Zach Winship','',
    'Main Processor : Quantitative Economist @ NYU','Memory Testing : 65536K OK','',
    'Detecting IDE Primary Master ... RESEARCH (C:)','Detecting IDE Primary Slave  ... PERSONAL PROJECTS (D:)','Detecting IDE Secondary Master ... PRESENTATIONS (E:)','Detecting Floppy Drive A: ... RESUME.PDF','',
    'Loading NBER_WP_35414.SYS ... OK','','Starting Zach 98...'];
  el.innerHTML = `<div class="energy">ZACH<br>98</div>`;
  let i = 0, done = false;
  const finish = () => {
    if (done) return; done = true; clearInterval(t);
    el.style.display='none'; sp.style.display='flex';
    setTimeout(() => { sp.style.display='none'; if (!localGet('z98nowelcome')) openApp('welcome'); beep('tada'); }, 1500);
  };
  const t = setInterval(() => { if (i < lines.length){ el.insertAdjacentText('beforeend', lines[i++]+'\n'); } else finish(); }, 110);
  el.onclick = finish; sp.onclick = () => { sp.style.display='none'; };
  addEventListener('keydown', finish, { once:true });
}
document.getElementById('safe').onclick = () => { document.getElementById('safe').style.display='none'; boot(); };
boot();
