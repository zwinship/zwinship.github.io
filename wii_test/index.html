<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>wii_test — prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --sky-1:#eaf2fb; --sky-2:#cfe3f6; --sky-3:#b9d7ef;
  --tile-1:#ffffff; --tile-2:#eef3f8;
  --ink:#1c3550; --ink-soft:#4d6a86;
  --wii-blue:#2f7fc4; --wii-blue-dk:#1a5c96;
  --glow: rgba(47,127,196,0.35);
}
:root[data-theme="night"]{
  --sky-1:#0d1830; --sky-2:#132544; --sky-3:#1a3358;
  --tile-1:#1e3352; --tile-2:#16283f;
  --ink:#eaf2fb; --ink-soft:#a9c1da;
  --wii-blue:#4fa8e0; --wii-blue-dk:#2f7fc4;
  --glow: rgba(79,168,224,0.45);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  font-family:'Nunito', sans-serif;
  color:var(--ink);
  overflow:hidden;
  cursor:none;
  height:100vh;
  position:relative;
  transition: color .5s ease;
}

/* ============ BACKGROUND ============ */
.wii-bg{
  position:fixed; inset:0; z-index:0;
  background: radial-gradient(140% 100% at 50% 0%, var(--sky-1) 0%, var(--sky-2) 55%, var(--sky-3) 100%);
  transition: background .6s ease;
  overflow:hidden;
}
.wii-bg .streak{
  position:absolute; top:-20%; height:160%; width:38%;
  background: linear-gradient(100deg, transparent 0%, rgba(255,255,255,0.35) 45%, transparent 100%);
  transform: rotate(12deg);
  animation: drift 16s linear infinite;
}
:root[data-theme="night"] .wii-bg .streak{ background: linear-gradient(100deg, transparent 0%, rgba(255,255,255,0.06) 45%, transparent 100%); }
.streak.s1{ left:-30%; animation-duration: 22s; }
.streak.s2{ left:10%;  animation-duration: 28s; animation-delay: -6s; }
.streak.s3{ left:55%;  animation-duration: 19s; animation-delay: -11s; }
@keyframes drift{
  0%   { transform: translateX(-10%) rotate(12deg); }
  100% { transform: translateX(140vw) rotate(12deg); }
}
.wii-bg .ripple{
  position:absolute; left:50%; bottom:-10%; width:180%; height:60%;
  transform:translateX(-50%);
  background: repeating-radial-gradient(circle at 50% 100%, rgba(255,255,255,0.25) 0px, transparent 2px, transparent 34px);
  opacity:.5;
  animation: pulseRing 7s ease-in-out infinite;
}
@keyframes pulseRing{ 0%,100%{ opacity:.35; } 50%{ opacity:.6; } }

/* ============ TOP BAR ============ */
.topbar{
  position:fixed; top:0; left:0; right:0; z-index:20;
  display:flex; justify-content:space-between; align-items:flex-start;
  padding:22px 34px;
  pointer-events:none;
}
.clock-widget{
  background: rgba(255,255,255,0.35);
  backdrop-filter: blur(6px);
  border:1px solid rgba(255,255,255,0.6);
  border-radius:16px;
  padding:10px 20px;
  box-shadow: 0 4px 14px rgba(20,50,90,0.12);
}
:root[data-theme="night"] .clock-widget{ background: rgba(20,35,60,0.5); border-color: rgba(255,255,255,0.12); }
.clock-time{ font-family:'Baloo 2', sans-serif; font-size:1.5rem; font-weight:700; line-height:1; letter-spacing:.02em; }
.clock-date{ font-size:.72rem; color:var(--ink-soft); margin-top:4px; text-transform:uppercase; letter-spacing:.08em; }

.status-icons{ display:flex; gap:14px; align-items:center; }
.status-pill{
  background: rgba(255,255,255,0.35);
  backdrop-filter: blur(6px);
  border:1px solid rgba(255,255,255,0.6);
  border-radius:14px;
  padding:9px 13px;
  display:flex; align-items:center; gap:8px;
  box-shadow: 0 4px 14px rgba(20,50,90,0.12);
}
:root[data-theme="night"] .status-pill{ background: rgba(20,35,60,0.5); border-color: rgba(255,255,255,0.12); }
.status-pill svg{ width:18px; height:18px; display:block; }
.wave-bar{ transform-origin: bottom; animation: wave 1.6s ease-in-out infinite; }
.wave-bar:nth-child(2){ animation-delay:.15s; }
.wave-bar:nth-child(3){ animation-delay:.3s; }
@keyframes wave{ 0%,100%{ transform: scaleY(0.4);} 50%{ transform: scaleY(1);} }

/* ============ MENU VIEWPORT ============ */
.menu-viewport{
  position:relative; z-index:10;
  height:100vh; width:100vw;
  overflow:hidden;
}
.menu-track{
  display:flex;
  width:200%;
  height:100vh;
  transition: transform .55s cubic-bezier(.22,1,.36,1);
}
.menu-page{
  width:50%;
  display:flex; align-items:center; justify-content:center;
  padding: 90px 40px 70px;
}
.channel-grid{
  display:grid;
  grid-template-columns: repeat(4, 148px);
  grid-template-rows: repeat(3, 112px);
  gap:16px;
}

/* ============ CHANNEL TILE ============ */
.tile{
  position:relative;
  border-radius:20px;
  background: linear-gradient(160deg, var(--tile-1) 0%, var(--tile-2) 100%);
  box-shadow: 0 8px 18px rgba(15,40,75,0.18), inset 0 1px 0 rgba(255,255,255,0.6);
  border: 1px solid rgba(255,255,255,0.7);
  overflow:hidden;
  cursor:none;
  transform: scale(1) rotate(0deg);
  transition: transform .18s ease, box-shadow .18s ease;
}
:root[data-theme="night"] .tile{ border-color: rgba(255,255,255,0.08); box-shadow: 0 8px 18px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.08); }
.tile::before{
  content:''; position:absolute; inset:0;
  background: radial-gradient(120% 60% at 50% -10%, rgba(255,255,255,0.85) 0%, transparent 60%);
  pointer-events:none;
}
:root[data-theme="night"] .tile::before{ background: radial-gradient(120% 60% at 50% -10%, rgba(255,255,255,0.14) 0%, transparent 60%); }
.tile.hover{
  transform: scale(1.08) rotate(var(--wob,0deg));
  box-shadow: 0 14px 26px rgba(15,40,75,0.28), 0 0 0 3px var(--glow);
  z-index:5;
}
.tile.blank{
  background: repeating-linear-gradient(135deg, rgba(120,140,160,0.12) 0 10px, rgba(120,140,160,0.05) 10px 20px);
  box-shadow: inset 0 0 0 2px rgba(140,160,180,0.25);
  cursor: default;
}
.tile.blank::before{ display:none; }

.tile-icon{
  position:absolute; top:16px; left:0; right:0;
  display:flex; align-items:center; justify-content:center;
  height:56px;
}
.tile-icon svg{ width:34px; height:34px; }
.tile-icon .glyph{ font-size:1.7rem; line-height:1; }

.tile-label{
  position:absolute; left:0; right:0; bottom:0;
  padding:7px 10px 8px;
  background: linear-gradient(0deg, rgba(15,30,55,0.62) 0%, rgba(15,30,55,0) 100%);
  color:#fff;
  font-family:'Baloo 2', sans-serif;
  font-size:.72rem; font-weight:600;
  letter-spacing:.01em;
  text-align:center;
  text-shadow: 0 1px 3px rgba(0,0,0,0.4);
}

/* ============ PAGE NAV ============ */
.page-nav{
  position:fixed; bottom:26px; left:50%; transform:translateX(-50%);
  z-index:20;
  display:flex; align-items:center; gap:18px;
}
.page-arrow{
  width:38px; height:38px; border-radius:50%;
  border:1px solid rgba(255,255,255,0.7);
  background: rgba(255,255,255,0.4);
  backdrop-filter: blur(6px);
  color:var(--ink);
  font-size:1.1rem;
  display:flex; align-items:center; justify-content:center;
  cursor:none;
}
:root[data-theme="night"] .page-arrow{ background: rgba(20,35,60,0.5); border-color: rgba(255,255,255,0.12); }
.page-dots{ display:flex; gap:8px; }
.dot{ width:8px; height:8px; border-radius:50%; background: rgba(80,110,140,0.35); transition: background .2s, transform .2s; }
.dot.active{ background: var(--wii-blue); transform: scale(1.3); }

/* ============ HOME BUTTON ============ */
.wii-home-btn{
  position:fixed; left:26px; bottom:24px; z-index:20;
  width:52px; height:52px; border-radius:50%;
  border:none; cursor:none;
  background: radial-gradient(circle at 35% 30%, #7fc4ef 0%, var(--wii-blue) 45%, var(--wii-blue-dk) 100%);
  box-shadow: 0 6px 16px rgba(20,60,100,0.35), inset 0 2px 3px rgba(255,255,255,0.5);
  display:flex; align-items:center; justify-content:center;
}
.wii-home-btn svg{ width:20px; height:20px; }

/* ============ CURSOR ============ */
#wii-cursor{
  position:fixed; top:0; left:0; z-index:999999; pointer-events:none;
  width:26px; height:26px; margin:-13px 0 0 -13px;
  transition: transform .05s linear;
}
#wii-cursor .ring{
  position:absolute; inset:0; border-radius:50%;
  border:2px solid #fff;
  box-shadow: 0 0 0 1px rgba(30,70,120,0.5), 0 3px 8px rgba(0,0,0,0.35);
  background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.9), rgba(210,230,250,0.55));
}
#wii-cursor .dot{ position:absolute; top:50%; left:50%; width:5px; height:5px; margin:-2.5px; border-radius:50%; background: var(--wii-blue-dk); }
#wii-cursor.press .ring{ transform: scale(0.78); }

/* ============ LAUNCH OVERLAY ============ */
.channel-launch{
  position:fixed; inset:0; z-index:500;
  background: radial-gradient(140% 100% at 50% 0%, var(--sky-1) 0%, var(--sky-2) 60%, var(--sky-3) 100%);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:22px;
  opacity:0; pointer-events:none;
  transition: opacity .35s ease;
}
.channel-launch.show{ opacity:1; pointer-events:auto; }
.launch-spinner{
  width:54px; height:54px; border-radius:50%;
  border:4px solid rgba(47,127,196,0.2);
  border-top-color: var(--wii-blue);
  animation: spin 0.9s linear infinite;
}
@keyframes spin{ to{ transform: rotate(360deg);} }
.launch-text{ font-family:'Baloo 2', sans-serif; font-weight:600; font-size:1.05rem; text-align:center; max-width:420px; padding:0 24px; }
.launch-sub{ font-size:.8rem; color:var(--ink-soft); }
.launch-close{
  margin-top:6px; font-family:'Baloo 2', sans-serif; font-size:.78rem; font-weight:600;
  padding:9px 20px; border-radius:20px; border:1px solid rgba(255,255,255,0.7);
  background: rgba(255,255,255,0.5); cursor:none; color:var(--ink);
}

/* ============ BANNER ============ */
.proto-banner{
  position:fixed; top:16px; left:50%; transform:translateX(-50%);
  z-index:20;
  font-family:'Baloo 2', sans-serif; font-size:.68rem; letter-spacing:.08em; text-transform:uppercase;
  color: var(--ink-soft);
  background: rgba(255,255,255,0.4); backdrop-filter: blur(6px);
  border:1px solid rgba(255,255,255,0.6); border-radius:20px;
  padding:5px 16px;
  pointer-events:none;
}
:root[data-theme="night"] .proto-banner{ background: rgba(20,35,60,0.5); border-color: rgba(255,255,255,0.12); }

@media (pointer: coarse){
  body, .tile, .page-arrow, .wii-home-btn, .launch-close{ cursor:auto; }
  #wii-cursor{ display:none; }
}
</style>
</head>
<body>

<div class="wii-bg">
  <div class="streak s1"></div>
  <div class="streak s2"></div>
  <div class="streak s3"></div>
  <div class="ripple"></div>
</div>

<div class="proto-banner">wii_test · design prototype · not linked from the site</div>

<div class="topbar">
  <div class="clock-widget">
    <div class="clock-time" id="clockTime">--:--</div>
    <div class="clock-date" id="clockDate">-- --- --</div>
  </div>
  <div class="status-icons">
    <div class="status-pill">
      <svg viewBox="0 0 24 24" fill="none"><rect x="2" y="10" width="3" height="8" rx="1" class="wave-bar" fill="currentColor"/><rect x="7" y="6" width="3" height="12" rx="1" class="wave-bar" fill="currentColor"/><rect x="12" y="2" width="3" height="16" rx="1" class="wave-bar" fill="currentColor"/></svg>
    </div>
    <div class="status-pill">
      <svg viewBox="0 0 24 24" fill="none"><rect x="2" y="6" width="14" height="12" rx="2" fill="currentColor" opacity=".85"/><rect x="17" y="9" width="2" height="6" rx="1" fill="currentColor" opacity=".6"/></svg>
    </div>
  </div>
</div>

<div class="menu-viewport">
  <div class="menu-track" id="menuTrack">

    <div class="menu-page">
      <div class="channel-grid" id="grid1"></div>
    </div>

    <div class="menu-page">
      <div class="channel-grid" id="grid2"></div>
    </div>

  </div>
</div>

<div class="page-nav">
  <button class="page-arrow" id="arrowLeft">&#8249;</button>
  <div class="page-dots">
    <span class="dot active" data-page="0"></span>
    <span class="dot" data-page="1"></span>
  </div>
  <button class="page-arrow" id="arrowRight">&#8250;</button>
</div>

<button class="wii-home-btn" id="homeBtn" title="Home">
  <svg viewBox="0 0 24 24" fill="none"><path d="M4 11 12 4l8 7" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10v8a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-8" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
</button>

<div class="channel-launch" id="launchOverlay">
  <div class="launch-spinner"></div>
  <div class="launch-text" id="launchText">Loading Channel…</div>
  <div class="launch-sub" id="launchSub"></div>
  <button class="launch-close" id="launchClose">Back to Menu</button>
</div>

<div id="wii-cursor"><div class="ring"></div><div class="dot"></div></div>

<script>
/* ===================== ICONS ===================== */
const ICONS = {
  projects:  '<svg viewBox="0 0 24 24" fill="none"><rect x="3" y="6" width="18" height="13" rx="2" stroke="#2f7fc4" stroke-width="1.8"/><path d="M3 9h18" stroke="#2f7fc4" stroke-width="1.8"/><path d="M7 13l3 3 6-6" stroke="#1a5c96" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  about:     '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="#2f7fc4" stroke-width="1.8"/><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6" stroke="#2f7fc4" stroke-width="1.8" stroke-linecap="round"/></svg>',
  present:   '<svg viewBox="0 0 24 24" fill="none"><rect x="2" y="5" width="20" height="13" rx="2" stroke="#2f7fc4" stroke-width="1.8"/><path d="M8 21h8M12 18v3" stroke="#2f7fc4" stroke-width="1.8" stroke-linecap="round"/><path d="M10 9l4 2.5-4 2.5V9z" fill="#1a5c96"/></svg>',
  experience:'<svg viewBox="0 0 24 24" fill="none"><rect x="3" y="8" width="18" height="12" rx="2" stroke="#2f7fc4" stroke-width="1.8"/><path d="M8 8V6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" stroke="#2f7fc4" stroke-width="1.8"/><path d="M3 13h18" stroke="#2f7fc4" stroke-width="1.8"/></svg>',
  blog:      '<svg viewBox="0 0 24 24" fill="none"><path d="M4 4h16v12H9l-5 4V4z" stroke="#2f7fc4" stroke-width="1.8" stroke-linejoin="round"/><path d="M7.5 8.5h9M7.5 11.5h6" stroke="#2f7fc4" stroke-width="1.6" stroke-linecap="round"/></svg>',
  resume:    '<svg viewBox="0 0 24 24" fill="none"><rect x="5" y="3" width="14" height="18" rx="2" stroke="#2f7fc4" stroke-width="1.8"/><path d="M8.5 8h7M8.5 11.5h7M8.5 15h4" stroke="#2f7fc4" stroke-width="1.6" stroke-linecap="round"/></svg>',
  contact:   '<svg viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="14" rx="2" stroke="#2f7fc4" stroke-width="1.8"/><path d="M3 7l9 6 9-6" stroke="#2f7fc4" stroke-width="1.8" stroke-linejoin="round"/></svg>',
  github:    '<svg viewBox="0 0 24 24" fill="none"><path d="M7 18c-3-1-3-4-4-4M7 21v-2.5c-1 0-2.2 0-3-.5-1-.6-1-1.6-2-2M17 21v-3.2c0-.9-.3-1.5-.7-1.8 2.3-.3 4.7-1.2 4.7-5.2 0-1.1-.4-2-1-2.7.1-.3.4-1.4-.1-2.9 0 0-.9-.3-2.9 1a10 10 0 0 0-5.4 0c-2-1.3-2.9-1-2.9-1-.5 1.5-.2 2.6-.1 2.9-.6.7-1 1.7-1 2.7 0 4 2.4 4.9 4.7 5.2-.3.3-.6.7-.7 1.4-.6.3-2.2.8-3.2-1" stroke="#2f7fc4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  linkedin:  '<svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="3" stroke="#2f7fc4" stroke-width="1.8"/><circle cx="8" cy="8.5" r="1.3" fill="#2f7fc4"/><path d="M8 11.5v6M12 17.5v-3.5c0-1.5 1-2.5 2.3-2.5S17 12.5 17 14v3.5" stroke="#2f7fc4" stroke-width="1.7" stroke-linecap="round"/><path d="M12 11.5v1" stroke="#2f7fc4" stroke-width="1.7" stroke-linecap="round"/></svg>',
  weather:   '<svg viewBox="0 0 24 24" fill="none"><circle cx="8" cy="9" r="3.4" fill="#f4b942"/><path d="M9 16a5 5 0 0 1 .3-9.9A6 6 0 0 1 21 9.5 4.2 4.2 0 0 1 20 16H9z" stroke="#2f7fc4" stroke-width="1.7" stroke-linejoin="round" fill="#fff"/></svg>',
  photo:     '<svg viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="14" rx="2" stroke="#2f7fc4" stroke-width="1.8"/><circle cx="8.5" cy="10" r="1.6" fill="#f4b942"/><path d="M3 17l5.5-5.5L12 15l3-3 6 5" stroke="#1a5c96" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/></svg>',
  gear:      '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="#2f7fc4" stroke-width="1.8"/><path d="M12 3v2.2M12 18.8V21M21 12h-2.2M5.2 12H3M18.4 5.6l-1.5 1.5M7.1 16.9l-1.5 1.5M18.4 18.4l-1.5-1.5M7.1 7.1 5.6 5.6" stroke="#2f7fc4" stroke-width="1.8" stroke-linecap="round"/></svg>',
  mii:       '<svg viewBox="0 0 24 24" fill="none"><circle cx="9" cy="7" r="2.6" fill="#f4b942"/><circle cx="15" cy="9" r="2" fill="#7fc4ef"/><path d="M4 19c.6-3.2 2.6-5 5-5s4.4 1.8 5 5" stroke="#2f7fc4" stroke-width="1.6" stroke-linecap="round"/><path d="M13 19c.4-2.4 1.8-3.7 3.4-3.7 1.6 0 2.7 1.1 3.1 2.9" stroke="#2f7fc4" stroke-width="1.6" stroke-linecap="round"/></svg>',
  news:      '<svg viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="14" height="16" rx="1.5" stroke="#2f7fc4" stroke-width="1.7"/><path d="M17 8h4v10a2 2 0 0 1-2 2h-2" stroke="#2f7fc4" stroke-width="1.7"/><path d="M6 8h8M6 11h8M6 14h5" stroke="#2f7fc4" stroke-width="1.5" stroke-linecap="round"/></svg>',
  sound:     '<svg viewBox="0 0 24 24" fill="none"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="#2f7fc4"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" stroke="#1a5c96" stroke-width="1.6" stroke-linecap="round"/></svg>',
  info:      '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#2f7fc4" stroke-width="1.8"/><path d="M12 11v6" stroke="#2f7fc4" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="7.6" r="1.1" fill="#2f7fc4"/></svg>',
  heart:     '<svg viewBox="0 0 24 24" fill="none"><path d="M12 20s-7-4.4-9.5-9C.8 7.4 3 4 6.5 4 9 4 11 5.6 12 7.3 13 5.6 15 4 17.5 4 21 4 23.2 7.4 21.5 11 19 15.6 12 20 12 20z" fill="#e5698a"/></svg>',
};

/* ===================== CHANNEL DATA ===================== */
const page1 = [
  { icon:'projects',   label:'Projects' },
  { icon:'mii',        label:'About Me' },
  { icon:'present',    label:'Presentations' },
  { icon:'experience', label:'Experience' },
  { icon:'blog',       label:'Blog' },
  { icon:'resume',     label:'Resume' },
  { icon:'contact',    label:'Contact' },
  { icon:'github',     label:'GitHub' },
  { icon:'linkedin',   label:'LinkedIn' },
  { icon:'weather',    label:'Weather' },
  { icon:'photo',      label:'Photos' },
  { icon:'gear',       label:'Options', action:'theme' },
];

const page2 = [
  { icon:'news',   label:'News' },
  { icon:'sound',  label:'Sound Test', action:'sound' },
  { icon:'info',   label:'About This Page', action:'info' },
  { icon:'heart',  label:'Credits', action:'credits' },
  { blank:true }, { blank:true }, { blank:true },
  { blank:true }, { blank:true }, { blank:true },
  { blank:true }, { blank:true },
];

function buildGrid(el, items){
  items.forEach(item => {
    const tile = document.createElement('div');
    if (item.blank){
      tile.className = 'tile blank';
      el.appendChild(tile);
      return;
    }
    tile.className = 'tile';
    tile.innerHTML = `<div class="tile-icon">${ICONS[item.icon] || ''}</div><div class="tile-label">${item.label}</div>`;
    tile.dataset.action = item.action || 'placeholder';
    tile.dataset.label = item.label;
    el.appendChild(tile);
  });
}
buildGrid(document.getElementById('grid1'), page1);
buildGrid(document.getElementById('grid2'), page2);

/* ===================== CLOCK ===================== */
function tickClock(){
  const now = new Date();
  let h = now.getHours(), m = now.getMinutes();
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12; if (h === 0) h = 12;
  document.getElementById('clockTime').textContent = h + ':' + String(m).padStart(2,'0') + ' ' + ampm;
  document.getElementById('clockDate').textContent = now.toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' });
}
tickClock();
setInterval(tickClock, 1000 * 15);

/* ===================== CUSTOM WIIMOTE CURSOR ===================== */
const cursorEl = document.getElementById('wii-cursor');
let cx = window.innerWidth/2, cy = window.innerHeight/2, lx = cx, ly = cy;
document.addEventListener('mousemove', e => { cx = e.clientX; cy = e.clientY; });
document.addEventListener('mousedown', () => cursorEl.classList.add('press'));
document.addEventListener('mouseup', () => cursorEl.classList.remove('press'));
(function animCursor(){
  const dx = cx - lx, dy = cy - ly;
  lx += dx * 0.35; ly += dy * 0.35;
  const tilt = Math.max(-14, Math.min(14, dx * 0.6));
  cursorEl.style.transform = `translate(${lx}px, ${ly}px) rotate(${tilt}deg)`;
  requestAnimationFrame(animCursor);
})();

/* ===================== TILE HOVER WOBBLE ===================== */
document.querySelectorAll('.tile:not(.blank)').forEach(tile => {
  tile.style.setProperty('--wob', (Math.random() > 0.5 ? 1 : -1) * (1 + Math.random()) + 'deg');
  tile.addEventListener('mouseenter', () => { tile.classList.add('hover'); blip(660); });
  tile.addEventListener('mouseleave', () => tile.classList.remove('hover'));
  tile.addEventListener('click', () => onTileClick(tile));
});

/* ===================== SYNTH SOUND (no external audio files) ===================== */
let actx;
function blip(freq, dur){
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const osc = actx.createOscillator();
    const gain = actx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.001, actx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.06, actx.currentTime + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + (dur || 0.18));
    osc.connect(gain).connect(actx.destination);
    osc.start();
    osc.stop(actx.currentTime + (dur || 0.2));
  }catch(e){ /* audio unsupported / blocked -- fine, purely decorative */ }
}
function chime(){
  [523.25, 659.25, 783.99].forEach((f,i) => setTimeout(() => blip(f, 0.5), i*90));
}

/* ===================== TILE CLICK / LAUNCH OVERLAY ===================== */
const overlay = document.getElementById('launchOverlay');
const launchText = document.getElementById('launchText');
const launchSub = document.getElementById('launchSub');

function onTileClick(tile){
  blip(880, 0.12);
  const action = tile.dataset.action;
  const label = tile.dataset.label;

  if (action === 'theme'){
    const root = document.documentElement;
    root.dataset.theme = root.dataset.theme === 'night' ? '' : 'night';
    return;
  }
  if (action === 'sound'){
    chime();
    return;
  }

  launchText.textContent = 'Loading ' + label + '…';
  launchSub.textContent = '';
  overlay.classList.add('show');

  setTimeout(() => {
    if (action === 'info'){
      launchText.textContent = 'wii_test';
      launchSub.textContent = 'A design prototype for a Wii Menu–styled version of this portfolio. Not linked anywhere on the live site yet — just checking whether the look works before any real content goes in.';
    } else if (action === 'credits'){
      launchText.textContent = 'Built with Claude Code';
      launchSub.textContent = 'Original CSS/SVG, synthesized sound, no ripped assets.';
    } else {
      launchText.textContent = label;
      launchSub.textContent = 'This channel isn’t connected yet — it’s just here to test the look and feel.';
    }
  }, 550);
}
document.getElementById('launchClose').addEventListener('click', () => overlay.classList.remove('show'));

/* ===================== PAGE SWIPE ===================== */
const track = document.getElementById('menuTrack');
const dots = document.querySelectorAll('.dot');
let page = 0;
function goToPage(p){
  page = Math.max(0, Math.min(1, p));
  track.style.transform = `translateX(-${page * 50}%)`;
  dots.forEach((d,i) => d.classList.toggle('active', i === page));
  blip(500, 0.1);
}
document.getElementById('arrowLeft').addEventListener('click', () => goToPage(page - 1));
document.getElementById('arrowRight').addEventListener('click', () => goToPage(page + 1));
dots.forEach(d => d.addEventListener('click', () => goToPage(+d.dataset.page)));
document.getElementById('homeBtn').addEventListener('click', () => { goToPage(0); overlay.classList.remove('show'); });
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') goToPage(page - 1);
  if (e.key === 'ArrowRight') goToPage(page + 1);
  if (e.key === 'Escape') overlay.classList.remove('show');
});
</script>
