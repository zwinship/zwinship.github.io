<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Zach Winship: Wii Menu</title>
<link rel="icon" href="../../images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@400;500;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<!--
  Layout reference: the bottom-bar silhouette, button geometry and page
  arrow are adapted from tobieche110/wii-portfolio (MIT License,
  Copyright (c) 2024 Tobias Echenique). Everything else is original.
  A fan homage to the Nintendo Wii Menu; not affiliated with Nintendo.
-->
<style>
:root{
  --cyan:#34beed;
  --cyan-text:#1f7fae;
  --gray-text:#6e7075;
  --ink:#4a4c50;
  --tile-border:#bdbec2;
  --font:'M PLUS 1p','Helvetica Neue',Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
.has-hand #root, .has-hand #root *{cursor:none !important}

/* Wii Menu background: near-white with faint horizontal lines */
.scan{background-color:#fafafa;background-image:repeating-linear-gradient(to bottom,#fafafa 0 2px,#f0f0f0 2px 4px)}

/* ================= STAGE ================= */
#root{position:fixed;inset:0;overflow:clip}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;overflow:clip}
#barExt{position:absolute;left:0;right:0;bottom:0;pointer-events:none;transition:transform .45s cubic-bezier(.45,0,.2,1);background:linear-gradient(#e6e7ea,#d8d9dd);border-top:3px solid var(--cyan);display:none}

/* ================= HEALTH & SAFETY ================= */
#warning{position:absolute;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;transition:opacity .6s ease;cursor:pointer}
#warning.gone{opacity:0;pointer-events:none}
.warn-title{display:flex;align-items:center;gap:18px;font-size:44px;font-weight:700;color:#222;letter-spacing:.5px;text-align:center}
.warn-title svg{width:56px;height:56px;flex:0 0 auto}
.warn-rule{width:min(880px,88%);height:3px;background:#222;margin:22px 0 34px}
.warn-body{width:min(880px,88%);font-size:30px;line-height:1.55;font-weight:500;color:#222}
.warn-body b{font-weight:700}
.warn-body .url{display:block;margin-top:26px}
.warn-press{margin-top:80px;font-size:30px;font-weight:500;color:#222;display:flex;align-items:center;gap:12px;opacity:0;animation:pressIn .6s ease 1.6s forwards}
.a-btn{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:50%;background:#222;color:#fff;font-size:24px;font-weight:700}
@keyframes pressIn{to{opacity:1}}
.portrait .warn-title{font-size:40px;flex-direction:column;gap:10px}
.portrait .warn-body{font-size:34px}

/* ================= MENU ================= */
#menu{position:absolute;inset:0;visibility:hidden}
#menu.boot{animation:fadeIn .8s ease both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
#pages{position:absolute;left:0;top:0;overflow:clip;transition:transform .5s cubic-bezier(.45,0,.2,1),opacity .45s ease}
#track{position:absolute;left:0;top:0;height:100%;display:flex;transition:transform .55s cubic-bezier(.45,0,.2,1)}
.page{position:relative;height:100%}
.grid{position:absolute;display:grid}

/* --- channel tile --- */
.ch{position:relative;border-radius:18px;background:#fff;border:2px solid var(--tile-border);padding:0;transition:border-color .1s,box-shadow .1s;outline:none}
.ch .bn{position:absolute;inset:4px;border-radius:13px;overflow:hidden}
.ch.hot,.ch:focus-visible{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 0 7px 2px rgba(52,190,237,.45);z-index:3}
.ch.empty{background:#ececee;border-color:#d2d3d6;cursor:default}
.ch.empty .bn{display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(to bottom,#efeff1 0 2px,#e6e6e9 2px 4px)}
.wii-mark{display:block;width:34%;max-width:96px}
/* 4:3 tiles: show the 16:9 banner letterboxed, like the real menu did */
.grid.narrow .ch .bn{top:50%;bottom:auto;aspect-ratio:16/9;transform:translateY(-50%);border-radius:8px}
.grid.narrow .ch.empty .bn{inset:4px;transform:none;aspect-ratio:auto}

/* hover label */
#bubble{position:absolute;z-index:40;pointer-events:none;padding:6px 28px;border-radius:999px;background:#fff;border:2px solid #b9babd;box-shadow:0 2px 4px rgba(0,0,0,.12);font-size:22px;font-weight:500;color:#4a4c50;white-space:nowrap;opacity:0;transform:translate(-50%,4px) scale(.92);transition:opacity .12s,transform .16s cubic-bezier(.3,1.6,.5,1)}
#bubble.on{opacity:1;transform:translate(-50%,0) scale(1);transition-delay:.18s}

/* page arrows */
.parrow{position:absolute;width:46px;height:82px;z-index:5;opacity:0;pointer-events:none;transition:opacity .25s}
.parrow svg{width:100%;height:100%;filter:drop-shadow(0 2px 2px rgba(20,60,120,.25))}
.parrow.show{opacity:1;pointer-events:auto}
.parrow.show svg{animation:arrowPulse 1.6s ease-in-out infinite}
.parrow.hot svg{animation:none;transform:scale(1.08)}
#arrL svg{transform:scaleX(-1)}
#arrL.show svg{animation:arrowPulseL 1.6s ease-in-out infinite}
#arrL.hot svg{animation:none;transform:scaleX(-1) scale(1.08)}
@keyframes arrowPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes arrowPulseL{0%,100%{transform:scaleX(-1) scale(1)}50%{transform:scaleX(-1) scale(1.07)}}

/* ================= BOTTOM BAR ================= */
#bar{position:absolute;left:0;height:200px;transition:transform .45s cubic-bezier(.45,0,.2,1)}
#bar svg.shape{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#clock{position:absolute;left:0;right:0;top:18px;display:flex;justify-content:center;height:62px}
#date{position:absolute;left:0;right:0;top:122px;text-align:center;font-size:30px;font-weight:500;color:#7d7f84;letter-spacing:.5px}
.round-btn{position:absolute;top:65px;width:132px;height:132px;border-radius:50%;outline:none}
.round-btn .face{position:absolute;inset:8px;border-radius:50%;background:linear-gradient(#f2f2f3,#d9d9db);border:4px solid var(--cyan);box-shadow:0 3px 4px rgba(0,0,0,.16);display:flex;align-items:center;justify-content:center;transition:box-shadow .12s}
.round-btn.hot .face,.round-btn:focus-visible .face{box-shadow:0 0 0 3px rgba(52,190,237,.35),0 0 8px 2px rgba(52,190,237,.45),0 3px 4px rgba(0,0,0,.16)}
#wiiBtn{left:58px}
#mailBtn{right:58px}
#wiiBtn .wii-mark{width:70px;max-width:none}
#mailBtn .env{fill:#a1a0a4;animation:mailGlow 2.4s ease-in-out infinite}
@keyframes mailGlow{0%,100%{fill:#a1a0a4}50%{fill:#34beed}}
#sdBtn{position:absolute;top:100px;width:50px;height:60px;border-radius:8px;outline:none;padding:2px}
#sdBtn svg{width:100%;height:100%}
#sdBtn.hot svg path:first-child,#sdBtn:focus-visible svg path:first-child{stroke:var(--cyan);stroke-width:3}

/* ================= CHANNEL PREVIEW ================= */
#preview{position:absolute;inset:0;z-index:50;pointer-events:none}
#preview.open{pointer-events:auto}
#preview.closing{pointer-events:none}
#pvZoom{position:absolute;overflow:hidden;background:#fff;transition:left .5s cubic-bezier(.45,0,.2,1),top .5s cubic-bezier(.45,0,.2,1),width .5s cubic-bezier(.45,0,.2,1),height .5s cubic-bezier(.45,0,.2,1),border-radius .5s}
#pvZoom .bn{position:absolute;inset:0}
#pvBottom{position:absolute;left:0;right:0;bottom:0;height:148px;display:flex;align-items:center;justify-content:center;gap:9%;transform:translateY(100%);transition:transform .35s cubic-bezier(.45,0,.2,1)}
#preview.shown #pvBottom{transform:none}
.pill{position:relative;width:400px;height:88px;border-radius:999px;background:linear-gradient(#fdfdfd,#e9e9eb);border:2px solid #c4c5c9;box-shadow:0 2px 3px rgba(0,0,0,.12);font-size:36px;font-weight:500;color:#55575c;transition:border-color .1s,box-shadow .1s;outline:none}
.pill.hot,.pill:focus-visible{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 0 8px 2px rgba(52,190,237,.45)}
.portrait .pill{width:300px;height:84px;font-size:32px}
.pvarrow{position:absolute;width:46px;height:82px;opacity:0;transition:opacity .25s;outline:none}
#preview.shown .pvarrow{opacity:1}
.pvarrow svg{width:100%;height:100%;filter:drop-shadow(0 2px 2px rgba(20,60,120,.25))}
.pvarrow.hot svg{transform:scale(1.08)}
#pvL svg{transform:scaleX(-1)}
#pvL.hot svg{transform:scaleX(-1) scale(1.08)}

/* ================= WII BUTTON SCREEN ================= */
#sysmenu{position:absolute;left:0;right:0;top:0;bottom:200px;z-index:55;display:none;flex-direction:column;align-items:center;justify-content:center;gap:36px}
#sysmenu.open{display:flex;animation:fadeIn .25s ease}
#sysmenu.open .sys-row{animation:sysIn .3s cubic-bezier(.45,0,.2,1)}
@keyframes sysIn{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sys-row{display:flex;gap:56px}
.portrait .sys-row{flex-direction:column;gap:30px}
.sysbtn{width:440px;height:200px;border-radius:24px;background:linear-gradient(#ffffff,#eeeff1);border:2px solid #c4c5c9;box-shadow:0 2px 4px rgba(0,0,0,.1);font-size:36px;font-weight:500;color:#55575c;transition:border-color .1s,box-shadow .1s;outline:none}
.sysbtn.hot,.sysbtn:focus-visible{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 0 8px 2px rgba(52,190,237,.45)}

/* ================= HAND CURSOR ================= */
#hand{position:fixed;left:0;top:0;z-index:9999;pointer-events:none;width:58px;height:70px;margin:-6px 0 0 -18px;display:none;transform-origin:18px 6px;will-change:transform}
.has-hand #hand{display:block}
.has-hand.in-content #hand{display:none}
#hand svg{width:100%;height:100%;transition:transform .08s;filter:drop-shadow(1px 2px 1px rgba(0,0,0,.28))}
#hand.press svg{transform:scale(.92)}

/* ================= CHANNEL CONTENT =================
   Each channel is its own full-screen app, styled after that real channel. */
#content{position:fixed;inset:0;z-index:70;display:none;cursor:auto;overflow:hidden;font-family:var(--font);color:var(--ink)}
#content.open{display:block;animation:fadeIn .3s ease}
#content.leaving{animation:fadeOut .2s ease forwards}
@keyframes fadeOut{to{opacity:0}}
#content [hidden]{display:none !important}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}
.scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.sel-text{user-select:text}
/* the system's grey pill button, as used across the real channels */
.wb{display:inline-flex;align-items:center;justify-content:center;min-width:clamp(130px,15vw,220px);height:clamp(46px,6.2vh,62px);padding:0 24px;border-radius:999px;background:linear-gradient(#fdfdfd,#e9e9eb);border:2px solid #c4c5c9;box-shadow:0 2px 3px rgba(0,0,0,.12);font-size:clamp(16px,2.2vh,22px);font-weight:500;color:#55575c;text-decoration:none;white-space:nowrap;outline:none;transition:border-color .1s,box-shadow .1s}
.wb:hover,.wb:focus-visible{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 0 8px 2px rgba(52,190,237,.45)}
.wbar{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:clamp(10px,3vw,40px);padding:14px 16px;padding-bottom:max(14px,env(safe-area-inset-bottom))}
.wbar.grey{background:linear-gradient(#ededef,#dcdde0);border-top:3px solid var(--cyan)}
@media (max-width:600px){.wb{min-width:0;flex:1 1 0;max-width:200px;padding:0 10px;font-size:16px}.wbar{gap:10px}}

/* --- Disc Channel: the paper's title screen --- */
.ds{background:radial-gradient(ellipse at 50% 42%,#ffffff 0,#f1f3f6 55%,#dde2e8 100%);align-items:center;justify-content:center;text-align:center;padding:16px}
.ds-disc{position:absolute;left:50%;top:44%;width:min(86vh,94vw);height:min(86vh,94vw);transform:translate(-50%,-50%);opacity:.5;pointer-events:none}
.ds-disc>div{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 30deg,#e9edf2,#ffffff,#e3e8ee,#fafbfc,#e9edf2);box-shadow:inset 0 0 0 2px #d3d8df;animation:spin 40s linear infinite}
.ds-disc>div::before{content:'';position:absolute;inset:36%;border-radius:50%;background:#f3f5f7;box-shadow:inset 0 0 0 2px #d3d8df}
.ds-disc>div::after{content:'';position:absolute;inset:45.5%;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 2px #d3d8df}
.ds-logo{position:relative;max-width:1040px}
.ds-kick{font-size:clamp(13px,2vh,19px);font-weight:700;color:#1f7fae;letter-spacing:.12em;text-transform:uppercase}
.ds-logo h1{font-size:min(7.4vh,8.6vw,76px);font-weight:800;color:#3d3f44;line-height:1.08;margin:2vh 0 1.4vh;letter-spacing:-.01em}
.ds-sub{font-size:min(3.2vh,5vw,30px);font-weight:500;color:#6e7075}
.ds-press{position:relative;margin-top:8vh;font-size:clamp(18px,3vh,28px);font-weight:500;color:#3d3f44;display:inline-flex;gap:12px;align-items:center;padding:8px 20px;border-radius:999px;animation:blink 1.6s ease-in-out infinite;outline:none}
.ds-press:focus-visible{box-shadow:0 0 0 2px var(--cyan)}
@keyframes blink{50%{opacity:.3}}
.ds-menu{position:relative;margin-top:6vh;display:flex;flex-direction:column;gap:clamp(10px,1.8vh,16px);align-items:center;animation:fadeIn .3s ease}
.ds-menu .wb{width:min(380px,80vw);max-width:none;flex:none}
.ds-credit{position:absolute;left:16px;right:16px;bottom:max(16px,env(safe-area-inset-bottom));font-size:clamp(12px,1.7vh,15px);color:#8a8c91}
.dlg{position:absolute;inset:0;z-index:5;background:rgba(236,238,241,.82);display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .2s ease}
.dlg-box{background:#fff;border:2px solid #c9cacd;border-radius:24px;box-shadow:0 8px 24px rgba(0,0,0,.12);max-width:780px;width:100%;max-height:100%;display:flex;flex-direction:column;overflow:hidden;text-align:left}
.dlg-box .scroll{padding:clamp(18px,3.4vh,34px) clamp(18px,3vw,36px);font-size:clamp(16px,2.3vh,20px);line-height:1.7;color:#4a4c50}
.dlg-box .wbar{border-top:2px solid #e3e4e7}

/* paper viewer opened from the title screen (after variant C's document viewer) */
.rs{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;background:#5b5e64 radial-gradient(ellipse at 50% 40%,#6c7076,#45484d);animation:fadeIn .2s ease;text-align:left}
.rs-top{flex:0 0 auto;display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:max(14px,env(safe-area-inset-top)) clamp(16px,3vw,40px) 8px;color:#e9eaec}
.rs-top b{font-size:clamp(17px,2.6vh,22px);font-weight:700}
.rs-count{font-size:18px;font-weight:500;color:#c5c7cb;font-variant-numeric:tabular-nums}
.rs-desk{position:relative;flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 clamp(60px,8vw,120px)}
.rs-desk .ph-arr{top:50%}
.rs-wrap{height:100%;display:flex;align-items:center;justify-content:center;min-width:0}
.rs-sheet{position:relative;height:min(100%,calc((100vw - 240px) * 1.294));aspect-ratio:8.5/11;max-height:100%;background:#fff;box-shadow:0 1px 0 #ddd,0 10px 30px rgba(0,0,0,.35);container-type:inline-size;overflow:hidden;color:#1c1c1c;font-family:Georgia,'Times New Roman',serif;user-select:text}
.rs-sheet .in{position:absolute;inset:0;overflow-y:auto;padding:9cqi 10cqi 7cqi;display:flex;flex-direction:column}
.rs-sheet .venue{font-size:max(11px,2.3cqi);letter-spacing:.14em;text-transform:uppercase;text-align:center;color:#555}
.rs-sheet h2{font-weight:700;font-size:max(17px,4.9cqi);line-height:1.2;text-align:center;margin:3.6cqi 0 0;text-wrap:balance}
.rs-sheet .by{font-style:italic;font-size:max(12px,2.6cqi);text-align:center;margin-top:2.6cqi;color:#333;line-height:1.45;text-wrap:balance}
.rs-sheet .abs-h{font-size:max(11px,2.3cqi);letter-spacing:.14em;text-transform:uppercase;text-align:center;margin:6cqi 0 2cqi;color:#333}
.rs-sheet .abs{font-size:max(13px,2.85cqi);line-height:1.55;text-align:justify;hyphens:auto;padding:0 3cqi}
.rs-sheet .kw{font-size:max(12px,2.5cqi);line-height:1.5;margin-top:3.4cqi;padding:0 3cqi;color:#333}
.rs-sheet .avail{margin-top:auto;padding:5cqi 3cqi 0;font-size:max(12px,2.4cqi);line-height:1.7}
.rs-sheet .avail a{color:#1a55a0}
.rs-sheet .folio{text-align:center;font-size:max(11px,2.2cqi);color:#777;margin-top:4cqi}
.rs .wbar{background:rgba(0,0,0,.18)}
@media (max-width:700px){.rs-desk{align-items:stretch;padding:0 8px 64px}.rs-desk .ph-arr{top:auto;bottom:6px;margin-top:0;width:34px;height:56px}.rs-wrap{flex:1;align-items:stretch}.rs-sheet{height:auto;width:100%;aspect-ratio:auto}.rs-sheet .in{padding:26px 20px 22px}}

/* --- Mii Channel: the plaza --- */
.mp{background:linear-gradient(#ffffff 0,#f6f7f9 40%,#e4e8ec 100%)}
.mp-floor{position:absolute;left:-60%;right:-60%;bottom:0;height:70%;background-image:linear-gradient(rgba(70,90,110,.1) 2px,transparent 2px),linear-gradient(90deg,rgba(70,90,110,.1) 2px,transparent 2px);background-size:110px 110px;transform:perspective(700px) rotateX(55deg);transform-origin:50% 100%;pointer-events:none}
.mp-main{position:relative;flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;align-items:flex-end;justify-content:center;gap:clamp(10px,2vw,30px);padding:clamp(40px,7vh,80px) clamp(16px,4vw,60px) 0}
.mp-mii{position:relative;flex:0 0 auto;width:min(34vw,58vh);margin-bottom:-2px;animation:miiIn .5s cubic-bezier(.3,1.4,.5,1) both}
@keyframes miiIn{from{transform:translateY(24px);opacity:0}}
.mp-mii img{display:block;width:100%;height:auto}
/* the speech balloon a selected Mii gets */
.mp-say{position:relative;align-self:center;flex:0 1 520px;min-width:0;margin-bottom:8vh;background:#fff;border:3px solid #c9cbcf;border-radius:34px;box-shadow:0 4px 12px rgba(0,0,0,.08);padding:clamp(18px,3.4vh,32px) clamp(20px,2.6vw,36px);user-select:text;animation:fadeIn .4s ease .25s both}
.mp-say::before{content:'';position:absolute;left:-17px;top:46%;width:28px;height:28px;background:#fff;border-left:3px solid #c9cbcf;border-bottom:3px solid #c9cbcf;transform:rotate(45deg);border-radius:0 0 0 6px}
.mp-say h2{font-size:clamp(24px,4.4vh,40px);font-weight:800;color:#3f4146;line-height:1.1}
.mp-say p{font-size:clamp(16px,2.4vh,21px);line-height:1.55;color:#55575c;margin-top:1.4vh}
.mp-say .now{font-size:clamp(14px,2vh,17px);color:#1f7fae;font-weight:500}
.mp .wbar{position:relative;z-index:2}
@media (max-width:760px){.mp-main{flex-direction:column;align-items:center;justify-content:flex-start;padding-bottom:16px}.mp-mii{width:min(56vw,30vh);margin-bottom:0;-webkit-mask-image:linear-gradient(#000 80%,transparent);mask-image:linear-gradient(#000 80%,transparent)}.mp-say{flex:none;width:100%;margin:14px 0 0;align-self:stretch}.mp-say::before{left:50%;top:-17px;margin-left:-14px;transform:rotate(135deg)}}

/* --- Photo Channel --- */
.ph{background-color:#eeeff1;background-image:repeating-linear-gradient(to bottom,#f3f3f5 0 2px,#ebebed 2px 4px)}
.ph-top{flex:0 0 auto;display:flex;align-items:baseline;gap:16px;padding:max(14px,env(safe-area-inset-top)) clamp(16px,4vw,48px) 6px}
.ph-top b{font-size:clamp(20px,3vh,28px);font-weight:700;color:#6e7075}
.ph .scroll{display:flex;align-items:center}
.ph-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(16px,3vw,44px);padding:clamp(10px,2vh,20px) clamp(16px,5vw,90px) 24px;max-width:1300px;width:100%;margin:auto}
.ph-th{position:relative;aspect-ratio:1;background:#fff;padding:clamp(5px,.7vw,10px);border-radius:4px;box-shadow:0 2px 6px rgba(0,0,0,.18);outline:none;transition:transform .15s,box-shadow .15s}
.ph-th:nth-child(1){transform:rotate(-2deg)}.ph-th:nth-child(3){transform:rotate(2deg)}
.ph-th:hover,.ph-th:focus-visible{transform:scale(1.04);box-shadow:0 0 0 3px var(--cyan),0 0 12px 3px rgba(52,190,237,.45)}
.ph-th img{display:block;width:100%;height:100%;object-fit:cover}
.ph-th .mv{position:absolute;right:clamp(10px,1.2vw,18px);bottom:clamp(10px,1.2vw,18px);width:clamp(30px,3.4vw,46px);height:clamp(30px,3.4vw,46px);border-radius:50%;background:rgba(0,0,0,.55)}

#pvZoom .bn .tl{display:none}
#pvZoom .bn .tick{font-size:5cqh !important}
#pvZoom .bn .tickbar,#pvZoom .bn .capbar{height:15% !important}
#pvZoom .bn .cap{font-size:8cqh !important}
.bn .safe{left:50%;top:50%;width:min(100cqw,177.78cqh);height:min(100cqh,56.25cqw);transform:translate(-50%,-50%);container-type:size}
/* phone preview: keep text clear of the side arrows */
.portrait #pvZoom .bn .safe{width:84cqw;height:47.25cqw}
#fader{position:fixed;inset:0;z-index:75;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s ease}
#fader.on{opacity:1;pointer-events:auto}
#musicToggle{width:300px;height:80px;font-size:28px}
.spin{animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ticker{from{transform:translateX(100cqw)}to{transform:translateX(-100%)}}
/* light gloss over each tile, like the real menu's glassy channel frames */
.ch:not(.empty) .bn::after{content:'';position:absolute;left:0;right:0;top:0;height:48%;background:linear-gradient(rgba(255,255,255,.28),rgba(255,255,255,0));pointer-events:none}

@media (prefers-reduced-motion:reduce){
  .bn *,.spin,.ch.hot,.parrow.show svg,#mailBtn .env,.warn-press{animation:none !important}
  .warn-press{opacity:1}
  #track,#pvZoom,#pages,#bar,#barExt,#pvBottom,#fader,#bubble{transition-duration:.01s !important}
  #sysmenu .sys-row,#content,#menu.boot,.ds-disc>div,.ds-press,.mp-mii,.fc-tick div,.nw-tick div{animation:none !important}
}
</style>

<script src="../shared/data.js"></script>
<script>
const ASSET = '../../';
const HERE = './';
const ZW_IMG = HERE + 'zw.webp', LED_IMG = HERE + 'led.webp';
const RESUME = ASSET + 'about_me/resume.pdf';
const LINKEDIN = 'https://linkedin.com/in/zwinship', GITHUB = 'https://github.com/zwinship';
const coarse = matchMedia('(pointer:coarse)').matches;

/* An upright, rounded "Wii" wordmark drawn as strokes (not the official logo file). */
const WII_MARK = (col='#a5a6aa') => `<svg class="wii-mark" viewBox="0 0 100 44" aria-hidden="true"><g fill="none" stroke="${col}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 10l9 28 9-22 9 22 9-28"/><path d="M62 20v18M84 20v18"/></g><circle cx="62" cy="9" r="4.6" fill="${col}"/><circle cx="84" cy="9" r="4.6" fill="${col}"/></svg>`;
document.querySelector('.wii-mark-slot').outerHTML = WII_MARK();

/* =====================================================================
   BANNERS: each tile copies the look of the real channel's tile: its own
   name, its own colors, one moving element. `.pv` lines only show in the
   zoomed preview, `.tl` lines only on the small tile.
   ===================================================================== */
const PV = (txt, css) => `<div class="pv" style="${css};font-size:5.6cqh;font-weight:500;line-height:1.45">${txt}</div>`;
const BN = (bg, inner) => `${bg}<div class="safe">${inner}</div>`;
const LIGHT = '<div style="inset:0;background:linear-gradient(#ffffff,#eceff3)"></div>';
const LABEL = (txt, css) => `<div style="${css};font-weight:800;color:#8b8d92;letter-spacing:-.15cqh;line-height:1.05">${txt}</div>`;
const nber = byId('nber');
const POLL_Q = byId('polls').body.split('?')[0] + '?';
const B = {
disc: () => BN(LIGHT, `
  <div class="spin" style="left:5cqw;top:15cqh;width:70cqh;height:70cqh;border-radius:50%;background:conic-gradient(from 30deg,#dfe4ec,#fbfcfd,#d8dee7,#f6f7fa,#dfe4ec);box-shadow:inset 0 0 0 .5cqh #b9bec7,0 1cqh 2cqh rgba(0,0,0,.08)">
    <div style="inset:36%;border-radius:50%;background:#eef0f3;box-shadow:inset 0 0 0 .5cqh #b9bec7"></div>
    <div style="inset:45%;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 .4cqh #b9bec7"></div>
  </div>
  <div class="tl">${LABEL('Disc<br>Channel', 'left:54cqw;top:31cqh;font-size:14cqh')}</div>
  <div class="pv" style="left:49cqw;right:8cqw;top:20cqh">
    <div style="position:static;font-size:4cqh;font-weight:700;color:#1f7fae;letter-spacing:.2cqh;white-space:nowrap">NBER WORKING PAPER NO. 35414</div>
    <div style="position:static;margin-top:3cqh;font-size:8.2cqh;font-weight:800;color:#45474c;line-height:1.1;text-wrap:balance">${nber.title.split(': ')[0]}</div>
    <div style="position:static;margin-top:3cqh;font-size:4.6cqh;font-weight:500;color:#6e7075;white-space:nowrap">${nber.title.split(': ')[1]}</div>
  </div>`),

mii: () => BN('<div style="inset:0;background:linear-gradient(#ffffff,#eef1f4)"></div>', `
  <img src="${ZW_IMG}" alt="" style="right:6cqw;bottom:0;height:70cqh;width:auto">
  ${LABEL('Mii<br>Channel', 'left:9cqw;top:24cqh;font-size:14cqh')}
  ${PV(PROFILE.name, 'left:9cqw;top:60cqh;color:#1f7fae;font-weight:700')}`),

photo: () => BN('<div style="inset:0;background:linear-gradient(#ffffff,#e9eaed)"></div>', `
  <div style="left:6cqw;top:15cqh;width:50cqh;height:50cqh;padding:1.4cqh;background:#fff;box-shadow:0 .8cqh 1.6cqh rgba(0,0,0,.18);transform:rotate(-7deg)"><img src="${LED_IMG}" alt="" style="position:static;display:block;width:100%;height:100%;object-fit:cover"></div>
  <div style="left:25cqw;top:34cqh;width:46cqh;height:46cqh;padding:1.4cqh;background:#fff;box-shadow:0 .8cqh 1.6cqh rgba(0,0,0,.18);transform:rotate(6deg)"><div style="position:static;width:100%;height:100%;background:linear-gradient(#e8f3fa,#c7dff0);overflow:hidden"><img src="${ZW_IMG}" alt="" style="position:static;display:block;width:100%;height:100%;object-fit:cover;object-position:50% 0"></div></div>
  ${LABEL('Photo<br>Channel', 'left:60cqw;top:31cqh;font-size:13cqh')}
  ${PV('SD Card', 'left:60cqw;top:64cqh;color:#1f7fae')}`),

shop: () => BN('<div style="inset:0;background:linear-gradient(#ffffff,#def3fc)"></div>', `
  <svg viewBox="0 0 40 40" style="left:50%;top:10cqh;width:36cqh;height:36cqh;margin-left:-18cqh"><path d="M13 14V11a7 7 0 0114 0v3" fill="none" stroke="#2aa6d8" stroke-width="3"/><rect x="5" y="13" width="30" height="23" rx="4" fill="#fff" stroke="#2aa6d8" stroke-width="3"/></svg>
  <div class="t" style="top:52cqh;font-size:13cqh;font-weight:800;color:#1f9fd0;letter-spacing:-.2cqh">Wii Shop Channel</div>
  ${PV('rd2dnet, Chesque, OctaStats, Tale of the Tape', 'left:0;right:0;text-align:center;top:74cqh;color:#4b9cc4')}`),

/* Forecast tile: live Boston temperature when it loads; otherwise the
   ridership paper takes its place, as the channel's "forecast". */
forecast: () => BN(`<div style="inset:0;background:linear-gradient(#2f93dc,#a9dbf6 82%)"></div>
  <div class="capbar" style="left:0;right:0;bottom:0;height:26%;background:linear-gradient(#ffffff,#e9f3fa);display:flex;align-items:center;justify-content:center"><span class="cap" style="position:static;font-size:12cqh;font-weight:800;color:#2c8fc6;letter-spacing:-.2cqh">Forecast Channel</span></div>`, `
  <div style="left:8cqw;top:9cqh;font-size:10cqh;font-weight:700;color:#fff;text-shadow:0 .4cqh 1cqh rgba(0,40,90,.3)">Boston</div>
  <div class="wx-temp" style="left:8cqw;top:23cqh;font-size:28cqh;font-weight:700;color:#fff;line-height:1;display:none;text-shadow:0 .5cqh 1.4cqh rgba(0,40,90,.3)"></div>
  <div class="wx-alt" style="left:8cqw;right:6cqw;top:27cqh;font-size:13cqh;font-weight:800;color:#fff;line-height:1.05;letter-spacing:-.2cqh;text-shadow:0 .5cqh 1.4cqh rgba(0,40,90,.3)">MBTA Ridership</div>
  ${PV('ARIMA, R, 2025', 'right:7cqw;top:12cqh;text-align:right;color:#fff;font-weight:700')}`),

news: () => BN(`<div style="inset:0;background:linear-gradient(#ffffff,#e9edf3)"></div>
  <div class="tickbar" style="left:0;right:0;bottom:0;height:24%;background:#24507d;overflow:hidden">
    <div class="tick" style="left:0;top:0;height:100%;display:flex;align-items:center;white-space:nowrap;font-size:9cqh;font-weight:500;color:#fff;animation:ticker 40s linear -8s infinite">${MEDIA.map(m=>`${m[1]}: ${m[2]}`).join('<span style="position:static;display:inline-block;width:12cqh"></span>')}</div>
  </div>`, `
  <div class="t" style="top:20cqh;font-size:17cqh;font-weight:800;color:#24507d;letter-spacing:-.3cqh">News Channel</div>
  ${PV(nber.badge.replace('WP','Working Paper'), 'left:0;right:0;text-align:center;top:52cqh;color:#3a75ad')}`),

internet: () => BN(LIGHT, `
  <div class="t" style="top:16cqh;font-size:14cqh;font-weight:800;color:#8b8d92;letter-spacing:-.2cqh">Internet Channel</div>
  <div style="left:14cqw;right:14cqw;top:50cqh;height:19cqh;border-radius:10cqh;background:#fff;border:.7cqh solid #7fbfe4;box-shadow:0 .6cqh 1.4cqh rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center">
    <span style="position:static;font-size:8cqh;font-weight:500;color:#5f6166">zwinship.github.io</span>
  </div>`),

votes: () => BN('<div style="inset:0;background:linear-gradient(#ffffff,#eceef2)"></div>', `
  <div class="t" style="top:13cqh;font-size:10.5cqh;font-weight:800;color:#8b8d92;letter-spacing:-.2cqh">Everybody Votes Channel</div>
  <div style="left:13cqw;width:34cqw;top:40cqh;height:20cqh;border-radius:7cqh;background:linear-gradient(#62c8f2,#2a9dd5);border:.8cqh solid #fff;box-shadow:0 .5cqh 1.2cqh rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;color:#fff;font-size:7cqh;font-weight:700"><span style="position:static">Predict</span></div>
  <div style="right:13cqw;width:34cqw;top:40cqh;height:20cqh;border-radius:7cqh;background:linear-gradient(#f47d74,#d8463d);border:.8cqh solid #fff;box-shadow:0 .5cqh 1.2cqh rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;color:#fff;font-size:7cqh;font-weight:700"><span style="position:static">Influence</span></div>
  ${PV(POLL_Q, 'left:0;right:0;text-align:center;top:72cqh;color:#55575c')}`),

/* title art for the Shop Channel: type only */
rd2dnet: () => BN('<div style="inset:0;background:linear-gradient(#ffffff,#e8f6fd)"></div>', `
  <div class="t" style="top:26cqh;font:700 24cqh/1 ui-monospace,Menlo,Consolas,monospace;color:#2b2d31;letter-spacing:-1cqh">rd2dnet</div>
  <div class="t" style="top:62cqh;font-size:6.4cqh;font-weight:700;color:#1f8fc4;letter-spacing:.5cqh">PYTHON AND R</div>`),
chesque: () => BN('<div style="inset:0;background:linear-gradient(#262c40,#171b28)"></div>', `
  <div class="t" style="top:32cqh;font-size:26cqh;font-weight:800;color:#f1e9d8;letter-spacing:-.4cqh">Ches<span style="position:static;color:#f0a53a">que</span></div>`),
octa: () => BN('<div style="inset:0;background:linear-gradient(#26262a,#121214)"></div>', `
  <div class="t" style="top:30cqh;font-size:24cqh;font-weight:800;color:#fff;letter-spacing:-.6cqh">Octa<span style="position:static;color:#e04646">Stats</span></div>
  <div class="t" style="top:64cqh;font-size:6.4cqh;font-weight:700;color:#9a9ba0;letter-spacing:.6cqh">UFC MODEL V2</div>`),
tape: () => BN('<div style="inset:0;background:linear-gradient(90deg,#c43c3c 0 50%,#2f66b8 50%)"></div>', `
  <div class="t" style="top:20cqh;font-size:13cqh;font-weight:700;color:#fff;letter-spacing:.4cqh">TALE OF THE</div>
  <div class="t" style="top:36cqh;font-size:34cqh;font-weight:800;color:#fff;letter-spacing:-.6cqh;line-height:1">TAPE</div>`),
micro: () => BN('<div style="inset:0;background:linear-gradient(#ffffff,#eef3f7)"></div>', `
  <div class="t" style="top:26cqh;font-size:8cqh;font-weight:700;color:#1f7fae;letter-spacing:.6cqh">INTERMEDIATE</div>
  <div class="t" style="top:38cqh;font-size:17cqh;font-weight:800;color:#45474c;letter-spacing:-.3cqh">Microeconomics</div>`),
};

/* =====================================================================
   CHANNEL SCREENS
   ===================================================================== */
const plain = s => String(s || '').replace(/\s*·\s*/g, ', ');
const EXT = (href, label, cls='wb') => `<a class="${cls}" href="${href}" ${href.startsWith('mailto:')?'':'target="_blank" rel="noopener"'}>${label}</a>`;
const BACK = (label='Wii Menu') => `<button class="wb" data-back>${label}</button>`;
const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => [...root.querySelectorAll(sel)];
const today = () => { const d = new Date(); return `${d.toLocaleDateString('en-US',{weekday:'long'})}, ${d.toLocaleDateString('en-US',{month:'long',day:'numeric'})}`; };
// move focus through a list of elements with the arrow keys
function arrowNav(e, els, cols=1){
  const i = els.indexOf(document.activeElement); if (i < 0) return false;
  const step = {ArrowRight:1, ArrowLeft:-1, ArrowDown:cols, ArrowUp:-cols}[e.key];
  if (!step) return false;
  const n = i + step; if (n < 0 || n >= els.length) return true;
  els[n].focus(); SFX.hover(); return true;
}

/* --- Photo Channel: only real photos and the real build video --- */
const led = byId('mbta-led');
const PHOTOS = [
  { kind:'img', src:LED_IMG, title:led.title, body:led.body, links:led.links },
  { kind:'video', src:ASSET+led.video, poster:HERE+'led_movie.webp', title:led.title, links:led.links },
  { kind:'zw', title:PROFILE.name, body:PROFILE.now, links:[[LINKEDIN,'LinkedIn'],[GITHUB,'GitHub']] },
];
const photoHTML = (p, big) => p.kind==='zw' ? `<div class="ph-zw"><img src="${ZW_IMG}" alt="Photo of ${PROFILE.name}"></div>`
  : p.kind==='video' ? (big ? `<video src="${p.src}" poster="${p.poster}" ${reduced ? 'controls' : 'autoplay muted loop'} playsinline preload="auto" aria-label="Video of the LED map"></video>` : `<img src="${p.poster}" alt="${p.title}, video" loading="lazy"><span class="mv" aria-hidden="true"></span>`)
  : `<img src="${p.src}" alt="${p.title}"${big?'':' loading="lazy"'}>`;

/* --- Disc Channel: papers, one sheet at a time (after variant C's viewer) --- */
const PAPERS = RESEARCH.filter(p => p.id !== 'micro');
const paperSheet = (p, i) => `<div class="in">
  <div class="venue">${p.badge ? p.badge.replace('WP No.','Working Paper No.') + ', ' : ''}${p.year}</div>
  <h2>${p.title}</h2>
  ${p.coauthors ? `<div class="by">With ${p.coauthors}</div>` : ''}
  <div class="abs-h">Abstract</div>
  <p class="abs">${p.body}</p>
  <p class="kw"><i>Keywords:</i> ${plain(p.meta)}</p>
  ${p.links.length ? `<div class="avail">${p.links.map(l=>`<a href="${l[0]}" target="_blank" rel="noopener">${l[1]}</a>`).join('<br>')}</div>` : '<div class="avail"></div>'}
  <div class="folio">${i+1}</div></div>`;

/* --- Shop titles --- */
const SHOP = [
  { p:SOFTWARE, name:'rd2dnet', art:'rd2dnet' },
  { p:byId('chesque'), name:'Chesque', art:'chesque' },
  { p:byId('octa2'), name:'OctaStats', art:'octa' },
  { p:byId('tott'), name:'Tale of the Tape', art:'tape' },
  { p:byId('micro'), name:'Intermediate Microeconomics', art:'micro' },
];
const firstSentence = s => (s.match(/^.*?[.?](\s|$)/) || [s])[0].trim();
const shopTitle = i => { const {p, art, name} = SHOP[i];
  return `<div class="sh-page">
    <div class="sh-art"><div class="bn">${B[art]()}</div></div>
    <div class="sh-txt"><h2>${name}</h2><div class="yr">${p.year}</div><p>${firstSentence(p.body)}</p>
      <a class="sh-buy" href="${p.links[0][0]}" target="_blank" rel="noopener" data-focus>${p.links[0][1]}</a></div>
  </div>`; };

/* --- News Channel --- */
const newsList = tab => tab === 'blog'

    init(r){

let AC = null, noiseBuf = null, jingleGain = null;
function audio(){
  if (!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)();
    noiseBuf = AC.createBuffer(1, AC.sampleRate*.5, AC.sampleRate); const d = noiseBuf.getChannelData(0); for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1; }catch(e){} }

function tone(freq, dur=.06, type='sine', vol=.05, when=0, slide=0, dest){

  s.buffer = noiseBuf; f.type = 'bandpass'; f.Q.value = q;
  f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t+dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t+dur*.3); g.gain.exponentialRampToValueAtTime(.0001, t+dur);

}

  hover: () => { noise(.025, 3200, 2800, .05, 6); tone(1250,.04,'sine',.018); },
  select: () => { tone(520,.16,'sine',.05,0,1.9); tone(1600,.03,'triangle',.02); },
  back: () => tone(900,.15,'sine',.045,0,.55),
  page: (dir=1) => dir>0 ? noise(.26, 500, 2200, .05, 1.2) : noise(.26, 2200, 500, .05, 1.2),
  start: () => { tone(660,.25,'sine',.05,0,1.5); tone(1320,.2,'triangle',.02,.05); },
  press: () => tone(1500,.03,'triangle',.03),
};
const NOTE = n => { const m = /^([A-G])(#?)(\d)$/.exec(n); if (!m) return 0; const i = {C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]] + (m[2]?1:0); return 440*Math.pow(2,(i + (m[3]-4)*12 - 9)/12); };

  let t = 0; const beat = .16;

let musicOn = true, musicGain = null, musicT = null, musicNext = 0, musicStep = 0;
try{ musicOn = localStorage.getItem('wiiMusic') !== 'off'; }catch(e){}
const MUSIC = ['C4 E4 G4 B4 E5 B4 G4 E4','A3 C4 E4 G4 C5 G4 E4 C4','D4 F4 A4 C5 F5 C5 A4 F4','G3 B3 D4 F4 B4 F4 D4 B3'].map(b=>b.split(' ').map(NOTE));
function startMusic(){
  const ac = audio(); if (!ac || musicGain) return;
  const lp = ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = 1800;

  musicGain.connect(lp).connect(ac.destination);

  state = 'closing'; clearTimeout(pvTimer); stopJingle(); if (!silent) SFX.back(); duckMusic(false);
  preview.classList.remove('shown'); preview.classList.add('closing');
  const p = Math.floor(current / L.per); if (p !== page) setPage(p, true, true);
  placeZoom(tileRect(current), 13); camera(false);
  pvTimer = setTimeout(() => {
    preview.classList.remove('open','closing'); preview.inert = true; pvZoom.innerHTML=''; pvZoom.style.width='0';
    state = 'menu';
    if (lastKey && tiles[current]){ tiles[current].focus({preventScroll:true}); setHot(tiles[current], true); }
    else if (!coarse){ const el = document.elementFromPoint(mx, my); const h = el && el.closest('[data-hot]'); setHot(h && !h.disabled ? h : null, true); }
  }, 480);
}
function forceClosePreview(){
  clearTimeout(pvTimer); stopJingle(); camera(false);
  preview.classList.remove('open','shown','closing'); preview.inert = true; pvZoom.innerHTML=''; pvZoom.style.width='0';
  if (state!=='content') state = 'menu';
}
document.getElementById('pvMenu').onclick = closePreview;
document.getElementById('pvL').onclick = () => current>0 && openPreview(current-1, -1);
document.getElementById('pvR').onclick = () => current<CHANNELS.length-1 && openPreview(current+1, 1);
document.getElementById('pvStart').onclick = () => openContent(current);

/* --- channel content --- */
const content = document.getElementById('content');
let contentFrom = 'preview', curScreen = null;
function showScreen(key){
  const sc = SCREENS[key]; curScreen = sc;
  content.innerHTML = sc.html();
  content.setAttribute('aria-label', sc.label);
  content.querySelectorAll('[data-back]').forEach(b => b.onclick = closeContent);
  content.classList.remove('leaving'); content.classList.add('open');
  document.documentElement.classList.add('in-content');
  stage.inert = true;
  if (sc.init) sc.init(content);
  setTimeout(() => { const f = content.querySelector('[data-focus]') || content.querySelector('button:not([disabled]),a'); if (f) f.focus({preventScroll:true}); }, 50);
}
const fader = document.getElementById('fader');
function openContent(idx){
  if (state !== 'preview') return;
  const ch = CHANNELS[idx]; SFX.start(); stopJingle();
  state = 'entering'; contentFrom = 'preview';
  fader.classList.add('on');
  setTimeout(() => { state = 'content'; showScreen(ch.screen); fader.classList.remove('on'); unscroll(); }, 260);
}
// "Wii Menu" from inside a channel returns to the channel grid: fade to white,
// then zoom the banner back down into its tile (rebuilt for the current layout).
function closeContent(){
  if (state !== 'content') return;
  state = 'leaving'; SFX.back();
  content.querySelectorAll('video').forEach(v=>v.pause());
  fader.classList.add('on');
  setTimeout(() => {
    if (curScreen && curScreen.leave) curScreen.leave(); curScreen = null;
    content.classList.remove('open'); content.innerHTML = '';
    document.documentElement.classList.remove('in-content'); stage.inert = false;
    if (contentFrom === 'preview'){
      const ch = CHANNELS[current], p = Math.floor(current / L.per);
      if (p !== page) setPage(p, true, true);
      [pagesEl, bar, pvZoom].forEach(el => el.style.transition = 'none');
      pvZoom.innerHTML = `<div class="bn">${B[ch.art]()}</div>`;
      placeZoom(L.zoom, 0); camera(true, current);
      preview.classList.add('open'); preview.classList.remove('shown'); preview.inert = false;
      pvZoom.offsetWidth;
      [pagesEl, bar, pvZoom].forEach(el => el.style.transition = '');
      fader.classList.remove('on');
      state = 'preview';
      setTimeout(() => closePreview(true), 180);
    } else {
      fader.classList.remove('on');
      state = 'menu'; if (lastKey) document.getElementById('mailBtn').focus({preventScroll:true});
    }
  }, 260);
}

/* --- Wii button / SD / mail --- */
const sys = document.getElementById('sysmenu');
function openSys(){ if(state!=='menu') return; SFX.select(); sys.classList.add('open'); state='sys'; bubble.classList.remove('on'); setHot(null, true); bar.inert = true; pagesEl.style.visibility='hidden'; arrL.style.visibility = arrR.style.visibility = 'hidden'; if (lastKey) document.getElementById('sysData').focus({preventScroll:true}); }
function closeSys(){ if(state!=='sys') return; SFX.back(); sys.classList.remove('open'); state='menu'; bar.inert = false; pagesEl.style.visibility=''; arrL.style.visibility = arrR.style.visibility = ''; if (lastKey) document.getElementById('wiiBtn').focus({preventScroll:true}); }
const musicBtn = document.getElementById('musicToggle');
const paintMusic = () => musicBtn.textContent = 'Music: ' + (musicOn ? 'On' : 'Off');
paintMusic();
musicBtn.onclick = () => { musicOn = !musicOn; paintMusic(); try{ localStorage.setItem('wiiMusic', musicOn ? 'on' : 'off'); }catch(e){}
  if (musicGain) musicGain.gain.setTargetAtTime(musicOn ? 1 : 0, AC.currentTime, .1); else if (musicOn) startMusic(); };
document.getElementById('wiiBtn').onclick = openSys;
document.getElementById('sysClose').onclick = closeSys;
document.getElementById('sysData').onclick = () => window.open(RESUME,'_blank','noopener');
document.getElementById('sysSettings').onclick = () => { location.href = ASSET; };
document.getElementById('sdBtn').onclick = () => { if (state==='menu'){ SFX.select(); window.open(RESUME,'_blank','noopener'); } };
document.getElementById('mailBtn').onclick = () => { if(state!=='menu') return; SFX.select(); contentFrom='menu'; bubble.classList.remove('on');
  state='entering'; fader.classList.add('on'); setTimeout(() => { state='content'; showScreen('board'); fader.classList.remove('on'); }, 260); };

/* --- keyboard: arrows move the highlight, Enter/A = select, Esc/Backspace/B = back --- */
let kFocus = 0;
addEventListener('keydown', e => {
  const onControl = e.target.closest && e.target.closest('button,a,video,iframe,input');
  if (state === 'warning'){ if (['Enter',' ','a','A'].includes(e.key)){ e.preventDefault(); startMenu(); } return; }
  if (onControl && (e.key==='Enter' || e.key===' ')) return;  // native buttons handle their own activation
  const back = ['Escape','Backspace','b','B'].includes(e.key);
  if (state === 'menu'){
    if (hotEl && hotEl.dataset.idx) kFocus = +hotEl.dataset.idx;
    const per = L.per, cols = L.cols, s = kFocus % per, row = Math.floor(s/cols), col = s % cols;
    let n = null;
    if (!hotEl && e.key.startsWith('Arrow')) n = page*per;
    else if (e.key==='ArrowRight') n = col < cols-1 ? kFocus+1 : (page < PAGES-1 ? (page+1)*per + row*cols : null);
    else if (e.key==='ArrowLeft') n = col > 0 ? kFocus-1 : (page > 0 ? (page-1)*per + row*cols + cols-1 : null);
    else if (e.key==='ArrowDown') n = row < L.rows-1 ? kFocus+cols : null;
    else if (e.key==='ArrowUp') n = row > 0 ? kFocus-cols : null;
    else if (e.key==='Enter' || e.key==='a' || e.key==='A'){ if (hotEl && hotEl.classList.contains('ch')) openPreview(+hotEl.dataset.idx); return; }
    else return;
    e.preventDefault();
    if (n===null || n<0) return;
    if (n >= CHANNELS.length){ if (e.key==='ArrowDown') return; n = CHANNELS.length-1; }
    const p = Math.floor(n/per); if (p!==page) setPage(p);
    kFocus = n; tiles[n].focus({preventScroll:true}); setHot(tiles[n]);
  } else if (state === 'opening'){
    if (back){ e.preventDefault(); closePreview(); }
  } else if (state === 'preview'){
    if (back){ e.preventDefault(); closePreview(); }
    else if (e.key==='Enter' || e.key==='a' || e.key==='A') openContent(current);
    else if (e.key==='ArrowLeft' && current>0) openPreview(current-1,-1);
    else if (e.key==='ArrowRight' && current<CHANNELS.length-1) openPreview(current+1,1);
  } else if (state === 'content'){
    if (curScreen && curScreen.key && curScreen.key(e)){ e.preventDefault(); return; }
    if (e.key==='Escape' || ((e.key==='Backspace' || e.key==='b' || e.key==='B') && !onControl)){ e.preventDefault(); if (curScreen && curScreen.back && curScreen.back()) return; closeContent(); }
  } else if (state === 'sys'){
    if (back) return closeSys();
    const order = ['sysData','sysSettings','musicToggle','sysClose'].map(id=>document.getElementById(id));
    let i = order.indexOf(document.activeElement);
    const moves = { ArrowRight:1, ArrowLeft:-1, ArrowDown:2, ArrowUp:-2 };
    if (moves[e.key] === undefined) return;
    e.preventDefault(); i = i < 0 ? 0 : Math.max(0, Math.min(3, i + moves[e.key]));
    order[i].focus({preventScroll:true}); setHot(order[i], false);
  }
});

/* --- touch: swipe pages in the menu, channels in the preview --- */
let tsx = null, tsy = null;
addEventListener('touchstart', e => { tsx = e.touches[0].clientX; tsy = e.touches[0].clientY; }, {passive:true});
addEventListener('touchend', e => {
  if (tsx===null) return; const dx = e.changedTouches[0].clientX - tsx, dy = e.changedTouches[0].clientY - tsy; tsx = null;
  if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy)) return;
  if (state==='menu'){ const t = page + (dx<0?1:-1);
    if (t < 0 || t >= PAGES){ if (!reduced) track.animate([{transform:`translateX(${-page*L.W}px)`},{transform:`translateX(${-page*L.W + (dx<0?-30:30)}px)`},{transform:`translateX(${-page*L.W}px)`}],{duration:260,easing:'ease-out'}); }
    else setPage(t); }
  else if (state==='preview'){ const n = current + (dx<0?1:-1); if (n>=0 && n<CHANNELS.length) openPreview(n, dx<0?1:-1); }
});

/* =====================================================================
   LIVE DATA: forecast + poll
   ===================================================================== */
const WX_CODES = {0:'Clear',1:'Mostly Clear',2:'Partly Cloudy',3:'Cloudy',45:'Fog',48:'Fog',51:'Drizzle',53:'Drizzle',55:'Drizzle',61:'Rain',63:'Rain',65:'Heavy Rain',71:'Snow',73:'Snow',75:'Heavy Snow',80:'Showers',81:'Showers',82:'Showers',95:'Thunderstorms'};
const CITIES = [[42.36,-71.06]];   // Boston
let wxCache = null;
function fetchWeather(){
  if (wxCache) return wxCache;
  const lat = CITIES.map(c=>c[0]).join(','), lon = CITIES.map(c=>c[1]).join(',');
  wxCache = fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&temperature_unit=fahrenheit`)
    .then(r=>r.json()).then(d=>Array.isArray(d)?d:[d]).catch(()=>null);
  return wxCache;
}
function paintBannerTemp(){
  fetchWeather().then(d=>{ if(!d || !d[0] || !d[0].current) return; const t = Math.round(d[0].current.temperature_2m)+'°';
    document.querySelectorAll('.wx-temp').forEach(el=>{ el.textContent=t; el.style.display='block'; });
    document.querySelectorAll('.wx-alt').forEach(el=>{ el.style.display='none'; }); });
}
new MutationObserver(paintBannerTemp).observe(pvZoom,{childList:true});
// prefers-reduced-motion: CSS can't stop SMIL, so pause banner SVG animations directly
function pauseSMIL(root){ if (reduced) root.querySelectorAll('svg').forEach(s => s.pauseAnimations && s.pauseAnimations()); }
new MutationObserver(() => pauseSMIL(pvZoom)).observe(pvZoom,{childList:true});
pauseSMIL(document);

/* =====================================================================
   GO
   ===================================================================== */
relayout(true);
let rT; addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(()=>relayout(false), 80); });
</script>
