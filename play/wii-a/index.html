<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Zach Winship: Wii Menu</title>
<link rel="icon" href="../../images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@400;500;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<!--
  Layout reference: the bottom-bar silhouette, button geometry and page
  arrow are adapted from tobieche110/wii-portfolio (MIT License,
  Copyright (c) 2024 Tobias Echenique). Everything else is original.
  A fan homage to the Nintendo Wii Menu; not affiliated with Nintendo.
-->
<style>
:root{
  --cyan:#34beed;
  --cyan-text:#1f7fae;
  --gray-text:#6e7075;
  --ink:#4a4c50;
  --tile-border:#bdbec2;
  --font:'M PLUS 1p','Helvetica Neue',Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
.has-hand #root, .has-hand #root *{cursor:none !important}

/* Wii Menu background: near-white with faint horizontal lines */
.scan{background-color:#fafafa;background-image:repeating-linear-gradient(to bottom,#fafafa 0 2px,#f0f0f0 2px 4px)}

/* ================= STAGE ================= */
#root{position:fixed;inset:0;overflow:clip}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;overflow:clip}
#barExt{position:absolute;left:0;right:0;bottom:0;pointer-events:none;transition:transform .45s cubic-bezier(.45,0,.2,1);background:linear-gradient(#e6e7ea,#d8d9dd);border-top:3px solid var(--cyan);display:none}

/* ================= HEALTH & SAFETY ================= */
#warning{position:absolute;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;transition:opacity .6s ease;cursor:pointer}
#warning.gone{opacity:0;pointer-events:none}
.warn-title{display:flex;align-items:center;gap:18px;font-size:44px;font-weight:700;color:#222;letter-spacing:.5px;text-align:center}
.warn-title svg{width:56px;height:56px;flex:0 0 auto}
.warn-rule{width:min(880px,88%);height:3px;background:#222;margin:22px 0 34px}
.warn-body{width:min(880px,88%);font-size:30px;line-height:1.55;font-weight:500;color:#222}
.warn-body b{font-weight:700}
.warn-body .url{display:block;margin-top:26px}
.warn-press{margin-top:80px;font-size:30px;font-weight:500;color:#222;display:flex;align-items:center;gap:12px;opacity:0;animation:pressIn .6s ease 1.6s forwards}
.a-btn{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:50%;background:#222;color:#fff;font-size:24px;font-weight:700}
@keyframes pressIn{to{opacity:1}}
.portrait .warn-title{font-size:40px;flex-direction:column;gap:10px}
.portrait .warn-body{font-size:34px}

/* ================= MENU ================= */
#menu{position:absolute;inset:0;visibility:hidden}
#menu.boot{animation:fadeIn .8s ease both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
#pages{position:absolute;left:0;top:0;overflow:clip;transition:transform .5s cubic-bezier(.45,0,.2,1),opacity .45s ease}
#track{position:absolute;left:0;top:0;height:100%;display:flex;transition:transform .55s cubic-bezier(.45,0,.2,1)}
.page{position:relative;height:100%}
.grid{position:absolute;display:grid}

/* --- channel tile --- */
.ch{position:relative;border-radius:18px;background:#fff;border:2px solid var(--tile-border);padding:0;transition:border-color .1s,box-shadow .1s;outline:none}
.ch .bn{position:absolute;inset:4px;border-radius:13px;overflow:hidden}
.ch.hot,.ch:focus-visible{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 0 7px 2px rgba(52,190,237,.45);z-index:3}
.ch.empty{background:#ececee;border-color:#d2d3d6;cursor:default}
.ch.empty .bn{display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(to bottom,#efeff1 0 2px,#e6e6e9 2px 4px)}
.wii-mark{display:block;width:34%;max-width:96px}
/* 4:3 tiles: show the 16:9 banner letterboxed, like the real menu did */
.grid.narrow .ch .bn{top:50%;bottom:auto;aspect-ratio:16/9;transform:translateY(-50%);border-radius:8px}
.grid.narrow .ch.empty .bn{inset:4px;transform:none;aspect-ratio:auto}

/* hover label */
#bubble{position:absolute;z-index:40;pointer-events:none;padding:6px 28px;border-radius:999px;background:#fff;border:2px solid #b9babd;box-shadow:0 2px 4px rgba(0,0,0,.12);font-size:22px;font-weight:500;color:#4a4c50;white-space:nowrap;opacity:0;transform:translate(-50%,4px) scale(.92);transition:opacity .12s,transform .16s cubic-bezier(.3,1.6,.5,1)}
#bubble.on{opacity:1;transform:translate(-50%,0) scale(1);transition-delay:.18s}

/* page arrows */
.parrow{position:absolute;width:46px;height:82px;z-index:5;opacity:0;pointer-events:none;transition:opacity .25s}
.parrow svg{width:100%;height:100%;filter:drop-shadow(0 2px 2px rgba(20,60,120,.25))}
.parrow.show{opacity:1;pointer-events:auto}
.parrow.show svg{animation:arrowPulse 1.6s ease-in-out infinite}
.parrow.hot svg{animation:none;transform:scale(1.08)}
#arrL svg{transform:scaleX(-1)}
#arrL.show svg{animation:arrowPulseL 1.6s ease-in-out infinite}
#arrL.hot svg{animation:none;transform:scaleX(-1) scale(1.08)}
@keyframes arrowPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes arrowPulseL{0%,100%{transform:scaleX(-1) scale(1)}50%{transform:scaleX(-1) scale(1.07)}}

/* ================= BOTTOM BAR ================= */
#bar{position:absolute;left:0;height:200px;transition:transform .45s cubic-bezier(.45,0,.2,1)}
#bar svg.shape{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#clock{position:absolute;left:0;right:0;top:18px;display:flex;justify-content:center;height:62px}
#date{position:absolute;left:0;right:0;top:122px;text-align:center;font-size:30px;font-weight:500;color:#7d7f84;letter-spacing:.5px}
.round-btn{position:absolute;top:65px;width:132px;height:132px;border-radius:50%;outline:none}
.round-btn .face{position:absolute;inset:8px;border-radius:50%;background:linear-gradient(#f2f2f3,#d9d9db);border:4px solid var(--cyan);box-shadow:0 3px 4px rgba(0,0,0,.16);display:flex;align-items:center;justify-content:center;transition:box-shadow .12s}
.round-btn.hot .face,.round-btn:focus-visible .face{box-shadow:0 0 0 3px rgba(52,190,237,.35),0 0 8px 2px rgba(52,190,237,.45),0 3px 4px rgba(0,0,0,.16)}
#wiiBtn{left:58px}
#mailBtn{right:58px}
#wiiBtn .wii-mark{width:70px;max-width:none}
#mailBtn .env{fill:#a1a0a4;animation:mailGlow 2.4s ease-in-out infinite}
@keyframes mailGlow{0%,100%{fill:#a1a0a4}50%{fill:#34beed}}
#sdBtn{position:absolute;top:100px;width:50px;height:60px;border-radius:8px;outline:none;padding:2px}
#sdBtn svg{width:100%;height:100%}
#sdBtn.hot svg path:first-child,#sdBtn:focus-visible svg path:first-child{stroke:var(--cyan);stroke-width:3}

/* ================= CHANNEL PREVIEW ================= */
#preview{position:absolute;inset:0;z-index:50;pointer-events:none}
#preview.open{pointer-events:auto}
#preview.closing{pointer-events:none}
#pvZoom{position:absolute;overflow:hidden;background:#fff;transition:left .5s cubic-bezier(.45,0,.2,1),top .5s cubic-bezier(.45,0,.2,1),width .5s cubic-bezier(.45,0,.2,1),height .5s cubic-bezier(.45,0,.2,1),border-radius .5s}
#pvZoom .bn{position:absolute;inset:0}
#pvBottom{position:absolute;left:0;right:0;bottom:0;height:148px;display:flex;align-items:center;justify-content:center;gap:9%;transform:translateY(100%);transition:transform .35s cubic-bezier(.45,0,.2,1)}
#preview.shown #pvBottom{transform:none}
.pill{position:relative;width:400px;height:88px;border-radius:999px;background:linear-gradient(#fdfdfd,#e9e9eb);border:2px solid #c4c5c9;box-shadow:0 2px 3px rgba(0,0,0,.12);font-size:36px;font-weight:500;color:#55575c;transition:border-color .1s,box-shadow .1s;outline:none}
.pill.hot,.pill:focus-visible{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 0 8px 2px rgba(52,190,237,.45)}
.portrait .pill{width:300px;height:84px;font-size:32px}
.pvarrow{position:absolute;width:46px;height:82px;opacity:0;transition:opacity .25s;outline:none}
#preview.shown .pvarrow{opacity:1}
.pvarrow svg{width:100%;height:100%;filter:drop-shadow(0 2px 2px rgba(20,60,120,.25))}
.pvarrow.hot svg{transform:scale(1.08)}
#pvL svg{transform:scaleX(-1)}
#pvL.hot svg{transform:scaleX(-1) scale(1.08)}

/* ================= WII BUTTON SCREEN ================= */
#sysmenu{position:absolute;left:0;right:0;top:0;bottom:200px;z-index:55;display:none;flex-direction:column;align-items:center;justify-content:center;gap:36px}
#sysmenu.open{display:flex;animation:fadeIn .25s ease}
#sysmenu.open .sys-row{animation:sysIn .3s cubic-bezier(.45,0,.2,1)}
@keyframes sysIn{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sys-row{display:flex;gap:56px}
.portrait .sys-row{flex-direction:column;gap:30px}
.sysbtn{width:440px;height:200px;border-radius:24px;background:linear-gradient(#ffffff,#eeeff1);border:2px solid #c4c5c9;box-shadow:0 2px 4px rgba(0,0,0,.1);font-size:36px;font-weight:500;color:#55575c;transition:border-color .1s,box-shadow .1s;outline:none}
.sysbtn.hot,.sysbtn:focus-visible{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 0 8px 2px rgba(52,190,237,.45)}

/* ================= HAND CURSOR ================= */
#hand{position:fixed;left:0;top:0;z-index:9999;pointer-events:none;width:58px;height:70px;margin:-6px 0 0 -18px;display:none;transform-origin:18px 6px;will-change:transform}
.has-hand #hand{display:block}
.has-hand.in-content #hand{display:none}
#hand svg{width:100%;height:100%;transition:transform .08s;filter:drop-shadow(1px 2px 1px rgba(0,0,0,.28))}
#hand.press svg{transform:scale(.92)}

/* ================= CHANNEL CONTENT =================
   Each channel is its own full-screen app, styled after that real channel. */
#content{position:fixed;inset:0;z-index:70;display:none;cursor:auto;overflow:hidden;font-family:var(--font);color:var(--ink)}
#content.open{display:block;animation:fadeIn .3s ease}
#content.leaving{animation:fadeOut .2s ease forwards}
@keyframes fadeOut{to{opacity:0}}
#content [hidden]{display:none !important}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}
.scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.sel-text{user-select:text}
/* the system's grey pill button, as used across the real channels */
.wb{display:inline-flex;align-items:center;justify-content:center;min-width:clamp(130px,15vw,220px);height:clamp(46px,6.2vh,62px);padding:0 24px;border-radius:999px;background:linear-gradient(#fdfdfd,#e9e9eb);border:2px solid #c4c5c9;box-shadow:0 2px 3px rgba(0,0,0,.12);font-size:clamp(16px,2.2vh,22px);font-weight:500;color:#55575c;text-decoration:none;white-space:nowrap;outline:none;transition:border-color .1s,box-shadow .1s}
.wb:hover,.wb:focus-visible{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 0 8px 2px rgba(52,190,237,.45)}
.wbar{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:clamp(10px,3vw,40px);padding:14px 16px;padding-bottom:max(14px,env(safe-area-inset-bottom))}
.wbar.grey{background:linear-gradient(#ededef,#dcdde0);border-top:3px solid var(--cyan)}
@media (max-width:600px){.wb{min-width:0;flex:1 1 0;max-width:200px;padding:0 10px;font-size:16px}.wbar{gap:10px}}

/* --- Disc Channel: the paper's title screen --- */
.ds{background:radial-gradient(ellipse at 50% 42%,#ffffff 0,#f1f3f6 55%,#dde2e8 100%);align-items:center;justify-content:center;text-align:center;padding:16px}
.ds-disc{position:absolute;left:50%;top:44%;width:min(86vh,94vw);height:min(86vh,94vw);transform:translate(-50%,-50%);opacity:.5;pointer-events:none}
.ds-disc>div{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 30deg,#e9edf2,#ffffff,#e3e8ee,#fafbfc,#e9edf2);box-shadow:inset 0 0 0 2px #d3d8df;animation:spin 40s linear infinite}
.ds-disc>div::before{content:'';position:absolute;inset:36%;border-radius:50%;background:#f3f5f7;box-shadow:inset 0 0 0 2px #d3d8df}
.ds-disc>div::after{content:'';position:absolute;inset:45.5%;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 2px #d3d8df}
.ds-logo{position:relative;max-width:1040px}
.ds-kick{font-size:clamp(13px,2vh,19px);font-weight:700;color:#1f7fae;letter-spacing:.12em;text-transform:uppercase}
.ds-logo h1{font-size:min(7.4vh,8.6vw,76px);font-weight:800;color:#3d3f44;line-height:1.08;margin:2vh 0 1.4vh;letter-spacing:-.01em}
.ds-sub{font-size:min(3.2vh,5vw,30px);font-weight:500;color:#6e7075}
.ds-press{position:relative;margin-top:8vh;font-size:clamp(18px,3vh,28px);font-weight:500;color:#3d3f44;display:inline-flex;gap:12px;align-items:center;padding:8px 20px;border-radius:999px;animation:blink 1.6s ease-in-out infinite;outline:none}
.ds-press:focus-visible{box-shadow:0 0 0 2px var(--cyan)}
@keyframes blink{50%{opacity:.3}}
.ds-menu{position:relative;margin-top:6vh;display:flex;flex-direction:column;gap:clamp(10px,1.8vh,16px);align-items:center;animation:fadeIn .3s ease}
.ds-menu .wb{width:min(380px,80vw);max-width:none;flex:none}
.ds-credit{position:absolute;left:16px;right:16px;bottom:max(16px,env(safe-area-inset-bottom));font-size:clamp(12px,1.7vh,15px);color:#8a8c91}
.dlg{position:absolute;inset:0;z-index:5;background:rgba(236,238,241,.82);display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .2s ease}
.dlg-box{background:#fff;border:2px solid #c9cacd;border-radius:24px;box-shadow:0 8px 24px rgba(0,0,0,.12);max-width:780px;width:100%;max-height:100%;display:flex;flex-direction:column;overflow:hidden;text-align:left}
.dlg-box .scroll{padding:clamp(18px,3.4vh,34px) clamp(18px,3vw,36px);font-size:clamp(16px,2.3vh,20px);line-height:1.7;color:#4a4c50}
.dlg-box .wbar{border-top:2px solid #e3e4e7}

/* --- Mii Channel: the plaza --- */
.mp{background:linear-gradient(#ffffff 0,#f6f7f9 40%,#e4e8ec 100%)}
.mp-floor{position:absolute;left:-60%;right:-60%;bottom:0;height:62%;background-image:linear-gradient(rgba(70,90,110,.06) 2px,transparent 2px),linear-gradient(90deg,rgba(70,90,110,.06) 2px,transparent 2px);background-size:90px 90px;transform:perspective(520px) rotateX(62deg);transform-origin:50% 100%;pointer-events:none}
.mp-label{position:absolute;top:max(16px,env(safe-area-inset-top));left:clamp(16px,4vw,48px);font-size:clamp(17px,2.6vh,24px);font-weight:700;color:#a0a2a7;z-index:1}
.mp-main{position:relative;flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;align-items:center;justify-content:center;gap:clamp(24px,5vw,90px);padding:clamp(56px,9vh,90px) clamp(16px,4vw,60px) 16px}
.mp-mii{position:relative;flex:0 0 auto;width:min(30vw,50vh);text-align:center;animation:miiIn .5s cubic-bezier(.3,1.4,.5,1) both}
@keyframes miiIn{from{transform:translateY(24px);opacity:0}}
.mp-mii img{position:relative;z-index:1;display:block;width:100%;height:auto}
.mp-mii .shadow{position:absolute;left:4%;right:4%;bottom:-18px;height:36px;border-radius:50%;background:radial-gradient(closest-side,rgba(40,50,60,.22),transparent)}
.mp-tag{display:inline-block;margin-bottom:12px;padding:6px 24px;border-radius:999px;background:#fff;border:3px solid var(--cyan);box-shadow:0 2px 4px rgba(0,0,0,.1);font-weight:700;color:#4a4c50;font-size:clamp(16px,2.4vh,22px)}
.mp-card{position:relative;flex:0 1 560px;min-width:0;background:#fff;border:2px solid #cfd0d4;border-radius:22px;box-shadow:0 4px 14px rgba(0,0,0,.08);overflow:hidden;user-select:text}
.mp-card .hd{background:linear-gradient(#62cdf2,#34beed);color:#fff;font-weight:700;padding:10px 22px;font-size:clamp(16px,2.3vh,20px)}
.mp-card dl{display:grid;grid-template-columns:auto minmax(0,1fr)}
.mp-card dt,.mp-card dd{padding:clamp(9px,1.5vh,13px) 0;border-bottom:1px solid #e6e7ea;font-size:clamp(14px,2vh,17px);line-height:1.4}
.mp-card dt{padding-left:22px;padding-right:18px;color:#1f7fae;font-weight:700}
.mp-card dd{padding-right:22px;color:#4a4c50}
.mp-card p{padding:clamp(12px,2vh,18px) 22px;font-size:clamp(15px,2.1vh,18px);line-height:1.6;color:#55575c}
.mp .wbar{position:relative}
@media (max-width:760px){.mp-main{flex-direction:column;justify-content:flex-start}.mp-mii{width:min(56vw,30vh)}.mp-card{flex:none;width:100%}}

/* --- Photo Channel --- */
.ph{background-color:#eeeff1;background-image:repeating-linear-gradient(to bottom,#f3f3f5 0 2px,#ebebed 2px 4px)}
.ph-top{flex:0 0 auto;display:flex;align-items:baseline;gap:16px;padding:max(14px,env(safe-area-inset-top)) clamp(16px,4vw,48px) 6px}
.ph-top b{font-size:clamp(20px,3vh,28px);font-weight:700;color:#6e7075}
.ph-top span{font-size:clamp(14px,2vh,17px);color:#8a8c91}
.ph-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(14px,2.6vw,34px);padding:clamp(10px,2vh,20px) clamp(16px,5vw,90px) 24px;max-width:1240px;margin:0 auto}
.ph-th{position:relative;aspect-ratio:4/3;background:#fff;padding:clamp(4px,.6vw,8px);border-radius:4px;box-shadow:0 2px 6px rgba(0,0,0,.18);outline:none;transition:transform .15s,box-shadow .15s}
.ph-th:hover,.ph-th:focus-visible{transform:scale(1.04);box-shadow:0 0 0 3px var(--cyan),0 0 12px 3px rgba(52,190,237,.45)}
.ph-th img{display:block;width:100%;height:100%;object-fit:cover}
.ph-th .mv{position:absolute;right:10px;bottom:10px;padding:2px 10px;border-radius:4px;background:rgba(0,0,0,.65);color:#fff;font-size:12px;font-weight:700;letter-spacing:.04em}
.ph-card{container-type:size;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;padding:0 8%}
.ph-card b{font-size:7.6cqw;font-weight:700;line-height:1.2}
.ph-card span{margin-top:4cqh;font-size:4.6cqw;font-weight:500;opacity:.8}
.ph-zw{width:100%;height:100%;background:linear-gradient(#e8f3fa,#c7dff0)}
.ph-zw img{object-fit:contain;object-position:50% 100%}
.ph-view{position:absolute;inset:0;z-index:4;background:#000;display:flex;flex-direction:column;animation:fadeIn .25s ease}
.ph-stage{position:relative;flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;padding:clamp(10px,3vh,28px) clamp(56px,8vw,110px)}
.ph-stage>img,.ph-stage>video{max-width:100%;max-height:100%;object-fit:contain;display:block}
.ph-stage>.ph-zw{width:auto;height:100%;max-width:100%;aspect-ratio:1}
.ph-stage>.ph-card{width:min(100%,calc((100vh - 280px)*4/3));height:auto;aspect-ratio:4/3}
.ph-arr{position:absolute;top:50%;width:46px;height:82px;margin-top:-41px;outline:none}
.ph-arr svg{width:100%;height:100%;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
.ph-arr:hover svg,.ph-arr:focus-visible svg{transform:scale(1.1)}
.ph-arr.l{left:clamp(6px,2vw,30px)}.ph-arr.l svg{transform:scaleX(-1)}.ph-arr.l:hover svg,.ph-arr.l:focus-visible svg{transform:scaleX(-1) scale(1.1)}
.ph-arr.r{right:clamp(6px,2vw,30px)}
.ph-cap{flex:0 0 auto;background:rgba(34,35,38,.96);color:#eee;padding:14px clamp(16px,4vw,48px);user-select:text}
.ph-cap h2{font-size:clamp(17px,2.5vh,22px);font-weight:700}
.ph-cap .m{font-size:14px;color:#9fd9f2;margin-top:2px}
.ph-cap p{font-size:clamp(14px,1.9vh,16px);line-height:1.55;color:#c9c9cc;max-width:980px;margin-top:6px}
.ph-cap a{color:#9fd9f2;font-weight:500;margin-right:18px;font-size:15px}
.ph-view .wbar{background:#1a1b1d}
.ph-view.show .ph-cap p{display:none}
@media (max-width:640px){.ph-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.ph-stage{padding:12px 12px 64px}.ph-arr{top:auto;bottom:6px;margin-top:0;width:34px;height:56px}}

/* --- Wii Shop Channel --- */
.sh{background:linear-gradient(#ffffff 0,#eaf7fd 100%)}
.sh-head{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:clamp(54px,9vh,80px);padding:max(8px,env(safe-area-inset-top)) clamp(16px,4vw,48px) 8px;background:#fff;border-bottom:4px solid var(--cyan);box-shadow:0 2px 8px rgba(52,190,237,.18)}
.sh-head b{color:#1f9fd0;font-size:clamp(20px,3.4vh,30px);font-weight:800;letter-spacing:-.01em}
.sh-head span{color:#6aaecb;font-size:clamp(14px,2vh,18px);font-weight:700}
.sh-body{flex:1 1 auto;min-height:0;display:flex;gap:clamp(16px,2.6vw,40px);padding:clamp(14px,3vh,30px) clamp(16px,4vw,48px)}
.sh-list{flex:0 0 clamp(270px,30vw,400px);overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:10px;padding:3px}
.sh-item{display:flex;align-items:center;gap:14px;padding:8px;background:#fff;border:2px solid #c3e7f6;border-radius:14px;text-align:left;outline:none;transition:border-color .1s,box-shadow .1s}
.sh-item:hover,.sh-item:focus-visible{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 0 8px 2px rgba(52,190,237,.35)}
.sh-item.sel{border-color:var(--cyan);background:#e9f8fe}
.sh-item .bnw{position:relative;flex:0 0 clamp(88px,8vw,112px);aspect-ratio:16/9;border-radius:8px;overflow:hidden;border:1px solid #d5d6da}
.sh-item .bnw .bn{position:absolute;inset:0}
.sh-item b{display:block;font-size:clamp(15px,2vh,17px);color:#3a3c40;line-height:1.25}
.sh-item small{display:block;font-size:13px;color:#7c8a93;margin-top:2px}
.sh-detail{flex:1 1 auto;min-width:0;overflow-y:auto;overflow-x:hidden;background:#fff;border:2px solid #c3e7f6;border-radius:22px;padding:clamp(16px,3vh,30px) clamp(16px,2.4vw,34px);user-select:text}
.sh-top{display:flex;gap:clamp(16px,2.4vw,30px);align-items:flex-start}
.sh-banner{position:relative;flex:0 0 min(46%,460px);aspect-ratio:16/9;border-radius:14px;overflow:hidden;border:2px solid #d5d6da}
.sh-banner .bn{position:absolute;inset:0}
.sh-detail h2{font-size:clamp(21px,3.2vh,30px);color:#3a3c40;line-height:1.2;margin-bottom:10px}
.sh-info{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 16px;font-size:clamp(14px,1.9vh,16px)}
.sh-info dt{color:#1f9fd0;font-weight:700}
.sh-info dd{color:#4a4c50}
.sh-detail p{margin-top:16px;line-height:1.65;font-size:clamp(15px,2vh,17px);color:#55575c;max-width:820px}
.sh-detail p.note{font-size:14px;color:#7c7e83}
.sh-code{margin-top:14px;font:15px/1.5 ui-monospace,Menlo,Consolas,monospace;background:#f2f9fc;border:1px solid #c3e7f6;border-radius:8px;padding:10px 14px;user-select:all;overflow-x:auto}
.sh-dl{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}
.sh-dl .wb{min-width:150px;flex:none}
.sh-dl .wb.main{background:linear-gradient(#63d2f6,#28afe2);color:#fff;border-color:#1f9fd0;font-weight:700}
.sh .wbar{background:#fff;border-top:2px solid #c3e7f6}
#shBack{display:none}
@media (max-width:760px){.sh-list{flex:1 1 auto}.sh-detail{display:none}.sh.detail-on .sh-list{display:none}.sh.detail-on .sh-detail{display:block}.sh.detail-on #shBack{display:inline-flex}.sh-top{flex-direction:column}.sh-banner{flex:none;width:100%}.sh-item.sel{background:#fff;border-color:#c3e7f6}}

/* --- Forecast Channel --- */
.fc{background:linear-gradient(#2a86d3 0,#55afe9 42%,#b6e0f7 100%);color:#fff}
.fc-top{flex:0 0 auto;display:flex;align-items:center;gap:16px;padding:max(16px,env(safe-area-inset-top)) clamp(16px,4vw,48px) 0}
.fc-city{background:linear-gradient(#ffffff,#e2eff8);color:#2a6fa8;font-weight:800;font-size:clamp(22px,4vh,38px);padding:4px 30px;border-radius:14px;box-shadow:0 3px 10px rgba(0,40,90,.25)}
.fc-top span{font-size:clamp(15px,2.2vh,20px);font-weight:500;text-shadow:0 1px 3px rgba(0,40,90,.35)}
.fc-main{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;gap:clamp(14px,3vw,36px);padding:clamp(14px,3vh,32px) clamp(16px,4vw,48px)}
.fc-panel{background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.6);border-radius:24px;padding:clamp(16px,3vh,30px) clamp(16px,2.4vw,32px);box-shadow:0 4px 16px rgba(0,40,90,.12)}
.fc-now{flex:0 0 clamp(220px,26vw,340px);text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center}
.fc-lbl{font-size:clamp(16px,2.4vh,22px);font-weight:700;text-shadow:0 1px 3px rgba(0,40,90,.3)}
.fc-temp{font-size:clamp(64px,15vh,150px);font-weight:700;line-height:1.05;margin:1vh 0;text-shadow:0 3px 10px rgba(0,40,90,.3)}
.fc-cond{font-size:clamp(17px,2.6vh,24px);font-weight:500}
.fc-src{font-size:13px;opacity:.8;margin-top:2vh}
.fc-paper{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;justify-content:center;user-select:text}
.fc-paper h2{font-size:clamp(22px,3.8vh,36px);line-height:1.2;margin:1vh 0;text-shadow:0 2px 6px rgba(0,40,90,.25)}
.fc-paper .m{font-size:clamp(14px,2vh,17px);font-weight:500;opacity:.9}
.fc-paper p{font-size:clamp(15px,2.2vh,20px);line-height:1.6;margin-top:1.6vh;max-width:760px;text-shadow:0 1px 2px rgba(0,40,90,.25)}
.fc-tick,.nw-tick{flex:0 0 auto;position:relative;height:40px;overflow:hidden;container-type:inline-size}
.fc-tick{background:rgba(12,56,110,.55)}
.fc-tick div,.nw-tick div{position:absolute;top:0;left:0;height:100%;display:flex;align-items:center;white-space:nowrap;font-size:16px;font-weight:500;color:#fff;animation:ticker 32s linear infinite}
.fc .wbar{background:linear-gradient(#ffffff,#e1edf6)}
@media (max-width:760px){.fc-main{flex-direction:column}.fc-now{flex:none}.fc-temp{font-size:72px}}

/* --- News Channel --- */
.nw{background:#f2f3f5}
.nw-head{flex:0 0 auto;display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:max(14px,env(safe-area-inset-top)) clamp(16px,4vw,48px) 0;background:#fff}
.nw-head b{font-size:clamp(22px,3.6vh,32px);color:#24507d;font-weight:800}
.nw-head span{font-size:clamp(14px,2vh,17px);color:#7d8590;font-weight:500}
.nw-tabs{flex:0 0 auto;display:flex;gap:6px;padding:12px clamp(16px,4vw,48px) 0;background:#fff;border-bottom:4px solid #24507d}
.nw-tab{padding:9px 26px;border-radius:12px 12px 0 0;background:#e1e6ed;color:#56677c;font-weight:700;font-size:clamp(15px,2vh,17px);outline:none}
.nw-tab:hover,.nw-tab:focus-visible{background:#cfe9f6;color:#24507d}
.nw-tab.on{background:#24507d;color:#fff}
.nw-list{list-style:none;max-width:1040px;margin:0 auto;padding:6px clamp(16px,4vw,48px) 20px}
.nw-list li>*{display:block;width:100%;text-align:left;padding:clamp(12px,2vh,18px) 12px;border-bottom:1px solid #d7dbe1;border-left:4px solid transparent;outline:none}
.nw-list button:hover,.nw-list button:focus-visible{background:#fff;border-left-color:var(--cyan)}
.nw-list .src{font-size:13px;font-weight:700;color:#3a75ad;text-transform:uppercase;letter-spacing:.06em}
.nw-list .hl{display:block;font-size:clamp(17px,2.6vh,23px);font-weight:700;color:#2f3237;margin-top:3px;line-height:1.3}
.nw-note{max-width:1040px;margin:0 auto;padding:16px clamp(16px,4vw,48px) 0;font-size:15px;color:#6d747d}
.nw-art{max-width:900px;margin:clamp(14px,3vh,34px) auto;padding:clamp(18px,3.6vh,40px) clamp(18px,3vw,44px);background:#fff;border:1px solid #d7dbe1;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.06);user-select:text;animation:fadeIn .2s ease}
.nw-art .src{font-size:14px;font-weight:700;color:#3a75ad;text-transform:uppercase;letter-spacing:.06em}
.nw-art h2{font-size:clamp(24px,4.4vh,40px);line-height:1.2;color:#2f3237;margin:10px 0 18px}
.nw-art p{font-size:clamp(15px,2.2vh,19px);line-height:1.65;color:#4f555c}
.nw-art .wb{margin-top:24px;flex:none}
.nw-wrap{margin:0 16px}
.nw-tick{background:#24507d}
.nw .wbar{background:linear-gradient(#ffffff,#e6e9ee)}

/* --- Internet Channel --- */
.in{background:#d6d7da}
.in-addr{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:max(10px,env(safe-area-inset-top)) clamp(12px,3vw,32px) 10px;background:linear-gradient(#f6f6f7,#dadbde);border-bottom:1px solid #b4b5b9}
.in-addr .fld{flex:1 1 auto;min-width:0;height:40px;border-radius:20px;background:#fff;border:2px solid #9cc6df;display:flex;align-items:center;padding:0 18px;font-size:16px;color:#3a3c40;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.in-addr .ld{flex:0 0 auto;font-size:14px;font-weight:700;color:#6e7075}
.in-page{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;background:#fff;user-select:text}
.pg{max-width:800px;margin:0 auto;padding:22px 20px 44px;font:16px/1.45 Arial,Helvetica,sans-serif;color:#000}
.pg.big{font-size:20px}
.pg h1{font-size:2em;margin:.2em 0 .3em}
.pg h2{font-size:1.3em;margin:1.3em 0 .4em;border-bottom:1px solid #999;padding-bottom:2px}
.pg h3{font-size:1em;margin:.9em 0 .1em}
.pg p{margin:.35em 0}
.pg ul{margin:.3em 0 .3em 1.4em}
.pg a{color:#0000ee;text-decoration:underline}
.pg .w{color:#555}
.in-tools{flex:0 0 auto;display:flex;justify-content:center;gap:clamp(6px,1.6vw,18px);padding:10px 8px;padding-bottom:max(10px,env(safe-area-inset-bottom));background:linear-gradient(#ececee,#c9cacd);border-top:1px solid #a9aaae}
.in-tb{flex:0 1 110px;min-width:0;height:clamp(48px,7vh,62px);border-radius:14px;background:linear-gradient(#ffffff,#e4e4e6);border:2px solid #b2b3b7;box-shadow:0 1px 2px rgba(0,0,0,.1);font-size:clamp(12px,1.8vh,15px);font-weight:700;color:#55575c;outline:none;transition:border-color .1s,box-shadow .1s}
.in-tb:hover:not([disabled]),.in-tb:focus-visible{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 0 8px 2px rgba(52,190,237,.4)}
.in-tb[disabled]{opacity:.42;cursor:default}
.in-tb.wm{flex-basis:130px}
.in-fav{position:absolute;right:clamp(10px,3vw,40px);bottom:calc(clamp(48px,7vh,62px) + 30px);z-index:3;width:min(380px,calc(100vw - 20px));background:#fff;border:2px solid #b2b3b7;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.2);overflow:hidden;animation:fadeIn .15s ease}
.in-fav b{display:block;padding:10px 18px;background:#eceef1;font-size:15px;color:#55575c}
.in-fav a{display:block;padding:11px 18px;border-top:1px solid #e3e4e7;color:#0000ee;font:16px Arial,Helvetica,sans-serif;outline:none}
.in-fav a:hover,.in-fav a:focus-visible{background:#e9f8fe}

/* --- Everybody Votes Channel --- */
.ev{background:linear-gradient(#ffffff,#eaedf1)}
.ev-head{flex:0 0 auto;padding:max(16px,env(safe-area-inset-top)) clamp(16px,4vw,48px) 0;font-size:clamp(17px,2.6vh,24px);font-weight:700;color:#a0a2a7}
.ev-main{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(18px,4vh,40px);padding:16px clamp(16px,4vw,48px)}
.ev-q{width:min(920px,100%);background:#fff;border:3px solid #cdd0d4;border-radius:26px;box-shadow:0 4px 14px rgba(0,0,0,.08);overflow:hidden;text-align:center}
.ev-q .lbl{background:#eef0f3;padding:8px;font-size:clamp(13px,1.8vh,16px);color:#8a8c91;font-weight:700;letter-spacing:.06em}
.ev-q h2{font-size:clamp(22px,4.2vh,38px);color:#3a3c40;line-height:1.3;padding:clamp(16px,3vh,28px) 22px}
.ev-ans{display:flex;gap:clamp(14px,3vw,44px);width:min(920px,100%)}
.ev-a{flex:1 1 0;min-height:clamp(96px,17vh,170px);border-radius:26px;color:#fff;font-size:clamp(20px,3.6vh,34px);font-weight:700;border:4px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.15);outline:none;transition:transform .12s,opacity .3s,box-shadow .1s;text-shadow:0 1px 3px rgba(0,0,0,.2)}
.ev-a.r{background:linear-gradient(#f47d74,#d8463d)}
.ev-a.b{background:linear-gradient(#62c8f2,#2a9dd5)}
.ev-a:hover:not([disabled]),.ev-a:focus-visible{transform:scale(1.03);box-shadow:0 0 0 4px var(--cyan),0 4px 12px rgba(0,0,0,.18)}
.ev-a[disabled]{cursor:default}
.ev-a.dim{opacity:.35}
.ev-res{width:min(920px,100%);background:#fff;border:2px solid #d5d6da;border-radius:22px;padding:clamp(16px,3vh,28px) clamp(18px,3vw,34px);user-select:text;animation:fadeIn .3s ease}
.ev-res .lbl{font-size:14px;color:#8a8c91;font-weight:700;letter-spacing:.06em}
.ev-res h3{font-size:clamp(19px,3vh,26px);color:#3a3c40;line-height:1.3;margin:6px 0 10px}
.ev-res p{font-size:clamp(15px,2.1vh,18px);line-height:1.6;color:#55575c}
.ev .wbar{background:linear-gradient(#ededef,#dcdde0)}
@media (max-width:600px){.ev-ans{flex-direction:column}.ev-a{min-height:72px}}

/* --- Wii Message Board --- */
.mb{background:#f4f2e8}
.mb-head{flex:0 0 auto;display:flex;align-items:baseline;gap:14px;padding:max(16px,env(safe-area-inset-top)) clamp(16px,4vw,48px) 12px;background:linear-gradient(#ffffff,#f4f2e8)}
.mb-head .d{font-size:clamp(40px,8vh,64px);font-weight:700;color:#45474c;line-height:1}
.mb-head .m{font-size:clamp(17px,2.6vh,22px);font-weight:500;color:var(--gray-text)}
.mb .scroll{padding:8px clamp(16px,4vw,48px) 24px}
.letter{max-width:760px;margin:0 auto;background:#fffef6;border:2px solid #e3dfc4;border-radius:14px;padding:clamp(18px,3vh,30px) clamp(18px,3vw,34px);background-image:repeating-linear-gradient(transparent 0 33px,#ece8cf 33px 34px);background-position:0 18px;box-shadow:0 3px 10px rgba(0,0,0,.06);user-select:text}
.letter p{font-size:18px;line-height:34px;color:#4a4c50}
.letter .from{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.letter .from .av{flex:0 0 auto;width:52px;height:52px;border-radius:12px;border:2px solid #d5d6da;background:linear-gradient(#e8f3fa,#c7dff0);overflow:hidden}
.letter .from .av img{width:100%;height:100%;object-fit:cover;object-position:50% 10%}
.letter .from b{font-size:18px}
.letter a{color:#1f7fae;font-weight:700}
.mb .wbar{background:linear-gradient(#ededef,#dcdde0);border-top:3px solid var(--cyan)}

/* ================= BANNERS =================
   Drawn in container units (cqw/cqh) so the same markup works on a tile,
   in the zoomed preview and in the content header. `.pv` elements only
   show when the banner is large (preview). */
.bn{container-type:size;font-family:var(--font)}
.bn *{position:absolute}
.bn .t{left:0;right:0;text-align:center;font-weight:700;white-space:nowrap}
.bn .pv{display:none}
#pvZoom .bn .pv{display:block}
.bn .tl{inset:0}
#pvZoom .bn .tl{display:none}
#pvZoom .bn .tick{font-size:5cqh !important}
#pvZoom .bn .tickbar,#pvZoom .bn .capbar{height:15% !important}
#pvZoom .bn .cap{font-size:8cqh !important}
.bn .safe{left:50%;top:50%;width:min(100cqw,177.78cqh);height:min(100cqh,56.25cqw);transform:translate(-50%,-50%);container-type:size}
/* phone preview: keep text clear of the side arrows */
.portrait #pvZoom .bn .safe{width:84cqw;height:47.25cqw}
#fader{position:fixed;inset:0;z-index:75;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s ease}
#fader.on{opacity:1;pointer-events:auto}
#musicToggle{width:300px;height:80px;font-size:28px}
.spin{animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ticker{from{transform:translateX(100cqw)}to{transform:translateX(-100%)}}
/* light gloss over each tile, like the real menu's glassy channel frames */
.ch:not(.empty) .bn::after{content:'';position:absolute;left:0;right:0;top:0;height:48%;background:linear-gradient(rgba(255,255,255,.28),rgba(255,255,255,0));pointer-events:none}

@media (prefers-reduced-motion:reduce){
  .bn *,.spin,.ch.hot,.parrow.show svg,#mailBtn .env,.warn-press{animation:none !important}
  .warn-press{opacity:1}
  #track,#pvZoom,#pages,#bar,#barExt,#pvBottom,#fader,#bubble{transition-duration:.01s !important}
  #sysmenu .sys-row,#content,#menu.boot,.ds-disc>div,.ds-press,.mp-mii,.fc-tick div,.nw-tick div{animation:none !important}
}
</style>

<script>

const coarse = matchMedia('(pointer:coarse)').matches;

/* An upright, rounded "Wii" wordmark drawn as strokes (not the official logo file). */

/* =====================================================================
   BANNERS: each tile copies the look of the real channel's tile: its own
   name, its own colors, one moving element. `.pv` lines only show in the
   zoomed preview, `.tl` lines only on the small tile.

const PV = (txt, css) => `<div class="pv" style="${css};font-size:5.6cqh;font-weight:500;line-height:1.45">${txt}</div>`;
const BN = (bg, inner) => `${bg}<div class="safe">${inner}</div>`;
const LIGHT = '<div style="inset:0;background:linear-gradient(#ffffff,#eceff3)"></div>';
const LABEL = (txt, css) => `<div style="${css};font-weight:800;color:#8b8d92;letter-spacing:-.15cqh;line-height:1.05">${txt}</div>`;
const nber = byId('nber');
const B = {
disc: () => BN(LIGHT, `
  <div class="spin" style="left:7cqw;top:13cqh;width:74cqh;height:74cqh;border-radius:50%;background:conic-gradient(from 30deg,#dfe4ec,#fbfcfd,#d8dee7,#f6f7fa,#dfe4ec);box-shadow:inset 0 0 0 .5cqh #b9bec7,0 1cqh 2cqh rgba(0,0,0,.08)">

    <div style="position:static;margin-top:3cqh;font-size:9cqh;font-weight:800;color:#45474c;line-height:1.1">${nber.title.split(': ')[0]}</div>
    <div style="position:static;margin-top:3cqh;font-size:5.6cqh;font-weight:500;color:#6e7075">${nber.title.split(': ')[1]}</div>

mii: () => BN('<div style="inset:0;background:linear-gradient(#ffffff,#eef1f4)"></div>', `
  <img src="${ZW_IMG}" alt="" style="right:6cqw;bottom:0;height:70cqh;width:auto">

shop: () => BN('<div style="inset:0;background:linear-gradient(#ffffff,#def3fc)"></div>', `

  <div class="wx-temp" style="left:8cqw;top:23cqh;font-size:28cqh;font-weight:700;color:#fff;line-height:1;display:none;text-shadow:0 .5cqh 1.4cqh rgba(0,40,90,.3)"></div>

news: () => BN(`<div style="inset:0;background:linear-gradient(#ffffff,#e9edf3)"></div>
  <div class="tickbar" style="left:0;right:0;bottom:0;height:24%;background:#24507d;overflow:hidden">

  </div>`, `
  <div class="t" style="top:20cqh;font-size:17cqh;font-weight:800;color:#24507d;letter-spacing:-.3cqh">News Channel</div>
  ${PV('Coverage of the congestion pricing and EMS paper', 'left:0;right:0;text-align:center;top:52cqh;color:#3a75ad')}`),

internet: () => BN(LIGHT, `
  <div class="t" style="top:16cqh;font-size:14cqh;font-weight:800;color:#8b8d92;letter-spacing:-.2cqh">Internet Channel</div>
  <div style="left:14cqw;right:14cqw;top:50cqh;height:19cqh;border-radius:10cqh;background:#fff;border:.7cqh solid #7fbfe4;box-shadow:0 .6cqh 1.4cqh rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center">
    <span style="position:static;font-size:8cqh;font-weight:500;color:#5f6166">zwinship.github.io</span>
  </div>
  ${PV('Résumé, links and contact', 'left:0;right:0;text-align:center;top:76cqh;color:#1f7fae')}`),

votes: () => BN('<div style="inset:0;background:linear-gradient(#ffffff,#eceef2)"></div>', `
  <div class="t" style="top:13cqh;font-size:10.5cqh;font-weight:800;color:#8b8d92;letter-spacing:-.2cqh">Everybody Votes Channel</div>
  <div style="left:13cqw;width:34cqw;top:40cqh;height:20cqh;border-radius:7cqh;background:linear-gradient(#62c8f2,#2a9dd5);border:.8cqh solid #fff;box-shadow:0 .5cqh 1.2cqh rgba(0,0,0,.15)"></div>
  <div style="right:13cqw;width:34cqw;top:40cqh;height:20cqh;border-radius:7cqh;background:linear-gradient(#f47d74,#d8463d);border:.8cqh solid #fff;box-shadow:0 .5cqh 1.2cqh rgba(0,0,0,.15)"></div>
  ${PV('Do election polls predict the result, or change it?', 'left:0;right:0;text-align:center;top:72cqh;color:#55575c')}`),

/* title banners for the Shop Channel's title pages */
rd2dnet: () => BN(LIGHT, `
  <svg viewBox="0 0 100 60" style="left:5cqw;top:14cqh;width:84cqh;height:72cqh">
    <g stroke="#c3c5ca" stroke-width="1.1" fill="none"><path d="M5 10 L95 30 M5 25 L95 45 M5 40 L95 60 M18 0 L6 60 M42 0 L30 60 M66 0 L54 60 M90 0 L78 60"/></g>
    <path d="M0 30 L100 52" stroke="#34beed" stroke-width="2.6" fill="none"/>
  </svg>
  <div style="left:58cqw;top:36cqh;font-size:15cqh;font-weight:800;color:#5f6166;letter-spacing:-.2cqh">rd2dnet</div>`),
chesque: () => BN('<div style="inset:0;background:linear-gradient(#262c40,#171b28)"></div>', `
  <div class="t" style="top:36cqh;font-size:22cqh;font-weight:800;color:#f1e9d8;letter-spacing:-.3cqh">Ches<span style="position:static;color:#f0a53a">que</span></div>`),
octa: () => BN('<div style="inset:0;background:linear-gradient(#26262a,#141416)"></div>', `
  <div style="left:50%;top:14cqh;width:72cqh;height:72cqh;margin-left:-36cqh;clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%);background:#d63434">
    <div style="inset:3cqh;clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%);background:#1b1b1e"></div>
    <div style="left:0;right:0;top:20cqh;text-align:center;font-size:13cqh;font-weight:800;color:#fff">OCTA</div>
    <div style="left:0;right:0;top:36cqh;text-align:center;font-size:13cqh;font-weight:800;color:#e04646">STATS</div>
  </div>`),
tape: () => BN('<div style="inset:0;background:linear-gradient(90deg,#c43c3c 0 50%,#2f66b8 50%)"></div>', `
  <div class="t" style="top:22cqh;font-size:15cqh;font-weight:800;color:#fff">Tale of the Tape</div>
  <div style="left:50%;top:50cqh;width:28cqh;height:28cqh;margin-left:-14cqh;border-radius:50%;background:#fff;text-align:center;line-height:28cqh;font-size:12cqh;font-weight:800;color:#333">VS</div>`),
micro: () => BN('<div style="inset:0;background:linear-gradient(#ffffff,#eef3f7)"></div>', `
  <div class="t" style="top:24cqh;font-size:8cqh;font-weight:700;color:#1f7fae;letter-spacing:.6cqh">INTERMEDIATE</div>
  <div class="t" style="top:36cqh;font-size:17cqh;font-weight:800;color:#45474c;letter-spacing:-.3cqh">Microeconomics</div>
  <div style="left:50%;top:66cqh;width:30cqh;height:1.2cqh;margin-left:-15cqh;border-radius:1cqh;background:#34beed"></div>`),
};

/* =====================================================================
   CHANNEL SCREENS
   ===================================================================== */
const plain = s => String(s || '').replace(/\s*·\s*/g, ', ');
const EXT = (href, label, cls='wb') => `<a class="${cls}" href="${href}" ${href.startsWith('mailto:')?'':'target="_blank" rel="noopener"'}>${label}</a>`;
const BACK = (label='Wii Menu') => `<button class="wb" data-back>${label}</button>`;
const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => [...root.querySelectorAll(sel)];
const today = () => { const d = new Date(); return `${d.toLocaleDateString('en-US',{weekday:'long'})}, ${d.toLocaleDateString('en-US',{month:'long',day:'numeric'})}`; };
// move focus through a list of elements with the arrow keys
function arrowNav(e, els, cols=1){
  const i = els.indexOf(document.activeElement); if (i < 0) return false;
  const step = {ArrowRight:1, ArrowLeft:-1, ArrowDown:cols, ArrowUp:-cols}[e.key];
  if (!step) return false;
  const n = i + step; if (n < 0 || n >= els.length) return true;
  els[n].focus(); SFX.hover(); return true;
}

/* --- Photo Channel items: real photos first, then title cards --- */
const led = byId('mbta-led');
const PHOTOS = [
  { kind:'img', src:LED_IMG, title:led.title, meta:'2026, in progress', body:led.body, links:led.links },
  { kind:'video', src:ASSET+led.video, poster:LED_IMG, title:'MBTA LED map build', meta:'Build video', body:'', links:led.links },
  { kind:'zw', title:PROFILE.name, meta:PROFILE.now, body:PROFILE.lede, links:[[LINKEDIN,'LinkedIn'],[GITHUB,'GitHub']] },
  ...[['cz','#2b5d8f'],['ozone','#3f7f58'],['llm','#5b4bb0']].map(([id,bg]) => { const p = byId(id);
    return { kind:'card', bg, title:p.title, meta:plain(p.meta) + (p.soon ? ', in progress' : ', ' + p.year), body:p.body, links:p.links, year:p.soon ? 'In progress' : p.year }; }),
];
const photoHTML = (p, big) => p.kind==='card' ? `<div class="ph-card" style="background:${p.bg}"><b>${p.title}</b><span>${p.year}</span></div>`
  : p.kind==='zw' ? `<div class="ph-zw"><img src="${ZW_IMG}" alt="Photo of ${PROFILE.name}" style="width:100%;height:100%;object-fit:contain;object-position:50% 100%"></div>`
  : p.kind==='video' ? (big ? `<video src="${p.src}" poster="${p.poster}" controls playsinline preload="none"></video>` : `<img src="${p.poster}" alt="${p.title}" loading="lazy"><span class="mv">MOVIE</span>`)
  : `<img src="${p.src}" alt="${p.title}"${big?'':' loading="lazy"'}>`;

/* --- Shop titles --- */
const SHOP = [
  { p:SOFTWARE, name:'rd2dnet', art:'rd2dnet' },
  { p:byId('chesque'), name:'Chesque', art:'chesque' },
  { p:byId('octa2'), name:'OctaStats', art:'octa' },
  { p:byId('tott'), name:'Tale of the Tape', art:'tape' },
  { p:byId('micro'), name:'Intermediate Microeconomics', art:'micro' },
];
const shopDetail = i => { const {p, art} = SHOP[i], cat = plain(p.meta).split(', ');
  return `<div class="sh-top"><div class="sh-banner"><div class="bn">${B[art]()}</div></div>
    <div style="min-width:0"><h2>${p.title}</h2><dl class="sh-info">
      <dt>Released</dt><dd>${p.year}</dd><dt>Category</dt><dd>${cat[0]}</dd><dt>Also</dt><dd>${cat.slice(1).join(', ')}</dd>
      ${p.badge ? `<dt>Version</dt><dd>${p.badge}</dd>` : ''}</dl></div></div>
    <p>${p.body}</p>
    ${p === SOFTWARE ? `<pre class="sh-code">pip install rd2dnet</pre><p class="note">${p.status}</p><p class="note">${p.credit}</p>` : ''}
    <div class="sh-dl">${p.links.map((l,k)=>EXT(l[0], l[1], k ? 'wb' : 'wb main')).join('')}</div>`; };

/* --- News Channel --- */
const newsList = tab => tab === 'blog'
  ? `<p class="nw-note">${BLOG_STATUS}.</p><ul class="nw-list">${BLOG.map(b=>`<li><div><span class="src">${plain(b[2])}</span><span class="hl">${b[0]}</span><span style="font-size:14px;color:#7d8590">${plain(b[1])}</span></div></li>`).join('')}</ul>`
  : `<ul class="nw-list">${MEDIA.map((m,i)=>`<li><button data-art="${i}"><span class="src">${m[1]}</span><span class="hl">${m[2]}</span></button></li>`).join('')}</ul>`;
const newsArticle = i => { const m = MEDIA[i]; return `<div class="nw-wrap"><article class="nw-art"><div class="src">${m[1]}</div><h2>${m[2]}</h2>
  <p>Coverage of the working paper "${nber.title}" (${nber.badge.replace('WP','Working Paper')}).</p>
  <div style="display:flex;flex-wrap:wrap;gap:12px">${EXT(m[0], 'Read the Article')}<button class="wb" id="nwList">Back</button></div></article></div>`; };

/* --- Internet Channel page: a plain HTML résumé --- */
const resumePage = () => `<div class="pg" id="pg">
  <h1>${PROFILE.name}</h1>
  <p>${PROFILE.lede}</p>
  <p><a href="mailto:${EMAIL}">${EMAIL}</a> | <a href="${GITHUB}" target="_blank" rel="noopener">GitHub</a> | <a href="${LINKEDIN}" target="_blank" rel="noopener">LinkedIn</a> | <a href="${RESUME}" target="_blank" rel="noopener">Résumé (PDF)</a></p>
  <h2>Education</h2>
  ${PROFILE.education.map(e=>`<h3>${e.degree}, ${e.school}</h3><p class="w">${e.when}</p><p>${e.note}</p>`).join('')}
  <h2>Experience</h2>
  ${EXPERIENCE.map(e=>`<h3>${e.role}</h3><p class="w">${e.org}, ${e.when}</p><p>${e.body}${e.links ? ' ' + e.links.map(l=>`<a href="${l[0]}" target="_blank" rel="noopener">${l[1]}</a>`).join(' ') : ''}</p>`).join('')}
  <h2>Research</h2>
  <ul>${RESEARCH.map(r=>`<li>${r.links.length ? `<a href="${r.links[0][0]}" target="_blank" rel="noopener">${r.title}</a>` : r.title} (${r.soon ? 'in progress' : r.year})</li>`).join('')}</ul>
  <h2>Skills</h2>
  <p>${PROFILE.skills.join(', ')}</p>
</div>`;
const FAVORITES = [[ASSET,'zwinship.github.io'],[RESUME,'Résumé (PDF)'],[ASSET+'about_me/transcript.pdf','Transcript (PDF)'],[GITHUB,'GitHub'],[LINKEDIN,'LinkedIn'],['mailto:'+EMAIL,EMAIL]];

const SCREENS = {
  disc: { label:'Disc Channel', html: () => { const [t1, t2] = nber.title.split(': '); return `<div class="scr ds">
      <div class="ds-disc" aria-hidden="true"><div></div></div>
      <div class="ds-logo"><div class="ds-kick">${nber.badge.replace('WP','Working Paper')}</div><h1>${t1}</h1><div class="ds-sub">${t2}</div></div>
      <button class="ds-press" id="dsPress" data-focus>Press <span class="a-btn">A</span></button>
      <div class="ds-menu" id="dsMenu" hidden>
        ${EXT(nber.links[0][0], 'Read the Paper')}
        <button class="wb" id="dsAbs">Summary</button>
        ${BACK()}
      </div>
      <div class="ds-credit">With ${nber.coauthors}</div>
      <div class="dlg" id="dsDlg" hidden><div class="dlg-box" role="dialog" aria-label="Summary"><div class="scroll sel-text"><p>${nber.body}</p></div><div class="wbar"><button class="wb" id="dsOk">OK</button></div></div></div>
    </div>`; },
    init(r){
      const press = $('#dsPress', r), menu = $('#dsMenu', r), dlg = $('#dsDlg', r);
      press.onclick = () => { SFX.start(); press.hidden = true; menu.hidden = false; menu.firstElementChild.focus({preventScroll:true}); };
      $('#dsAbs', r).onclick = () => { SFX.select(); dlg.hidden = false; $('#dsOk', r).focus(); };
      $('#dsOk', r).onclick = () => { SFX.back(); dlg.hidden = true; $('#dsAbs', r).focus(); };
      r.querySelector('.ds').addEventListener('click', e => { if (!press.hidden && !e.target.closest('button,a')) press.click(); });
    },
    key(e){ const r = content;
      if (!$('#dsDlg', r).hidden) return false;
      if ($('#dsMenu', r).hidden) return false;
      return ['ArrowUp','ArrowDown'].includes(e.key) && arrowNav(e, $$('#dsMenu .wb', r));
    },
    back(){ const dlg = $('#dsDlg', content); if (!dlg.hidden){ $('#dsOk', content).click(); return true; } return false; },
  },

  mii: { label:'Mii Channel', html: () => { const [ms, bs] = PROFILE.education; return `<div class="scr mp">
      <div class="mp-floor" aria-hidden="true"></div>
      <div class="mp-label">Mii Plaza</div>
      <div class="mp-main">
        <div class="mp-mii"><div class="mp-tag">${PROFILE.name.split(' ')[0]}</div><img src="${ZW_IMG}" alt="Photo of ${PROFILE.name}"><div class="shadow"></div></div>
        <div class="mp-card"><div class="hd">Mii Profile</div><dl>
          <dt>Name</dt><dd>${PROFILE.name}</dd>
          <dt>Now</dt><dd>${ms.degree}, ${ms.school}, to May 2027</dd>
          <dt>Before</dt><dd>${bs.degree}, ${bs.school}, 2026</dd>
          <dt>Tools</dt><dd>${PROFILE.skills.slice(0,5).join(', ')}</dd></dl>
          <p>${PROFILE.lede}</p></div>
      </div>
      <div class="wbar">${BACK()}${EXT(RESUME,'Résumé')}${EXT('mailto:'+EMAIL,'Email')}</div>
    </div>`; },
    key(e){ return ['ArrowLeft','ArrowRight'].includes(e.key) && arrowNav(e, $$('.wbar .wb', content)); } },

  photo: { label:'Photo Channel', html: () => `<div class="scr ph">

/* =====================================================================
   SOUND: all synthesized
   ===================================================================== */
let AC = null, noiseBuf = null, jingleGain = null;
function audio(){
  if (!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)();
    noiseBuf = AC.createBuffer(1, AC.sampleRate*.5, AC.sampleRate); const d = noiseBuf.getChannelData(0); for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1; }catch(e){} }
  return AC;
}
function tone(freq, dur=.06, type='sine', vol=.05, when=0, slide=0, dest){
  const ac = audio(); if(!ac) return;
  const t = ac.currentTime + when, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(freq*slide, t+dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t+.008); g.gain.exponentialRampToValueAtTime(.0001, t+dur);
  o.connect(g).connect(dest||ac.destination); o.start(t); o.stop(t+dur+.02);
}
function noise(dur, f0, f1, vol=.03, q=2){
  const ac = audio(); if(!ac) return;
  const t = ac.currentTime, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = noiseBuf; f.type = 'bandpass'; f.Q.value = q;
  f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t+dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t+dur*.3); g.gain.exponentialRampToValueAtTime(.0001, t+dur);
  s.connect(f).connect(g).connect(ac.destination); s.start(t); s.stop(t+dur+.02);
}
const SFX = {
  hover: () => { noise(.025, 3200, 2800, .05, 6); tone(1250,.04,'sine',.018); },
  select: () => { tone(520,.16,'sine',.05,0,1.9); tone(1600,.03,'triangle',.02); },
  back: () => tone(900,.15,'sine',.045,0,.55),
  page: (dir=1) => dir>0 ? noise(.26, 500, 2200, .05, 1.2) : noise(.26, 2200, 500, .05, 1.2),
  start: () => { tone(660,.25,'sine',.05,0,1.5); tone(1320,.2,'triangle',.02,.05); },
  press: () => tone(1500,.03,'triangle',.03),
};
const NOTE = n => { const m = /^([A-G])(#?)(\d)$/.exec(n); if (!m) return 0; const i = {C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]] + (m[2]?1:0); return 440*Math.pow(2,(i + (m[3]-4)*12 - 9)/12); };
function playJingle(str){
  const ac = audio(); if (!ac || !str) return;
  stopJingle();
  jingleGain = ac.createGain(); jingleGain.gain.value = 1; jingleGain.connect(ac.destination);
  let t = 0; const beat = .16;
  str.split(' ').forEach(n => { if (n !== '.'){ const f = NOTE(n); tone(f, .3, 'triangle', .045, t, 0, jingleGain); tone(f*2, .12, 'sine', .012, t, 0, jingleGain); } t += beat; });
}
/* Original ambient menu loop (not Nintendo's music): a soft Cmaj7, Am7, Dm7, G7
   arpeggio through a lowpass, scheduled a little ahead of the audio clock. */
let musicOn = true, musicGain = null, musicT = null, musicNext = 0, musicStep = 0;
try{ musicOn = localStorage.getItem('wiiMusic') !== 'off'; }catch(e){}
const MUSIC = ['C4 E4 G4 B4 E5 B4 G4 E4','A3 C4 E4 G4 C5 G4 E4 C4','D4 F4 A4 C5 F5 C5 A4 F4','G3 B3 D4 F4 B4 F4 D4 B3'].map(b=>b.split(' ').map(NOTE));
function startMusic(){
  const ac = audio(); if (!ac || musicGain) return;
  const lp = ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = 1800;
  musicGain = ac.createGain(); musicGain.gain.value = musicOn ? 1 : 0;
  musicGain.connect(lp).connect(ac.destination);
  musicNext = ac.currentTime + .1;
  musicT = setInterval(() => {
    while (musicNext < ac.currentTime + .6){
      const bar = MUSIC[Math.floor(musicStep/8) % 4], f = bar[musicStep % 8];
      const when = musicNext - ac.currentTime;
      tone(f, .55, 'triangle', .016, when, 0, musicGain);
      if (musicStep % 8 === 0) tone(f/2, 1.6, 'sine', .014, when, 0, musicGain);
      musicNext += .3; musicStep++;
    }
  }, 150);
}
function duckMusic(down){ if (!musicGain || !musicOn) return; musicGain.gain.setTargetAtTime(down ? 0 : 1, AC.currentTime, .12); }
function stopJingle(){ if (jingleGain){ try{ jingleGain.gain.setTargetAtTime(0, AC.currentTime, .05); }catch(e){} jingleGain = null; } }

/* =====================================================================
   LAYOUT: 16:9 (and wider), 4:3, and a portrait mode for phones.
   ===================================================================== */
let L;
function computeLayout(){
  const a = innerWidth / innerHeight;
  if (a < .9){
    const W = 720, H = Math.round(Math.max(1100, Math.min(1700, W/a))), cols = 2, rows = 4, gx = 16, gy = 18, mx = 60;
    const tw = (W - 2*mx - gx*(cols-1)) / cols, th = 188, gridH = rows*th + (rows-1)*gy;
    const barTop = H - 200, top = Math.max(60, Math.round((barTop - gridH)*.5));
    const zh = 470;
    return { mode:'portrait', W, H, cols, rows, per:cols*rows, gx, gy, mx, tw, th, top, barTop, s:190, zoom:{l:0,t:Math.round((H-148-zh)/2),w:720,h:zh}, arrowY:top + gridH/2 - 41 };
  }
  const H = 720, W = Math.round(Math.max(960, Math.min(1280, H*a)));
  const cols = 4, rows = 3, gx = 14, gy = 12, mx = Math.round(W*.074);
  const tw = (W - 2*mx - gx*(cols-1)) / cols, th = 156;
  return { mode:'land', W, H, cols, rows, per:cols*rows, gx, gy, mx, tw, th, top:40, barTop:H-200, s:204, zoom:{l:0,t:0,w:W,h:572}, arrowY:40 + (rows*th+(rows-1)*gy)/2 - 41 };
}

function barPath(W, s){

  const X = v => (s + v*k).toFixed(1), R = v => (W - s - v*k).toFixed(1);
  return `M0,44 H${s} C${X(32)},44 ${X(71)},44 ${X(118)},84 C${X(150)},112 ${X(180)},130 ${X(238)},130 H${R(238)} C${R(180)},130 ${R(150)},112 ${R(118)},84 C${R(71)},44 ${R(32)},44 ${W-s},44 H${W}`;
}
function buildBar(){

    <path fill="url(#barG)" d="${top} V200 H0 Z"/>
    <path fill="none" stroke="#34beed" stroke-width="3" d="${top}"/>
    <path filter="url(#tabShadow)" fill="url(#tabG)" d="M0,61 H118 C155,61 186,92 186,130 C186,168 155,199 118,199 H0 Z"/>
    <path filter="url(#tabShadow)" fill="url(#tabG)" d="M${W},61 H${W-118} C${W-155},61 ${W-186},92 ${W-186},130 C${W-186},168 ${W-155},199 ${W-118},199 H${W} Z"/>`;
  Object.assign(bar.style, { top:L.barTop+'px', width:W+'px' });
  const sd = document.getElementById('sdBtn');
  sd.style.left = '212px'; sd.style.display = L.mode==='portrait' ? 'none' : '';

function buildGrid(){

  for (let p=0; p<PAGES; p++){
    const pg = document.createElement('div'); pg.className='page'; pg.style.width = L.W+'px';
    const grid = document.createElement('div'); grid.className = 'grid' + (L.tw/L.th < 1.6 ? ' narrow' : '');
    Object.assign(grid.style, { left:L.mx+'px', top:L.top+'px', gridTemplateColumns:`repeat(${L.cols},${L.tw}px)`, gridTemplateRows:`repeat(${L.rows},${L.th}px)`, gap:`${L.gy}px ${L.gx}px` });
    for (let s=0; s<L.per; s++){

let kFocus = 0;

  if (onControl && (e.key==='Enter' || e.key===' ')) return;  // native buttons handle their own activation
  const back = ['Escape','Backspace','b','B'].includes(e.key);
  if (state === 'menu'){
    if (hotEl && hotEl.dataset.idx) kFocus = +hotEl.dataset.idx;
    const per = L.per, cols = L.cols, s = kFocus % per, row = Math.floor(s/cols), col = s % cols;
    let n = null;

    else if (e.key==='ArrowDown') n = row < L.rows-1 ? kFocus+cols : null;
    else if (e.key==='ArrowUp') n = row > 0 ? kFocus-cols : null;
