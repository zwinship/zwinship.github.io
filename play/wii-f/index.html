<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Zach Winship: Wii Menu</title>
<link rel="icon" href="../../images/logo.png">
<!--
  Layout reference: the bottom-bar silhouette, button geometry and page
  arrow are adapted from tobieche110/wii-portfolio (MIT License,
  Copyright (c) 2024 Tobias Echenique). Everything else is original.
  A fan homage to the Nintendo Wii Menu; not affiliated with Nintendo.
-->
<style>
:root{
  --cyan:#34beed;
  --cyan-text:#1f7fae;
  --gray-text:#6e7075;
  --ink:#4a4c50;
  --tile-border:#bdbec2;
  --font:'Arial Rounded MT Bold','Varela Round','Nunito','M PLUS Rounded 1c','Helvetica Rounded','Helvetica Neue',Arial,sans-serif;
  --logo:'Arial Black','Arial Rounded MT Bold','Inter','Helvetica Neue',Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
.has-hand #root, .has-hand #root *{cursor:none !important}

/* Wii Menu background: near-white with faint horizontal lines */
.scan{background-color:#fafafa;background-image:repeating-linear-gradient(to bottom,#fafafa 0 2px,#f0f0f0 2px 4px)}

/* ================= STAGE ================= */
#root{position:fixed;inset:0;overflow:clip}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;overflow:clip}
#barExt{position:absolute;left:0;right:0;bottom:0;pointer-events:none;transition:transform .45s cubic-bezier(.45,0,.2,1);background:linear-gradient(#e6e7ea,#d8d9dd);border-top:3px solid var(--cyan);display:none}
/* ================= MENU ================= */
#menu{position:absolute;inset:0;visibility:hidden}
#menu.boot{animation:fadeIn .8s ease both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
#pages{position:absolute;left:0;top:0;overflow:clip;transition:transform .5s cubic-bezier(.45,0,.2,1),opacity .45s ease}
#track{position:absolute;left:0;top:0;height:100%;display:flex;transition:transform .55s cubic-bezier(.45,0,.2,1)}
.page{position:relative;height:100%}
.grid{position:absolute;display:grid}

/* --- channel tile --- */
.ch{position:relative;border-radius:18px;background:#fff;border:2px solid var(--tile-border);padding:0;transition:border-color .1s,box-shadow .1s;outline:none}
.ch .bn{position:absolute;inset:4px;border-radius:13px;overflow:hidden}
.ch.hot,.ch:focus-visible{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 0 7px 2px rgba(52,190,237,.45);z-index:3}
.ch.empty{background:#ececee;border-color:#d2d3d6;cursor:default}
.ch.empty .bn{display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(to bottom,#efeff1 0 2px,#e6e6e9 2px 4px)}
.wii-mark{display:block;width:34%;max-width:96px}
/* 4:3 tiles: show the 16:9 banner letterboxed, like the real menu did */
.grid.narrow .ch .bn{top:50%;bottom:auto;aspect-ratio:16/9;transform:translateY(-50%);border-radius:8px}
.grid.narrow .ch.empty .bn{inset:4px;transform:none;aspect-ratio:auto}

/* hover label */
#bubble{position:absolute;z-index:40;pointer-events:none;padding:6px 28px;border-radius:999px;background:#fff;border:2px solid #b9babd;box-shadow:0 2px 4px rgba(0,0,0,.12);font-size:22px;font-weight:500;color:#4a4c50;white-space:nowrap;opacity:0;transform:translate(-50%,4px) scale(.92);transition:opacity .12s,transform .16s cubic-bezier(.3,1.6,.5,1)}
#bubble.on{opacity:1;transform:translate(-50%,0) scale(1);transition-delay:.18s}

/* page arrows */
.parrow{position:absolute;width:46px;height:82px;z-index:5;opacity:0;pointer-events:none;transition:opacity .25s}
.parrow svg{width:100%;height:100%;filter:drop-shadow(0 2px 2px rgba(20,60,120,.25))}
.parrow.show{opacity:1;pointer-events:auto}
.parrow.show svg{animation:arrowPulse 1.6s ease-in-out infinite}
.parrow.hot svg{animation:none;transform:scale(1.08)}
#arrL svg{transform:scaleX(-1)}
#arrL.show svg{animation:arrowPulseL 1.6s ease-in-out infinite}
#arrL.hot svg{animation:none;transform:scaleX(-1) scale(1.08)}
@keyframes arrowPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes arrowPulseL{0%,100%{transform:scaleX(-1) scale(1)}50%{transform:scaleX(-1) scale(1.07)}}

/* ================= BOTTOM BAR ================= */
#bar{position:absolute;left:0;height:200px;transition:transform .45s cubic-bezier(.45,0,.2,1)}
#bar svg.shape{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#clock{position:absolute;left:0;right:0;top:18px;display:flex;justify-content:center;height:62px}
#date{position:absolute;left:0;right:0;top:122px;text-align:center;font-size:30px;font-weight:500;color:#7d7f84;letter-spacing:.5px}
.round-btn{position:absolute;top:65px;width:132px;height:132px;border-radius:50%;outline:none}
.round-btn .face{position:absolute;inset:8px;border-radius:50%;background:linear-gradient(#f2f2f3,#d9d9db);border:4px solid var(--cyan);box-shadow:0 3px 4px rgba(0,0,0,.16);display:flex;align-items:center;justify-content:center;transition:box-shadow .12s}
.round-btn.hot .face,.round-btn:focus-visible .face{box-shadow:0 0 0 3px rgba(52,190,237,.35),0 0 8px 2px rgba(52,190,237,.45),0 3px 4px rgba(0,0,0,.16)}
#wiiBtn{left:58px}
#mailBtn{right:58px}
#wiiBtn .wii-mark{width:70px;max-width:none}
#mailBtn .env{fill:#a1a0a4;animation:mailGlow 2.4s ease-in-out infinite}
@keyframes mailGlow{0%,100%{fill:#a1a0a4}50%{fill:#34beed}}
#sdBtn{position:absolute;top:100px;width:50px;height:60px;border-radius:8px;outline:none;padding:2px}
#sdBtn svg{width:100%;height:100%}
#sdBtn.hot svg path:first-child,#sdBtn:focus-visible svg path:first-child{stroke:var(--cyan);stroke-width:3}

/* ================= CHANNEL PREVIEW ================= */
#preview{position:absolute;inset:0;z-index:50;pointer-events:none}
#preview.open{pointer-events:auto}
#preview.closing{pointer-events:none}
#pvZoom{position:absolute;overflow:hidden;background:#fff;transition:left .5s cubic-bezier(.45,0,.2,1),top .5s cubic-bezier(.45,0,.2,1),width .5s cubic-bezier(.45,0,.2,1),height .5s cubic-bezier(.45,0,.2,1),border-radius .5s}
#pvZoom .bn{position:absolute;inset:0}
#pvBottom{position:absolute;left:0;right:0;bottom:0;height:148px;display:flex;align-items:center;justify-content:center;gap:9%;transform:translateY(100%);transition:transform .35s cubic-bezier(.45,0,.2,1)}
#preview.shown #pvBottom{transform:none}
.pill{position:relative;width:400px;height:88px;border-radius:999px;background:linear-gradient(#fdfdfd,#e9e9eb);border:2px solid #c4c5c9;box-shadow:0 2px 3px rgba(0,0,0,.12);font-size:36px;font-weight:500;color:#55575c;transition:border-color .1s,box-shadow .1s;outline:none}
.pill.hot,.pill:focus-visible{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 0 8px 2px rgba(52,190,237,.45)}
.portrait .pill{width:300px;height:84px;font-size:32px}
.pvarrow{position:absolute;width:46px;height:82px;opacity:0;transition:opacity .25s;outline:none}
#preview.shown .pvarrow{opacity:1}
.pvarrow svg{width:100%;height:100%;filter:drop-shadow(0 2px 2px rgba(20,60,120,.25))}
.pvarrow.hot svg{transform:scale(1.08)}
#pvL svg{transform:scaleX(-1)}
#pvL.hot svg{transform:scaleX(-1) scale(1.08)}

/* ================= WII BUTTON SCREEN ================= */
#sysmenu{position:absolute;left:0;right:0;top:0;bottom:200px;z-index:55;display:none;flex-direction:column;align-items:center;justify-content:center;gap:36px}
#sysmenu.open{display:flex;animation:fadeIn .25s ease}
#sysmenu.open .sys-row{animation:sysIn .3s cubic-bezier(.45,0,.2,1)}
@keyframes sysIn{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sys-row{display:flex;gap:56px}
.portrait .sys-row{flex-direction:column;gap:30px}
.sysbtn{width:440px;height:200px;border-radius:24px;background:linear-gradient(#ffffff,#eeeff1);border:2px solid #c4c5c9;box-shadow:0 2px 4px rgba(0,0,0,.1);font-size:36px;font-weight:500;color:#55575c;transition:border-color .1s,box-shadow .1s;outline:none}
.sysbtn.hot,.sysbtn:focus-visible{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 0 8px 2px rgba(52,190,237,.45)}

/* ================= HAND CURSOR ================= */
#hand{position:fixed;left:0;top:0;z-index:9999;pointer-events:none;width:58px;height:70px;margin:-6px 0 0 -18px;display:none;transform-origin:18px 6px;will-change:transform}
.has-hand #hand{display:block}
.has-hand.in-content #hand{display:none}
#hand svg{width:100%;height:100%;transition:transform .08s;filter:drop-shadow(1px 2px 1px rgba(0,0,0,.28))}
#hand.press svg{transform:scale(.92)}

/* ================= CHANNEL CONTENT =================
   Each channel is its own full-screen app, styled after that real channel. */
#content{position:fixed;inset:0;z-index:70;display:none;cursor:auto;overflow:hidden;font-family:var(--font);color:var(--ink)}
#content.open{display:block;animation:fadeIn .3s ease}
#content.leaving{animation:fadeOut .2s ease forwards}
@keyframes fadeOut{to{opacity:0}}
#content [hidden]{display:none !important}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}
.scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.sel-text{user-select:text}
/* the system's grey pill button, as used across the real channels */
.wb{display:inline-flex;align-items:center;justify-content:center;min-width:clamp(130px,15vw,220px);height:clamp(46px,6.2vh,62px);padding:0 24px;border-radius:999px;background:linear-gradient(#fdfdfd,#e9e9eb);border:2px solid #c4c5c9;box-shadow:0 2px 3px rgba(0,0,0,.12);font-size:clamp(16px,2.2vh,22px);font-weight:500;color:#55575c;text-decoration:none;white-space:nowrap;outline:none;transition:border-color .1s,box-shadow .1s}
.wb:hover,.wb:focus-visible{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 0 8px 2px rgba(52,190,237,.45)}
.wbar{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:clamp(10px,3vw,40px);padding:14px 16px;padding-bottom:max(14px,env(safe-area-inset-bottom))}
.wbar.grey{background:linear-gradient(#ededef,#dcdde0);border-top:3px solid var(--cyan)}
@media (max-width:600px){.wb{min-width:0;flex:1 1 0;max-width:200px;padding:0 10px;font-size:16px}.wbar{gap:10px}}
/* --- Mii Channel: the plaza --- */
.mp{background:linear-gradient(#ffffff 0,#f6f7f9 40%,#e4e8ec 100%)}
.mp-floor{position:absolute;left:-60%;right:-60%;bottom:0;height:70%;background-image:linear-gradient(rgba(70,90,110,.1) 2px,transparent 2px),linear-gradient(90deg,rgba(70,90,110,.1) 2px,transparent 2px);background-size:110px 110px;transform:perspective(700px) rotateX(55deg);transform-origin:50% 100%;pointer-events:none}
.mp-main{position:relative;flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;align-items:flex-end;justify-content:center;gap:clamp(10px,2vw,30px);padding:clamp(40px,7vh,80px) clamp(16px,4vw,60px) 0}
.mp-mii{position:relative;flex:0 0 auto;width:min(34vw,58vh);margin-bottom:-2px;animation:miiIn .5s cubic-bezier(.3,1.4,.5,1) both}
@keyframes miiIn{from{transform:translateY(24px);opacity:0}}
.mp-mii img{display:block;width:100%;height:auto}
/* the speech balloon a selected Mii gets */
.mp-say{position:relative;align-self:center;flex:0 1 520px;min-width:0;margin-bottom:8vh;background:#fff;border:3px solid #c9cbcf;border-radius:34px;box-shadow:0 4px 12px rgba(0,0,0,.08);padding:clamp(18px,3.4vh,32px) clamp(20px,2.6vw,36px);user-select:text;animation:fadeIn .4s ease .25s both}
.mp-say::before{content:'';position:absolute;left:-17px;top:46%;width:28px;height:28px;background:#fff;border-left:3px solid #c9cbcf;border-bottom:3px solid #c9cbcf;transform:rotate(45deg);border-radius:0 0 0 6px}
.mp-say h2{font-size:clamp(24px,4.4vh,40px);font-weight:800;color:#3f4146;line-height:1.1}
.mp-say p{font-size:clamp(16px,2.4vh,21px);line-height:1.55;color:#55575c;margin-top:1.4vh}
.mp-say .now{font-size:clamp(14px,2vh,17px);color:#1f7fae;font-weight:500}
.mp .wbar{position:relative;z-index:2}
@media (max-width:760px){.mp-main{flex-direction:column;align-items:center;justify-content:flex-start;padding-bottom:16px}.mp-mii{width:min(56vw,30vh);margin-bottom:0;-webkit-mask-image:linear-gradient(#000 80%,transparent);mask-image:linear-gradient(#000 80%,transparent)}.mp-say{flex:none;width:100%;margin:14px 0 0;align-self:stretch}.mp-say::before{left:50%;top:-17px;margin-left:-14px;transform:rotate(135deg)}}
/* --- Wii Message Board --- */
.mb{background:#f4f2e8}
.mb-head{flex:0 0 auto;display:flex;align-items:baseline;gap:14px;padding:max(16px,env(safe-area-inset-top)) clamp(16px,4vw,48px) 12px;background:linear-gradient(#ffffff,#f4f2e8)}
.mb-head .d{font-size:clamp(40px,8vh,64px);font-weight:700;color:#45474c;line-height:1}
.mb-head .m{font-size:clamp(17px,2.6vh,22px);font-weight:500;color:var(--gray-text)}
.mb .scroll{padding:8px clamp(16px,4vw,48px) 24px}
.letter{max-width:760px;margin:0 auto;background:#fffef6;border:2px solid #e3dfc4;border-radius:14px;padding:clamp(18px,3vh,30px) clamp(18px,3vw,34px);background-image:repeating-linear-gradient(transparent 0 33px,#ece8cf 33px 34px);background-position:0 18px;box-shadow:0 3px 10px rgba(0,0,0,.06);user-select:text}
.letter p{font-size:18px;line-height:34px;color:#4a4c50}
.letter .from{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.letter .from .av{flex:0 0 auto;width:52px;height:52px;border-radius:12px;border:2px solid #d5d6da;background:linear-gradient(#e8f3fa,#c7dff0);overflow:hidden}
.letter .from .av img{width:100%;height:100%;object-fit:cover;object-position:50% 10%}
.letter .from b{font-size:18px}
.letter a{color:#1f7fae;font-weight:700}
.mb .wbar{background:linear-gradient(#ededef,#dcdde0);border-top:3px solid var(--cyan)}
/* ================= BANNERS =================
   Each banner is a scene (fills the frame) plus a logo layer that always
   stays whole. Both use a 160 x 90 drawing so the same art works on a
   tile, in the zoomed preview and on a title screen. */
.bn{container-type:size;font-family:var(--font)}
.bn>.bg,.bn>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.bn .lt{font-family:var(--logo);font-weight:900}
#fader{position:fixed;inset:0;z-index:75;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s ease}
#fader.on{opacity:1;pointer-events:auto}
#musicToggle{width:300px;height:80px;font-size:28px}
/* light gloss over each tile, like the real menu's glassy channel frames */
.ch:not(.empty) .bn::after{content:'';position:absolute;left:0;right:0;top:0;height:48%;background:linear-gradient(rgba(255,255,255,.26),rgba(255,255,255,0));pointer-events:none}

/* ================= GAME TITLE SCREEN ================= */
.gm{background:#000;color:#fff}
.gm-art{position:absolute;inset:0}
.gm-art .bn{position:absolute;inset:0}
.gm-art::after{content:'';position:absolute;left:0;right:0;bottom:0;height:46%;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.5));pointer-events:none;transition:opacity .3s}
.gm-ui{position:absolute;left:16px;right:16px;bottom:max(7vh,calc(16px + env(safe-area-inset-bottom)));display:flex;flex-direction:column;align-items:center}
.gm-press{display:inline-flex;align-items:center;gap:.4em;padding:10px 24px;border-radius:999px;font-family:var(--logo);font-weight:900;font-size:clamp(24px,4.6vh,44px);color:#fff;letter-spacing:.02em;text-shadow:0 0 2px #000,0 2px 0 #000,0 0 10px rgba(0,0,0,.6);animation:blink 1.1s steps(1,end) infinite;outline:none}
.gm-press:focus-visible{box-shadow:0 0 0 3px rgba(255,255,255,.7)}
.gm-press .a-btn{width:1.3em;height:1.3em;font-size:.9em;background:#fff;color:#222;text-shadow:none;box-shadow:0 0 0 3px rgba(0,0,0,.55)}
@keyframes blink{0%{opacity:1}60%{opacity:0}}
.a-btn{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;font-weight:700}
.gm-menu{display:flex;flex-direction:column;gap:clamp(10px,1.8vh,18px);align-items:center;animation:menuIn .25s cubic-bezier(.3,1.3,.5,1)}
@keyframes menuIn{from{opacity:0;transform:translateY(16px)}}
.gm-opt{display:flex;align-items:center;justify-content:center;width:min(440px,84vw);height:clamp(54px,8.6vh,84px);border-radius:999px;background:linear-gradient(#ffffff,#e9eaee);border:4px solid var(--acc,#34beed);box-shadow:0 4px 0 rgba(0,0,0,.25),0 6px 14px rgba(0,0,0,.25);font-family:var(--logo);font-weight:900;font-size:clamp(22px,3.7vh,36px);color:#2b2d31;text-decoration:none;outline:none;transition:transform .1s,box-shadow .1s}
.gm-opt:hover,.gm-opt:focus-visible{transform:scale(1.04);box-shadow:0 0 0 4px #fff,0 0 0 8px var(--acc,#34beed),0 6px 16px rgba(0,0,0,.3)}
.gm-box{position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.5);animation:fadeIn .2s ease}
.gm-card{width:min(780px,100%);background:#fff;border:5px solid var(--acc,#34beed);border-radius:30px;padding:clamp(22px,4.4vh,44px) clamp(20px,3.4vw,44px) clamp(18px,3.4vh,32px);text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.35);user-select:text}
.gm-card p{font-size:clamp(18px,2.9vh,27px);line-height:1.45;font-weight:700;color:#3a3c41}
.gm-card p+p{margin-top:1.2em;color:#6a6c72;font-weight:500}
.gm-card .gm-opt{margin:clamp(20px,4vh,36px) auto 0;width:min(300px,100%);height:clamp(50px,7.4vh,70px)}
.gm-vid{position:absolute;inset:0;z-index:3;background:#000;display:flex;flex-direction:column;animation:fadeIn .2s ease}
.gm-vid video{flex:1 1 auto;min-height:0;width:100%;object-fit:contain;display:block}
.gm-vid .gm-opt{margin:14px auto max(14px,env(safe-area-inset-bottom));width:min(300px,80vw);height:clamp(50px,7vh,66px)}
.portrait .gm-art .bn>svg.lg{top:9%;bottom:auto;height:56.25vw}

@media (prefers-reduced-motion:reduce){
  .ch.hot,.parrow.show svg,#mailBtn .env,.gm-press,.gm-menu,.gm-box,.gm-vid{animation:none !important}
  #track,#pvZoom,#pages,#bar,#barExt,#pvBottom,#fader,#bubble{transition-duration:.01s !important}
  #sysmenu .sys-row,#content,#menu.boot,.mp-mii{animation:none !important}
}

@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body class="scan">

<div id="root" class="scan">
<div id="barExt"></div>
<div id="stage" class="scan">

  <!-- ===== Wii Menu ===== -->
  <div id="menu">
    <div id="pages"><div id="track"></div></div>
    <button class="parrow" id="arrL" aria-label="Previous page" data-hot></button>
    <button class="parrow" id="arrR" aria-label="Next page" data-hot></button>

    <div id="bar">
      <svg class="shape" preserveAspectRatio="none" aria-hidden="true"></svg>
      <div id="clock" aria-hidden="true"></div>
      <div id="date"></div>
      <button class="round-btn" id="wiiBtn" aria-label="Wii Menu options" data-hot><span class="face"><span class="wii-mark-slot"></span></span></button>
      <button id="sdBtn" aria-label="SD Card: résumé" data-hot><svg viewBox="0 0 46 56" aria-hidden="true"><path d="M4 2h26l14 14v36a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z" fill="#cbcccf" stroke="#a9aaae" stroke-width="2"/><g fill="#e9e9eb"><rect x="8" y="6" width="4" height="9" rx="1"/><rect x="14" y="6" width="4" height="9" rx="1"/><rect x="20" y="6" width="4" height="9" rx="1"/><rect x="26" y="6" width="4" height="9" rx="1"/></g><text x="23" y="42" text-anchor="middle" font-family="M PLUS 1p,Arial" font-weight="700" font-size="13" fill="#9a9b9f">SD</text></svg></button>
      <button class="round-btn" id="mailBtn" aria-label="Wii Message Board: contact Zach" data-hot>
        <span class="face"><svg width="58" height="40" viewBox="0 0 96 64" style="position:relative"><path class="env" d="M0 4v8l46.7 22.9c.8.4 1.8.4 2.6 0L96 12V4c0-2.2-1.8-4-4-4H4C1.8 0 0 1.8 0 4z"/><path class="env" d="M46.7 43.8 0 20.5V60c0 2.2 1.8 4 4 4h88c2.2 0 4-1.8 4-4V20.5L49.3 43.8c-.8.4-1.8.4-2.6 0z"/></svg></span>
      </button>
    </div>

    <div id="bubble" aria-hidden="true"></div>

    <!-- ===== Channel preview ===== -->
    <div id="preview" role="dialog" aria-modal="true" aria-label="Channel preview">
      <div id="pvZoom"></div>
      <button class="pvarrow" id="pvL" aria-label="Previous channel" data-hot></button>
      <button class="pvarrow" id="pvR" aria-label="Next channel" data-hot></button>
      <div id="pvBottom" class="scan">
        <button class="pill" id="pvMenu" data-hot>Wii Menu</button>

    <path d="M14 30V9.5a5 5 0 0 1 10 0V26l.2-1.2a4.6 4.6 0 0 1 9 .2V28a4.6 4.6 0 0 1 9 0v3a4.4 4.4 0 0 1 8.6 1V46c0 11-8 20-20 20h-3C18 66 12 60 8.5 53L3.3 42.5a4.6 4.6 0 0 1 7.6-5L14 41z" fill="url(#handG)" stroke="#2b6fa8" stroke-width="2.6" stroke-linejoin="round"/>

<script src="../shared/data.js"></script>
<script>
const ASSET = '../../';
const HERE = './';
const ZW_IMG = HERE + 'zw.webp', LED_IMG = HERE + 'led.webp';
const RESUME = ASSET + 'about_me/resume.pdf';
const LINKEDIN = 'https://linkedin.com/in/zwinship', GITHUB = 'https://github.com/zwinship';
const coarse = matchMedia('(pointer:coarse)').matches;
/* An upright, rounded "Wii" wordmark drawn as strokes (not the official logo file). */
const WII_MARK = (col='#a5a6aa') => `<svg class="wii-mark" viewBox="0 0 100 44" aria-hidden="true"><g fill="none" stroke="${col}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 10l9 28 9-22 9 22 9-28"/><path d="M62 20v18M84 20v18"/></g><circle cx="62" cy="9" r="4.6" fill="${col}"/><circle cx="84" cy="9" r="4.6" fill="${col}"/></svg>`;
document.querySelector('.wii-mark-slot').outerHTML = WII_MARK();

const plain = s => String(s || '').replace(/\s*·\s*/g, ', ');
const EXT = (href, label, cls='wb') => `<a class="${cls}" href="${href}" ${href.startsWith('mailto:')?'':'target="_blank" rel="noopener"'}>${label}</a>`;
const BACK = (label='Wii Menu') => `<button class="wb" data-back>${label}</button>`;
const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => [...root.querySelectorAll(sel)];
const today = () => { const d = new Date(); return `${d.toLocaleDateString('en-US',{weekday:'long'})}, ${d.toLocaleDateString('en-US',{month:'long',day:'numeric'})}`; };
// move focus through a list of elements with the arrow keys
function arrowNav(e, els, cols=1){
  const i = els.indexOf(document.activeElement); if (i < 0) return false;
  const step = {ArrowRight:1, ArrowLeft:-1, ArrowDown:cols, ArrowUp:-cols}[e.key];
  if (!step) return false;
  const n = i + step; if (n < 0 || n >= els.length) return true;
  els[n].focus(); SFX.hover(); return true;
}

/* =====================================================================
   BANNERS: every project is a game or WiiWare title, so each tile is that
   title's channel banner: a logo over a small looping scene.
   ===================================================================== */
let UID = 0;
const uid = () => 'f' + (++UID);
const SVG = (cls, par, inner) => `<svg class="${cls}" viewBox="0 0 160 90" preserveAspectRatio="${par}" aria-hidden="true">${inner}</svg>`;
const SCENE = (bg, inner, logo='') => `<div class="bg" style="background:${bg}"></div>${SVG('sc','xMidYMid slice',inner)}${logo ? SVG('lg','xMidYMid meet',logo) : ''}`;
// rough glyph widths (in em) for a heavy sans, used to pick a font size that
// fills `len` without squashing the letters much
const em = t => [...t.replace(/<[^>]+>/g,'')].reduce((s,c) => s + (c===' ' ? .3 : /[.,:]/.test(c) ? .35 : /[0-9]/.test(c) ? .62 : /[A-Z]/.test(c) ? .74 : .6), 0);
const TX = (x, y, t, len, fill, stroke, sw, max=99) => {
  const size = Math.min(max, len / em(t)).toFixed(2);
  const a = `x="${x}" y="${y}" font-size="${size}" text-anchor="middle" textLength="${len}" lengthAdjust="spacingAndGlyphs" stroke-width="${sw}" stroke-linejoin="round"`;
  return `<text class="lt" ${a} fill="rgba(0,0,0,.35)" stroke="rgba(0,0,0,.35)" transform="translate(.5 .9)">${t.replace(/ fill="[^"]*"/g,'')}</text><text class="lt" ${a} fill="${fill}" stroke="${stroke}" paint-order="stroke">${t}</text>`;
};
const LOOP = (vals, dur, begin='0s', keyTimes='') => `<animateTransform attributeName="transform" type="translate" values="${vals}" dur="${dur}" begin="${begin}" repeatCount="indefinite"${keyTimes ? ` keyTimes="${keyTimes}"` : ''}/>`;
const ANIM = (attr, vals, dur, begin='0s') => `<animate attributeName="${attr}" values="${vals}" dur="${dur}" begin="${begin}" repeatCount="indefinite"/>`;
const rng = s => () => (s = (s * 16807) % 2147483647) / 2147483647;
function skyline(seed, base, col, win, minH, maxH){
  const r = rng(seed); let x = -4, out = '';
  while (x < 166){
    const w = 7 + (r()*10|0), h = minH + r()*(maxH-minH);
    out += `<rect x="${x}" y="${(base-h).toFixed(1)}" width="${w}" height="${(h+1).toFixed(1)}" fill="${col}"/>`;
    if (win) for (let wy = base-h+3; wy < base-3; wy += 4) for (let wx = x+2; wx < x+w-2; wx += 3) if (r() < .33) out += `<rect x="${wx}" y="${wy.toFixed(1)}" width="1.3" height="1.8" fill="${win}"/>`;
    x += w + (r()*2|0);
  }
  return out;
}
// pixel art: rows of 'X'
function PX(rows, x0, y0, p, col, edge){
  let sh = '', fg = '';
  rows.forEach((row, ry) => [...row].forEach((c, rx) => { if (c !== 'X') return;
    const x = x0 + rx*p, y = y0 + ry*p;
    sh += `<rect x="${(x-p*.4).toFixed(2)}" y="${(y-p*.4).toFixed(2)}" width="${(p*1.8).toFixed(2)}" height="${(p*1.8).toFixed(2)}" fill="${edge}"/>`;
    fg += `<rect x="${x.toFixed(2)}" y="${y.toFixed(2)}" width="${(p+.04).toFixed(2)}" height="${(p+.04).toFixed(2)}" fill="${typeof col === 'function' ? col(ry) : col}"/>`; }));
  return sh + fg;
}
const FONT5 = {
  C:['.XXX.','X...X','X....','X....','X....','X...X','.XXX.'],
  H:['X...X','X...X','X...X','XXXXX','X...X','X...X','X...X'],
  E:['XXXXX','X....','X....','XXXX.','X....','X....','XXXXX'],
  S:['.XXXX','X....','X....','.XXX.','....X','....X','XXXX.'],
  Q:['.XXX.','X...X','X...X','X...X','X.X.X','X..X.','.XX.X'],
  U:['X...X','X...X','X...X','X...X','X...X','X...X','.XXX.'],
};
const KNIGHT = ['....XX....','...XXXX...','..XXXXXX..','.XXX.XXXX.','XXXXXXXXX.','XXXXXXXXXX','.XX..XXXXX','.....XXXXX','....XXXXX.','...XXXXXX.','..XXXXXXXX','..XXXXXXXX'];
const KING = ['...X...','..XXX..','...X...','.XXXXX.','XXXXXXX','XXXXXXX','.XXXXX.','..XXX..','..XXX..','.XXXXX.','XXXXXXX','XXXXXXX'];
const oct = (r, cx, cy, sy, dy=0) => Array.from({length:8}, (_, i) => { const a = (22.5 + 45*i) * Math.PI/180; return [cx + r*Math.cos(a), cy + r*Math.sin(a)*sy + dy]; });
const pts = a => a.map(p => p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');

const nber = byId('nber');
const B = {
/* the Disc Channel tile, as on the real menu: glossy white with a disc slot */
disctile: () => SCENE('linear-gradient(#ffffff,#f3f4f6 48%,#e1e3e7)', `
  <ellipse cx="80" cy="45" rx="3" ry="31" fill="#dfe1e5"/>
  <ellipse cx="80" cy="45" rx="1.5" ry="30" fill="#c6c9cf"/>
  <ellipse cx="79.3" cy="38" rx=".55" ry="19" fill="#fff" opacity=".95"/>
  <path d="M-40 0h16l-30 90h-16z" fill="#fff" opacity=".6">${LOOP('0 0;240 0;240 0', '5s', '0s', '0;.4;1')}</path>`),

/* the paper, as the game in the disc drive */
nber: () => { const city = skyline(11, 70, '#14244a', '#ffd27a', 12, 40);
  const lamp = (c, b) => `<rect x="${b}" y="-1.6" width="5" height="1.8" rx=".6" fill="${c}">${ANIM('opacity', c === '#ff3b3b' ? '1;.15;1' : '.15;1;.15', '.5s')}</rect>`;
  return SCENE('linear-gradient(#0b1736,#1f3466 62%,#33497a)', `
  ${skyline(5, 70, '#203765', null, 20, 50)}${city}
  <rect x="0" y="70" width="160" height="20" fill="#2a2d34"/><rect x="0" y="70" width="160" height="1.2" fill="#555a63"/>
  <line x1="0" y1="82" x2="160" y2="82" stroke="#e6e6e6" stroke-width=".9" stroke-dasharray="6 5"/>
  <g transform="translate(0 59)"><g>
    <path d="M33.5 9.5 L62 5 L62 17Z" fill="#fff3c4" opacity=".22"/>
    <rect x="0" y="0" width="24" height="13" rx="1.6" fill="#f5f5f2"/>
    <path d="M24 4H29.5L33.5 9V13H24Z" fill="#f5f5f2"/><path d="M25.3 5.4H28.9L31.6 8.9H25.3Z" fill="#8fb8d8"/>
    <rect x="0" y="7.2" width="33.5" height="1.8" fill="#d62828"/>
    ${lamp('#ff3b3b', 3)}${lamp('#3b8bff', 9)}
    <circle cx="6.5" cy="13.4" r="2.6" fill="#1d1d1f"/><circle cx="6.5" cy="13.4" r="1" fill="#9a9a9a"/>
    <circle cx="27" cy="13.4" r="2.6" fill="#1d1d1f"/><circle cx="27" cy="13.4" r="1" fill="#9a9a9a"/>
    ${LOOP('-70 0;175 0', '6s')}</g></g>`,
  TX(80, 25, 'CONGESTION PRICING', 140, '#fff', '#b3121f', 2.8) +
  TX(80, 38, 'and EMS Response Time', 92, '#ffd23f', '#0b1736', 2.2)); },

mii: () => { const p = uid(); return SCENE('#fff', `
  <defs><pattern id="${p}" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fff"/><path d="M12 2 22 12 12 22 2 12Z" fill="#f7c28a"/><path d="M0-10 10 0 0 10-10 0ZM24-10 34 0 24 10 14 0ZM0 14 10 24 0 34-10 24ZM24 14 34 24 24 34 14 24Z" fill="#94d6ec"/></pattern></defs>
  <g><rect x="-30" y="-30" width="230" height="160" fill="url(#${p})"/>${LOOP('0 0;24 24', '8s')}</g>
  <ellipse cx="89" cy="62" rx="40" ry="34" fill="#fff" opacity=".75"/>
  <image href="${ZW_IMG}" x="46" y="5" width="86" height="85" preserveAspectRatio="xMidYMax meet"/>`); },

chesque: () => { let floor = ''; const rows = 6, cols = 14, Y = t => 58 + 34*Math.pow(t, 1.5), X = (x, t) => 80 + (x-80)*(.3 + .7*t);
  for (let r = 0; r < rows; r++){ const a = r/rows, b = (r+1)/rows;
    for (let c = 0; c < cols; c++){ const xa = -60 + c*20, xb = xa + 20;
      floor += `<path d="M${X(xa,a).toFixed(1)} ${Y(a).toFixed(1)}L${X(xb,a).toFixed(1)} ${Y(a).toFixed(1)}L${X(xb,b).toFixed(1)} ${Y(b).toFixed(1)}L${X(xa,b).toFixed(1)} ${Y(b).toFixed(1)}Z" fill="${(r+c)%2 ? '#c9b6f2' : '#4e3489'}"/>`; } }
  const stars = [[12,10],[30,40],[48,6],[118,8],[140,30],[150,12],[70,46],[100,42],[20,26],[132,46]].map(([x,y],i) => `<rect x="${x}" y="${y}" width="1.2" height="1.2" fill="#fff">${ANIM('opacity', '1;.2;1', (1.4 + (i%3)*.5)+'s', (-i*.3)+'s')}</rect>`).join('');
  const word = 'CHESQUE', p = 2.8, x0 = (160 - (word.length*5*p + (word.length-1)*p))/2;
  const shade = ry => ry < 3 ? '#ffe066' : ry < 5 ? '#ffc233' : '#f08c1a';
  const logo = [...word].map((ch, i) => PX(FONT5[ch], x0 + i*6*p, 12, p, shade, '#2a0f04')).join('');
  const hop = (d, b) => `<animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0;0 0" keyTimes="0;.12;.24;1" dur="${d}" begin="${b}" repeatCount="indefinite"/>`;
  return SCENE('linear-gradient(#170d33,#3a2264 55%,#5a3a86)', `${stars}
  <rect x="0" y="54" width="160" height="5" fill="#7a56c0" opacity=".35"/>${floor}
  <g><g transform="translate(16 46)">${PX(KNIGHT, 0, 0, 1.7, '#f4efe2', '#1a0f2e')}</g>${hop('2.4s', '0s')}</g>
  <g><g transform="translate(128 45)">${PX(KING, 0, 0, 1.7, '#f4efe2', '#1a0f2e')}</g>${hop('2.4s', '-1.2s')}</g>`,
  `<g>${logo}<animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2" dur="1.2s" calcMode="discrete" repeatCount="indefinite"/></g>`); },

tott: () => { const p = uid(); return SCENE('radial-gradient(ellipse at 25% 0,rgba(255,255,255,.28),rgba(255,255,255,0) 55%),radial-gradient(ellipse at 75% 0,rgba(255,255,255,.28),rgba(255,255,255,0) 55%),linear-gradient(105deg,#c8102e 0 50%,#1846b0 50%)', `
  <defs><pattern id="${p}" x="0" y="55" width="10" height="12" patternUnits="userSpaceOnUse"><path d="M.25 0v5M2.25 0v2.5M4.25 0v2.5M5.25 0v3.6M6.25 0v2.5M8.25 0v2.5" stroke="#1a1a1a" stroke-width=".5"/><animateTransform attributeName="patternTransform" type="translate" from="0 0" to="-10 0" dur="1s" repeatCount="indefinite"/></pattern></defs>
  <g transform="rotate(-6 80 61)"><rect x="-30" y="55" width="220" height="12" fill="#ffd200"/><rect x="-30" y="55" width="220" height="12" fill="url(#${p})"/><rect x="-30" y="66" width="220" height="1" fill="rgba(0,0,0,.2)"/></g>`,
  TX(80, 18, 'TALE OF THE', 66, '#fff', '#111', 2) + TX(80, 47, 'TAPE', 104, '#fff', '#111', 3.6)); },

octa: () => { const o = oct(60, 80, 76, .33), top = o.map(([x,y]) => [x, y-12]);
  let back = '', front = '';
  for (let i = 0; i < 8; i++){ const j = (i+1)%8, q = `<path d="M${o[i][0].toFixed(1)} ${o[i][1].toFixed(1)}L${o[j][0].toFixed(1)} ${o[j][1].toFixed(1)}L${top[j][0].toFixed(1)} ${top[j][1].toFixed(1)}L${top[i][0].toFixed(1)} ${top[i][1].toFixed(1)}Z"`;
    if (o[i][1] + o[j][1] < 152) back += `${q} fill="rgba(10,10,14,.55)" stroke="#3b3b42" stroke-width=".8"/>`; else front += `${q} fill="rgba(10,10,14,.22)" stroke="#55555d" stroke-width=".8"/>`; }
  const cone = (x, d) => `<path d="M${x} -6 L${x-22} 96 L${x+22} 96Z" fill="#fff" opacity=".07"><animateTransform attributeName="transform" type="rotate" values="${-d} ${x} -6;${d} ${x} -6;${-d} ${x} -6" dur="6s" repeatCount="indefinite"/></path>`;
  return SCENE('radial-gradient(ellipse at 50% 35%,#3a3a40,#121214 72%)', `
  ${back}<polygon points="${pts(o)}" fill="#e6e3da" stroke="#4a4a52" stroke-width="1.2"/>
  <polygon points="${pts(oct(44, 80, 76, .33))}" fill="none" stroke="#c9c5ba" stroke-width=".6"/>${front}
  ${cone(44, 12)}${cone(116, -12)}`,
  TX(80, 30, 'Octa<tspan fill="#e3262f">Stats</tspan>', 118, '#fff', '#000', 3.2) + TX(80, 41, 'UFC MODEL V2', 52, '#c4c4cc', '#000', 1.5)); },

rd2dnet: () => { let blocks = '', dots = ''; const r = rng(3);
  for (let x = -60; x < 220; x += 20) for (let y = -60; y < 150; y += 20) blocks += `<rect x="${x+2.2}" y="${y+2.2}" width="15.6" height="15.6" rx="1.3" fill="${r() < .1 ? '#cfe3b4' : '#e6dfcc'}"/>`;
  for (let x = 0; x <= 180; x += 20) for (let y = -20; y <= 120; y += 20) if (x !== 100 && r() < .4) dots += `<circle cx="${x}" cy="${y}" r="1.5" fill="${x < 100 ? '#2a6fdb' : '#f08a24'}"/>`;
  const route = (d, c, dur) => `<path d="${d}" fill="none" stroke="${c}" stroke-width="1.3" stroke-dasharray="2 1.6" opacity=".7"/><circle r="2.6" fill="${c}" stroke="#fff" stroke-width="1"><animateMotion path="${d}" dur="${dur}" repeatCount="indefinite"/></circle>`;
  return SCENE('#fbf8f0', `<g transform="rotate(-12 80 45)">${blocks}${dots}
  <line x1="100" y1="-60" x2="100" y2="150" stroke="#d7263d" stroke-width="2.2" stroke-dasharray="5 2.5"/>
  ${route('M20 80H60V60H80V40H100', '#2a6fdb', '4s')}${route('M180 20H140V40H120V80H100', '#f08a24', '4.6s')}</g>`,
  TX(80, 32, 'rd2dnet', 92, '#1d3557', '#fbf8f0', 4.6)); },

led: () => { const g = uid(); return SCENE('#1b1b1b', `
  <defs><linearGradient id="${g}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".7"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient></defs>
  <g transform="translate(80 47)"><g><image href="${LED_IMG}" x="-80" y="-79" width="160" height="158.4" preserveAspectRatio="xMidYMid slice"/>
    <animateTransform attributeName="transform" type="scale" values="1;1.1;1" dur="18s" repeatCount="indefinite"/></g></g>
  <rect width="160" height="50" fill="url(#${g})"/>`,
  TX(80, 22, 'MBTA Live Tracker', 124, '#fff', '#111', 2.8) + TX(80, 35, 'LED Art', 40, '#ed8b00', '#111', 2)); },

micro: () => { const p = uid(); const a = '88;97.1;88', b = '68;65.5;68', d = '4s';
  return SCENE('#fbfaf3', `
  <defs><pattern id="${p}" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M8 0H0V8" fill="none" stroke="#d3e2ee" stroke-width=".45"/></pattern></defs>
  <rect width="160" height="90" fill="url(#${p})"/>
  <path d="M22 46V86H152" fill="none" stroke="#33363b" stroke-width="1.3"/>
  <line x1="30" y1="84" x2="146" y2="52" stroke="#1e6fd9" stroke-width="2" stroke-linecap="round"/>
  <g><line x1="30" y1="52" x2="146" y2="84" stroke="#e0443a" stroke-width="2" stroke-linecap="round"/><animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="${d}" repeatCount="indefinite"/></g>
  <line x1="22" x2="88" y1="68" y2="68" stroke="#8a8e96" stroke-width=".7" stroke-dasharray="1.6 1.4">${ANIM('x2', a, d)}${ANIM('y1', b, d)}${ANIM('y2', b, d)}</line>
  <line x1="88" x2="88" y1="68" y2="86" stroke="#8a8e96" stroke-width=".7" stroke-dasharray="1.6 1.4">${ANIM('x1', a, d)}${ANIM('x2', a, d)}${ANIM('y1', b, d)}</line>
  <circle cx="88" cy="68" r="2.4" fill="#33363b">${ANIM('cx', a, d)}${ANIM('cy', b, d)}</circle>`,
  TX(80, 15, 'INTERMEDIATE', 64, '#1f4e79', '#fbfaf3', 2.2) + TX(80, 33, 'Microeconomics', 128, '#1f4e79', '#fbfaf3', 3.6)); },

cz: () => { const taxi = `<rect x="0" y="3" width="20" height="6" rx="1.6" fill="#ffcc1a"/><path d="M5 3.4 7 .4H13.5L15.5 3.4Z" fill="#ffcc1a"/><path d="M6.6 3.2 8 1.2H10V3.2ZM10.6 3.2V1.2H13L14.2 3.2Z" fill="#8fc3e6"/><rect x="9" y="-1.3" width="2.6" height="1.5" rx=".4" fill="#fff"/><rect x="1" y="5.6" width="18" height=".8" fill="#2b2b2b" opacity=".5"/><circle cx="5" cy="9" r="1.8" fill="#222"/><circle cx="15.5" cy="9" r="1.8" fill="#222"/>`;

  <rect x="0" y="68" width="160" height="3" fill="#cfd3d6"/><rect x="0" y="71" width="160" height="19" fill="#50555c"/>

/* =====================================================================
   SOUND: all synthesized
   ===================================================================== */
let AC = null, noiseBuf = null, jingleGain = null;
function audio(){
  if (!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)();
    noiseBuf = AC.createBuffer(1, AC.sampleRate*.5, AC.sampleRate); const d = noiseBuf.getChannelData(0); for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1; }catch(e){} }
  return AC;
}
function tone(freq, dur=.06, type='sine', vol=.05, when=0, slide=0, dest){
  const ac = audio(); if(!ac) return;
  const t = ac.currentTime + when, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(freq*slide, t+dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t+.008); g.gain.exponentialRampToValueAtTime(.0001, t+dur);
  o.connect(g).connect(dest||ac.destination); o.start(t); o.stop(t+dur+.02);
}
function noise(dur, f0, f1, vol=.03, q=2){
  const ac = audio(); if(!ac) return;
  const t = ac.currentTime, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = noiseBuf; f.type = 'bandpass'; f.Q.value = q;
  f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t+dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t+dur*.3); g.gain.exponentialRampToValueAtTime(.0001, t+dur);
  s.connect(f).connect(g).connect(ac.destination); s.start(t); s.stop(t+dur+.02);
}
const SFX = {
  hover: () => { noise(.025, 3200, 2800, .05, 6); tone(1250,.04,'sine',.018); },
  select: () => { tone(520,.16,'sine',.05,0,1.9); tone(1600,.03,'triangle',.02); },
  back: () => tone(900,.15,'sine',.045,0,.55),
  page: (dir=1) => dir>0 ? noise(.26, 500, 2200, .05, 1.2) : noise(.26, 2200, 500, .05, 1.2),
  start: () => { tone(660,.25,'sine',.05,0,1.5); tone(1320,.2,'triangle',.02,.05); },
  press: () => tone(1500,.03,'triangle',.03),
};
const NOTE = n => { const m = /^([A-G])(#?)(\d)$/.exec(n); if (!m) return 0; const i = {C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]] + (m[2]?1:0); return 440*Math.pow(2,(i + (m[3]-4)*12 - 9)/12); };
function playJingle(str){
  const ac = audio(); if (!ac || !str) return;
  stopJingle();
  jingleGain = ac.createGain(); jingleGain.gain.value = 1; jingleGain.connect(ac.destination);
  let t = 0; const beat = .16;
  str.split(' ').forEach(n => { if (n !== '.'){ const f = NOTE(n); tone(f, .3, 'triangle', .045, t, 0, jingleGain); tone(f*2, .12, 'sine', .012, t, 0, jingleGain); } t += beat; });
}
/* Original ambient menu loop (not Nintendo's music): a soft Cmaj7, Am7, Dm7, G7
   arpeggio through a lowpass, scheduled a little ahead of the audio clock. */
let musicOn = true, musicGain = null, musicT = null, musicNext = 0, musicStep = 0;
try{ musicOn = localStorage.getItem('wiiMusic') !== 'off'; }catch(e){}
const MUSIC = ['C4 E4 G4 B4 E5 B4 G4 E4','A3 C4 E4 G4 C5 G4 E4 C4','D4 F4 A4 C5 F5 C5 A4 F4','G3 B3 D4 F4 B4 F4 D4 B3'].map(b=>b.split(' ').map(NOTE));
function startMusic(){
  const ac = audio(); if (!ac || musicGain) return;
  const lp = ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = 1800;
  musicGain = ac.createGain(); musicGain.gain.value = musicOn ? 1 : 0;
  musicGain.connect(lp).connect(ac.destination);
  musicNext = ac.currentTime + .1;
  musicT = setInterval(() => {
    while (musicNext < ac.currentTime + .6){
      const bar = MUSIC[Math.floor(musicStep/8) % 4], f = bar[musicStep % 8];
      const when = musicNext - ac.currentTime;
      tone(f, .55, 'triangle', .016, when, 0, musicGain);
      if (musicStep % 8 === 0) tone(f/2, 1.6, 'sine', .014, when, 0, musicGain);
      musicNext += .3; musicStep++;
    }
  }, 150);
}
function duckMusic(down){ if (!musicGain || !musicOn) return; musicGain.gain.setTargetAtTime(down ? 0 : 1, AC.currentTime, .12); }
function stopJingle(){ if (jingleGain){ try{ jingleGain.gain.setTargetAtTime(0, AC.currentTime, .05); }catch(e){} jingleGain = null; } }

/* =====================================================================
   LAYOUT: 16:9 (and wider), 4:3, and a portrait mode for phones.
   ===================================================================== */
let L;
function computeLayout(){
  const a = innerWidth / innerHeight;
  if (a < .9){
    const W = 720, H = Math.round(Math.max(1100, Math.min(1700, W/a))), cols = 2, rows = 4, gx = 16, gy = 18, mx = 60;
    const tw = (W - 2*mx - gx*(cols-1)) / cols, th = 188, gridH = rows*th + (rows-1)*gy;
    const barTop = H - 200, top = Math.max(60, Math.round((barTop - gridH)*.5));
    const zh = 470;
    return { mode:'portrait', W, H, cols, rows, per:cols*rows, gx, gy, mx, tw, th, top, barTop, s:190, zoom:{l:0,t:Math.round((H-148-zh)/2),w:720,h:zh}, arrowY:top + gridH/2 - 41 };
  }
  const H = 720, W = Math.round(Math.max(960, Math.min(1280, H*a)));
  const cols = 4, rows = 3, gx = 14, gy = 12, mx = Math.round(W*.074);
  const tw = (W - 2*mx - gx*(cols-1)) / cols, th = 156;
  return { mode:'land', W, H, cols, rows, per:cols*rows, gx, gy, mx, tw, th, top:40, barTop:H-200, s:204, zoom:{l:0,t:0,w:W,h:572}, arrowY:40 + (rows*th+(rows-1)*gy)/2 - 41 };
}

}

const ARROW_SVG = `<svg viewBox="0 0 55 98" aria-hidden="true"><defs><radialGradient id="arG" cx="24" cy="49" r="45" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#cbf6ff"/><stop offset="1" stop-color="#62d6ff"/></radialGradient></defs><path d="M4.16 2.07 52.25 48.28a1 1 0 0 1 0 1.44L4.16 95.93c-.7.66-1.84.07-1.68-.88L9.92 49 2.48 2.95c-.16-.95.98-1.54 1.68-.88Z" fill="url(#arG)" stroke="#24479b" stroke-width="3"/></svg>`;

const SEG = {0:'1111110',1:'0110000',2:'1101101',3:'1111001',4:'0110011',5:'1011011',6:'1011111',7:'1110000',8:'1111111',9:'1111011'};
// thinner, slightly rounded segments
const SEG_POLY = ['M8,3 H28 L25,6.5 H11 Z','M30,5 V29 L26.5,26.5 V8.5 Z','M30,35 V59 L26.5,55.5 V37.5 Z','M8,61 H28 L25,57.5 H11 Z','M6,35 V59 L9.5,55.5 V37.5 Z','M6,5 V29 L9.5,26.5 V8.5 Z','M8.5,32 L11,29.8 H25 L27.5,32 L25,34.2 H11 Z'];

const digitSVG = (ch, x) => `<g transform="translate(${x},0)">${SEG_POLY.map((d,i)=>(SEG[ch]||'0000000')[i]==='1'?`<path d="${d}" fill="${SEG_COL}" stroke="${SEG_COL}" stroke-width="1" stroke-linejoin="round"/>`:'').join('')}</g>`;
let colon = true;
function tick(){

  const hs = String(h), ms = String(m).padStart(2,'0');
  let x = 0, svg = '';

/* --- paging --- */
const arrL = document.getElementById('arrL'), arrR = document.getElementById('arrR');

/* --- preview: the menu "camera" pushes into the tile while its banner grows --- */
const preview = document.getElementById('preview'), pvZoom = document.getElementById('pvZoom');

/* --- keyboard: arrows move the highlight, Enter/A = select, Esc/Backspace/B = back --- */
let kFocus = 0;
addEventListener('keydown', e => {

  if (onControl && (e.key==='Enter' || e.key===' ')) return;  // native buttons handle their own activation
  const back = ['Escape','Backspace','b','B'].includes(e.key);
  if (state === 'menu'){
    if (hotEl && hotEl.dataset.idx) kFocus = +hotEl.dataset.idx;
    const per = L.per, cols = L.cols, s = kFocus % per, row = Math.floor(s/cols), col = s % cols;
    let n = null;
    if (!hotEl && e.key.startsWith('Arrow')) n = page*per;
    else if (e.key==='ArrowRight') n = col < cols-1 ? kFocus+1 : (page < PAGES-1 ? (page+1)*per + row*cols : null);
    else if (e.key==='ArrowLeft') n = col > 0 ? kFocus-1 : (page > 0 ? (page-1)*per + row*cols + cols-1 : null);
    else if (e.key==='ArrowDown') n = row < L.rows-1 ? kFocus+cols : null;
    else if (e.key==='ArrowUp') n = row > 0 ? kFocus-cols : null;

    let i = order.indexOf(document.activeElement);
    const moves = { ArrowRight:1, ArrowLeft:-1, ArrowDown:2, ArrowUp:-2 };
    if (moves[e.key] === undefined) return;
    e.preventDefault(); i = i < 0 ? 0 : Math.max(0, Math.min(3, i + moves[e.key]));

  if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy)) return;
  if (state==='menu'){ const t = page + (dx<0?1:-1);
    if (t < 0 || t >= PAGES){ if (!reduced) track.animate([{transform:`translateX(${-page*L.W}px)`},{transform:`translateX(${-page*L.W + (dx<0?-30:30)}px)`},{transform:`translateX(${-page*L.W}px)`}],{duration:260,easing:'ease-out'}); }
    else setPage(t); }
  else if (state==='preview'){ const n = current + (dx<0?1:-1); if (n>=0 && n<CHANNELS.length) openPreview(n, dx<0?1:-1); }
});
// prefers-reduced-motion: CSS can't stop SMIL, so pause banner SVG animations directly
function pauseSMIL(root){ if (reduced) root.querySelectorAll('svg').forEach(s => s.pauseAnimations && s.pauseAnimations()); }
new MutationObserver(() => pauseSMIL(pvZoom)).observe(pvZoom,{childList:true});
pauseSMIL(document);

/* =====================================================================
   GO
   ===================================================================== */
relayout(true);
let rT; addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(()=>relayout(false), 80); });
</script>
