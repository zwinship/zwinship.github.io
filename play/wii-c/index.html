<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Zach Winship: Wii Menu</title>
<link rel="icon" href="../../images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@300;400;500;700;800&family=Oswald:wght@500;700&family=IBM+Plex+Mono:wght@400;600&family=Press+Start+2P&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<!--
  Layout reference: the bottom-bar silhouette, button geometry and page
  arrow are adapted from tobieche110/wii-portfolio (MIT License,
  Copyright (c) 2024 Tobias Echenique). Everything else is original.
  A fan homage to the Nintendo Wii Menu; not affiliated with Nintendo.
-->
<style>
:root{
  --cyan:#34beed;
  --cyan-text:#1f7fae;
  --gray-text:#6e7075;
  --ink:#4a4c50;
  --tile-border:#bdbec2;
  --font:'M PLUS 1p','Helvetica Neue',Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
.has-hand #root, .has-hand #root *{cursor:none !important}

/* Wii Menu background: near-white with faint horizontal lines */
.scan{background-color:#fafafa;background-image:repeating-linear-gradient(to bottom,#fafafa 0 2px,#f0f0f0 2px 4px)}

/* ================= STAGE ================= */
#root{position:fixed;inset:0;overflow:clip}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;overflow:clip}
#barExt{position:absolute;left:0;right:0;bottom:0;pointer-events:none;transition:transform .45s cubic-bezier(.45,0,.2,1);background:linear-gradient(#e6e7ea,#d8d9dd);border-top:3px solid var(--cyan);display:none}

/* ================= HEALTH & SAFETY ================= */
#warning{position:absolute;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;transition:opacity .6s ease;cursor:pointer}
#warning.gone{opacity:0;pointer-events:none}
.warn-title{display:flex;align-items:center;gap:18px;font-size:44px;font-weight:700;color:#222;letter-spacing:.5px;text-align:center}
.warn-title svg{width:56px;height:56px;flex:0 0 auto}
.warn-rule{width:min(880px,88%);height:3px;background:#222;margin:22px 0 34px}
.warn-body{width:min(880px,88%);font-size:30px;line-height:1.55;font-weight:500;color:#222}
.warn-body b{font-weight:700}
.warn-body .url{display:block;margin-top:26px}
.warn-press{margin-top:80px;font-size:30px;font-weight:500;color:#222;display:flex;align-items:center;gap:12px;opacity:0;animation:pressIn .6s ease 1.6s forwards}
.a-btn{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:50%;background:#222;color:#fff;font-size:24px;font-weight:700}
@keyframes pressIn{to{opacity:1}}
.portrait .warn-title{font-size:40px;flex-direction:column;gap:10px}
.portrait .warn-body{font-size:34px}

/* ================= MENU ================= */
#menu{position:absolute;inset:0;visibility:hidden}
#menu.boot{animation:fadeIn .8s ease both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
#pages{position:absolute;left:0;top:0;overflow:clip;transition:transform .5s cubic-bezier(.45,0,.2,1),opacity .45s ease}
#track{position:absolute;left:0;top:0;height:100%;display:flex;transition:transform .55s cubic-bezier(.45,0,.2,1)}
.page{position:relative;height:100%}
.grid{position:absolute;display:grid}

/* --- channel tile --- */
.ch{position:relative;border-radius:18px;background:#fff;border:2px solid var(--tile-border);padding:0;transition:border-color .1s,box-shadow .1s;outline:none}
.ch .bn{position:absolute;inset:4px;border-radius:13px;overflow:hidden}
.ch.hot,.ch:focus-visible{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 0 7px 2px rgba(52,190,237,.45);z-index:3}
.ch.empty{background:#ececee;border-color:#d2d3d6;cursor:default}
.ch.empty .bn{display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(to bottom,#efeff1 0 2px,#e6e6e9 2px 4px)}
.wii-mark{display:block;width:34%;max-width:96px}
/* 4:3 tiles: show the 16:9 banner letterboxed, like the real menu did */
.grid.narrow .ch .bn{top:50%;bottom:auto;aspect-ratio:16/9;transform:translateY(-50%);border-radius:8px}
.grid.narrow .ch.empty .bn{inset:4px;transform:none;aspect-ratio:auto}

/* hover label */
#bubble{position:absolute;z-index:40;pointer-events:none;padding:6px 28px;border-radius:999px;background:#fff;border:2px solid #b9babd;box-shadow:0 2px 4px rgba(0,0,0,.12);font-size:22px;font-weight:500;color:#4a4c50;white-space:nowrap;opacity:0;transform:translate(-50%,4px) scale(.92);transition:opacity .12s,transform .16s cubic-bezier(.3,1.6,.5,1)}
#bubble.on{opacity:1;transform:translate(-50%,0) scale(1);transition-delay:.18s}

/* page arrows */
.parrow{position:absolute;width:46px;height:82px;z-index:5;opacity:0;pointer-events:none;transition:opacity .25s}
.parrow svg{width:100%;height:100%;filter:drop-shadow(0 2px 2px rgba(20,60,120,.25))}
.parrow.show{opacity:1;pointer-events:auto}
.parrow.show svg{animation:arrowPulse 1.6s ease-in-out infinite}
.parrow.hot svg{animation:none;transform:scale(1.08)}
#arrL svg{transform:scaleX(-1)}
#arrL.show svg{animation:arrowPulseL 1.6s ease-in-out infinite}
#arrL.hot svg{animation:none;transform:scaleX(-1) scale(1.08)}
@keyframes arrowPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes arrowPulseL{0%,100%{transform:scaleX(-1) scale(1)}50%{transform:scaleX(-1) scale(1.07)}}

/* ================= BOTTOM BAR ================= */
#bar{position:absolute;left:0;height:200px;transition:transform .45s cubic-bezier(.45,0,.2,1)}
#bar svg.shape{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#clock{position:absolute;left:0;right:0;top:18px;display:flex;justify-content:center;height:62px}
#date{position:absolute;left:0;right:0;top:122px;text-align:center;font-size:30px;font-weight:500;color:#7d7f84;letter-spacing:.5px}
.round-btn{position:absolute;top:65px;width:132px;height:132px;border-radius:50%;outline:none}
.round-btn .face{position:absolute;inset:8px;border-radius:50%;background:linear-gradient(#f2f2f3,#d9d9db);border:4px solid var(--cyan);box-shadow:0 3px 4px rgba(0,0,0,.16);display:flex;align-items:center;justify-content:center;transition:box-shadow .12s}
.round-btn.hot .face,.round-btn:focus-visible .face{box-shadow:0 0 0 3px rgba(52,190,237,.35),0 0 8px 2px rgba(52,190,237,.45),0 3px 4px rgba(0,0,0,.16)}
#wiiBtn{left:58px}
#mailBtn{right:58px}
#wiiBtn .wii-mark{width:70px;max-width:none}
#mailBtn .env{fill:#a1a0a4;animation:mailGlow 2.4s ease-in-out infinite}
@keyframes mailGlow{0%,100%{fill:#a1a0a4}50%{fill:#34beed}}
#sdBtn{position:absolute;top:100px;width:50px;height:60px;border-radius:8px;outline:none;padding:2px}
#sdBtn svg{width:100%;height:100%}
#sdBtn.hot svg path:first-child,#sdBtn:focus-visible svg path:first-child{stroke:var(--cyan);stroke-width:3}

/* ================= CHANNEL PREVIEW ================= */
#preview{position:absolute;inset:0;z-index:50;pointer-events:none}
#preview.open{pointer-events:auto}
#preview.closing{pointer-events:none}
#pvZoom{position:absolute;overflow:hidden;background:#fff;transition:left .5s cubic-bezier(.45,0,.2,1),top .5s cubic-bezier(.45,0,.2,1),width .5s cubic-bezier(.45,0,.2,1),height .5s cubic-bezier(.45,0,.2,1),border-radius .5s}
#pvZoom .bn{position:absolute;inset:0}
#pvBottom{position:absolute;left:0;right:0;bottom:0;height:148px;display:flex;align-items:center;justify-content:center;gap:9%;transform:translateY(100%);transition:transform .35s cubic-bezier(.45,0,.2,1)}
#preview.shown #pvBottom{transform:none}
.pill{position:relative;width:400px;height:88px;border-radius:999px;background:linear-gradient(#fdfdfd,#e9e9eb);border:2px solid #c4c5c9;box-shadow:0 2px 3px rgba(0,0,0,.12);font-size:36px;font-weight:500;color:#55575c;transition:border-color .1s,box-shadow .1s;outline:none}
.pill.hot,.pill:focus-visible{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 0 8px 2px rgba(52,190,237,.45)}
.portrait .pill{width:300px;height:84px;font-size:32px}
.pvarrow{position:absolute;width:46px;height:82px;opacity:0;transition:opacity .25s;outline:none}
#preview.shown .pvarrow{opacity:1}
.pvarrow svg{width:100%;height:100%;filter:drop-shadow(0 2px 2px rgba(20,60,120,.25))}
.pvarrow.hot svg{transform:scale(1.08)}
#pvL svg{transform:scaleX(-1)}
#pvL.hot svg{transform:scaleX(-1) scale(1.08)}

/* ================= WII BUTTON SCREEN ================= */
#sysmenu{position:absolute;left:0;right:0;top:0;bottom:200px;z-index:55;display:none;flex-direction:column;align-items:center;justify-content:center;gap:36px}
#sysmenu.open{display:flex;animation:fadeIn .25s ease}
#sysmenu.open .sys-row{animation:sysIn .3s cubic-bezier(.45,0,.2,1)}
@keyframes sysIn{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sys-row{display:flex;gap:56px}
.portrait .sys-row{flex-direction:column;gap:30px}
.sysbtn{width:440px;height:200px;border-radius:24px;background:linear-gradient(#ffffff,#eeeff1);border:2px solid #c4c5c9;box-shadow:0 2px 4px rgba(0,0,0,.1);font-size:36px;font-weight:500;color:#55575c;transition:border-color .1s,box-shadow .1s;outline:none}
.sysbtn.hot,.sysbtn:focus-visible{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 0 8px 2px rgba(52,190,237,.45)}

/* ================= HAND CURSOR ================= */
#hand{position:fixed;left:0;top:0;z-index:9999;pointer-events:none;width:58px;height:70px;margin:-6px 0 0 -18px;display:none;transform-origin:18px 6px;will-change:transform}
.has-hand #hand{display:block}
.has-hand.in-content #hand{display:none}
#hand svg{width:100%;height:100%;transition:transform .08s;filter:drop-shadow(1px 2px 1px rgba(0,0,0,.28))}
#hand.press svg{transform:scale(.92)}

/* ================= CHANNEL CONTENT =================
   Each channel opens its own full-screen app with its own layout, the way
   third-party channels each had their own look. Shared pieces are only the
   frame (#content/#app) and the "Wii Menu" pill used to leave. */
:root{--serif:'Source Serif 4',Georgia,'Times New Roman',serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;--fight:'Oswald','Arial Narrow',Arial,sans-serif;--pixel:'Press Start 2P',ui-monospace,monospace}
#content{position:fixed;inset:0;z-index:70;display:none;cursor:auto;background:#fff}
#content.open{display:block;animation:fadeIn .3s ease}
#content.leaving{animation:fadeOut .2s ease forwards}
@keyframes fadeOut{to{opacity:0}}
#app{position:absolute;inset:0}
.app{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;user-select:text}
.app a{color:inherit}
.app h1:focus{outline:none}
.app button{user-select:none}
.app .vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* the Wii Menu pill, as on the channel preview */
.wm{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;height:56px;min-width:200px;padding:0 30px;border-radius:999px;background:linear-gradient(#fdfdfd,#e9e9eb);border:2px solid #c4c5c9;box-shadow:0 2px 3px rgba(0,0,0,.12);font-size:22px;font-weight:500;color:#55575c;text-decoration:none;white-space:nowrap;transition:border-color .1s,box-shadow .1s;outline:none}
.wm:hover,.wm:focus-visible{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 0 8px 2px rgba(52,190,237,.45)}
.wm.glass{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.4);color:#fff;box-shadow:none;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.wm.glass:hover,.wm.glass:focus-visible{border-color:#fff;background:rgba(255,255,255,.24);box-shadow:0 0 0 1px #fff}
.wm.small{height:46px;min-width:0;padding:0 22px;font-size:18px}
@media (max-width:640px){.wm{height:48px;min-width:0;padding:0 22px;font-size:18px}}
.bar-safe{padding-bottom:max(16px,env(safe-area-inset-bottom))}
/* Wii-style blue arrow used for page turns */
.warrow{flex:0 0 auto;width:46px;height:82px;outline:none;transition:transform .12s,opacity .2s}
.warrow svg{width:100%;height:100%;filter:drop-shadow(0 2px 2px rgba(20,60,120,.25))}
.warrow.prev svg{transform:scaleX(-1)}
.warrow:hover,.warrow:focus-visible{transform:scale(1.08)}
.warrow:focus-visible svg{filter:drop-shadow(0 0 6px rgba(52,190,237,.9))}
.warrow:disabled{opacity:0;pointer-events:none}
@media (max-width:640px){.warrow{width:30px;height:54px}}

/* ---------- Research: document viewer ---------- */
.rs{background:#5b5e64 radial-gradient(ellipse at 50% 40%,#6c7076,#45484d)}
.rs-top{flex:0 0 auto;display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:14px clamp(16px,3vw,40px) 8px;padding-top:max(14px,env(safe-area-inset-top));color:#e9eaec}
.rs-top h1{font-size:22px;font-weight:700;letter-spacing:.3px}
.rs-count{font-size:18px;font-weight:500;color:#c5c7cb;font-variant-numeric:tabular-nums}
.rs-desk{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:clamp(8px,3vw,48px);padding:0 clamp(8px,2vw,32px)}
.rs-wrap{height:100%;display:flex;align-items:center;justify-content:center;min-width:0;perspective:1600px}
.rs-sheet{position:relative;height:min(100%,calc((100vw - 220px) * 1.294));aspect-ratio:8.5/11;max-height:100%;background:#fff;box-shadow:0 1px 0 #ddd,0 10px 30px rgba(0,0,0,.35);container-type:inline-size;overflow:hidden;color:#1c1c1c;font-family:var(--serif);transform-origin:0 50%}
.rs-sheet .in{position:absolute;inset:0;overflow-y:auto;padding:9cqi 10cqi 7cqi;display:flex;flex-direction:column}
.rs-sheet .venue{font-size:max(11px,2.3cqi);letter-spacing:.14em;text-transform:uppercase;text-align:center;color:#555}
.rs-sheet h2{font-weight:650;font-size:max(17px,4.9cqi);line-height:1.2;text-align:center;margin:3.6cqi 0 0;text-wrap:balance}
.rs-sheet .by{font-style:italic;font-size:max(12px,2.6cqi);text-align:center;margin-top:2.6cqi;color:#333;line-height:1.45;text-wrap:balance}
.rs-sheet .abs-h{font-size:max(11px,2.3cqi);letter-spacing:.14em;text-transform:uppercase;text-align:center;margin:6cqi 0 2cqi;color:#333}
.rs-sheet .abs{font-size:max(13px,2.85cqi);line-height:1.55;text-align:justify;hyphens:auto;padding:0 3cqi}
.rs-sheet .kw{font-size:max(12px,2.5cqi);line-height:1.5;margin-top:3.4cqi;padding:0 3cqi;color:#333}
.rs-sheet .kw i{font-style:italic}
.rs-sheet .avail{margin-top:auto;padding:5cqi 3cqi 0;font-size:max(12px,2.4cqi);line-height:1.7;color:#333}
.rs-sheet .avail a{color:#1a55a0;text-underline-offset:2px}
.rs-sheet .avail a:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.rs-sheet .folio{text-align:center;font-size:max(11px,2.2cqi);color:#777;margin-top:4cqi}
.rs-sheet.turn-out{animation:rsOut .22s ease-in forwards}
.rs-sheet.turn-in{animation:rsIn .28s ease-out}
.rs-sheet.back.turn-out{animation-name:rsOutB}
.rs-sheet.back.turn-in{animation-name:rsInB}
@keyframes rsOut{to{transform:rotateY(-70deg);opacity:0}}
@keyframes rsIn{from{transform:translateX(30px);opacity:0}}
@keyframes rsOutB{to{transform:translateX(40px);opacity:0}}
@keyframes rsInB{from{transform:rotateY(-70deg);opacity:0}}
.rs-bar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px clamp(16px,3vw,40px)}
@media (max-width:700px){
  .rs-desk{align-items:stretch;padding:0 6px;gap:4px}
  .rs-desk .warrow{align-self:center}
  .rs-wrap{flex:1;align-items:stretch}
  .rs-sheet{height:auto;width:100%;aspect-ratio:auto}
  .rs-sheet .in{padding:28px 20px 22px}
}

/* ---------- Press: headline board ---------- */
.pr{background:#0e2238 linear-gradient(#143152,#0a1828);color:#fff}
.pr-top{flex:0 0 auto;display:flex;align-items:center;gap:18px;padding:18px clamp(16px,4vw,56px) 0;padding-top:max(18px,env(safe-area-inset-top))}
.pr-top h1{font-size:clamp(22px,2.4vw,30px);font-weight:800;letter-spacing:.5px}
.pr-top p{font-size:clamp(13px,1.2vw,16px);color:#9fb6cf;font-weight:500;line-height:1.35}
.pr-top .rule{width:3px;align-self:stretch;background:var(--cyan);border-radius:2px}
.pr-stage{flex:1;min-height:0;display:flex;align-items:center;gap:clamp(8px,3vw,40px);padding:0 clamp(8px,2.5vw,40px)}
.pr-story{flex:1;min-width:0;max-width:1300px;margin:0 auto}
.pr-outlet{font-size:clamp(15px,1.6vw,22px);font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--cyan)}
.pr-head{display:block;margin-top:.5em;font-size:clamp(28px,4.6vw,76px);font-weight:800;line-height:1.12;letter-spacing:-.01em;text-decoration:none;text-wrap:balance;outline:none}
.pr-head:hover,.pr-head:focus-visible{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:8px;text-decoration-color:var(--cyan)}
.pr-story.swap{animation:prSwap .35s ease}
@keyframes prSwap{from{opacity:0;transform:translateY(14px)}}
.pr-index{flex:0 0 auto;display:flex;flex-wrap:wrap;justify-content:center;gap:4px clamp(12px,2vw,30px);padding:0 16px 18px}
.pr-index button{font-size:clamp(13px,1.1vw,16px);font-weight:500;color:#8aa3bf;padding:6px 0;border-bottom:3px solid transparent;outline:none}
.pr-index button:hover,.pr-index button:focus-visible{color:#fff}
.pr-index button[aria-current="true"]{color:#fff;border-bottom-color:var(--cyan)}
.pr-ticker{flex:0 0 auto;height:44px;background:#fff;color:#0e2238;overflow:hidden;position:relative;display:flex;align-items:center}
.pr-ticker .trk{display:flex;white-space:nowrap;animation:prTick 90s linear infinite;will-change:transform}
.pr-ticker span{padding-right:64px;font-size:17px;font-weight:500}
.pr-ticker b{font-weight:800;margin-right:10px}
@keyframes prTick{to{transform:translateX(-50%)}}
.pr-bar{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px clamp(16px,4vw,56px);background:#0a1828}

/* ---------- rd2dnet: package terminal ---------- */
.rd{background:#16181c;color:#d9dce1}
.rd-scroll{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;padding:clamp(24px,5vh,64px) clamp(16px,5vw,80px) 24px;padding-top:max(clamp(24px,5vh,64px),env(safe-area-inset-top))}
.rd-grid{width:100%;max-width:1360px;margin:auto;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:clamp(24px,5vw,80px)}
.rd h1{font-family:var(--mono);font-weight:600;font-size:clamp(40px,6vw,92px);letter-spacing:-.03em;color:#fff;line-height:1}
.rd h1 small{font-size:.32em;font-weight:400;color:#7fd3f2;letter-spacing:0;margin-left:.6em;vertical-align:.9em}
.rd .sub{font-size:clamp(17px,1.6vw,22px);font-weight:500;color:#aeb4bd;margin-top:14px;line-height:1.35}
.rd .body p{font-size:clamp(15px,1.15vw,17px);line-height:1.75;color:#c9cdd3;margin-top:18px;max-width:68ch}
.rd .status{margin-top:22px;padding-left:14px;border-left:3px solid var(--cyan);font-size:clamp(14px,1.1vw,16px);line-height:1.6;color:#e8eaee}
.rd .credit{margin-top:22px;font-size:13.5px;line-height:1.6;color:#878d96;max-width:68ch}
.rd-term{font-family:var(--mono);font-size:clamp(13px,1vw,15px);line-height:1.7}
.rd-term h2{font-family:var(--font);font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#7c828b;margin:0 0 10px}
.rd-term h2:not(:first-child){margin-top:34px}
.rd-cmd{position:relative;background:#0c0d10;border:1px solid #2b2f36;border-radius:8px;padding:12px 70px 12px 14px;color:#e9ecf0;margin-bottom:12px;overflow-wrap:break-word}
.rd-cmd code{font:inherit}
.rd-cmd .lang{display:block;color:#6f7680;font-size:.85em}
.rd-cmd .p{color:var(--cyan);user-select:none}
.rd-cmd button{position:absolute;right:8px;top:8px;font-family:var(--font);font-size:12px;font-weight:500;color:#9aa1ab;padding:2px 8px;border-radius:5px;border:1px solid #333840;outline:none}
.rd-cmd button:hover,.rd-cmd button:focus-visible{color:#fff;border-color:var(--cyan)}
.rd-links a{display:block;color:#e9ecf0;text-decoration:none;padding:3px 0;overflow-wrap:anywhere}

.bn .t{left:0;right:0;text-align:center;font-weight:700;white-space:nowrap}
.bn .pv{display:none}
#pvZoom .bn .pv{display:block}
#pvZoom .bn .tickbar{height:13% !important}
#pvZoom .bn .tick{font-size:5.5cqh !important}
.bn .blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
#pvZoom .bn .kb{animation:kb 14s ease-in-out infinite alternate}
@keyframes kb{to{transform:scale(1.08)}}
.bn .safe{left:50%;top:50%;width:min(100cqw,177.78cqh);height:min(100cqh,56.25cqw);transform:translate(-50%,-50%);container-type:size}
/* phone preview: keep text clear of the side arrows */
.portrait #pvZoom .bn .safe{width:84cqw;height:47.25cqw}
#fader{position:fixed;inset:0;z-index:75;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s ease}
#fader.on{opacity:1;pointer-events:auto}
#musicToggle{width:300px;height:80px;font-size:28px}
.spin{animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ticker{from{transform:translateX(100cqw)}to{transform:translateX(-100%)}}
/* Zach's photo (transparent PNG): head-and-shoulders crop, face centered */
.zw{background:linear-gradient(#e8f3fa,#cfe4f2);overflow:hidden}
.zw::before{content:'';position:absolute;inset:0;background:url(../../images/zwinship.png) 43% 11%/150% auto no-repeat}
/* light gloss over each tile, like the real menu's glassy channel frames */
.ch:not(.empty) .bn::after{content:'';position:absolute;left:0;right:0;top:0;height:48%;background:linear-gradient(rgba(255,255,255,.14),rgba(255,255,255,0));pointer-events:none}

@media (prefers-reduced-motion:reduce){
  .bn *,.spin,.ch.hot,.parrow.show svg,#mailBtn .env,.warn-press{animation:none !important}
  .warn-press{opacity:1}
  #track,#pvZoom,#pages,#bar,#barExt,#pvBottom,#fader,#bubble{transition-duration:.01s !important}
  #sysmenu .sys-row,#content,#menu.boot{animation:none !important}
}
</style>
</head>
<body class="scan">

<div id="root" class="scan">
<div id="barExt"></div>
<div id="stage" class="scan">

  <!-- ===== Health & Safety ===== -->
  <div id="warning" role="button" tabindex="0" aria-label="Press A to continue">

      <svg viewBox="0 0 60 60" aria-hidden="true"><path d="M30 4 57 54H3Z" fill="#222"/><path d="M27.5 20h5l-1 20h-3zM27.5 44h5v5h-5z" fill="#fff"/></svg>
      <span>WARNING-HEALTH AND SAFETY</span>
    </div>
    <div class="warn-rule"></div>
    <div class="warn-body">
      BEFORE BROWSING, READ ZACH'S <b>RÉSUMÉ</b> FOR IMPORTANT INFORMATION ABOUT HIS RESEARCH, PROJECTS AND EXPERIENCE.

  <!-- ===== Wii Menu ===== -->

    <div id="bar">
      <svg class="shape" preserveAspectRatio="none" aria-hidden="true"></svg>
      <div id="clock" aria-hidden="true"></div>
      <div id="date"></div>
      <button class="round-btn" id="wiiBtn" aria-label="Wii Menu options" data-hot><span class="face"><span class="wii-mark-slot"></span></span></button>
      <button id="sdBtn" aria-label="SD Card: résumé" data-hot><svg viewBox="0 0 46 56" aria-hidden="true"><path d="M4 2h26l14 14v36a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z" fill="#cbcccf" stroke="#a9aaae" stroke-width="2"/><g fill="#e9e9eb"><rect x="8" y="6" width="4" height="9" rx="1"/><rect x="14" y="6" width="4" height="9" rx="1"/><rect x="20" y="6" width="4" height="9" rx="1"/><rect x="26" y="6" width="4" height="9" rx="1"/></g><text x="23" y="42" text-anchor="middle" font-family="M PLUS 1p,Arial" font-weight="700" font-size="13" fill="#9a9b9f">SD</text></svg></button>
      <button class="round-btn" id="mailBtn" aria-label="Wii Message Board: contact Zach" data-hot>
        <span class="face"><svg width="58" height="40" viewBox="0 0 96 64" style="position:relative"><path class="env" d="M0 4v8l46.7 22.9c.8.4 1.8.4 2.6 0L96 12V4c0-2.2-1.8-4-4-4H4C1.8 0 0 1.8 0 4z"/><path class="env" d="M46.7 43.8 0 20.5V60c0 2.2 1.8 4 4 4h88c2.2 0 4-1.8 4-4V20.5L49.3 43.8c-.8.4-1.8.4-2.6 0z"/></svg></span>
      </button>

    <div id="bubble" aria-hidden="true"></div>

    <!-- ===== Channel preview ===== -->

      <div id="pvZoom"></div>

      <button class="pvarrow" id="pvR" aria-label="Next channel" data-hot></button>
      <div id="pvBottom" class="scan">
        <button class="pill" id="pvMenu" data-hot>Wii Menu</button>
        <button class="pill" id="pvStart" data-hot>Start</button>
      </div>
    </div>

    <!-- ===== Wii button screen ===== -->
    <div id="sysmenu" class="scan" role="dialog" aria-modal="true" aria-label="Wii Menu options">
      <div class="sys-row">
        <button class="sysbtn" id="sysData" data-hot>Résumé</button>
        <button class="sysbtn" id="sysSettings" data-hot>Main Site</button>
      </div>
      <div class="sys-row" style="gap:40px"><button class="pill" id="musicToggle" data-hot>Music: On</button><button class="pill" id="sysClose" data-hot style="width:300px;height:80px;font-size:32px">Wii Menu</button></div>
    </div>
  </div>
</div>
</div>

<!-- ===== Channel content (full screen, unscaled) ===== -->
<div id="content" role="dialog" aria-modal="true" aria-labelledby="ccTitle"><div id="app"></div></div>

<div id="fader"></div>

<!-- ===== P1 hand pointer ===== -->
<div id="hand" aria-hidden="true">
  <svg viewBox="0 0 58 70">
    <defs><linearGradient id="handG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d4f0fc"/></linearGradient></defs>
    <path d="M14 30V9.5a5 5 0 0 1 10 0V26l.2-1.2a4.6 4.6 0 0 1 9 .2V28a4.6 4.6 0 0 1 9 0v3a4.4 4.4 0 0 1 8.6 1V46c0 11-8 20-20 20h-3C18 66 12 60 8.5 53L3.3 42.5a4.6 4.6 0 0 1 7.6-5L14 41z" fill="url(#handG)" stroke="#2b6fa8" stroke-width="2.6" stroke-linejoin="round"/>
    <path d="M24 26v10M33.2 28v8M42.2 31v6" stroke="#2b6fa8" stroke-width="2" stroke-linecap="round" opacity=".5"/>
    <text x="31" y="56" text-anchor="middle" font-family="M PLUS 1p,Arial" font-weight="700" font-size="15" fill="#2b6fa8">1</text>
  </svg>
</div>

<script src="../shared/data.js"></script>
<script>
const ASSET = '../../';

/* An upright, rounded "Wii" wordmark drawn as strokes (not the official logo file). */
const WII_MARK = (col='#a5a6aa') => `<svg class="wii-mark" viewBox="0 0 100 44" aria-hidden="true"><g fill="none" stroke="${col}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 10l9 28 9-22 9 22 9-28"/><path d="M62 20v18M84 20v18"/></g><circle cx="62" cy="9" r="4.6" fill="${col}"/><circle cx="84" cy="9" r="4.6" fill="${col}"/></svg>`;
document.querySelector('.wii-mark-slot').outerHTML = WII_MARK();

/* =====================================================================
   BANNERS: each channel has its own banner, made from a real photo or
   from type set in that channel's own style. Lines marked `.pv` only show
   in the zoomed preview.
   ===================================================================== */
const PV = (txt, css) => `<div class="pv" style="${css};font-size:5.5cqh;font-weight:500;line-height:1.5">${txt}</div>`;
// bg fills the whole banner; content sits in a centered 16:9 box so it
// keeps its layout on wide (preview) and narrow (phone preview) shapes.
const BN = (bg, inner) => `${bg}<div class="safe">${inner}</div>`;
const RESUME = ASSET+'about_me/resume.pdf', RESUME_IMG = 'resume-page.jpg', TRANSCRIPT = ASSET+'about_me/transcript.pdf';
const NBER = byId('nber');
const B = {
research: () => BN('<div style="inset:0;background:#fbfaf7"></div>', `
  <div class="t" style="top:15cqh;font:500 4.6cqh/1 var(--serif);letter-spacing:.5cqh;text-transform:uppercase;color:#6a6a6a">NBER Working Paper No. 35414</div>
  <div style="left:9cqw;right:9cqw;top:29cqh;text-align:center;font:620 11cqh/1.13 var(--serif);color:#1c1c1c">Congestion Pricing and EMS Response Time</div>
  <div class="t" style="top:72cqh;font:italic 400 6cqh/1 var(--serif);color:#3a3a3a">Evidence From New York City</div>`),

rd2dnet: () => BN('<div style="inset:0;background:#16181c"></div>', `
  <div style="left:9cqw;top:22cqh;font:600 19cqh/1 var(--mono);letter-spacing:-.6cqh;color:#fff">rd2dnet</div>
  <div style="left:9cqw;top:58cqh;font:400 6.8cqh/1 var(--mono);color:#8fd8f5;white-space:nowrap">$ pip install rd2dnet<span class="blink" style="position:relative;display:inline-block;width:3.6cqh;height:7cqh;margin-left:1cqh;vertical-align:-1cqh;background:#8fd8f5"></span></div>`),

zach: () => BN('<div style="inset:0;background:linear-gradient(#bfe3f7,#eef8fd 80%)"></div>', `
  <div style="right:2cqw;bottom:0;height:96cqh;width:91cqh;background:url(${ASSET}images/zwinship.png) right bottom/contain no-repeat"></div>
  <div style="left:8cqw;top:30cqh;font-size:15cqh;font-weight:800;color:#2d2f33;line-height:1">Zach<br>Winship</div>
  ${PV(PROFILE.now.replace(', finishing May 2027.',''), 'left:8cqw;right:52cqw;top:68cqh;color:#1f7fae;line-height:1.35')}`),

resume: () => BN('<div style="inset:0;background:linear-gradient(#e6e7ea,#d4d6da)"></div>', `
  <img src="${RESUME_IMG}" alt="" style="left:50%;top:9cqh;width:66cqw;height:auto;transform:translateX(-50%);box-shadow:0 .6cqh 2.4cqh rgba(0,0,0,.25)">`),

press: () => BN(`<div style="inset:0;background:linear-gradient(#143152,#0a1828)"></div>
  <div class="tickbar" style="left:0;right:0;bottom:0;height:17%;background:#fff;overflow:hidden">
    <div class="tick" style="left:0;top:0;height:100%;display:flex;align-items:center;white-space:nowrap;font-size:7.5cqh;font-weight:700;color:#0e2238;animation:ticker 30s linear -6s infinite">${MEDIA.map(m=>m[1]).join('<span style="position:static;display:inline-block;width:9cqh"></span>')}</div>
  </div>`, `
  <div style="left:8cqw;top:14cqh;font-size:5.4cqh;font-weight:700;letter-spacing:.6cqh;color:#34beed">PROMARKET</div>
  <div style="left:8cqw;right:8cqw;top:25cqh;font-size:10.5cqh;font-weight:800;line-height:1.12;color:#fff">New York's congestion toll helped ambulances move faster</div>`),

experience: () => BN('<div style="inset:0;background:#f7f7f5"></div>', `
  <div style="left:8cqw;top:15cqh;font-size:11.5cqh;font-weight:800;color:#2d2f33;white-space:nowrap">Research Assistant</div>
  <div style="left:8cqw;top:33cqh;font-size:11.5cqh;font-weight:800;color:#a9abb0;white-space:nowrap">Teaching Assistant</div>
  <div style="left:8cqw;top:51cqh;font-size:11.5cqh;font-weight:800;color:#d0d1d4;white-space:nowrap">Regulatory Data Intern</div>
  <div style="left:8cqw;top:75cqh;font-size:5.6cqh;font-weight:700;color:#1f7fae">New York University</div>`),

led: () => `<img src="${ASSET}images/mbta_led_build.jpg" alt="" class="kb" style="inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 22%">`,

octa: () => BN('<div style="inset:0;background:#0c0c0e radial-gradient(ellipse 70% 60% at 50% 0,rgba(200,30,30,.5),transparent 70%)"></div>', `
  <div class="t" style="top:20cqh;font:700 21cqh/1 var(--fight);letter-spacing:.4cqh;color:#fff">OCTASTATS</div>
  <div style="left:50%;top:52cqh;width:24cqh;height:1.2cqh;margin-left:-12cqh;background:#d42020"></div>
  <div class="t" style="top:62cqh;font:500 6cqh/1 var(--fight);letter-spacing:1.2cqh;color:#c9c9cf">UFC MODEL V2</div>`),

chesque: () => BN('<div style="inset:0;background:#141826 repeating-conic-gradient(#1c2133 0 25%,#141826 0 50%) 50% 50%/25cqh 25cqh"></div>', `
  <div class="t" style="top:30cqh;font-size:21cqh;font-weight:800;color:#f1e9d8;letter-spacing:-.4cqh;text-shadow:0 .6cqh 2cqh rgba(0,0,0,.6)">Ches<span style="position:static;color:#f0a53a">que</span></div>
  ${PV('Chess rules, but every piece is a hero', 'left:0;right:0;text-align:center;top:64cqh;color:#cfc6b3')}`),

tape: () => BN('<div style="inset:0;background:linear-gradient(100deg,#b61f24 0 50%,#1f4fa6 50%)"></div>', `
  <div class="t" style="top:15cqh;font:700 22cqh/.95 var(--fight);color:#fff;text-shadow:0 .8cqh 0 rgba(0,0,0,.18)">TALE OF<br>THE TAPE</div>
  <div class="t" style="top:68cqh;font:500 5.6cqh/1 var(--fight);letter-spacing:1.2cqh;color:#fff">UFC DAILY</div>`),

micro: () => BN('<div style="inset:0;background-color:#fcfdfe;background-image:linear-gradient(#d4e4f1 1px,transparent 1px),linear-gradient(90deg,#d4e4f1 1px,transparent 1px);background-size:9cqh 9cqh"></div>', `
  <div style="left:8cqw;top:25cqh;font-size:9cqh;font-weight:700;color:#4a7fb1">Intermediate</div>
  <div style="left:8cqw;top:37cqh;font-size:14.5cqh;font-weight:800;color:#1b2b44;letter-spacing:-.3cqh">Microeconomics</div>
  ${PV('Course website, built with Professor Naveen Sunder', 'left:8cqw;top:62cqh;color:#33445e')}`),

blog: () => BN('<div style="inset:0;background:#1c3327"></div>', `
  <div style="left:9cqw;top:20cqh;font:italic 600 16cqh/1 var(--serif);color:#efe8d6">Unlikely<br>Instruments</div>
  <div style="left:9cqw;top:72cqh;font-size:5.4cqh;font-weight:700;letter-spacing:.5cqh;color:#a9c3a6">BLOG, FIRST POST EARLY 2027</div>`),
};

/* =====================================================================
   CHANNEL APPS
   ===================================================================== */
const plain = s => String(s || '').replace(/\s*·\s*/g, ', ');
const coarse = matchMedia('(pointer:coarse)').matches;
const BACK = (cls='') => `<button class="wm ${cls}" data-back>Wii Menu</button>`;
const ARR = (d, label) => `<button class="warrow ${d<0?'prev':'next'}" data-nav="${d}" aria-label="${label}">${ARROW_SVG}</button>`;
const PILL = (href, label, cls='') => `<a class="wm ${cls}" href="${href}" ${href.startsWith('mailto:')?'':'target="_blank" rel="noopener"'}>${label}</a>`;
const PHOTO = (cls='') => `<div class="zw ${cls}" role="img" aria-label="Photo of ${PROFILE.name}"></div>`;
const yearOf = s => (String(s).match(/\d{4}/) || [''])[0];
function swapAnim(el, cls){ if (reduced || !el) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

/* --- Research: one paper per page, turned with the arrows --- */
const PAPERS = RESEARCH.filter(p => p.id !== 'micro');
let rsI = 0;
const rsPage = (p, i) => `<div class="in">
  <div class="venue">${p.soon ? 'In progress' : p.badge ? p.badge.replace('WP No.','Working Paper No.') + ', ' + p.year : p.year}</div>
  <h2>${p.title}</h2>
  ${p.coauthors ? `<div class="by">With ${p.coauthors}</div>` : ''}
  <div class="abs-h">Abstract</div>
  <p class="abs">${p.body}</p>
  <p class="kw"><i>Keywords:</i> ${plain(p.meta)}</p>
  ${p.links.length ? `<div class="avail">Available at:<br>${p.links.map(l=>`<a href="${l[0]}" target="_blank" rel="noopener">${l[1]}</a>`).join('<br>')}</div>` : '<div class="avail"></div>'}
  <div class="folio">${i+1}</div></div>`;
function rsPaint(){
  const p = PAPERS[rsI], app = document.getElementById('app');
  app.querySelector('.rs-sheet').innerHTML = rsPage(p, rsI);
  app.querySelector('.rs-sheet .in').scrollTop = 0;
  app.querySelector('.rs-count').textContent = `${rsI+1} / ${PAPERS.length}`;
  app.querySelector('.rs-sheet').setAttribute('aria-label', `Paper ${rsI+1} of ${PAPERS.length}`);
  const open = app.querySelector('#rsOpen');
  if (p.links.length){ open.href = p.links[0][0]; open.textContent = 'Open ' + p.links[0][1].replace(/^Paper$/,'paper'); open.style.visibility = ''; }
  else open.style.visibility = 'hidden';
  app.querySelector('.warrow.prev').disabled = rsI === 0;
  app.querySelector('.warrow.next').disabled = rsI === PAPERS.length-1;
}

/* --- Press: one headline at a time --- */
let prI = 0;
function prPaint(anim){
  const m = MEDIA[prI], app = document.getElementById('app');
  const st = app.querySelector('.pr-story');
  st.innerHTML = `<div class="pr-outlet">${m[1]}</div><a class="pr-head" href="${m[0]}" target="_blank" rel="noopener">${m[2]}</a>`;
  if (anim) swapAnim(st, 'swap');
  app.querySelectorAll('.pr-index button').forEach((b,i) => b.setAttribute('aria-current', i===prI));
  app.querySelector('#prRead').href = m[0];
  app.querySelector('.warrow.prev').disabled = prI === 0;
  app.querySelector('.warrow.next').disabled = prI === MEDIA.length-1;
}

/* --- Experience: oldest on the left, newest on the right --- */
const JOBS = [...EXPERIENCE].reverse();
let exI = JOBS.length - 1;
function exPaint(anim){
  const e = JOBS[exI], app = document.getElementById('app');
  const c = app.querySelector('.ex-card');
  c.innerHTML = `<div class="when">${e.when}</div><h2>${e.role}</h2><div class="org">${e.org}</div><p>${e.body}</p>
    ${e.links ? `<div class="lk">${e.links.map(l=>`<a href="${l[0]}" target="_blank" rel="noopener">${l[1]}</a>`).join('')}</div>` : ''}`;
  if (anim) swapAnim(c, 'swap');
  app.querySelectorAll('.ex-rail button').forEach((b,i) => b.setAttribute('aria-current', i===exI));
}

/* --- Resume viewer zoom --- */
const ZOOMS = [1, 1.5, 2.2];
let rvZ = 0;
function rvPaint(){
  const app = document.getElementById('app'), img = app.querySelector('.rv-view img'); if (!img) return;
  img.style.height = `calc((100% - 40px) * ${ZOOMS[rvZ]})`;
  app.querySelector('#rvOut').disabled = rvZ === 0; app.querySelector('#rvIn').disabled = rvZ === ZOOMS.length-1;
  app.querySelector('.rv-zoom span').textContent = Math.round(ZOOMS[rvZ]*100) + '%';
}
// Use the browser's own PDF viewer where there is one; otherwise show the page as an image.
const PDF_INLINE = navigator.pdfViewerEnabled === true && !coarse;

const SCREENS = {
  research: {
    html: () => `<div class="rs">
      <header class="rs-top"><h1 id="ccTitle" tabindex="-1">Research</h1><span class="rs-count"></span></header>
      <div class="rs-desk">${ARR(-1,'Previous paper')}<div class="rs-wrap"><article class="rs-sheet"></article></div>${ARR(1,'Next paper')}</div>
      <footer class="rs-bar">${BACK()}<a class="wm" id="rsOpen" target="_blank" rel="noopener">Open</a></footer></div>`,
    init: () => { rsI = 0; rsPaint(); },
    nav: d => {
      const n = rsI + d; if (n < 0 || n >= PAPERS.length) return;
      SFX.page(d); const sh = document.querySelector('.rs-sheet');
      if (reduced){ rsI = n; rsPaint(); return; }
      sh.classList.toggle('back', d < 0); sh.classList.remove('turn-in'); sh.classList.add('turn-out');
      setTimeout(() => { rsI = n; rsPaint(); sh.classList.remove('turn-out'); void sh.offsetWidth; sh.classList.add('turn-in'); }, 210);
    },
  },

  press: {
    html: () => `<div class="pr">
      <header class="pr-top"><h1 id="ccTitle" tabindex="-1">Press</h1><span class="rule"></span><p>Coverage of ${NBER.title.split(':')[0]},<br>NBER Working Paper No. 35414</p></header>
      <main class="pr-stage">${ARR(-1,'Previous story')}<div class="pr-story" aria-live="polite"></div>${ARR(1,'Next story')}</main>
      <nav class="pr-index" aria-label="Outlets">${MEDIA.map((m,i)=>`<button data-i="${i}">${m[1]}</button>`).join('')}</nav>
      <div class="pr-ticker" aria-hidden="true"><div class="trk">${[0,1].map(()=>MEDIA.map(m=>`<span><b>${m[1]}</b>${m[2]}</span>`).join('')).join('')}</div></div>
      <footer class="pr-bar">${BACK('glass')}<a class="wm glass" id="prRead" target="_blank" rel="noopener">Read story</a></footer></div>`,
    init: app => { prI = 0; prPaint(false); app.querySelectorAll('.pr-index button').forEach(b => b.onclick = () => { const i = +b.dataset.i; if (i !== prI){ prI = i; SFX.page(1); prPaint(true); } }); },
    nav: d => { const n = prI + d; if (n < 0 || n >= MEDIA.length) return; prI = n; SFX.page(d); prPaint(true); },
  },

  rd2dnet: {
    html: () => { const s = SOFTWARE.body.split(/(?<=\.) /); return `<div class="rd"><div class="rd-scroll"><div class="rd-grid">
      <div><h1 id="ccTitle" tabindex="-1">rd2dnet<small>${SOFTWARE.badge}</small></h1>
        <div class="sub">${SOFTWARE.title.replace(/^rd2dnet: /,'')}</div>
        <div class="body"><p>${s.slice(0,2).join(' ')}</p><p>${s.slice(2).join(' ')}</p></div>
        <div class="status">${SOFTWARE.status}</div>
        <p class="credit">${SOFTWARE.credit}</p></div>

/* =====================================================================
   SOUND: all synthesized
   ===================================================================== */
let AC = null, noiseBuf = null, jingleGain = null;
function audio(){
  if (!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)();
    noiseBuf = AC.createBuffer(1, AC.sampleRate*.5, AC.sampleRate); const d = noiseBuf.getChannelData(0); for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1; }catch(e){} }
  return AC;
}
function tone(freq, dur=.06, type='sine', vol=.05, when=0, slide=0, dest){
  const ac = audio(); if(!ac) return;
  const t = ac.currentTime + when, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(freq*slide, t+dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t+.008); g.gain.exponentialRampToValueAtTime(.0001, t+dur);
  o.connect(g).connect(dest||ac.destination); o.start(t); o.stop(t+dur+.02);
}
function noise(dur, f0, f1, vol=.03, q=2){
  const ac = audio(); if(!ac) return;
  const t = ac.currentTime, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = noiseBuf; f.type = 'bandpass'; f.Q.value = q;
  f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t+dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t+dur*.3); g.gain.exponentialRampToValueAtTime(.0001, t+dur);
  s.connect(f).connect(g).connect(ac.destination); s.start(t); s.stop(t+dur+.02);
}
const SFX = {
  hover: () => { noise(.025, 3200, 2800, .05, 6); tone(1250,.04,'sine',.018); },
  select: () => { tone(520,.16,'sine',.05,0,1.9); tone(1600,.03,'triangle',.02); },
  back: () => tone(900,.15,'sine',.045,0,.55),
  page: (dir=1) => dir>0 ? noise(.26, 500, 2200, .05, 1.2) : noise(.26, 2200, 500, .05, 1.2),
  start: () => { tone(660,.25,'sine',.05,0,1.5); tone(1320,.2,'triangle',.02,.05); },
  press: () => tone(1500,.03,'triangle',.03),
};
const NOTE = n => { const m = /^([A-G])(#?)(\d)$/.exec(n); if (!m) return 0; const i = {C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]] + (m[2]?1:0); return 440*Math.pow(2,(i + (m[3]-4)*12 - 9)/12); };
function playJingle(str){
  const ac = audio(); if (!ac || !str) return;
  stopJingle();
  jingleGain = ac.createGain(); jingleGain.gain.value = 1; jingleGain.connect(ac.destination);
  let t = 0; const beat = .16;
  str.split(' ').forEach(n => { if (n !== '.'){ const f = NOTE(n); tone(f, .3, 'triangle', .045, t, 0, jingleGain); tone(f*2, .12, 'sine', .012, t, 0, jingleGain); } t += beat; });
}
/* Original ambient menu loop (not Nintendo's music): a soft Cmaj7, Am7, Dm7, G7
   arpeggio through a lowpass, scheduled a little ahead of the audio clock. */
let musicOn = true, musicGain = null, musicT = null, musicNext = 0, musicStep = 0;
try{ musicOn = localStorage.getItem('wiiMusic') !== 'off'; }catch(e){}
const MUSIC = ['C4 E4 G4 B4 E5 B4 G4 E4','A3 C4 E4 G4 C5 G4 E4 C4','D4 F4 A4 C5 F5 C5 A4 F4','G3 B3 D4 F4 B4 F4 D4 B3'].map(b=>b.split(' ').map(NOTE));
function startMusic(){
  const ac = audio(); if (!ac || musicGain) return;
  const lp = ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = 1800;
  musicGain = ac.createGain(); musicGain.gain.value = musicOn ? 1 : 0;
  musicGain.connect(lp).connect(ac.destination);
  musicNext = ac.currentTime + .1;
  musicT = setInterval(() => {
    while (musicNext < ac.currentTime + .6){
      const bar = MUSIC[Math.floor(musicStep/8) % 4], f = bar[musicStep % 8];
      const when = musicNext - ac.currentTime;
      tone(f, .55, 'triangle', .016, when, 0, musicGain);
      if (musicStep % 8 === 0) tone(f/2, 1.6, 'sine', .014, when, 0, musicGain);
      musicNext += .3; musicStep++;
    }
  }, 150);
}
function duckMusic(down){ if (!musicGain || !musicOn) return; musicGain.gain.setTargetAtTime(down ? 0 : 1, AC.currentTime, .12); }
function stopJingle(){ if (jingleGain){ try{ jingleGain.gain.setTargetAtTime(0, AC.currentTime, .05); }catch(e){} jingleGain = null; } }

/* =====================================================================
   LAYOUT: 16:9 (and wider), 4:3, and a portrait mode for phones.
   ===================================================================== */
let L;
function computeLayout(){
  const a = innerWidth / innerHeight;
  if (a < .9){
    const W = 720, H = Math.round(Math.max(1100, Math.min(1700, W/a))), cols = 2, rows = 4, gx = 16, gy = 18, mx = 60;
    const tw = (W - 2*mx - gx*(cols-1)) / cols, th = 188, gridH = rows*th + (rows-1)*gy;
    const barTop = H - 200, top = Math.max(60, Math.round((barTop - gridH)*.5));
    const zh = 470;
    return { mode:'portrait', W, H, cols, rows, per:cols*rows, gx, gy, mx, tw, th, top, barTop, s:190, zoom:{l:0,t:Math.round((H-148-zh)/2),w:720,h:zh}, arrowY:top + gridH/2 - 41 };
  }
  const H = 720, W = Math.round(Math.max(960, Math.min(1280, H*a)));
  const cols = 4, rows = 3, gx = 14, gy = 12, mx = Math.round(W*.074);
  const tw = (W - 2*mx - gx*(cols-1)) / cols, th = 156;
  return { mode:'land', W, H, cols, rows, per:cols*rows, gx, gy, mx, tw, th, top:40, barTop:H-200, s:204, zoom:{l:0,t:0,w:W,h:572}, arrowY:40 + (rows*th+(rows-1)*gy)/2 - 41 };
}
const stage = document.getElementById('stage'), track = document.getElementById('track'), pagesEl = document.getElementById('pages');

function barPath(W, s){
  const d = s + (W/2 - s)*.55, k = (d - s)/238;
  const X = v => (s + v*k).toFixed(1), R = v => (W - s - v*k).toFixed(1);
  return `M0,44 H${s} C${X(32)},44 ${X(71)},44 ${X(118)},84 C${X(150)},112 ${X(180)},130 ${X(238)},130 H${R(238)} C${R(180)},130 ${R(150)},112 ${R(118)},84 C${R(71)},44 ${R(32)},44 ${W-s},44 H${W}`;
}
function buildBar(){

      <linearGradient id="tabG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dcdcdf"/><stop offset="1" stop-color="#d0d0d3"/></linearGradient>
      <filter id="tabShadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="1" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity=".1"/></filter></defs>
    <path fill="url(#barG)" d="${top} V200 H0 Z"/>
    <path fill="none" stroke="#34beed" stroke-width="3" d="${top}"/>
    <path filter="url(#tabShadow)" fill="url(#tabG)" d="M0,61 H118 C155,61 186,92 186,130 C186,168 155,199 118,199 H0 Z"/>
    <path filter="url(#tabShadow)" fill="url(#tabG)" d="M${W},61 H${W-118} C${W-155},61 ${W-186},92 ${W-186},130 C${W-186},168 ${W-155},199 ${W-118},199 H${W} Z"/>`;
  Object.assign(bar.style, { top:L.barTop+'px', width:W+'px' });
  const sd = document.getElementById('sdBtn');
  sd.style.left = '212px'; sd.style.display = L.mode==='portrait' ? 'none' : '';
  document.getElementById('clock').style.transform = L.mode==='portrait' ? 'scale(.85)' : '';
}
function buildGrid(){
  PAGES = Math.ceil(CHANNELS.length / L.per);

  Object.assign(pagesEl.style, { width:L.W+'px', height:(L.barTop+60)+'px' });

  for (let p=0; p<PAGES; p++){
    const pg = document.createElement('div'); pg.className='page'; pg.style.width = L.W+'px';
    const grid = document.createElement('div'); grid.className = 'grid' + (L.tw/L.th < 1.6 ? ' narrow' : '');
    Object.assign(grid.style, { left:L.mx+'px', top:L.top+'px', gridTemplateColumns:`repeat(${L.cols},${L.tw}px)`, gridTemplateRows:`repeat(${L.rows},${L.th}px)`, gap:`${L.gy}px ${L.gx}px` });
    for (let s=0; s<L.per; s++){
      const idx = p*L.per+s, ch = CHANNELS[idx];
      const el = document.createElement('button');
      if (ch){
        el.className = 'ch'; el.dataset.hot = ''; el.dataset.idx = idx;
        el.setAttribute('aria-label', ch.name);
        el.innerHTML = `<div class="bn">${B[ch.art]()}</div>`;

        tiles[idx] = el;
      } else {
        el.className = 'ch empty'; el.tabIndex = -1; el.setAttribute('aria-hidden','true');
        el.innerHTML = `<div class="bn"><span style="position:static;display:contents">${WII_MARK('#d0d1d4')}</span></div>`;
      }
      grid.appendChild(el);
    }
    pg.appendChild(grid); track.appendChild(pg);
  }
  const ax = Math.max(6, L.mx/2-23);
  document.getElementById('arrL').style.cssText = `left:${ax}px;top:${L.arrowY}px`;
  document.getElementById('arrR').style.cssText = `right:${ax}px;top:${L.arrowY}px`;
  ['pvL','pvR'].forEach(id => document.getElementById(id).style.top = (L.zoom.t + L.zoom.h/2 - 41)+'px');
  document.getElementById('pvL').style.left = '22px'; document.getElementById('pvR').style.right = '22px';
  if (typeof pauseSMIL === 'function') pauseSMIL(track);
}
function unscroll(){ for (const el of [document.getElementById('root'), stage, pagesEl]) { el.scrollTop = 0; el.scrollLeft = 0; } }
function fit(){
  unscroll();
  const w = innerWidth, h = innerHeight;
  SCALE = Math.min(w/L.W, h/L.H);
  OX = (w - L.W*SCALE)/2;
  OY = h - L.H*SCALE;              // bottom-align so the bar always touches the bottom edge
  Object.assign(stage.style, { width:L.W+'px', height:L.H+'px', transform:`translate(${OX}px,${OY}px) scale(${SCALE})` });
  // Extend the bar beyond the stage on ultra-wide screens
  if (OX > 1 && L.mode!=='portrait'){ barExt.style.display='block'; barExt.style.height = ((200-44)*SCALE)+'px'; }
  else barExt.style.display='none';
}
function relayout(force){
  const next = computeLayout(), prevMode = L && L.mode;
  const changed = force || !L || next.mode!==L.mode || next.W!==L.W || next.H!==L.H;
  L = next;
  document.body.classList.toggle('portrait', L.mode==='portrait');
  if (changed){
    const keep = state==='preview' && prevMode===L.mode;
    if (!keep && (state==='preview' || state==='opening' || state==='closing')) forceClosePreview();
    if (state==='content' && contentFrom==='preview') camera(false);
    buildBar(); buildGrid(); setPage(keep ? Math.floor(current/L.per) : Math.min(page, PAGES-1), true, true);
    if (keep){ [pagesEl, bar, barExt, pvZoom].forEach(el => el.style.transition='none'); placeZoom(L.zoom, 0); camera(true, current); pvZoom.offsetWidth; [pagesEl, bar, barExt, pvZoom].forEach(el => el.style.transition=''); }
  }
  fit();
}

/* =====================================================================
   ARROWS, CLOCK
   ===================================================================== */
const ARROW_SVG = `<svg viewBox="0 0 55 98" aria-hidden="true"><defs><radialGradient id="arG" cx="24" cy="49" r="45" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#cbf6ff"/><stop offset="1" stop-color="#62d6ff"/></radialGradient></defs><path d="M4.16 2.07 52.25 48.28a1 1 0 0 1 0 1.44L4.16 95.93c-.7.66-1.84.07-1.68-.88L9.92 49 2.48 2.95c-.16-.95.98-1.54 1.68-.88Z" fill="url(#arG)" stroke="#24479b" stroke-width="3"/></svg>`;
['arrL','arrR','pvL','pvR'].forEach(id => document.getElementById(id).innerHTML = ARROW_SVG);

const SEG = {0:'1111110',1:'0110000',2:'1101101',3:'1111001',4:'0110011',5:'1011011',6:'1011111',7:'1110000',8:'1111111',9:'1111011'};
// thinner, slightly rounded segments
const SEG_POLY = ['M8,3 H28 L25,6.5 H11 Z','M30,5 V29 L26.5,26.5 V8.5 Z','M30,35 V59 L26.5,55.5 V37.5 Z','M8,61 H28 L25,57.5 H11 Z','M6,35 V59 L9.5,55.5 V37.5 Z','M6,5 V29 L9.5,26.5 V8.5 Z','M8.5,32 L11,29.8 H25 L27.5,32 L25,34.2 H11 Z'];
const SEG_COL = '#a5a7ab';
const digitSVG = (ch, x) => `<g transform="translate(${x},0)">${SEG_POLY.map((d,i)=>(SEG[ch]||'0000000')[i]==='1'?`<path d="${d}" fill="${SEG_COL}" stroke="${SEG_COL}" stroke-width="1" stroke-linejoin="round"/>`:'').join('')}</g>`;
let colon = true;
function tick(){
  const now = new Date();
  let h = now.getHours(); const m = now.getMinutes();
  const ampm = h>=12 ? 'PM' : 'AM'; h = h%12 || 12;
  const hs = String(h), ms = String(m).padStart(2,'0');
  let x = 0, svg = '';
  for (const c of hs){ svg += digitSVG(c, x); x += 38; }
  svg += `<g opacity="${colon?1:.12}"><rect x="${x+1}" y="20" width="6" height="6" rx="2" fill="${SEG_COL}"/><rect x="${x+1}" y="40" width="6" height="6" rx="2" fill="${SEG_COL}"/></g>`; x += 14;
  svg += digitSVG(ms[0], x); x += 38; svg += digitSVG(ms[1], x); x += 38;
  svg += `<text x="${x+3}" y="17" font-family="M PLUS 1p,Arial" font-weight="500" font-size="13" fill="${SEG_COL}">${ampm}</text>`; x += 28;
  document.getElementById('clock').innerHTML = `<svg viewBox="0 0 ${x} 64" width="${x}" height="62">${svg}</svg>`;
  document.getElementById('date').textContent = `${now.toLocaleDateString('en-US',{weekday:'short'})} ${now.getMonth()+1}/${now.getDate()}`;
  colon = !colon;
}
tick(); setInterval(tick, 1000);

/* =====================================================================
   HAND POINTER + HOVER
   ===================================================================== */
const fine = matchMedia('(hover:hover) and (pointer:fine)').matches;
const reduced = matchMedia('(prefers-reduced-motion:reduce)').matches;
const hand = document.getElementById('hand');
if (fine) document.documentElement.classList.add('has-hand');
let mx = innerWidth/2, my = innerHeight/2, hx = mx, hy = my, roll = 0, lastMove = 0, lastKey = false;
addEventListener('pointermove', e => { mx = e.clientX; my = e.clientY; lastMove = performance.now(); lastKey = false; });
addEventListener('pointerdown', () => { lastKey = false; }, true);
addEventListener('keydown', () => { lastKey = true; }, true);
addEventListener('pointerdown', () => hand.classList.add('press'));
addEventListener('pointerup', () => hand.classList.remove('press'));
(function loop(){
  const k = reduced ? 1 : .7;
  hx += (mx-hx)*k; hy += (my-hy)*k;
  // A gentle "roll" toward where you point that settles upright when the hand rests.
  const target = performance.now() - lastMove < 300 ? (mx/innerWidth - .5) * 12 : 0;
  roll += (target - roll) * .08;
  hand.style.transform = `translate(${hx}px,${hy}px) rotate(${roll}deg)`;
  requestAnimationFrame(loop);
})();

let hotEl = null;
const bubble = document.getElementById('bubble');
function setHot(el, silent){
  if (el === hotEl) return;
  if (hotEl) hotEl.classList.remove('hot');
  hotEl = el;
  if (el){ el.classList.add('hot'); if (started && !silent) SFX.hover(); }
  updateBubble();
}
function updateBubble(){
  if (hotEl && hotEl.classList.contains('ch') && state==='menu'){
    const idx = +hotEl.dataset.idx, ch = CHANNELS[idx];
    bubble.textContent = ch.name;
    const s = idx % L.per, col = s % L.cols, row = Math.floor(s / L.cols);
    const cx = L.mx + col*(L.tw+L.gx) + L.tw/2, by = L.top + (row+1)*L.th + row*L.gy;
    const half = bubble.offsetWidth/2 || 120;
    bubble.style.left = Math.max(half+10, Math.min(L.W-half-10, cx)) + 'px';
    bubble.style.top = Math.min(by - 8, L.barTop - 46) + 'px';
    bubble.classList.add('on');
  } else bubble.classList.remove('on');
}
document.addEventListener('pointerover', e => {
  if (e.pointerType === 'touch' || ['opening','closing','leaving'].includes(state)) return;
  const el = e.target.closest('[data-hot]');
  const next = el && !el.disabled && el.offsetParent !== null ? el : null;
  if (next !== hotEl && document.activeElement && document.activeElement !== document.body && document.activeElement.closest('#stage')) document.activeElement.blur();
  setHot(next);
});
document.documentElement.addEventListener('mouseleave', () => { setHot(null); hand.style.opacity = 0; });
document.documentElement.addEventListener('mouseenter', () => { hand.style.opacity = ''; });
document.addEventListener('focusin', e => { if (!lastKey) return; const el = e.target.closest('[data-hot]'); if (el) setHot(el, true); });

/* =====================================================================
   STATE MACHINE: warning, menu, opening, preview, content; closing
   returns from preview to menu.
   ===================================================================== */
let state = 'warning', started = false, page = 0, current = -1, pvTimer = null;
const menu = document.getElementById('menu'), warning = document.getElementById('warning');

let pressReady = reduced;
document.querySelector('.warn-press').addEventListener('animationend', () => { pressReady = true; });
setTimeout(() => { pressReady = true; }, 3000);
function startMenu(){
  if (started || !pressReady) return;   // A is only accepted once the prompt has appeared
  started = true; audio(); SFX.press(); setTimeout(startMusic, 900);
  warning.classList.add('gone');
  menu.style.visibility = 'visible'; menu.classList.add('boot');
  state = 'menu';
  setTimeout(()=>{ warning.remove(); }, 700);
}
warning.addEventListener('click', startMenu);

/* --- paging --- */
const arrL = document.getElementById('arrL'), arrR = document.getElementById('arrR');
function setPage(p, silent, instant){
  const prev = page;
  page = Math.max(0, Math.min(PAGES-1, p));
  if (instant){ track.style.transition='none'; }
  track.style.transform = `translateX(${-page*L.W}px)`;
  if (instant){ track.offsetWidth; track.style.transition=''; }
  [...track.children].forEach((pg,i) => pg.inert = i !== page);
  arrL.classList.toggle('show', page>0); arrR.classList.toggle('show', page<PAGES-1);
  if ((document.activeElement===arrL && page===0) || (document.activeElement===arrR && page===PAGES-1)){ const t = tiles[page*L.per]; if (t) t.focus({preventScroll:true}); }
  arrL.disabled = page===0; arrR.disabled = page===PAGES-1;
  if (!silent && page !== prev) SFX.page(page >= prev ? 1 : -1);
  setHot(null);
}
arrL.onclick = () => setPage(page-1);
arrR.onclick = () => setPage(page+1);

/* --- preview: the menu "camera" pushes into the tile while its banner grows --- */
const preview = document.getElementById('preview'), pvZoom = document.getElementById('pvZoom');
preview.inert = true;
function tileRect(idx){
  const s = idx % L.per, col = s % L.cols, row = Math.floor(s / L.cols);
  const w = L.tw-12, h = L.tw/L.th < 1.6 ? w*9/16 : L.th-12;
  return { l:L.mx + col*(L.tw+L.gx) + 6, t:L.top + row*(L.th+L.gy) + (L.th-h)/2, w, h };
}
function placeZoom(r, radius){ Object.assign(pvZoom.style, { left:r.l+'px', top:r.t+'px', width:r.w+'px', height:r.h+'px', borderRadius:radius+'px' }); }
function camera(on, idx){
  if (on){
    const r = tileRect(idx);
    pagesEl.style.transformOrigin = `${r.l + r.w/2}px ${r.t + r.h/2}px`;
    pagesEl.style.transform = 'scale(3.2)'; pagesEl.style.opacity = '0';
    bar.style.transform = barExt.style.transform = 'translateY(230px)';
    arrL.style.opacity = arrR.style.opacity = '0';
  } else {
    pagesEl.style.transform = ''; pagesEl.style.opacity = '';
    bar.style.transform = barExt.style.transform = ''; arrL.style.opacity = arrR.style.opacity = '';
  }
}
function openPreview(idx, dir){
  current = idx; const ch = CHANNELS[idx];
  if (state === 'menu'){
    state = 'opening'; SFX.select(); bubble.classList.remove('on');
    pvZoom.innerHTML = `<div class="bn">${B[ch.art]()}</div>`;
    pvZoom.style.transition = 'none'; placeZoom(tileRect(idx), 13); pvZoom.offsetWidth; pvZoom.style.transition = '';
    preview.classList.remove('closing'); preview.classList.add('open'); preview.inert = false;
    requestAnimationFrame(() => { placeZoom(L.zoom, 0); camera(true, idx); });
    clearTimeout(pvTimer); duckMusic(true);
    pvTimer = setTimeout(() => { if (state!=='opening') return; state = 'preview'; preview.classList.add('shown'); if (lastKey) document.getElementById('pvStart').focus({preventScroll:true}); playJingle(ch.jingle); }, 480);
  } else if (state === 'preview'){
    SFX.page(); stopJingle();
    pvZoom.innerHTML = `<div class="bn">${B[ch.art]()}</div>`;
    if (!reduced) pvZoom.animate([{opacity:0, transform:`translateX(${dir*60}px)`},{opacity:1, transform:'none'}],{duration:260,easing:'ease-out'});
    setTimeout(()=>{ if (current===idx && state==='preview') playJingle(ch.jingle); }, 200);
  } else return;
  document.getElementById('pvL').style.visibility = idx>0 ? 'visible':'hidden';
  document.getElementById('pvR').style.visibility = idx<CHANNELS.length-1 ? 'visible':'hidden';
  if (document.activeElement && document.activeElement.style.visibility === 'hidden') document.getElementById('pvStart').focus({preventScroll:true});
}
function closePreview(silent){
  if (state !== 'preview' && state !== 'opening') return;
  state = 'closing'; clearTimeout(pvTimer); stopJingle(); if (!silent) SFX.back(); duckMusic(false);
  preview.classList.remove('shown'); preview.classList.add('closing');
  const p = Math.floor(current / L.per); if (p !== page) setPage(p, true, true);
  placeZoom(tileRect(current), 13); camera(false);
  pvTimer = setTimeout(() => {
    preview.classList.remove('open','closing'); preview.inert = true; pvZoom.innerHTML=''; pvZoom.style.width='0';
    state = 'menu';
    if (lastKey && tiles[current]){ tiles[current].focus({preventScroll:true}); setHot(tiles[current], true); }
    else if (!coarse){ const el = document.elementFromPoint(mx, my); const h = el && el.closest('[data-hot]'); setHot(h && !h.disabled ? h : null, true); }
  }, 480);
}
function forceClosePreview(){
  clearTimeout(pvTimer); stopJingle(); camera(false);
  preview.classList.remove('open','shown','closing'); preview.inert = true; pvZoom.innerHTML=''; pvZoom.style.width='0';
  if (state!=='content') state = 'menu';
}
document.getElementById('pvMenu').onclick = closePreview;
document.getElementById('pvL').onclick = () => current>0 && openPreview(current-1, -1);
document.getElementById('pvR').onclick = () => current<CHANNELS.length-1 && openPreview(current+1, 1);
document.getElementById('pvStart').onclick = () => openContent(current);

/* --- channel content --- */
const content = document.getElementById('content'), appEl = document.getElementById('app');
let contentFrom = 'preview', curScreen = null;
function showScreen(key){
  const sc = SCREENS[key]; curScreen = sc;
  appEl.innerHTML = sc.html();
  appEl.firstElementChild.classList.add('app');
  appEl.querySelectorAll('[data-back]').forEach(b => b.onclick = closeContent);
  appEl.querySelectorAll('[data-nav]').forEach(b => b.onclick = () => sc.nav(+b.dataset.nav));
  content.classList.remove('leaving'); content.classList.add('open');
  document.documentElement.classList.add('in-content');
  stage.inert = true;
  if (sc.init) sc.init(appEl);
  setTimeout(()=>{ const t = document.getElementById('ccTitle'); if (t) t.focus({preventScroll:true}); }, 50);
}
const fader = document.getElementById('fader');
function openContent(idx){
  if (state !== 'preview') return;
  const ch = CHANNELS[idx]; SFX.start(); stopJingle();
  state = 'entering'; contentFrom = 'preview';
  fader.classList.add('on');
  setTimeout(() => { state = 'content'; showScreen(ch.screen); fader.classList.remove('on'); unscroll(); }, 260);
}
// "Wii Menu" from inside a channel returns to the channel grid: fade to white,
// then zoom the banner back down into its tile (rebuilt for the current layout).
function closeContent(){
  if (state !== 'content') return;
  state = 'leaving'; SFX.back();
  content.querySelectorAll('video').forEach(v=>v.pause());
  fader.classList.add('on');
  setTimeout(() => {
    content.classList.remove('open'); appEl.innerHTML = ''; curScreen = null;
    document.documentElement.classList.remove('in-content'); stage.inert = false;
    if (contentFrom === 'preview'){
      const ch = CHANNELS[current], p = Math.floor(current / L.per);
      if (p !== page) setPage(p, true, true);
      [pagesEl, bar, pvZoom].forEach(el => el.style.transition = 'none');
      pvZoom.innerHTML = `<div class="bn">${B[ch.art]()}</div>`;
      placeZoom(L.zoom, 0); camera(true, current);
      preview.classList.add('open'); preview.classList.remove('shown'); preview.inert = false;
      pvZoom.offsetWidth;
      [pagesEl, bar, pvZoom].forEach(el => el.style.transition = '');
      fader.classList.remove('on');
      state = 'preview';
      setTimeout(() => closePreview(true), 180);
    } else {
      fader.classList.remove('on');
      state = 'menu'; if (lastKey) document.getElementById('mailBtn').focus({preventScroll:true});
    }
  }, 260);
}

/* --- Wii button / SD / mail --- */
const sys = document.getElementById('sysmenu');
function openSys(){ if(state!=='menu') return; SFX.select(); sys.classList.add('open'); state='sys'; bubble.classList.remove('on'); setHot(null, true); bar.inert = true; pagesEl.style.visibility='hidden'; arrL.style.visibility = arrR.style.visibility = 'hidden'; if (lastKey) document.getElementById('sysData').focus({preventScroll:true}); }
function closeSys(){ if(state!=='sys') return; SFX.back(); sys.classList.remove('open'); state='menu'; bar.inert = false; pagesEl.style.visibility=''; arrL.style.visibility = arrR.style.visibility = ''; if (lastKey) document.getElementById('wiiBtn').focus({preventScroll:true}); }
const musicBtn = document.getElementById('musicToggle');
const paintMusic = () => musicBtn.textContent = 'Music: ' + (musicOn ? 'On' : 'Off');
paintMusic();
musicBtn.onclick = () => { musicOn = !musicOn; paintMusic(); try{ localStorage.setItem('wiiMusic', musicOn ? 'on' : 'off'); }catch(e){}
  if (musicGain) musicGain.gain.setTargetAtTime(musicOn ? 1 : 0, AC.currentTime, .1); else if (musicOn) startMusic(); };
document.getElementById('wiiBtn').onclick = openSys;
document.getElementById('sysClose').onclick = closeSys;
document.getElementById('sysData').onclick = () => window.open(RESUME,'_blank','noopener');
document.getElementById('sysSettings').onclick = () => { location.href = ASSET; };
document.getElementById('sdBtn').onclick = () => { if (state==='menu'){ SFX.select(); window.open(RESUME,'_blank','noopener'); } };
document.getElementById('mailBtn').onclick = () => { if(state!=='menu') return; SFX.select(); contentFrom='menu'; bubble.classList.remove('on');
  state='entering'; fader.classList.add('on'); setTimeout(() => { state='content'; showScreen('board'); fader.classList.remove('on'); }, 260); };

/* --- keyboard: arrows move the highlight, Enter/A = select, Esc/Backspace/B = back --- */
let kFocus = 0;
addEventListener('keydown', e => {
  const onControl = e.target.closest && e.target.closest('button,a,video,iframe,input');
  if (state === 'warning'){ if (['Enter',' ','a','A'].includes(e.key)){ e.preventDefault(); startMenu(); } return; }
  if (onControl && (e.key==='Enter' || e.key===' ')) return;  // native buttons handle their own activation
  const back = ['Escape','Backspace','b','B'].includes(e.key);
  if (state === 'menu'){
    if (hotEl && hotEl.dataset.idx) kFocus = +hotEl.dataset.idx;
    const per = L.per, cols = L.cols, s = kFocus % per, row = Math.floor(s/cols), col = s % cols;
    let n = null;
    if (!hotEl && e.key.startsWith('Arrow')) n = page*per;
    else if (e.key==='ArrowRight') n = col < cols-1 ? kFocus+1 : (page < PAGES-1 ? (page+1)*per + row*cols : null);
    else if (e.key==='ArrowLeft') n = col > 0 ? kFocus-1 : (page > 0 ? (page-1)*per + row*cols + cols-1 : null);
    else if (e.key==='ArrowDown') n = row < L.rows-1 ? kFocus+cols : null;
    else if (e.key==='ArrowUp') n = row > 0 ? kFocus-cols : null;
    else if (e.key==='Enter' || e.key==='a' || e.key==='A'){ if (hotEl && hotEl.classList.contains('ch')) openPreview(+hotEl.dataset.idx); return; }
    else return;
    e.preventDefault();
    if (n===null || n<0) return;
    if (n >= CHANNELS.length){ if (e.key==='ArrowDown') return; n = CHANNELS.length-1; }
    const p = Math.floor(n/per); if (p!==page) setPage(p);
    kFocus = n; tiles[n].focus({preventScroll:true}); setHot(tiles[n]);
  } else if (state === 'opening'){
    if (back){ e.preventDefault(); closePreview(); }
  } else if (state === 'preview'){
    if (back){ e.preventDefault(); closePreview(); }
    else if (e.key==='Enter' || e.key==='a' || e.key==='A') openContent(current);
    else if (e.key==='ArrowLeft' && current>0) openPreview(current-1,-1);
    else if (e.key==='ArrowRight' && current<CHANNELS.length-1) openPreview(current+1,1);
  } else if (state === 'content'){
    if (e.key==='Escape' || ((e.key==='Backspace' || e.key==='b' || e.key==='B') && !onControl)){ e.preventDefault(); closeContent(); }
    else if (curScreen && curScreen.nav && (e.key==='ArrowLeft' || e.key==='ArrowRight')){ e.preventDefault(); curScreen.nav(e.key==='ArrowLeft' ? -1 : 1); }
    else if (curScreen && curScreen.key && curScreen.key(e)) e.preventDefault();
  } else if (state === 'sys'){
    if (back) return closeSys();
    const order = ['sysData','sysSettings','musicToggle','sysClose'].map(id=>document.getElementById(id));
    let i = order.indexOf(document.activeElement);
    const moves = { ArrowRight:1, ArrowLeft:-1, ArrowDown:2, ArrowUp:-2 };
    if (moves[e.key] === undefined) return;
    e.preventDefault(); i = i < 0 ? 0 : Math.max(0, Math.min(3, i + moves[e.key]));
    order[i].focus({preventScroll:true}); setHot(order[i], false);
  }
});

/* --- touch: swipe pages in the menu, channels in the preview --- */
let tsx = null, tsy = null;
addEventListener('touchstart', e => { tsx = e.touches[0].clientX; tsy = e.touches[0].clientY; }, {passive:true});
addEventListener('touchend', e => {
  if (tsx===null) return; const dx = e.changedTouches[0].clientX - tsx, dy = e.changedTouches[0].clientY - tsy; tsx = null;
  if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy)) return;
  if (state==='menu'){ const t = page + (dx<0?1:-1);
    if (t < 0 || t >= PAGES){ if (!reduced) track.animate([{transform:`translateX(${-page*L.W}px)`},{transform:`translateX(${-page*L.W + (dx<0?-30:30)}px)`},{transform:`translateX(${-page*L.W}px)`}],{duration:260,easing:'ease-out'}); }
    else setPage(t); }
  else if (state==='preview'){ const n = current + (dx<0?1:-1); if (n>=0 && n<CHANNELS.length) openPreview(n, dx<0?1:-1); }
});

// prefers-reduced-motion: CSS can't stop SMIL, so pause banner SVG animations directly
function pauseSMIL(root){ if (reduced) root.querySelectorAll('svg').forEach(s => s.pauseAnimations && s.pauseAnimations()); }
new MutationObserver(() => pauseSMIL(pvZoom)).observe(pvZoom,{childList:true});
pauseSMIL(document);

/* =====================================================================
   GO
   ===================================================================== */
relayout(true);
let rT; addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(()=>relayout(false), 80); });
</script>
</body>
</html>
